# Publie Supply360 sur GitHub Pages à chaque push sur main : le HTML est régénéré depuis app/
# (build.py, sans dépendance) puis servi à la racine du site (index.html).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer le HTML
        run: |
          python build.py
          mkdir -p _site
          cp dist/supply360.html _site/index.html
          cp dist/supply360.html _site/supply360.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
