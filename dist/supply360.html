one)\n    return ic(nom) if nom in ICONES else f\"<span>{escape(icone)}<\/span>\"\n\n\n# --------------------------------------------------------------------------\n# Structure de page\n# --------------------------------------------------------------------------\ndef header() -> None:\n    \"\"\"Header fixe : logo AFI (fond clair : le logo est transparent), Supply360, état du moteur, date du jour.\n\n    La navigation entre onglets (main.py) est positionnée dans ce header par le CSS.\n    \"\"\"\n    j = date.today()\n    st.html(\n        '<div class=\"s360-header\"><div class=\"s360-logo\" role=\"img\" '\n        'aria-label=\"Air France Industries KLM Engineering &amp; Maintenance\"><\/div><span class=\"s360-sep\"><\/span>'\n        '<div class=\"s360-brand\">Supply<span>360<\/span><\/div>'\n        f'<div class=\"s360-today\"><span class=\"s360-moteur\" title=\"Journal du moteur : relances et leur cause\"><i><\/i>Prêt<\/span>{ic(\"calendar\")}{JOURS[j.weekday()]} {j:%d/%m/%Y}<\/div><\/div>'\n        '<div class=\"s360-busy\">Calcul en cours…<\/div>'\n    )\n\n\ndef contexte(*blocs: tuple[str, str, str]) -> str:\n    \"\"\"Encadré de contexte de l'en-tête de page : (libellé, valeur, badge facultatif) par bloc.\"\"\"\n    html = \"\"\n    for lbl, val, extra in blocs:\n        html += (f'<div class=\"bloc\"><span class=\"lbl\">{escape(lbl)}<\/span><span class=\"val\">{escape(val)}<\/span>'\n                 f'{extra}<\/div>')\n    return f'<div class=\"s360-contexte\">{html}<\/div>'\n\n\ndef hero(icone: str, titre: str, sous_titre: str = \"\", surtitre: str = \"\", contexte_html: str = \"\",\n         avion: str | None = None) -> None:\n    \"\"\"En-tête de page : bandeau léger à la couleur de l'onglet, icône, titre, et à droite un encadré de contexte\n    (chantier, date des données…). Couleur et icône : core/style.ONGLETS (onglet actif). `avion` : famille d'image\n    (core/avions.famille), affichée entre le titre et l'encadré.\"\"\"\n    couleur, nom_icone = ONGLETS.get(st.session_state.get(\"active_tab\", \"\"), (\"#1F4E9C\", \"\"))\n    sub = f'<p class=\"sous\">{escape(sous_titre)}<\/p>' if sous_titre else \"\"\n    sur = f'<p class=\"surtitre\">{escape(surtitre)}<\/p>' if surtitre else \"\"\n    st.markdown(f'<div class=\"s360-hero\" style=\"--onglet:{couleur}\"><div class=\"gauche\"><div class=\"ico\">{_icone(nom_icone or icone)}<\/div>'\n                f'<div>{sur}<h1>{escape(titre)}<\/h1>{sub}<\/div><\/div>'\n                + (f'<div class=\"s360-avion t-{escape(avion)}\" role=\"img\" aria-label=\"{escape(avion.upper())}\"><\/div>' if avion else \"\")\n                + f'{contexte_html}<\/div>', unsafe_allow_html=True)\n\n\ndef aide(texte: str) -> str:\n    \"\"\"Petit « ? » : le texte s'affiche au survol de la souris (infobulle). Pour les précisions qu'on ne veut pas\n    afficher en permanence. Texte court : une à trois phrases.\"\"\"\n    return f'<span class=\"s360-aide\" tabindex=\"0\" data-tip=\"{escape(texte)}\">?<\/span>' if texte else \"\"\n\n\ndef _tete(title: str, subtitle: str, tag: str, info: str = \"\") -> str:\n    sub = f\"<p>{escape(subtitle)}<\/p>\" if subtitle else \"\"\n    tg = f'<span class=\"tag\">{escape(tag)}<\/span>' if tag else \"\"\n    return f'<div class=\"s360-section-head\"><div><h3>{escape(title)}{tg}{aide(info)}<\/h3>{sub}<\/div><\/div>'\n\n\n@contextmanager\ndef section(key: str, title: str, subtitle: str = \"\", tag: str = \"\", export=None, carte: bool = True, info: str = \"\"):\n    \"\"\"Bloc : titre, sous-titre et compteur (`tag`) ; carte blanche, ou bloc sans fond (`carte=False`, ex. tuiles).\n    `export` = (fonction, nom de fichier, clé) : bouton « Exporter (Excel) » à droite du titre. `key` unique (TAB_ID).\"\"\"\n    box = st.container(key=f\"{'s360sec' if carte else 's360bloc'}_{key}\")\n    with box:\n        if export:\n            with st.container(key=f\"s360tete_{key}\"):\n                a, b = st.columns([5, 1.3], vertical_alignment=\"bottom\")\n                a.html(_tete(title, subtitle, tag))\n                with b:\n                    telecharger(*export)\n        elif title or subtitle:\n            st.html(_tete(title, subtitle, tag, info))\n        yield box\n\n\ndef footer() -> None:\n    st.html('<div class=\"s360-footer\">Supply360 · Air France Industries — fichiers traités localement dans votre navigateur, '\n            \"rien n'est envoyé. Rafraîchir la page réinitialise la session.<\/div>\")\n\n\ndef en_developpement(icone: str, titre: str, points: list[str]) -> None:\n    \"\"\"Page d'un onglet prévu mais pas encore développé.\"\"\"\n    items = \"\".join(f\"<li>{escape(p)}<\/li>\" for p in points)\n    st.markdown(f'<div class=\"s360-wip\"><div class=\"plane\"><\/div><div class=\"ico\">{_icone(icone)}<\/div><h2>{escape(titre)}<\/h2>'\n                f'{badge(\"En cours de développement\", \"warn\")}'\n                f\"<p>Cette fonctionnalité arrive dans une prochaine version de Supply360.<\/p><ul>{items}<\/ul><\/div>\",\n                unsafe_allow_html=True)\n\n\ndef cartes_fonctions(cartes: list[dict], couleur: str = \"\", colonnes: int = 3) -> None:\n    \"\"\"Grille de cartes « ce que vous trouverez » (onglets à venir) : chaque carte = dict(icone, titre, texte, points) ;\n    `colonnes` par ligne sur grand écran (moins sur écran étroit).\"\"\"\n    html = \"\"\n    for c in cartes:\n        pts = \"\".join(f\"<li>{escape(p)}<\/li>\" for p in c.get(\"points\", []))\n        html += (f'<div class=\"carte\"><div class=\"tete\"><span class=\"pastille\">{_icone(c[\"icone\"])}<\/span>'\n                 f'<h4>{escape(c[\"titre\"])}<\/h4><\/div><p>{escape(c.get(\"texte\", \"\"))}<\/p><ul>{pts}<\/ul><\/div>')\n    style = f' style=\"--cols:{colonnes};{f\"--onglet:{couleur}\" if couleur else \"\"}\"'\n    st.markdown(f'<div class=\"s360-fonctions\"{style}>{html}<\/div>', unsafe_allow_html=True)\n\n\ndef ponderation(criteres: list[tuple[str, int, str]], couleur: str = \"\") -> None:\n    \"\"\"Critères d'un score pondéré : (critère, poids en %, ce que ça mesure), avec une barre proportionnelle au poids.\"\"\"\n    html = \"\".join(f'<div class=\"ligne\"><span class=\"crit\">{escape(c)}<\/span><span class=\"barre\"><i style=\"width:{p}%\"><\/i><\/span>'\n                   f'<b>{p} %<\/b><span class=\"desc\">{escape(d)}<\/span><\/div>' for c, p, d in criteres)\n    style = f' style=\"--onglet:{couleur}\"' if couleur else \"\"\n    st.markdown(f'<div class=\"s360-poids\"{style}>{html}<\/div>', unsafe_allow_html=True)\n\n\ndef tableau_simple(entetes: list[str], lignes: list[list[str]]) -> None:\n    \"\"\"Petit tableau statique (règles, niveaux) ; les cellules sont du HTML de confiance (badges).\"\"\"\n    th = \"\".join(f\"<th>{escape(h)}<\/th>\" for h in entetes)\n    tr = \"\".join(\"<tr>\" + \"\".join(f\"<td>{c}<\/td>\" for c in l) + \"<\/tr>\" for l in lignes)\n    st.markdown(f'<table class=\"s360-simple\"><thead><tr>{th}<\/tr><\/thead><tbody>{tr}<\/tbody><\/table>', unsafe_allow_html=True)\n\n\ndef apercu_alertes(lignes: list[tuple[str, str, str, str]]) -> None:\n    \"\"\"Aperçu de fil d'alertes : (niveau → ton du badge, libellé du niveau, message, action).\"\"\"\n    html = \"\".join(f'<div class=\"alerte\" style=\"{_vars(ton)}\">{badge(niv, ton)}<span class=\"msg\">{escape(msg)}<\/span>'\n                   f'<span class=\"act\">{escape(act)}<\/span><\/div>' for ton, niv, msg, act in lignes)\n    st.markdown(f'<div class=\"s360-fil\">{html}<\/div>', unsafe_allow_html=True)\n\n\n# --------------------------------------------------------------------------\n# Indicateurs\n# --------------------------------------------------------------------------\ndef kpi_card(label: str, value, sub: str = \"\", tone: str = \"navy\", icone: str | None = None, note: str = \"\", info: str = \"\") -> str:\n    \"\"\"HTML d'une tuile KPI (à passer à `kpi_grid`) : icône teintée, libellé, chiffre coloré, précision ; `info` = « ? ».\"\"\"\n    sub_html = f'<div class=\"sub\" title=\"{escape(str(sub))}\">{escape(str(sub))}<\/div>' if sub else \"\"\n    note_html = (f'<span class=\"note\">{escape(note)}<\/span>' if note else \"\") + aide(info)\n    return (f'<div class=\"s360-kpi\" style=\"{_vars(tone)}\"><div class=\"t\"><span class=\"pastille\">{_icone(icone or ICONE_TON.get(tone, \"layers\"))}'\n            f'<\/span><span>{escape(str(label))}<\/span>{note_html}<\/div><div class=\"val\">{escape(str(value))}<\/div>{sub_html}<\/div>')\n\n\ndef kpi_repartition(label: str, total, unite: str, segments: list[tuple[str, float, str]], note: str = \"\",\n                    icone: str = \"layers\", tone: str = \"navy\") -> str:\n    \"\"\"Grande tuile (2 colonnes) : total, barre de répartition (segments (libellé, valeur, couleur)) et légende chiffrée.\"\"\"\n    somme = sum(v for _, v, _ in segments) or 1\n    barre = \"\".join(f'<span style=\"flex:{v};background:{c}\" data-tip=\"{escape(lib)} : {_nombre(v)} ({v / somme:.0%})\"><\/span>'\n                    for lib, v, c in segments if v)\n    leg = \"\".join(f'<li><i style=\"background:{c}\"><\/i>{escape(lib)} <b>{_nombre(v)}<\/b><\/li>' for lib, v, c in segments)\n    note_html = f'<span class=\"note\">{escape(note)}<\/span>' if note else \"\"\n    return (f'<div class=\"s360-kpi large\" style=\"{_vars(tone)}\"><div class=\"t\"><span class=\"pastille\">{_icone(icone)}<\/span>'\n            f'<span>{escape(label)}<\/span>{note_html}<\/div><div class=\"val\">{escape(str(total))} <small>{escape(unite)}<\/small><\/div>'\n            f'<div class=\"s360-repart\" role=\"img\" aria-label=\"Répartition\">{barre}<\/div><ul class=\"s360-leg\">{leg}<\/ul><\/div>')\n\n\ndef kpi_grid(cards: list[str]) -> None:\n    st.markdown(f'<div class=\"s360-kpis\">{\"\".join(cards)}<\/div>', unsafe_allow_html=True)\n\n\ndef valeurs(items: list[tuple[str, str, str]]) -> None:\n    \"\"\"Bandeau de chiffres côte à côte : (libellé, valeur, précision).\"\"\"\n    st.html('<div class=\"s360-valeurs\">' + \"\".join(f\"<div><span>{escape(a)}<\/span><b>{escape(b)}<\/b><small>{escape(c)}<\/small><\/div>\"\n                                                   for a, b, c in items) + \"<\/div>\")\n\n\ndef badge(text: str, tone: str = \"navy\", couleur: str | None = None) -> str:\n    \"\"\"Badge de statut : pastille de couleur + libellé (la couleur n'est jamais seule).\"\"\"\n    c, _, f = _tone(tone)\n    if couleur:\n        c, f = couleur, \"#\" + teinte(couleur)\n    return f'<span class=\"s360-badge\" style=\"--c:{c};--f:{f}\"><i><\/i>{escape(text)}<\/span>'\n\n\ndef chantier_badge(statut: str, jours_avant_debut: int | None = None) -> str:\n    \"\"\"Badge de statut chantier : uniquement Terminé / En cours / À venir.\"\"\"\n    if statut not in CHANTIER_STATUTS:\n        raise ValueError(f\"Statut de chantier inconnu : {statut}\")\n    text = statut + (f\" · J-{jours_avant_debut}\" if statut == \"À venir\" and jours_avant_debut is not None else \"\")\n    return badge(text, CHANTIER_STATUTS[statut])\n\n\ndef callout(message_html: str, tone: str = \"navy\", icon: str = \"ℹ️\") -> None:\n    \"\"\"Bandeau court (action à mener, alerte). `message_html` est du HTML de confiance.\"\"\"\n    st.markdown(f'<div class=\"s360-callout\" style=\"{_vars(tone)}\">{_icone(icon)}<div>{message_html}<\/div><\/div>',\n                unsafe_allow_html=True)\n\n\ndef empty_state(title: str, message: str, etapes: list[tuple[str, bool]] | None = None, icon: str = \"inbox\") -> None:\n    \"\"\"État vide : explique quoi faire tant que les fichiers ne sont pas importés.\"\"\"\n    steps = \"\".join(f'<span class=\"s360-step{\" ok\" if ok else \"\"}\">{ic(\"check\") if ok else ic(\"plus\")} {escape(lbl)}<\/span>'\n                    for lbl, ok in etapes or [])\n    st.markdown(f'<div class=\"s360-empty\"><div class=\"ico\">{_icone(icon)}<\/div><h4>{escape(title)}<\/h4><p>{escape(message)}<\/p>'\n                f'<div class=\"s360-steps\">{steps}<\/div><\/div>', unsafe_allow_html=True)\n\n\n@contextmanager\ndef barre_perimetre(cle: str):\n    \"\"\"Barre « Périmètre » sous les sous-onglets (flotte, classe, équipement…) : même allure dans tous les onglets.\"\"\"\n    with st.container(key=f\"s360perimetre_{cle}\"):\n        yield\n\n\ndef choix_multiple(colonne, label: str, options: list, cle: str, tout: str = \"Toutes\", libelles: dict | None = None,\n                   aide: str | None = None) -> list:\n    \"\"\"Groupe de boutons d'une barre « Périmètre » : « tout » sélectionné par défaut ; un clic choisit une valeur\n    (plusieurs possibles) ; cliquer sur « tout », ou tout désélectionner, revient à tout. Renvoie les valeurs retenues\n    (toutes si rien n'est choisi).\"\"\"\n    def maj():\n        v, avant = list(st.session_state.get(cle) or []), st.session_state.get(cle + \"__avant\", [tout])\n        if tout in v and tout not in avant:      # clic sur « tout » : on repart de tout\n            v = [tout]\n        elif tout in v and len(v) > 1:           # clic sur une valeur : « tout » se désélectionne\n            v = [x for x in v if x != tout]\n        st.session_state[cle] = v or [tout]\n        st.session_state[cle + \"__avant\"] = st.session_state[cle]\n\n    sel = colonne.pills(label, [tout] + list(options), selection_mode=\"multi\", default=[tout], key=cle, on_change=maj,\n                        format_func=lambda x: (libelles or {}).get(x, x), persist_state=\"page\", help=aide)\n    sel = [x for x in (sel or []) if x != tout]\n    return sel or list(options)\n\n\ndef choix_unique(colonne, label: str, options: list, cle: str, defaut=None, libelles: dict | None = None,\n                 aide: str | None = None):\n    \"\"\"Groupe de boutons d'une barre « Périmètre », un seul choix (ex. période de prévision) : même allure que\n    choix_multiple ; on ne peut pas tout désélectionner. Renvoie la valeur choisie.\"\"\"\n    defaut = options[0] if defaut is None else defaut\n    v = colonne.pills(label, list(options), selection_mode=\"single\", default=defaut, required=True, key=cle,\n                      format_func=lambda x: (libelles or {}).get(x, x), persist_state=\"page\", help=aide)\n    return defaut if v is None else v\n\n\ndef tableau(df, column_config=None, height=None, cle: str = \"\", statut: str | None = None, couleurs: dict | None = None,\n            **_ignore) -> None:\n    \"\"\"Tableau standard de l'app : même rendu et mêmes filtres que `tableau_html` (tri et filtre au clic sur un\n    en-tête, recherche, compteur). Les colonnes numériques, monétaires (« € ») et dates sont reconnues seules ;\n    `column_config` (formats de date, bulles d'aide, barres de progression) est repris.\"\"\"\n    if isinstance(height, (int, float)):\n        hauteur = f\"{max(8.0, height / 13):.0f}rem\"\n    elif height == \"content\":\n        hauteur = \"none\"\n    else:\n        hauteur = \"34rem\"\n    tableau_html(df, colonne_config=column_config, hauteur=hauteur, cle=cle,\n                 statut=statut if statut in getattr(df, \"columns\", ()) else None, couleurs=couleurs)\n\n\ndef graphe(html: str, sous: str = \"\") -> None:\n    \"\"\"Graphe de core/charts.py dans sa carte (titre, sous-titre, boutons Agrandir / PNG ajoutés par build.py).\n    st.markdown (et non st.html, qui supprime le SVG).\"\"\"\n    if sous:\n        html = html.replace(\"<\/h5>\", f'<\/h5><p class=\"g-sous\">{escape(sous)}<\/p>', 1)\n    st.markdown(f'<div class=\"s360-graphe\">{html}<\/div>', unsafe_allow_html=True)\n\n\n# --------------------------------------------------------------------------\n# Tableaux HTML (badges de statut, colonnes fixes, filtres dans la page)\n# --------------------------------------------------------------------------\ndef _nombre(v) -> str:\n    try:\n        f = float(v)\n    except (TypeError, ValueError):\n        return escape(str(v))\n    if f != f:  # NaN\n        return \"—\"\n    return f\"{f:,.0f}\".replace(\",\", \" \") if abs(f) >= 1000 or f.is_integer() else f\"{f:,.1f}\".replace(\",\", \" \").replace(\".\", \",\")\n\n\ndef _cellule(v, col: str, fort: set, euros: set) -> str:\n    if v is None or (not isinstance(v, str) and pd.isna(v)):\n        return '<span class=\"vide\">—<\/span>'\n    if isinstance(v, (pd.Timestamp, date)):\n        return f\"{pd.Timestamp(v):%d/%m/%Y}\"\n    if isinstance(v, (bool, np.bool_)):\n        return \"Oui\" if v else \"Non\"\n    if isinstance(v, (int, float, np.integer, np.floating)):\n        if col in euros:\n            return escape(_euros(v))\n        if float(v) == 0:\n            return '<span class=\"zero\">0<\/span>'\n        txt = _nombre(v)\n        return f'<span class=\"fort\">{txt}<\/span>' if col in fort and float(v) > 0 else txt\n    txt = str(v)\n    return escape(txt) if txt.strip() else '<span class=\"vide\">—<\/span>'\n\n\ndef _euros(v) -> str:\n    f = float(v)\n    return f\"{f / 1e6:.1f} M€\".replace(\".\", \",\") if abs(f) >= 1e6 else (f\"{f / 1e3:.0f} k€\" if abs(f) >= 1e4 else f\"{f:,.0f} €\".replace(\",\", \" \"))\n\n\nPAGE_TABLEAU = 200  # lignes affichées d'emblée (puis « Afficher plus »)\n\n\ndef _types_colonnes(df: pd.DataFrame, colonne_config, num: set, euros: set) -> dict:\n    \"\"\"{colonne: (type, format, aide)} : type = num | euros | date | mois | progres | evol | txt (filtres et rendu).\n    « evol » : colonne numérique dont le nom commence par « Évolution » (pourcentage : ▲ +67 % / ▼ −30 %).\"\"\"\n    cfg = colonne_config or {}\n    out = {}\n    for c in df.columns:\n        conf = cfg.get(c) if isinstance(cfg.get(c), dict) else {}\n        tc = conf.get(\"type_config\") or {}\n        fmt, aide = str(tc.get(\"format\") or \"\"), conf.get(\"help\") or \"\"\n        serie = df[c]\n        if tc.get(\"type\") == \"progress\":\n            typ = \"progres\"\n        elif str(c).startswith(\"Évolution\") and pd.api.types.is_numeric_dtype(serie):\n            typ = \"evol\"\n        elif c in euros or \"€\" in fmt or (\"€\" in str(c) and pd.api.types.is_numeric_dtype(serie)):\n            typ = \"euros\"\n        elif tc.get(\"type\") == \"date\" or pd.api.types.is_datetime64_any_dtype(serie):\n            typ = \"mois\" if fmt.upper() in (\"MM/YYYY\", \"MMM YYYY\", \"MMMM YYYY\") else \"date\"\n        elif c in num or tc.get(\"type\") == \"number\" or (pd.api.types.is_numeric_dtype(serie) and not pd.api.types.is_bool_dtype(serie)):\n            typ = \"num\"\n        else:\n            typ = \"txt\"\n            if serie.dtype == object and len(serie):  # colonne de dates stockées en objets (Timestamp, date)\n                ech = serie.dropna().head(20)\n                if len(ech) and all(isinstance(v, (pd.Timestamp, date)) for v in ech):\n                    typ = \"mois\" if fmt.upper() == \"MM/YYYY\" else \"date\"\n        out[c] = (typ, fmt, aide)\n    return out\n\n\ndef evolution(pct: float, seuil: float = 20) -> str:\n    \"\"\"Évolution en % lisible d'un coup d'œil : ▲ +67 % (hausse, orange), ▼ −30 % (baisse, bleu), = +5 % (stable).\"\"\"\n    if pct != pct:  # NaN\n        return '<span class=\"vide\">—<\/span>'\n    signe = f\"+{pct:.0f}\" if pct > 0 else (\"−\" + f\"{-pct:.0f}\" if pct < 0 else \"0\")\n    cls, fl = (\"hausse\", \"▲\") if pct > seuil else ((\"baisse\", \"▼\") if pct < -seuil else (\"stable\", \"=\"))\n    return f'<span class=\"s360-evol {cls}\">{fl} {signe} %<\/span>'\n\n\ndef _brut(v, typ: str) -> str:\n    \"\"\"Valeur brute d'une cellule (attribut data-v) : tri et filtres dans la page.\"\"\"\n    if v is None or (not isinstance(v, str) and pd.isna(v)):\n        return \"\"\n    if typ in (\"date\", \"mois\"):\n        try:\n            return f\"{pd.Timestamp(v):%Y-%m-%d}\"\n        except (TypeError, ValueError):\n            return \"\"\n    if typ in (\"num\", \"euros\", \"progres\", \"evol\"):\n        try:\n            return repr(float(v))\n        except (TypeError, ValueError):\n            return \"\"\n    return \"\"\n\n\ndef tableau_html(df: pd.DataFrame, statut: str | None = None, couleurs: dict | None = None, num=(), fort=(), euros=(),\n                 longs=(), pn=(), groupes=None, fixes: int = 0, marque: tuple[str, str] | None = None, filtres: bool = True,\n                 cle: str = \"\", hauteur: str = \"34rem\", max_lignes: int = 20000, colonne_config=None) -> None:\n    \"\"\"LE tableau de l'app (tous les tableaux passent par ici, `tableau` compris) : même allure et mêmes filtres partout.\n\n    Rendu : statut en badge coloré (`statut`, `couleurs` = {valeur: couleur}), nombres alignés, zéros atténués,\n    `fort` = quantités à traiter (rouge si > 0), `longs` = textes sur plusieurs lignes, `pn` = colonnes en gras,\n    `fixes` = colonnes figées à gauche, `groupes` = [(titre, nb colonnes)] au-dessus des en-têtes, `marque` =\n    (colonne booléenne, libellé) : étiquette rouge sous le statut. Dates et formats repris de `colonne_config`.\n    Filtres (JavaScript de build.py, dans la page, sans recalcul) : clic sur un en-tête = trier, filtrer par valeurs\n    (texte), par bornes (nombres, dates) ; recherche dans tout le tableau ; pastilles par statut (`filtres`) ;\n    compteur de lignes et « Effacer les filtres ». Au-delà de `max_lignes`, seules les premières lignes sont affichées.\"\"\"\n    cle = cle or f\"t{uuid.uuid4().hex[:10]}\"\n    couleurs = couleurs or {}\n    for c in (\"Catégorie\", \"Equipement\", \"Équipement\", \"equipment\"):  # « HOUSSE » → « Housse », comme dans les graphes\n        if c in df.columns and df[c].dtype == object:\n            df = df.assign(**{c: df[c].map(lambda v: charts_aff(v) if isinstance(v, str) else v)})\n    total = len(df)\n    if total > max_lignes:\n        df = df.head(max_lignes)\n    num, fort, euros, longs, pn = set(num) | set(fort), set(fort), set(euros), set(longs), set(pn)\n    cols = [c for c in df.columns if not (marque and c == marque[0])]\n    types = _types_colonnes(df[cols], colonne_config, num, euros)\n    euros = euros | {c for c, (ty, _, _) in types.items() if ty == \"euros\"}\n    gauche, fixe_css = 0.0, []\n    for i in range(min(fixes, len(cols))):  # largeur des colonnes figées : d'après le texte le plus long (badge compris)\n        textes = df[cols[i]].astype(str).str.len()\n        w = min(22.0, max(6.0, 0.62 * max(int(textes.max() if len(textes) else 0), len(str(cols[i]))) + (3.2 if cols[i] == statut else 1.8)))\n        fixe_css.append((f\"left:{gauche}rem;min-width:{w}rem;max-width:{w}rem\", i == fixes - 1))\n        gauche += w\n    def classe(i, c):\n        k = [\"num\"] if types[c][0] in (\"num\", \"euros\", \"progres\", \"evol\") else []\n        if i < len(fixe_css):\n            k += [\"fixe\"] + ([\"dernier\"] if fixe_css[i][1] else [])\n        return \" \".join(k)\n    def style(i):\n        return f' style=\"{fixe_css[i][0]}\"' if i < len(fixe_css) else \"\"\n    tete = \"\".join(\n        f'<th class=\"{classe(i, c)}{\" cle\" if c in fort else \"\"}\"{style(i)} data-type=\"{\"txt\" if c == statut else (\"num\" if types[c][0] == \"evol\" else types[c][0])}\"'\n        f'{f\" title={chr(34)}{escape(types[c][2])}{chr(34)}\" if types[c][2] else \"\"}>{escape(str(c))}<\/th>'\n        for i, c in enumerate(cols))\n    grp = \"\"\n    if groupes:\n        grp = '<tr class=\"grp\">' + \"\".join(f'<th colspan=\"{n}\">{escape(g)}<\/th>' for g, n in groupes) + \"<\/tr>\"\n    def cellule(i, c, v):\n        typ = types[c][0]\n        brut = _brut(v, typ)\n        dv = f' data-v=\"{brut}\"' if brut else \"\"\n        if c == statut:\n            txt = \"\" if v is None or (not isinstance(v, str) and pd.isna(v)) else str(v)\n            h = badge(txt, couleur=couleurs.get(txt, \"#9AA5B1\")) if txt else '<span class=\"vide\">—<\/span>'\n        elif typ == \"mois\" and brut:\n            h = f\"{pd.Timestamp(v):%m/%Y}\"\n        elif typ == \"evol\" and brut:\n            h = evolution(float(v))\n        elif typ == \"progres\" and brut:\n            pct = max(0.0, min(100.0, float(v)))\n            h = f'<span class=\"progres\"><i style=\"width:{pct:.0f}%\"><\/i><\/span>{float(v):.0f} %'\n        elif c in longs:\n            h = f'<span class=\"long\">{_cellule(v, c, fort, euros)}<\/span>'\n        elif c in pn:\n            h = f'<span class=\"pn\">{_cellule(v, c, fort, euros)}<\/span>'\n        else:\n            h = _cellule(v, c, fort, euros)\n        return f'<td class=\"{classe(i, c)}\"{style(i)}{dv}>{h}<\/td>'\n    # Colonne par colonne, chaque valeur distincte n'est mise en forme qu'une fois (statuts, catégories, zéros…) :\n    # plusieurs fois plus rapide sous Pyodide qu'une mise en forme cellule par cellule.\n    colonnes_html = []\n    for i, c in enumerate(cols):\n        deja, sortie = {}, []\n        for v in df[c].tolist():\n            try:\n                cle_v = (type(v), v)\n                h = deja.get(cle_v)\n            except TypeError:  # valeur non hachable\n                cle_v, h = None, None\n            if h is None:\n                h = cellule(i, c, v)\n                if cle_v is not None:\n                    deja[cle_v] = h\n            sortie.append(h)\n        colonnes_html.append(sortie)\n    marques = df[marque[0]].fillna(False).astype(bool).tolist() if marque and marque[0] in df.columns else [False] * len(df)\n    if marque and statut in cols:  # étiquette rouge sous le badge de statut\n        j, tag = cols.index(statut), f'<br><span class=\"s360-tag rouge drapeau\">{escape(marque[1])}<\/span>'  # drapeau : CSS\n        colonnes_html[j] = [h.replace(\"<\/td>\", tag + \"<\/td>\") if m else h for h, m in zip(colonnes_html[j], marques)]\n    statuts = [escape(str(v)) for v in df[statut].tolist()] if statut and statut in df.columns else None\n    lignes = [f\"<tr{f' data-statut={chr(34)}{statuts[k]}{chr(34)}' if statuts else ''}{' class=' + chr(34) + 'marque' + chr(34) if marques[k] else ''}>\"\n              f\"{''.join(cellules)}<\/tr>\" for k, cellules in enumerate(zip(*colonnes_html))]\n    pastilles = \"\"\n    if filtres and statut and statut in df.columns:\n        compte = df[statut].value_counts()\n        compte = compte.reindex([v for v in couleurs if v in compte.index] + [v for v in compte.index if v not in couleurs])\n        pastilles = ('<div class=\"s360-filtres\"><button class=\"actif\" data-f=\"\">Tous<\/button>'\n                     + \"\".join(f'<button data-f=\"{escape(str(v))}\" style=\"--c:{couleurs.get(v, \"#9AA5B1\")}\"><i><\/i>{escape(str(v))} <b>{n}<\/b><\/button>'\n                               for v, n in compte.items()) + \"<\/div>\")\n    coupe = (f'<p class=\"s360-tableau-note\">{max_lignes} premières lignes sur {total} : '\n             \"exportez en Excel pour tout voir.<\/p>\") if total > max_lignes else \"\"\n    # Affichage par pages : les PAGE premières lignes sont dans le tableau, les autres attendent dans data-reste\n    # (JSON). Le navigateur n'a ainsi que quelques centaines de lignes à dessiner ; recherche, filtres et tri\n    # (JavaScript de build.py) portent sur toutes les lignes, « Afficher plus » ajoute la page suivante.\n    visibles, reste = lignes[:PAGE_TABLEAU], lignes[PAGE_TABLEAU:]\n    attr_reste = f' data-reste=\"{escape(json.dumps(reste, ensure_ascii=False))}\"' if reste else \"\"\n    plus = (f'<div class=\"s360-plus\" data-table=\"s360t_{cle}\"><button type=\"button\">Afficher {min(PAGE_TABLEAU, len(reste))} '\n            f'lignes de plus<\/button><span>{len(reste)} lignes non affichées<\/span><\/div>') if reste else \"\"\n    n = len(lignes)\n    compte = f\"{n} ligne{'s' if n > 1 else ''}\" + (f\" · {len(visibles)} affichées\" if reste else \"\")\n    # st.html et non st.markdown : le HTML est inséré tel quel (st.markdown le fait passer par l'analyseur Markdown,\n    # qui fige la page plusieurs secondes sur un grand tableau).\n    st.html(f'<div class=\"s360-outils\" data-table=\"s360t_{cle}\" data-total=\"{n}\">{pastilles}'\n            f'<span class=\"s360-nb-lignes\">{compte}<\/span><\/div>'\n            f'<div class=\"s360-tableau{\" groupes\" if groupes else \"\"}\" style=\"--h:{hauteur}\"><table id=\"s360t_{cle}\" class=\"s360-filtrable\"{attr_reste}>'\n            f\"<thead>{grp}<tr>{tete}<\/tr><\/thead><tbody>{''.join(visibles)}<\/tbody><\/table><\/div>{plus}{coupe}\")\n\n\n# --------------------------------------------------------------------------\n# Imports et téléchargements\n# --------------------------------------------------------------------------\ndef _fichier_valide(f) -> bool:\n    \"\"\"Vrai pour un fichier réellement importé (Streamlit peut renvoyer un `DeletedFile` après un changement d'onglet).\"\"\"\n    return f is not None and hasattr(f, \"getvalue\") and hasattr(f, \"name\")\n\n\ndef fichier(label: str, cle: str, types: list[str], colonnes: list[tuple[str, str, bool]] | None = None, on_import=None):\n    \"\"\"`file_uploader` dont le contenu survit au changement d'onglet. Renvoie (nom, octets) ou None.\n\n    Streamlit efface un widget qui n'est pas affiché : sans cette mémoire, revenir sur un onglet\n    obligeait à réimporter ses fichiers. La mémoire peut aussi être remplie par `import_groupe`.\n    `on_import(nom)` est appelé (en callback) quand un nouveau fichier est importé ici.\n    \"\"\"\n    # La clé du widget porte un numéro de version : vider_emplacement() l'incrémente pour effacer le fichier affiché.\n    version = st.session_state.get(f\"{cle}__v\", 0)\n    memoire, cle_up, vu = f\"{cle}__data\", f\"{cle}__upload\" + (str(version) if version else \"\"), f\"{cle}__vu\"\n\n    def _maj():\n        f = st.session_state.get(cle_up)\n        if f is None:\n            st.session_state.pop(memoire, None)   # l'utilisateur a retiré le fichier\n        elif _fichier_valide(f):\n            st.session_state[memoire] = (dossiers.sans_marque(f.name), f.getvalue(), f.file_id)\n            st.session_state[vu] = f.file_id\n            # Zone d'import vidée (nouvelle version du widget) : Streamlit libère sa propre copie du fichier, seule\n            # la mémoire ci-dessus reste (le fichier n'est plus gardé deux fois).\n            vider_emplacement(cle, garder_donnees=True)\n            if on_import:\n                on_import(dossiers.sans_marque(f.name))\n\n    up = st.file_uploader(label, type=types, key=cle_up, on_change=_maj)\n    garde = st.session_state.get(memoire)\n    if _fichier_valide(up) and st.session_state.get(vu) != up.file_id:\n        garde = st.session_state[memoire] = (dossiers.sans_marque(up.name), up.getvalue(), up.file_id)\n        st.session_state[vu] = up.file_id\n    if garde and not (_fichier_valide(up) and up.file_id == garde[2]):\n        st.markdown(f'<div class=\"s360-file\">{ic(\"check\")}<span>{escape(garde[0])}<\/span><\/div>', unsafe_allow_html=True)\n    if colonnes:\n        with st.popover(\"Colonnes attendues\", width=\"stretch\"):\n            st.markdown(\"\\n\".join(f\"- `{nom}`{' — **obligatoire**' if obl else ''}\" + (f\" · {aide}\" if aide else \"\")\n                                  for nom, aide, obl in colonnes))\n            st.caption(\"Détection automatique de la feuille et de la ligne d'en-tête, sans tenir compte des accents ni des majuscules.\")\n    return garde[:2] if garde else None\n\n\ndef vider_emplacement(cle: str, garder_donnees: bool = False) -> None:\n    \"\"\"Efface le fichier affiché dans l'import `fichier(cle)` (nouvelle version du widget) et, sauf\n    `garder_donnees`, le fichier gardé en mémoire. À appeler dans un callback.\"\"\"\n    st.session_state[f\"{cle}__v\"] = st.session_state.get(f\"{cle}__v\", 0) + 1\n    if not garder_donnees:\n        st.session_state.pop(f\"{cle}__data\", None)\n\n\nLIBELLES_SOURCES = {\"stock_pe\": \"Résultat PE (onglet PE mousses)\", \"stock_textile\": \"Résultat ALL TEXTILE (onglet Textile cabine)\",\n                    \"besoins\": sio.FICHIER_BESOINS, \"asreq\": sio.FICHIER_ASREQ, \"stock\": sio.FICHIER_STOCK,\n                    \"commandes\": sio.FICHIER_COMMANDES, \"references\": sio.FICHIER_REFERENCES, \"pieces\": \"Pièces par avion\",\n                    \"pe\": \"PE mousses\", \"besoin_prod\": \"Besoin Prod mousses\"}\n\n\n@st.cache_resource(show_spinner=False, max_entries=256)\ndef _source_fichier(data: bytes, nom: str):\n    \"\"\"Source d'un fichier (contenu, puis nom), mise en cache : chaque fichier n'est analysé qu'une fois.\"\"\"\n    return sio.identifier_fichier(data, nom)\n\n\ndef _boutons_dossier(dossier: str, cible: str, mode: str) -> str:\n    attrs = f'data-dossier=\"{escape(dossier)}\" data-cible=\"{escape(cible)}\" data-mode=\"{escape(mode)}\"'\n    return (f'<span class=\"s360-dossier-grp\"><button type=\"button\" class=\"s360-dossier-btn\" {attrs}>{ic(\"folder\")}Ouvrir {escape(dossier)}<\/button>'\n            f'<button type=\"button\" class=\"s360-dossier-btn autre\" {attrs} data-changer=\"1\" '\n            f'title=\"Choisir un autre dossier {escape(dossier)}\">Changer<\/button><\/span>')\n\n\ndef boutons_dossiers(dossier: str, cible: str, mode: str = \"fichiers\", commandes: bool = True) -> None:\n    \"\"\"Barre « 📂 Ouvrir <dossier> » (+ « 📂 Ouvrir COMMANDE ») : dossiers mémorisés, gérés en JavaScript par build.py.\n\n    Le dossier choisi une fois est retenu par le navigateur. Selon `mode`, on dépose dans le `file_uploader` de\n    clé `cible` : tous ses fichiers (« fichiers »), ceux du chantier choisi dans la liste (« chantier ») ou le\n    fichier le plus récemment modifié (« dernier »). « Changer » choisit un autre dossier. Sans effet en local.\n    COMMANDE : fichier Commandes (SAP) le plus récent, rangé dans l'import commun `commun__commandes`.\n    \"\"\"\n    html = _boutons_dossier(dossier, cible, mode)\n    if commandes:\n        html += _boutons_dossier(\"COMMANDE\", \"commun__dossier_commande__upload\", \"dernier\")\n    st.markdown(f'<div class=\"s360-dossiers\">{html}<\/div>', unsafe_allow_html=True)\n    if commandes:\n        with st.container(key=\"s360cache_commande\"):  # zone de dépôt du bouton COMMANDE, masquée (CSS)\n            import_dossier(\"commun__dossier_commande\", {\"commandes\": \"commun__commandes\"}, resume=False)\n\n\n@contextmanager\ndef zone_repliable(cle: str, libelle: str, interrupteur=None, aide: str | None = None):\n    \"\"\"Zone repliée derrière un interrupteur. Contrairement à `st.expander` (dont le contenu replié n'est pas\n    dans la page), les widgets restent présents, masqués en CSS : les boutons « 📂 Ouvrir » peuvent y déposer\n    des fichiers même quand la zone est fermée. `interrupteur` : colonne où placer l'interrupteur (bloc compact).\"\"\"\n    ouvert = (interrupteur or st).toggle(libelle, key=cle, persist_state=\"page\", help=aide)\n    with st.container(key=f\"s360pli_{'ouvert' if ouvert else 'ferme'}_{cle}\"):\n        yield\n\n\ndef etat_fichiers(fichiers: list[tuple[str, str, bool]]) -> None:\n    \"\"\"Pastilles d'état des imports : (libellé, clé de `fichier`, obligatoire) → ✓ nom du fichier, ou « à importer ».\"\"\"\n    puces = []\n    for libelle, cle, obligatoire in fichiers:\n        garde = st.session_state.get(f\"{cle}__data\")\n        if garde:  # nom du fichier au survol : la pastille tient sur une ligne\n            puces.append(f'<span class=\"s360-puce ok\" data-tip=\"{escape(garde[0])}\">{ic(\"check\")}<b>{escape(libelle)}<\/b><\/span>')\n        elif obligatoire:\n            puces.append(f'<span class=\"s360-puce ko\" data-tip=\"Obligatoire : à importer\">{ic(\"plus\")}<b>{escape(libelle)}<\/b>'\n                         '<em>à importer<\/em><\/span>')\n        else:\n            puces.append(f'<span class=\"s360-puce\" data-tip=\"Facultatif : enrichit l\\'analyse\">{ic(\"plus\")}<b>{escape(libelle)}<\/b><\/span>')\n    st.markdown(f'<div class=\"s360-puces\">{\"\".join(puces)}<\/div>', unsafe_allow_html=True)  # pas st.html : il retire le SVG\n\n\ndef import_commandes(colonnes) -> tuple[str, bytes] | None:\n    \"\"\"Import manuel du fichier Commandes (SAP), commun à tous les onglets. Renvoie (nom, octets) ou None.\"\"\"\n    return fichier(sio.FICHIER_COMMANDES, \"commun__commandes\", [\"xlsx\", \"xlsm\"], colonnes)\n\n\ndef lien_sharepoint(url: str, dossier: str) -> None:\n    \"\"\"Aide « première utilisation » : synchroniser le dossier Teams avec OneDrive pour le voir dans « Parcourir ».\"\"\"\n    with st.popover(f\"Première utilisation : synchroniser le dossier {dossier}\"):\n        st.markdown(\n            f\"Le bouton **Parcourir** ouvre l'Explorateur Windows : le dossier Teams **{dossier}** doit y apparaître. \"\n            \"À faire **une seule fois par poste** :\\n\\n\"\n            f\"1. [Ouvrir le dossier {dossier} sur SharePoint]({url}) (nouvel onglet).\\n\"\n            \"2. En haut de la page, cliquer sur **« Ajouter un raccourci à Mon OneDrive »** (ou **« Synchroniser »**).\\n\"\n            f\"3. Le dossier apparaît dans l'Explorateur sous **OneDrive – Air France-KLM › {dossier}**, et reste à jour tout seul.\\n\\n\"\n            \"Ensuite, dans Supply360 : **Ouvrir** puis **Autoriser** (le dossier est choisi une seule fois, puis retenu \"\n            \"par le navigateur ; Edge ou Chrome). Rien à télécharger à la main.\\n\\n\"\n            \"Astuce : ajoutez en raccourci la bibliothèque **Documents** entière du canal : R2, Textile et COMMANDE \"\n            \"seront tous disponibles d'un coup.\")\n\n\ndef import_dossier(cle: str, cibles: dict[str, str], dossier: bool = False, on_choix=None, label: str = \"\", aide: str = \"\",\n                   noms: dict[str, str] | None = None, resume: bool = True, zone=None, autres: tuple = ()) -> None:\n    \"\"\"Import de tout un dossier : chaque fichier est reconnu par son contenu (à défaut son nom) et rangé\n    dans l'emplacement `fichier` correspondant (`cibles` = {source: clé du fichier}).\n\n    `dossier=True` : sélection d'un dossier entier (R2 ou un dossier « <IMMAT> - <JJMMAA> ») ; les fichiers\n    sont regroupés par dossier chantier et, s'il y en a plusieurs, on choisit le chantier à analyser.\n    Si une source a plusieurs fichiers, le plus récent (date dans le nom) est retenu et peut être changé.\n    `on_choix(dossier_chantier, {source: [chemins]})` est appelé après chaque répartition.\n    `noms` = {source: motif} : règles de nommage prioritaires (voir dossiers.appliquer_noms).\n    Un fichier Commandes (SAP) trouvé ici est ignoré si `commandes` n'est pas une cible : seul le dossier COMMANDE fait foi.\n    `autres` : sources lues par un autre onglet (même dossier) : ni utilisées ni signalées comme ignorées.\n    `zone` : conteneur où placer la zone d'import (ex. l'expander « Import manuel ») ; le choix du chantier et le\n    bilan restent à l'emplacement courant.\n    \"\"\"\n    version = st.session_state.get(f\"{cle}__v\", 0)\n    cle_up, cle_idx, cle_ch, cle_bilan = f\"{cle}__upload{version}\", f\"{cle}__index\", f\"{cle}__chantier\", f\"{cle}__bilan\"\n\n    def _ranger(source, chemin):\n        nom, data, fid = st.session_state[cle_idx][chemin]\n        vider_emplacement(cibles[source])  # efface un ancien fichier importé à la main dans cet emplacement\n        st.session_state[f\"{cibles[source]}__data\"] = (dossiers.nom_court(nom), data, fid)\n\n    def _appliquer():\n        index = st.session_state.get(cle_idx, {})\n        groupes = dossiers.regrouper(list(index))\n        ch = st.session_state.get(cle_ch, dossiers.HORS_CHANTIER)\n        chemins = groupes.get(ch, []) + (groupes.get(dossiers.HORS_CHANTIER, []) if ch != dossiers.HORS_CHANTIER else [])\n        sources = {c: _source_fichier(index[c][1], c) for c in chemins}\n        par_source, inconnus = dossiers.repartir(dossiers.appliquer_noms(sources, noms) if noms else sources)\n        for source, liste in par_source.items():\n            if source in cibles:\n                _ranger(source, liste[0])\n                st.session_state[f\"{cle}__alt__{source}\"] = liste[0]\n        if dossier:  # nouveau chantier : aucun fichier de l'ancien ne doit rester\n            for source in cibles:\n                if source not in par_source:\n                    vider_emplacement(cibles[source])\n        st.session_state[cle_bilan] = (par_source, inconnus)\n        if on_choix:\n            on_choix(ch, par_source)\n\n    def _charger():\n        # Chaque sélection REMPLACE la précédente (Streamlit, lui, ajouterait les fichiers aux anciens) : on garde\n        # les fichiers en mémoire et on vide la zone d'import (nouvelle version du widget).\n        fs = [f for f in st.session_state.get(cle_up) or [] if _fichier_valide(f)]\n        if not fs:\n            return\n        st.session_state[cle_idx] = {f.name: (f.name, f.getvalue(), f.file_id) for f in fs}\n        st.session_state[f\"{cle}__v\"] = version + 1\n        chantiers = dossiers.chantiers_tries(dossiers.regrouper(list(st.session_state[cle_idx])))\n        if st.session_state.get(cle_ch) not in chantiers:\n            st.session_state[cle_ch] = chantiers[0] if chantiers else dossiers.HORS_CHANTIER\n        _appliquer()\n\n    with zone if zone is not None else nullcontext():\n        st.file_uploader(label or \"Importer les fichiers du dossier (Ctrl+A pour tout sélectionner)\", type=[\"xlsx\", \"xlsm\", \"csv\"],\n                         accept_multiple_files=\"directory\" if dossier else True, key=cle_up, on_change=_charger, help=aide or None)\n    index = st.session_state.get(cle_idx, {})\n    if not index:\n        return\n    taille = sum(len(v[1]) for v in index.values()) / 1e6\n    if taille > 250:\n        callout(f\"{taille:.0f} Mo importés : pour aller plus vite, choisissez directement le dossier du chantier.\", \"warn\", \"🐢\")\n    chantiers = dossiers.chantiers_tries(dossiers.regrouper(list(index)))\n    par_source, inconnus = st.session_state.get(cle_bilan, ({}, []))\n    doubles = {s: l for s, l in par_source.items() if s in cibles and len(l) > 1}\n    choix_chantier = dossier and len(chantiers) > 1\n    if choix_chantier or doubles:\n        cols = iter(st.columns(int(choix_chantier) + len(doubles)))\n        if choix_chantier:\n            def _libelle(g):\n                immat, debut = sio.chantier_depuis_nom(g)\n                return f\"{immat} · début {debut:%d/%m/%Y}\"\n            next(cols).selectbox(f\"Chantier à analyser ({len(chantiers)} dossiers)\", chantiers, key=cle_ch, format_func=_libelle,\n                                 on_change=_appliquer, persist_state=\"page\")\n        for source, liste in doubles.items():\n            next(cols).selectbox(f\"{LIBELLES_SOURCES[source]} : {len(liste)} fichiers, le plus récent est retenu\", liste,\n                                 key=f\"{cle}__alt__{source}\", format_func=dossiers.nom_court, persist_state=\"page\",\n                                 on_change=lambda s=source: _ranger(s, st.session_state[f\"{cle}__alt__{s}\"]))\n    manquants = [LIBELLES_SOURCES[s] for s in cibles if s not in par_source and s not in (\"asreq\", \"commandes\")\n                 and not (s == \"besoins\" and \"asreq\" in par_source)]\n    notes = []\n    ch = st.session_state.get(cle_ch, dossiers.HORS_CHANTIER)\n    nb = sum(len(l) for l in par_source.values()) + len(inconnus)\n    if resume:\n        notes.append(f\"Dossier importé : <b>{escape(ch)}<\/b> ({nb} fichier(s))\" if ch else f\"Dossier importé : {nb} fichier(s)\")\n    if manquants:\n        notes.append(\"absent(s) du dossier : <b>\" + \", \".join(escape(m) for m in manquants) + \"<\/b>\")\n    if \"commandes\" in par_source and \"commandes\" not in cibles:\n        notes.append(f\"Commandes (SAP) du dossier non utilisé ({escape(dossiers.nom_court(par_source['commandes'][0]))}) : \"\n                     \"le fichier du dossier <b>COMMANDE<\/b> fait foi\")\n    # Raison de chaque fichier écarté : non reconnu, ou reconnu comme une source que cet onglet n'utilise pas\n    hors = [f\"{escape(dossiers.nom_court(c))} (non reconnu)\" for c in inconnus] + [\n        f\"{escape(dossiers.nom_court(c))} (reconnu comme {escape(LIBELLES_SOURCES.get(s, s))})\" for s, l in par_source.items()\n        if s not in cibles and s != \"commandes\" and s not in autres for c in l]\n    if hors:\n        notes.append(\"Ignoré(s) : \" + \", \".join(hors))\n    if notes:\n        st.html('<div class=\"s360-note\">' + \" · \".join(notes) + \"<\/div>\")\n\n\ndef telecharger(data, nom: str, cle: str, label: str = \"Exporter (Excel)\") -> None:\n    \"\"\"Bouton de téléchargement Excel. `on_click=\"ignore\"` : télécharger ne relance pas les calculs.\n\n    `data` : octets, ou de préférence une FONCTION sans argument qui les produit. Le fichier n'est alors fabriqué\n    qu'au clic, et non à chaque affichage de l'onglet (plusieurs secondes sur de gros fichiers, page figée) :\n    « Exporter » fabrique le fichier, puis le téléchargement part tout seul (JavaScript de build.py, clé « __auto »).\n    \"\"\"\n    mime = \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"\n    if not callable(data):\n        st.download_button(label, data=data, file_name=nom, key=cle, on_click=\"ignore\", mime=mime)\n        return\n    if st.session_state.pop(f\"{cle}__pret\", False):  # fabriqué pour cette exécution seulement\n        with st.spinner(\"Préparation du fichier Excel…\"):\n            octets = data()\n        st.download_button(label, data=octets, file_name=nom, key=f\"{cle}__auto\", on_click=\"ignore\", mime=mime)\n    else:\n        st.button(label, key=f\"{cle}__prep\", on_click=lambda: st.session_state.__setitem__(f\"{cle}__pret\", True))\n\n\ndef sous_onglets(cle: str, options: list[str], icones: dict | None = None) -> str:\n    \"\"\"Barre de sous-onglets (pastilles, l'active en bleu marine). Renvoie l'option active. `icones` : ignoré (libellés seuls).\"\"\"\n    with st.container(key=\"s360sub_\" + cle):\n        choix = st.segmented_control(\"Section\", options, default=options[0], key=cle, required=True,\n                                     label_visibility=\"collapsed\", persist_state=\"page\",\n                                     format_func=str)\n    return choix or options[0]\n", "app/core/dossiers.py": "\"\"\"Dossiers importés d'un coup (dossier SharePoint synchronisé) : regroupement par chantier, choix des fichiers.\n\nFonctions pures, testables sans Streamlit. Les fichiers arrivent avec leur chemin relatif\n(« R2/F-XKAA - 151126/extraction.xlsx ») grâce au correctif FormData de build.py ; en développement\nlocal (`streamlit run`), seul le nom est connu et tout est rangé dans un même dossier.\n\"\"\"\n\nimport re\nfrom datetime import date, datetime\n\nfrom core import io as sio\n\n# Dates dans un nom de fichier : AAAAMMJJ (20261020, 2026-10-20) ou JJMMAAAA / JJ.MM.AA.\nDATE_ISO = re.compile(r\"(?<!\\d)(20\\d{2})[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\\d|3[01])(?!\\d)\")\nDATE_FR = re.compile(r\"(?<!\\d)(0[1-9]|[12]\\d|3[01])[-_./]?(0[1-9]|1[0-2])[-_./]?(20\\d{2}|\\d{2})(?!\\d)\")\nHORS_CHANTIER = \"\"\n# Date de modification du fichier (ms), ajoutée devant le chemin par build.py (« @1730650000000@/Textile/x.xlsx ») :\n# sert à retenir le fichier le plus récent quand aucune date n'est écrite dans son nom.\nMARQUE_MODIF = re.compile(r\"@(\\d{10,})@/\")\n# Fichiers « Résultat » du dossier Textile (nom normalisé : minuscules, sans accents, espaces → _) :\n# « Résultat … ALL TEXTILE … » pour l'onglet Textile cabine, « Résultat … PE … » pour l'onglet PE mousses.\nRESULTAT_ALL_TEXTILE = r\"^resultat.*all[_\\-.]*textile\"\nRESULTAT_PE = r\"^resultat.*(?<![a-z])pe(?![a-z])\"\n\n\ndef nom_court(chemin: str) -> str:\n    return chemin.replace(\"\\\\\", \"/\").rsplit(\"/\", 1)[-1]\n\n\ndef date_modif(chemin: str) -> int:\n    \"\"\"Date de modification du fichier en millisecondes (0 si inconnue, ex. en développement local).\"\"\"\n    m = MARQUE_MODIF.search(chemin.replace(\"\\\\\", \"/\"))\n    return int(m.group(1)) if m else 0\n\n\ndef sans_marque(chemin: str) -> str:\n    \"\"\"Chemin sans la date de modification ajoutée par build.py.\"\"\"\n    return MARQUE_MODIF.sub(\"\", chemin)\n\n\ndef date_dans_nom(nom: str) -> date | None:\n    \"\"\"Date d'extraction lue dans le nom du fichier (sans le dossier), ou None.\"\"\"\n    nom = nom_court(nom)\n    for motif, ordre in ((DATE_ISO, (0, 1, 2)), (DATE_FR, (2, 1, 0))):\n        for m in motif.finditer(nom):\n            a, mo, j = (m.group(i + 1) for i in ordre)\n            try:\n                return date(int(a) if len(a) == 4 else 2000 + int(a), int(mo), int(j))\n            except ValueError:\n                continue\n    return None\n\n\ndef dossier_chantier(chemin: str) -> str:\n    \"\"\"Dossier « <IMMAT> - <JJMMAA> » qui contient le fichier (le plus proche), ou HORS_CHANTIER.\"\"\"\n    parties = chemin.replace(\"\\\\\", \"/\").split(\"/\")[:-1]\n    for partie in reversed(parties):\n        if sio.chantier_depuis_nom(partie):\n            return partie\n    return HORS_CHANTIER\n\n\ndef regrouper(chemins: list[str]) -> dict[str, list[str]]:\n    \"\"\"{dossier chantier: [chemins]} ; les fichiers hors dossier chantier vont sous HORS_CHANTIER.\"\"\"\n    groupes: dict[str, list[str]] = {}\n    for c in chemins:\n        groupes.setdefault(dossier_chantier(c), []).append(c)\n    return groupes\n\n\ndef chantiers_tries(groupes: dict[str, list[str]]) -> list[str]:\n    \"\"\"Dossiers chantier triés par date de début (les plus proches d'abord), puis par nom.\"\"\"\n    noms = [g for g in groupes if g != HORS_CHANTIER]\n    return sorted(noms, key=lambda g: (sio.chantier_depuis_nom(g)[1], g))\n\n\ndef _recence(chemin: str) -> tuple:\n    ms = date_modif(chemin)\n    jour = date_dans_nom(chemin) or (datetime.fromtimestamp(ms / 1000).date() if ms else date.min)\n    return jour, ms, nom_court(chemin).lower()\n\n\ndef meilleur(chemins: list[str]) -> str:\n    \"\"\"Parmi plusieurs fichiers d'une même source, le plus récent : date écrite dans le nom, à défaut date de\n    modification du fichier ; à égalité, le dernier modifié, puis le dernier par nom.\"\"\"\n    return max(chemins, key=_recence)\n\n\ndef repartir(sources: dict[str, str | None]) -> tuple[dict[str, list[str]], list[str]]:\n    \"\"\"{chemin: source} → ({source: [chemins, le retenu en premier]}, [chemins non reconnus]).\"\"\"\n    par_source: dict[str, list[str]] = {}\n    inconnus = []\n    for chemin, source in sources.items():\n        if source is None:\n            inconnus.append(chemin)\n        else:\n            par_source.setdefault(source, []).append(chemin)\n    for source, liste in par_source.items():\n        retenu = meilleur(liste)\n        par_source[source] = [retenu] + sorted((c for c in liste if c != retenu), key=nom_court)\n    return par_source, inconnus\n\n\ndef appliquer_noms(sources: dict[str, str | None], regles: dict) -> dict[str, str | None]:\n    \"\"\"Règles de nommage propres à un dossier ({source: motif regex, ou liste de motifs par ordre de préférence}, sur le\n    nom normalisé, sans accents ni majuscules), appliquées dans l'ordre.\n\n    Si au moins un fichier correspond au motif d'une source, il fait foi : il prend cette source et les autres\n    fichiers reconnus comme cette source par leur contenu sont écartés. Avec une liste, le premier motif qui trouve un\n    fichier l'emporte (ex. « Résultat ALL TEXTILE », à défaut tout « Résultat »). Un fichier pris par une règle ne\n    peut plus l'être par une règle suivante. Sans fichier correspondant, la détection par contenu s'applique.\n    \"\"\"\n    sources = dict(sources)\n    pris: set[str] = set()\n    for source, motifs in regles.items():\n        retenus = []\n        for motif in [motifs] if isinstance(motifs, str) else motifs:\n            retenus = [c for c in sources if c not in pris and re.search(motif, sio.normaliser(nom_court(c)))]\n            if retenus:\n                break\n        if not retenus:\n            continue\n        pris.update(retenus)\n        for c in sources:\n            if c in retenus:\n                sources[c] = source\n            elif sources[c] == source and c not in pris:\n                sources[c] = None\n    return sources\n", "app/core/icones.py": "\"\"\"Icônes vectorielles (traits, dessin du jeu Lucide, licence ISC) : remplacent les emojis de l'interface.\n\nInsérées en SVG dans le HTML des composants : rendu identique sur tous les postes, couleur héritée du texte.\n\"\"\"\n\nICONES = {\n    \"wrench\": '<path d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z\"/>',\n    \"scissors\": '<circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/>',\n    \"armchair\": '<path d=\"M19 9V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v3\"/><path d=\"M3 16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z\"/><path d=\"M5 18v2\"/><path d=\"M19 18v2\"/>',\n    \"factory\": '<path d=\"M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z\"/><path d=\"M17 18h1\"/><path d=\"M12 18h1\"/><path d=\"M7 18h1\"/>',\n    \"bell\": '<path d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9\"/><path d=\"M10.3 21a1.94 1.94 0 0 0 3.4 0\"/>',\n    \"folder\": '<path d=\"M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z\"/>',\n    \"check\": '<path d=\"M20 6 9 17l-5-5\"/>',\n    \"download\": '<path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/><path d=\"m7 10 5 5 5-5\"/><path d=\"M12 15V3\"/>',\n    \"sliders\": '<path d=\"M4 21v-7\"/><path d=\"M4 10V3\"/><path d=\"M12 21v-9\"/><path d=\"M12 8V3\"/><path d=\"M20 21v-5\"/><path d=\"M20 12V3\"/><path d=\"M2 14h4\"/><path d=\"M10 8h4\"/><path d=\"M18 16h4\"/>',\n    \"search\": '<circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/>',\n    \"alert\": '<path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/>',\n    \"calendar\": '<rect x=\"3\" y=\"4\" widt \" width=\"18\" height=\"18\" rx=\"2\"/><circle cx=\"9\" cy=\"9\" r=\"2\"/><path d=\"m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21\"/>',\n    \"clock\": '<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/>',\n    \"moon\": '<path d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z\"/>',\n    \"grid\": '<rect x=\"3\" y=\"3\" width=\"7\" height=\"9\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"5\" rx=\"1\"/><rect x=\"14\" y=\"12\" width=\"7\" height=\"9\" rx=\"1\"/><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\" rx=\"1\"/>',\n    \"trend\": '<path d=\"M22 7 13.5 15.5 8.5 10.5 2 17\"/><path d=\"M16 7h6v6\"/>',\n    \"table\": '<path d=\"M12 3v18\"/><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18\"/><path d=\"M3 15h18\"/>',\n    \"pause\": '<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M10 15V9\"/><path d=\"M14 15V9\"/>',\n    \"info\": '<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 16v-4\"/><path d=\"M12 8h.01\"/>',\n    \"target\": '<circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/>',\n    \"check-circle\": '<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/>',\n    \"tag\": '<path d=\"M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z\"/><circle cx=\"7.5\" cy=\"7.5\" r=\".5\" fill=\"currentColor\"/>',\n    \"plane\": '<path d=\"M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z\"/>',\n    \"x\": '<path d=\"M18 6 6 18\"/><path d=\"m6 6 12 12\"/>',\n    \"moteur\": '<rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"2\"/><rect x=\"9\" y=\"9\" width=\"6\" height=\"6\"/><path d=\"M15 2v2\"/><path d=\"M15 20v2\"/><path d=\"M2 15h2\"/><path d=\"M2 9h2\"/><path d=\"M20 15h2\"/><path d=\"M20 9h2\"/><path d=\"M9 2v2\"/><path d=\"M9 20v2\"/>',\n    \"inbox\": '<path d=\"M22 12h-6l-2 3h-4l-2-3H2\"/><path d=\"M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z\"/>',\n    \"link\": '<path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/>',\n    \"euro\": '<path d=\"M4 10h12\"/><path d=\"M4 14h9\"/><path d=\"M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2\"/>',\n    \"users\": '<path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/>',\n    \"gauge\": '<path d=\"m12 14 4-4\"/><path d=\"M3.34 19a10 10 0 1 1 17.32 0\"/>',\n    \"box-off\": '<path d=\"M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z\"/><path d=\"m3.3 7 8.7 5 8.7-5\"/><path d=\"M12 22V12\"/><path d=\"m2 2 20 20\"/>',\n}\n\n\ndef ic(nom: str, cls: str = \"\") -> str:\n    \"\"\"SVG de l'icône `nom` (vide si inconnue).\"\"\"\n    if nom not in ICONES:\n        return \"\"\n    return (f'<svg class=\"s360-ic {cls}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" '\n            f'stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">{ICONES[nom]}<\/svg>')\n", "app/core/io.py": "\"\"\"Lecture des fichiers importés, normalisation / validation des colonnes, export Excel.\n\nAucune dépendance à Streamlit : tout est testable avec pytest. Les fichiers arrivent\nsous forme d'octets (`UploadedFile.getvalue()`), jamais via un chemin.\n\nLecture avec calamine (moteur Rust inclus dans Pyodide, ~10× plus rapide qu'openpyxl) ;\nexport avec core/xlsx.py (bibliothèque standard).\n\"\"\"\n\nimport codecs\nimport html\nimport io\nimport re\nimport unicodedata\nimport zipfile\nfrom datetime import date\n\nimport numpy as np\nimport pandas as pd\n\nfrom core import transforms as tf\nfrom core import xlsx\n\n\nclass ColonneIntrouvable(ValueError):\n    \"\"\"Erreur métier lisible : une colonne attendue manque dans un fichier importé.\"\"\"\n\n    def __init__(self, libelle: str, fichier: str, feuille: str | None = None, colonnes=None):\n        msg = f\"Colonne « {libelle} » introuvable dans le fichier {fichier}\"\n        msg += f\" (feuille « {feuille} »).\" if feuille else \".\"\n        if colonnes is not None:\n            msg += \" Colonnes détectées : \" + \", \".join(str(c) for c in colonnes)\n        super().__init__(msg)\n\n\nclass FichierIllisible(ValueError):\n    \"\"\"Le fichier importé ne peut pas être lu (format, feuille absente…).\"\"\"\n\n\n# Libellés des sources : identiques dans tous les onglets (CLAUDE.md §2.3).\nFICHIER_BESOINS = \"Besoins chantier (LOGOPS)\"\nFICHIER_ASREQ = \"Étude ASREQ/NOREQ\"\nFICHIER_STOCK = \"État du stock\"\nFICHIER_COMMANDES = \"Commandes (SAP)\"\nFICHIER_REFERENCES = \"Références textile\"\n\n\n# --------------------------------------------------------------------------\n# Reconnaissance des fichiers par leur nom (import groupé d'un dossier SharePoint)\n# --------------------------------------------------------------------------\n# Mots-clés cherchés dans le nom du fichier (sans accents ni majuscules), par ordre de priorité.\nMOTS_CLES_SOURCES = [\n    (\"besoin_prod\", (\"besoin_prod\",)),\n    (\"pe\", (\"pe_mousse\",)),\n    (\"besoins\", (\"logops\",)),\n    (\"asreq\", (\"asreq\", \"noreq\")),\n    (\"pieces\", (\"piece\",)),\n    (\"references\", (\"reference\", \"catalog\")),\n    (\"commandes\", (\"commande\", \"sap\")),\n    (\"stock\", (\"stock\", \"resultat\")),  # export « Résultat - <IMMAT>.xlsx » de l'État du stock\n]\nCHANTIER_DANS_NOM = re.compile(r\"(?<![A-Z0-9])([A-Z]{1,2}-?[A-Z0-9]{3,5})\\s*-\\s*(\\d{2})(\\d{2})(\\d{2})(?!\\d)\")\n\n\ndef reconnaitre_fichier(nom: str) -> str | None:\n    \"\"\"Source d'un fichier d'après son nom : besoins, asreq, pieces, references, commandes, stock (ou None).\"\"\"\n    n = normaliser(nom.rsplit(\".\", 1)[0])\n    for source, mots in MOTS_CLES_SOURCES:\n        if any(m in n for m in mots):\n            return source\n    return None\n\n\n# Signatures de contenu : mots-clés de la ligne d'en-tête (mêmes règles que les lecteurs ci-dessous).\nSIGNATURES_SOURCES = [\n    (\"besoin_prod\", [\"ccn\", \"qty per a/c\", \"nb_ac\"]),\n    (\"besoins\", [\"mpn prime\", \"qty\"]),\n    (\"stock\", [\"pnr\", \"qte sur etagere\"]),\n    (\"commandes\", [\"pn\", \"code acheteur\", \"commande\"]),\n    (\"pieces\", [\"qty_per_ac\", \"registration\"]),\n    (\"references\", [\"pn\", \"equip\"]),\n]\n\n\n# --------------------------------------------------------------------------\n# Aperçu rapide d'un classeur .xlsx / .xlsm (en-têtes seulement)\n# --------------------------------------------------------------------------\n_NS = r\"(?:[\\w.-]+:)?\"  # préfixe d'espace de noms éventuel (« x:row » : fichiers produits par certains logiciels)\n\n\ndef _texte_xml(fragment: str) -> str:\n    fragment = re.sub(rf\"<{_NS}rPh\\b.*?<\/{_NS}rPh>\", \"\", fragment, flags=re.S)  # annotations phonétiques\n    return html.unescape(\"\".join(re.findall(rf\"<{_NS}t\\b[^>]*?(?:/>|>(.*?)<\/{_NS}t>)\", fragment, re.S)))\n\n\ndef apercu_xlsx(data: bytes, max_lignes: int = 30, max_feuilles: int = 10, octets: int = 400_000):\n    \"\"\"[(feuille, lignes)] : les premières lignes de chaque feuille, en ne lisant que le début du fichier XML.\n\n    Le moteur Excel charge une feuille ENTIÈRE même pour en lire 15 lignes : sous Pyodide, reconnaître un gros État\n    du stock prenait plusieurs secondes et beaucoup de mémoire, pendant lesquelles la page semblait figée. Ici, on\n    décompresse seulement le début de chaque feuille (et des textes partagés). None si le fichier n'est pas un .xlsx.\n    Tolère les variantes d'écriture des exports (balises préfixées « x: », chemins et casse des fichiers internes\n    différents, lignes vides abrégées) ; si rien n'est reconnu, l'appelant repasse par la lecture classique.\n    \"\"\"\n    try:\n        z = zipfile.ZipFile(io.BytesIO(data))\n    except Exception:\n        return None\n    noms_zip = {n.lower(): n for n in z.namelist()}\n\n    def lire(chemin, taille=-1):\n        nom = noms_zip.get(chemin.lstrip(\"/\").lower())\n        if nom is None:\n            raise KeyError(chemin)\n        with z.open(nom) as f:\n            return f.read(taille).decode(\"utf-8\", \"ignore\")\n\n    def relations(chemin):\n        \"\"\"{Id: (Type, cible)} du fichier de relations `chemin` (cibles relatives au dossier de la partie).\"\"\"\n        dossier = \"\" if chemin.startswith(\"_rels/\") else chemin.rsplit(\"/_rels/\", 1)[0]\n        out = {}\n        for rel in re.findall(rf\"<{_NS}Relationship\\b[^>]*>\", lire(chemin)):\n            i, t, ty = (re.search(rf'\\b{a}=\"([^\"]*)\"', rel) for a in (\"Id\", \"Target\", \"Type\"))\n            if i and t:\n                cible = t.group(1)\n                cible = cible.lstrip(\"/\") if cible.startswith(\"/\") else (f\"{dossier}/{cible}\" if dossier else cible)\n                parties = []\n                for x in cible.split(\"/\"):  # « xl/../x » → « x »\n                    if x == \"..\":\n                        parties = parties[:-1]\n                    elif x not in (\"\", \".\"):\n                        parties.append(x)\n                out[i.group(1)] = (ty.group(1) if ty else \"\", \"/\".join(parties))\n        return out\n\n    try:\n        racine = relations(\"_rels/.rels\")\n        chemin_classeur = next((c for ty, c in racine.values() if ty.endswith(\"/officeDocument\")), \"xl/workbook.xml\")\n    except Exception:\n        chemin_classeur = \"xl/workbook.xml\"\n    dossier = chemin_classeur.rsplit(\"/\", 1)[0] if \"/\" in chemin_classeur else \"\"\n    try:\n        classeur = lire(chemin_classeur)\n        cibles = relations(f\"{dossier}/_rels/{chemin_classeur.rsplit('/', 1)[-1]}.rels\" if dossier\n                           else f\"_rels/{chemin_classeur}.rels\")\n    except Exception:\n        return None\n    feuilles = []\n    for balise in re.findall(rf\"<{_NS}sheet\\b[^>]*>\", classeur):\n        n, r = re.search(r'\\bname=\"([^\"]*)\"', balise), re.search(r'\\b[\\w.-]*:?id=\"([^\"]+)\"', balise)\n        if n and r and r.group(1) in cibles:\n            feuilles.append((html.unescape(n.group(1)), cibles[r.group(1)][1]))\n    lignes_par_feuille, besoins = [], set()\n    for nom, chemin in feuilles[:max_feuilles]:\n        try:\n            xml = lire(chemin, octets)\n        except KeyError:\n            continue\n        lignes = []\n        for attrs_ligne, ligne in re.findall(rf\"<{_NS}row\\b([^>]*?)(?:/>|>(.*?)<\/{_NS}row>)\", xml, re.S):\n            num = re.search(r'\\br=\"(\\d+)\"', attrs_ligne)\n            rang = int(num.group(1)) - 1 if num else len(lignes)  # rang réel (lignes vides absentes du XML)\n            if rang >= max_lignes:\n                break\n            lignes += [[] for _ in range(rang - len(lignes))]\n            cellules = []\n            for attrs, corps in re.findall(rf\"<{_NS}c\\b([^>]*?)(?:/>|>(.*?)<\/{_NS}c>)\", ligne or \"\", re.S):\n                v = re.search(rf\"<{_NS}v>(.*?)<\/{_NS}v>\", corps or \"\", re.S)\n                if re.search(r'\\bt=\"s\"', attrs) and v:\n                    besoins.add(int(v.group(1)))\n                    cellules.append((\"s\", int(v.group(1))))\n                elif re.search(r'\\bt=\"inlineStr\"', attrs):\n                    cellules.append((\"t\", _texte_xml(corps or \"\")))\n                else:\n                    cellules.append((\"t\", html.unescape(v.group(1)) if v else \"\"))\n            lignes.append(cellules)\n        lignes_par_feuille.append((nom, lignes))\n    partages = []\n    chemin_textes = next((c for ty, c in cibles.values() if ty.endswith(\"/sharedStrings\")), f\"{dossier}/sharedStrings.xml\")\n    if besoins and chemin_textes.lower() in noms_zip:\n        with z.open(noms_zip[chemin_textes.lower()]) as f:  # lecture progressive jusqu'au dernier texte utile\n            reste, decodeur = \"\", codecs.getincrementaldecoder(\"utf-8\")(\"ignore\")  # accents coupés entre deux blocs\n            motif = re.compile(rf\"<{_NS}si\\b[^>]*?(?:/>|>(.*?)<\/{_NS}si>)\", re.S)\n            while len(partages) <= max(besoins):\n                bloc = f.read(262_144)\n                if not bloc:\n                    break\n                reste += decodeur.decode(bloc)\n                complets = list(motif.finditer(reste))  # textes entiers seulement : la fin du bloc attend le suivant\n                if complets:\n                    partages += [_texte_xml(m.group(1) or \"\") for m in complets]\n                    reste = reste[complets[-1].end():]\n    return [(nom, [[(partages[v] if v < len(partages) else \"\") if k == \"s\" else v for k, v in l] for l in lignes])\n            for nom, lignes in lignes_par_feuille]\n\n\ndef _source_par_entetes(noms, lire) -> str | None:\n    if \"Ordered\" in noms:  # étude ASREQ/NOREQ (classeur .xlsm, feuille « Ordered »)\n        return \"asreq\"\n    if any(\"bottom_foam\" in normaliser(f) or \"backrest_foam\" in normaliser(f) for f in noms):\n        return \"pe\"  # fichier PE mousses (feuilles BOTTOM FOAM / BACKREST FOAM)\n    apercus = []\n    for feuille in noms[:10]:\n        try:\n            apercus.append(lire(feuille))\n        except Exception:\n            continue\n    # Signature par signature sur TOUTES les feuilles : une feuille annexe (paramètres, légende…) qui ressemble à un\n    # autre fichier ne doit pas l'emporter sur la feuille de données de l'État du stock.\n    for source, mots in SIGNATURES_SOURCES:\n        if any(trouver_ligne_entete(raw, mots, max_scan=LIGNES_ENTETE) is not None for raw in apercus):\n            return source\n    return None\n\n\ndef detecter_source(data: bytes, nom: str) -> str | None:\n    \"\"\"Source d'un fichier d'après son CONTENU (en-têtes des 30 premières lignes de chaque feuille).\n\n    Indépendant du nom du fichier, qui peut changer. None si rien ne correspond ou fichier illisible.\n    Aperçu rapide d'abord (apercu_xlsx) ; s'il ne reconnaît rien (export écrit autrement), lecture classique.\n    \"\"\"\n    if nom.lower().endswith(\".csv\"):\n        tete = normaliser(data[:4000].decode(\"utf-8-sig\", errors=\"ignore\").split(\"\\n\", 1)[0])\n        return \"pieces\" if \"qty_per_ac\" in tete and \"registration\" in tete else None\n    apercu = apercu_xlsx(data)\n    if apercu:\n        contenus = dict(apercu)\n        source = _source_par_entetes([n for n, _ in apercu], lambda f: pd.DataFrame(contenus[f]))\n        if source:\n            return source\n    try:\n        xl = ouvrir_excel(data, nom)\n    except FichierIllisible:\n        return None\n    return _source_par_entetes(list(xl.sheet_names), lambda f: xl.parse(f, header=None, nrows=LIGNES_ENTETE))\n\n\ndef identifier_fichier(data: bytes, nom: str) -> str | None:\n    \"\"\"Source d'un fichier : par son contenu d'abord, à défaut par les mots-clés de son nom.\"\"\"\n    return detecter_source(data, nom) or reconnaitre_fichier(nom.replace(\"\\\\\", \"/\").rsplit(\"/\", 1)[-1])\n\n\ndef chantier_depuis_nom(nom: str) -> tuple[str, date] | None:\n    \"\"\"« F-XKAA - 151126 - LOGOPS.xlsx » → (\"F-XKAA\", date(2026, 11, 15)) ; None si absent ou date invalide.\"\"\"\n    m = CHANTIER_DANS_NOM.search(nom.upper())\n    if not m:\n        return None\n    try:\n        return m.group(1), date(2000 + int(m.group(4)), int(m.group(3)), int(m.group(2)))\n    except ValueError:\n        return None\n\n\n# --------------------------------------------------------------------------\n# Normalisation des en-têtes et recherche de colonnes\n# --------------------------------------------------------------------------\ndef normaliser(s) -> str:\n    \"\"\"Minuscules, sans accents, espaces → `_` (« Qté sur\\\\nÉtagère » → « qte_sur_etagere »).\"\"\"\n    s = str(s).replace(\"\\n\", \" \").strip()\n    s = unicodedata.normalize(\"NFKD\", s).encode(\"ascii\", \"ignore\").decode(\"ascii\")\n    return re.sub(r\"\\s+\", \"_\", s).strip(\"_\").lower()\n\n\ndef nettoyer_entetes(df: pd.DataFrame) -> pd.DataFrame:\n    df = df.copy()\n    df.columns = [str(c).replace(\"\\n\", \" \").strip() for c in df.columns]\n    return df\n\n\ndef trouver_colonne(df: pd.DataFrame, *alias: str, exact: bool = False):\n    \"\"\"Renvoie la première colonne dont le nom normalisé correspond à un alias.\n\n    Correspondance exacte d'abord, puis partielle (alias contenu dans le nom) sauf si\n    `exact=True`. Renvoie None si rien ne correspond.\n    \"\"\"\n    noms = {c: normaliser(c) for c in df.columns}\n    cibles = [normaliser(a) for a in alias]\n    for col, n in noms.items():\n        if n in cibles:\n            return col\n    if exact:\n        return None\n    for col, n in noms.items():\n        for cible in cibles:\n            if cible in n:\n                return col\n    return None\n\n\nLIGNES_ENTETE = 30  # l'en-tête est cherché dans les 30 premières lignes (titres, filtres ou lignes vides au-dessus)\n\n\ndef trouver_ligne_entete(raw: pd.DataFrame, mots_cles, max_scan: int = LIGNES_ENTETE):\n    \"\"\"Indice de la ligne d'en-tête (feuille lue sans header) contenant tous les mots-clés.\"\"\"\n    cles = [normaliser(m) for m in mots_cles]\n    for i in range(min(max_scan, len(raw))):\n        cellules = [normaliser(v) for v in raw.iloc[i].tolist()]\n        jointes = \"|\".join(cellules)\n        if all(any(m in c for c in cellules) or m in jointes for m in cles):\n            return i\n    return None\n\n\n# --------------------------------------------------------------------------\n# Ouverture des classeurs\n# --------------------------------------------------------------------------\ndef _moteur() -> str:\n    try:\n        import python_calamine  # noqa: F401\n        return \"calamine\"\n    except ImportError:  # développement local sans calamine\n        return \"openpyxl\"\n\n\ndef ouvrir_excel(data: bytes, fichier: str) -> pd.ExcelFile:\n    try:\n        xl = pd.ExcelFile(io.BytesIO(data), engine=_moteur())\n        xl.s360_octets = data  # pour choisir_feuille : aperçu rapide des en-têtes (apercu_xlsx)\n        return xl\n    except Exception as exc:  # format non Excel, fichier corrompu ou protégé\n        raise FichierIllisible(\n            f\"Le fichier {fichier} n'a pas pu être ouvert comme classeur Excel ({exc}).\"\n        ) from exc\n\n\ndef choisir_feuille(xl: pd.ExcelFile, mots_cles, feuille_preferee: str | None = None):\n    \"\"\"(nom_feuille, ligne_entete) de la feuille contenant les colonnes attendues.\n\n    La feuille dont le nom contient `feuille_preferee` est testée en premier ; à défaut\n    on renvoie la première feuille avec l'en-tête en ligne 0.\n    \"\"\"\n    feuilles = list(xl.sheet_names)\n    if feuille_preferee:\n        cible = normaliser(feuille_preferee)\n        feuilles.sort(key=lambda s: 0 if cible in normaliser(s) else 1)\n    apercu = apercu_xlsx(xl.s360_octets) if getattr(xl, \"s360_octets\", None) is not None else None\n    apercu = dict(apercu) if apercu else {}\n    # aperçu rapide (début du XML) plutôt que le chargement de toute la feuille ; à défaut, lecture classique\n    for rapide in ([True, False] if apercu else [False]):\n        for s in feuilles:\n            if rapide and s not in apercu:\n                continue\n            try:\n                raw = pd.DataFrame(apercu[s]) if rapide else xl.parse(s, header=None, nrows=LIGNES_ENTETE)\n            except Exception:\n                continue\n            h = trouver_ligne_entete(raw, mots_cles)\n            if h is not None:\n                return s, h\n    return xl.sheet_names[0], 0\n\n\ndef _cellule(v):\n    \"\"\"Comme pandas : nombre entier → int, texte vide → None.\"\"\"\n    if type(v) is float and v.is_integer():\n        return int(v)\n    return None if v == \"\" else v\n\n\ndef lire_colonnes(xl: pd.ExcelFile, feuille: str, entete: int, mots_cles, garder) -> pd.DataFrame:\n    \"\"\"Lecture ÉCONOME EN MÉMOIRE : seules les colonnes dont le nom normalisé satisfait `garder(nom)` sont gardées.\n\n    pandas crée un objet Python par cellule de TOUTES les colonnes (≈ 80 Mo pour 30 000 lignes × 23 colonnes sous\n    Pyodide, où la mémoire ne redescend jamais) : un gros État du stock pouvait saturer la mémoire du navigateur et\n    figer la page. Ici, les lignes sont lues une à une (moteur calamine) et seules les colonnes utiles sont gardées.\n    Sans calamine (développement local), lecture pandas classique.\n    \"\"\"\n    livre = getattr(xl, \"book\", None)\n    if not hasattr(livre, \"get_sheet_by_name\"):\n        return lire_feuille(xl, feuille, entete)\n    lignes = livre.get_sheet_by_name(feuille).iter_rows()\n    cles = [normaliser(m) for m in mots_cles]\n    for i, ligne in enumerate(lignes):  # ligne d'en-tête : celle qui contient les mots-clés (comme trouver_ligne_entete)\n        cellules = [normaliser(v) for v in ligne]\n        jointes = \"|\".join(cellules)\n        if all(any(m in c for c in cellules) or m in jointes for m in cles):\n            break\n        if i >= 30:\n            return lire_feuille(xl, feuille, entete)\n    else:\n        return lire_feuille(xl, feuille, entete)\n    noms, vus = [], {}\n    for j, v in enumerate(ligne):  # noms de colonnes comme pandas : vides → « Unnamed: j », doublons → « X.1 »\n        n = str(v).replace(\"\\n\", \" \").strip() if v not in (None, \"\") else f\"Unnamed: {j}\"\n        if n in vus:\n            vus[n] += 1\n            n = f\"{n}.{vus[n]}\"\n        else:\n            vus[n] = 0\n        noms.append(n)\n    idx = [j for j, n in enumerate(noms) if garder(normaliser(n))]\n    valeurs = {j: [] for j in idx}\n    for ligne in lignes:\n        n = len(ligne)\n        for j in idx:\n            valeurs[j].append(_cellule(ligne[j]) if j < n else None)\n    df = pd.DataFrame({noms[j]: pd.Series(valeurs[j], dtype=object) for j in idx})\n    return df.dropna(how=\"all\").reset_index(drop=True)\n\n\ndef lire_feuille(xl: pd.ExcelFile, feuille: str, entete: int) -> pd.DataFrame:\n    \"\"\"Lit une feuille en conservant les types bruts d'Excel (dtype=object) :\n    un PN numérique reste un entier (pas de « 12345.0 »).\"\"\"\n    return nettoyer_entetes(xl.parse(feuille, header=entete, dtype=object))\n\n\n# --------------------------------------------------------------------------\n# Typage explicite\n# --------------------------------------------------------------------------\ndef _sans_decimale(v):\n    if isinstance(v, float) and v.is_integer():\n        return int(v)\n    return v\n\n\ndef cle_pn(serie: pd.Series) -> pd.Series:\n    \"\"\"Référence pièce en texte pour les jointures : majuscules, sans aucun espace.\n\n    Les zéros en tête sont conservés s'ils sont saisis en texte dans Excel.\n    \"\"\"\n    s = serie.map(_sans_decimale, na_action=\"ignore\")\n    s = s.map(str, na_action=\"ignore\").str.replace(\"[\\\\s\\u00a0\\u202f]+\", \"\", regex=True).str.upper()\n    return s.where(~s.isin([\"\", \"NAN\", \"NONE\", \"NAT\"]), np.nan).astype(object)\n\n\ndef texte(serie: pd.Series) -> pd.Series:\n    \"\"\"Texte nettoyé, valeurs vides → NaN (évite la chaîne « nan »).\"\"\"\n    s = serie.map(_sans_decimale, na_action=\"ignore\").map(str, na_action=\"ignore\").str.strip()\n    return s.where(s.notna() & (s != \"\"), np.nan).astype(object)\n\n\ndef nombre(serie: pd.Series, defaut=None) -> pd.Series:\n    s = pd.to_numeric(serie, errors=\"coerce\")\n    return s.fillna(defaut) if defaut is not None else s\n\n\ndef dates(serie: pd.Series) -> pd.Series:\n    \"\"\"Dates Excel ou texte JJ/MM/AAAA → datetime64 (NaT si invalide).\"\"\"\n    # Unité fixée (ns) : la précision dépend sinon du type des cellules (objets datetime ou Timestamp).\n    return pd.to_datetime(serie, errors=\"coerce\", dayfirst=True, format=\"mixed\").astype(\"datetime64[ns]\")\n\n\n# --------------------------------------------------------------------------\n# Export Excel\n# --------------------------------------------------------------------------\ndef nom_export(tab_id: str, jour: date | None = None) -> str:\n    jour = jour or date.today()\n    return f\"Supply360_{tab_id}_{jour:%Y%m%d}.xlsx\"\n\n\ndef exporter_excel(feuilles: dict, couleurs_lignes: dict | None = None, couleurs_cellules: dict | None = None) -> bytes:\n    \"\"\"Écrit {nom_feuille: DataFrame} dans un classeur mis en forme.\n\n    En-têtes en gras sur fond bleu marine, volets figés, filtres automatiques, largeurs\n    ajustées, dates au format JJ/MM/AAAA. `couleurs_lignes` = {nom_feuille: liste de\n    couleurs hexa (ou None) alignée sur les lignes} pour surligner certaines lignes ; `couleurs_cellules` =\n    {nom_feuille: {colonne: couleurs}} pour colorer une seule colonne (le statut, comme les badges de l'interface).\n    \"\"\"\n    return xlsx.classeur(feuilles, couleurs_lignes, couleurs_cellules)\n\n\n# --------------------------------------------------------------------------\n# Lecture des sources (une ligne par ligne de fichier, colonnes normalisées)\n# --------------------------------------------------------------------------\ndef lire_besoins_geav(data: bytes):\n    \"\"\"Besoins chantier « classiques » (colonnes MPN Prime / Qty). Renvoie (lignes, feuille).\"\"\"\n    xl = ouvrir_excel(data, FICHIER_BESOINS)\n    feuille, entete = choisir_feuille(xl, [\"mpn prime\", \"qty\"], feuille_preferee=\"PartRequirements\")\n    df = lire_feuille(xl, feuille, entete)\n\n    c_pn = trouver_colonne(df, \"mpn prime\", exact=True) or trouver_colonne(df, \"mpn prime\")\n    c_qty = trouver_colonne(df, \"qty\", exact=True) or trouver_colonne(df, \"quantite\", \"quantity\")\n    c_desc = trouver_colonne(df, \"description\")\n    c_task = trouver_colonne(df, \"task trfx\", exact=True) or trouver_colonne(\n        df, \"t
