: \"?\" if pd.isna(g) else str(int(g)))\n    deficit = m[\"Deficit\"].astype(str)\n    a_cmd = m[\"Qty_a_commander\"].astype(str)\n    contact = \" (contact: \" + agent + \")\"\n\n    regles = [  # (condition, code, message) — la première condition vraie l'emporte\n        (~m[\"in_stock_file\"], \"inconnu\",\n         pd.Series(\"❓ PN introuvable dans le fichier État du stock (à vérifier manuellement)\", index=m.index)),\n        (~m[\"gestion_in_scope\"], \"hors_perimetre\",\n         \"⚠️ Besoin de \" + deficit + \" — Gestion \" + gestion + \" hors périmètre (contacter \" + agent + \")\"),\n        ((m[\"Qty_a_commander\"] > 0) & (m[\"QTY_CDE\"] > 0), \"commander\",\n         \"🔴 Commander le complément (\" + a_cmd + \") + relancer \" + fourn + contact),\n        (m[\"Qty_a_commander\"] > 0, \"commander\",\n         \"🔴 Commander \" + a_cmd + \" — aucune commande en cours\" + contact),\n        (m[\"Deficit\"] <= 0, \"ok\",\n         pd.Series(\"🟢 Stock suffisant — aucune action\", index=m.index)),\n        (psd.isna() | psd_manquante, \"relancer\",\n         \"🟠 Relancer \" + fourn + \" — commande en cours, PSD manquante ou à confirmer\" + contact),\n        (psd_tardive, \"relancer_urgent\",\n         \"🔴 Relancer \" + fourn + \" — PSD \" + psd_txt.fillna(\"\") + \" après la date limite GEAV\" + contact),\n        (pd.Series(True, index=m.index), \"en_cours\",\n         \"🔵 Livraison en cours — PSD \" + psd_txt.fillna(\"\") + \" (\" + fourn + \")\"),\n    ]\n    code = pd.Series(None, index=m.index, dtype=object)\n    message = pd.Series(None, index=m.index, dtype=object)\n    for cond, c, msg in regles:\n        libre = code.isna() & cond.fillna(False).astype(bool)\n        code[libre] = c\n        message[libre] = msg[libre]\n    return code, message\n\n\n# --------------------------------------------------------------------------\n# Synthèse et priorisation\n# --------------------------------------------------------------------------\ndef synthese_geav(m_scope: pd.DataFrame) -> dict:\n    codes = m_scope[\"ACTION_CODE\"]\n    return {\n        \"n_total\": int(len(m_scope)),\n        \"n_commander\": int((codes == \"commander\").sum()),\n        \"qty_a_commander\": int(m_scope.loc[codes == \"commander\", \"Qty_a_commander\"].sum()),\n        \"n_relance\": int(codes.isin([\"relancer\", \"relancer_urgent\"]).sum()),\n        \"n_relance_urgente\": int((codes == \"relancer_urgent\").sum()),\n        \"n_en_cours\": int((codes == \"en_cours\").sum()),\n        \"n_ok\": int((codes == \"ok\").sum()),\n        \"n_inconnu\": int((codes == \"inconnu\").sum()),\n        \"n_risque\": int(m_scope[\"RISK_CLASS\"].sum()),\n    }\n\n\ndef actions_a_lancer(m_scope: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Lignes qui demandent une action, du pire au meilleur : classe 8/9 d'abord,\n    puis commander > relance urgente > relancer > PN introuvable, puis quantité.\"\"\"\n    a = m_scope[m_scope[\"ACTION_CODE\"].isin(ACTIONS_A_LANCER)].copy()\n    a[\"_ordre\"] = a[\"ACTION_CODE\"].map({c: i for i, c in enumerate(ACTION_ORDRE)})\n    a = a.sort_values([\"RISK_CLASS\", \"_ordre\", \"Qty_a_commander\", \"PSD\"],\n                      ascending=[False, True, False, True], kind=\"stable\")\n    return a.drop(columns=\"_ordre\")\n\n\ndef jours_avant(date_debut, aujourd_hui) -> int:\n    return int((pd.Timestamp(date_debut).normalize() - pd.Timestamp(aujourd_hui).normalize()).days)\n", "app/core/xlsx.py": "\"\"\"Écriture de classeurs Excel (.xlsx) mis en forme, avec la seule bibliothèque standard.\n\nRemplace openpyxl / xlsxwriter, absents de Pyodide : l'app n'a plus rien à télécharger\ndepuis PyPI. Gère : plusieurs feuilles, en-têtes en gras blanc sur bleu marine, volets\nfigés, filtres automatiques, largeurs ajustées, dates JJ/MM/AAAA, surlignage de lignes.\n\"\"\"\n\nimport io\nimport math\nimport zipfile\nfrom datetime import date, datetime\nfrom xml.sax.saxutils import escape\n\nimport numpy as np\nimport pandas as pd\n\nNAVY = \"002157\"\nEPOCH = datetime(1899, 12, 30)\n\n\ndef _col(n: int) -> str:\n    \"\"\"1 → A, 27 → AA.\"\"\"\n    s = \"\"\n    while n:\n        n, r = divmod(n - 1, 26)\n        s = chr(65 + r) + s\n    return s\n\n\ndef _xml_text(v) -> str:\n    # Caractères de contrôle interdits en XML.\n    return escape(\"\".join(ch for ch in str(v) if ch in \"\\t\\n\\r\" or ord(ch) >= 32))\n\n\nclass _Styles:\n    \"\"\"Index de styles (cellXfs) : (format, couleur de fond) → numéro.\"\"\"\n\n    FMT_DATE = 164\n\n    def __init__(self):\n        self.fills = [\"none\", \"gray125\", NAVY]\n        self.xfs = [(0, 0, 0)]          # (numFmtId, fillId, fontId) ; 0 = défaut\n        self.cache = {}\n        self.header = self._xf(0, self._fill(NAVY), 1)\n\n    def _fill(self, hexa):\n        if hexa not in self.fills:\n            self.fills.append(hexa)\n        return self.fills.index(hexa)\n\n    def _xf(self, fmt, fill, font=0):\n        key = (fmt, fill, font)\n        if key not in self.xfs:\n            self.xfs.append(key)\n        return self.xfs.index(key)\n\n    def cellule(self, est_date: bool, fond: str | None):\n        key = (est_date, fond)\n        if key not in self.cache:\n            self.cache[key] = self._xf(self.FMT_DATE if est_date else 0, self._fill(fond) if fond else 0)\n        return self.cache[key]\n\n    def xml(self) -> str:\n        fills = []\n        for f in self.fills:\n            if f in (\"none\", \"gray125\"):\n                fills.append(f'<fill><patternFill patternType=\"{f}\"/><\/fill>')\n            else:\n                fills.append(f'<fill><patternFill patternType=\"solid\"><fgColor rgb=\"FF{f}\"/><bgColor indexed=\"64\"/><\/patternFill><\/fill>')\n        xfs = \"\".join(\n            f'<xf numFmtId=\"{n}\" fontId=\"{fo}\" fillId=\"{fi}\" borderId=\"0\" xfId=\"0\"'\n            + (' applyNumberFormat=\"1\"' if n else \"\") + (' applyFill=\"1\"' if fi else \"\") + (' applyFont=\"1\"' if fo else \"\")\n            + (' applyAlignment=\"1\"><alignment vertical=\"center\" wrapText=\"1\"/><\/xf>' if fo else \"/>\")\n            for n, fi, fo in self.xfs)\n        return ('<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n                '<styleSheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\">'\n                f'<numFmts count=\"1\"><numFmt numFmtId=\"{self.FMT_DATE}\" formatCode=\"dd/mm/yyyy\"/><\/numFmts>'\n                '<fonts count=\"2\"><font><sz val=\"11\"/><name val=\"Calibri\"/><family val=\"2\"/><\/font>'\n                '<font><b/><sz val=\"11\"/><color rgb=\"FFFFFFFF\"/><name val=\"Calibri\"/><family val=\"2\"/><\/font><\/fonts>'\n                f'<fills count=\"{len(fills)}\">{\"\".join(fills)}<\/fills>'\n                '<borders count=\"1\"><border><left/><right/><top/><bottom/><diagonal/><\/border><\/borders>'\n                '<cellStyleXfs count=\"1\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\"/><\/cellStyleXfs>'\n                f'<cellXfs count=\"{len(self.xfs)}\">{xfs}<\/cellXfs>'\n                '<cellStyles count=\"1\"><cellStyle name=\"Normal\" xfId=\"0\" builtinId=\"0\"/><\/cellStyles>'\n                '<\/styleSheet>')\n\n\ndef _valeur(v):\n    \"\"\"(type, valeur XML) d'une cellule ou None si vide.\"\"\"\n    if v is None or v is pd.NaT:\n        return None\n    if isinstance(v, (pd.Timestamp, datetime, date, np.datetime64)):\n        ts = pd.Timestamp(v)\n        if pd.isna(ts):\n            return None\n        ts = ts.tz_localize(None) if ts.tzinfo else ts\n        return \"d\", (ts.to_pydatetime() - EPOCH).total_seconds() / 86400\n    if isinstance(v, (bool, np.bool_)):\n        return \"b\", \"1\" if v else \"0\"\n    if isinstance(v, (int, float, np.integer, np.floating)):\n        f = float(v)\n        if math.isnan(f) or math.isinf(f):\n            return None\n        return \"n\", repr(int(f)) if f.is_integer() and abs(f) < 1e15 else repr(f)\n    s = str(v)\n    return (\"s\", s) if s else None\n\n\ndef _feuille(df: pd.DataFrame, styles: _Styles, fonds, fonds_cellules: dict | None = None) -> tuple[str, str | None]:\n    \"\"\"`fonds` : couleur par ligne ; `fonds_cellules` : {indice de colonne: couleur par ligne} (ex. cellule Statut).\"\"\"\n    fonds_cellules = fonds_cellules or {}\n    ncols, nrows = len(df.columns), len(df)\n    largeurs = [len(str(c)) for c in df.columns]\n    lignes = []\n    entete = \"\".join(f'<c r=\"{_col(j + 1)}1\" t=\"inlineStr\" s=\"{styles.header}\"><is><t>{_xml_text(c)}<\/t><\/is><\/c>'\n                     for j, c in enumerate(df.columns))\n    lignes.append(f'<row r=\"1\">{entete}<\/row>')\n    for i, rec in enumerate(df.itertuples(index=False, name=None), start=2):\n        fond_ligne = fonds[i - 2] if fonds is not None else None\n        cells = []\n        for j, v in enumerate(rec):\n            ref = f\"{_col(j + 1)}{i}\"\n            fond = fonds_cellules[j][i - 2] if j in fonds_cellules and fonds_cellules[j][i - 2] else fond_ligne\n            val = _valeur(v)\n            if val is None:\n                if fond:\n                    cells.append(f'<c r=\"{ref}\" s=\"{styles.cellule(False, fond)}\"/>')\n                continue\n            t, x = val\n            if t == \"d\":\n                cells.append(f'<c r=\"{ref}\" s=\"{styles.cellule(True, fond)}\"><v>{x:.6f}<\/v><\/c>')\n                largeurs[j] = max(largeurs[j], 10)\n            elif t == \"s\":\n                st = styles.cellule(False, fond)\n                cells.append(f'<c r=\"{ref}\" t=\"inlineStr\"{f\" s={chr(34)}{st}{chr(34)}\" if st else \"\"}><is><t xml:space=\"preserve\">'\n                             f'{_xml_text(x)}<\/t><\/is><\/c>')\n                if i < 502:\n                    largeurs[j] = max(largeurs[j], len(x))\n            else:\n                st = styles.cellule(False, fond)\n                cells.append(f'<c r=\"{ref}\"{f\" t={chr(34)}b{chr(34)}\" if t == \"b\" else \"\"}'\n                             f'{f\" s={chr(34)}{st}{chr(34)}\" if st else \"\"}><v>{x}<\/v><\/c>')\n                if i < 502:\n                    largeurs[j] = max(largeurs[j], len(x))\n        lignes.append(f'<row r=\"{i}\">{\"\".join(cells)}<\/row>')\n    cols = \"\".join(f'<col min=\"{j + 1}\" max=\"{j + 1}\" width=\"{min(max(w + 2, 8), 60)}\" customWidth=\"1\"/>'\n                   for j, w in enumerate(largeurs))\n    ref_filtre = f\"A1:{_col(ncols)}{nrows + 1}\" if ncols and nrows else None\n    xml = ('<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n           '<worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" '\n           'xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\">'\n           '<sheetViews><sheetView workbookViewId=\"0\">'\n           '<pane ySplit=\"1\" topLeftCell=\"A2\" activePane=\"bottomLeft\" state=\"frozen\"/>'\n           '<selection pane=\"bottomLeft\" activeCell=\"A2\" sqref=\"A2\"/><\/sheetView><\/sheetViews>'\n           '<sheetFormatPr defaultRowHeight=\"15\"/>'\n           + (f\"<cols>{cols}<\/cols>\" if cols else \"\")\n           + f'<sheetData>{\"\".join(lignes)}<\/sheetData>'\n           + (f'<autoFilter ref=\"{ref_filtre}\"/>' if ref_filtre else \"\")\n           + '<\/worksheet>')\n    return xml, ref_filtre\n\n\ndef classeur(feuilles: dict, couleurs_lignes: dict | None = None, couleurs_cellules: dict | None = None) -> bytes:\n    \"\"\"{nom_feuille: DataFrame} → octets d'un fichier .xlsx. `couleurs_lignes` : {nom: [hexa|None]} ;\n    `couleurs_cellules` : {nom: {colonne: [hexa|None]}} (fond d'une seule colonne, ex. le statut).\"\"\"\n    styles = _Styles()\n    noms, xml_feuilles, filtres = [], [], []\n    for nom, df in feuilles.items():\n        nom31 = \"\".join(ch for ch in str(nom) if ch not in '[]:*?/\\\\')[:31] or \"Feuille\"\n        df = df.reset_index(drop=True)\n        cellules = {list(df.columns).index(c): list(v) for c, v in ((couleurs_cellules or {}).get(nom) or {}).items() if c in df.columns}\n        xml, ref = _feuille(df, styles, (couleurs_lignes or {}).get(nom), cellules)\n        noms.append(nom31)\n        xml_feuilles.append(xml)\n        filtres.append(ref)\n    n = len(noms)\n    sheets = \"\".join(f'<sheet name=\"{_xml_text(s)}\" sheetId=\"{i + 1}\" r:id=\"rId{i + 1}\"/>' for i, s in enumerate(noms))\n    defs = \"\".join(f'<definedName name=\"_xlnm._FilterDatabase\" localSheetId=\"{i}\" hidden=\"1\">'\n                   f\"'{_xml_text(s)}'!{':'.join(_abs(p) for p in ref.split(':'))}<\/definedName>\"\n                   for i, (s, ref) in enumerate(zip(noms, filtres)) if ref)\n    workbook = ('<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n                '<workbook xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" '\n                'xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\">'\n                f'<bookViews><workbookView/><\/bookViews><sheets>{sheets}<\/sheets>'\n                + (f\"<definedNames>{defs}<\/definedNames>\" if defs else \"\") + '<\/workbook>')\n    rels = \"\".join(f'<Relationship Id=\"rId{i + 1}\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet\" '\n                   f'Target=\"worksheets/sheet{i + 1}.xml\"/>' for i in range(n))\n    rels += (f'<Relationship Id=\"rId{n + 1}\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles\" '\n             'Target=\"styles.xml\"/>')\n    types = \"\".join(f'<Override PartName=\"/xl/worksheets/sheet{i + 1}.xml\" '\n                    'ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml\"/>' for i in range(n))\n    buf = io.BytesIO()\n    with zipfile.ZipFile(buf, \"w\", zipfile.ZIP_DEFLATED) as z:\n        z.writestr(\"[Content_Types].xml\",\n                   '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n                   '<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\">'\n                   '<Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/>'\n                   '<Default Extension=\"xml\" ContentType=\"application/xml\"/>'\n                   '<Override PartName=\"/xl/workbook.xml\" '\n                   'ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml\"/>'\n                   '<Override PartName=\"/xl/styles.xml\" '\n                   'ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml\"/>'\n                   f'{types}<\/Types>')\n        z.writestr(\"_rels/.rels\",\n                   '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n                   '<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">'\n                   '<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" '\n                   'Target=\"xl/workbook.xml\"/><\/Relationships>')\n        z.writestr(\"xl/workbook.xml\", workbook)\n        z.writestr(\"xl/_rels/workbook.xml.rels\",\n                   '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n                   f'<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">{rels}<\/Relationships>')\n        z.writestr(\"xl/styles.xml\", styles.xml())\n        for i, xml in enumerate(xml_feuilles):\n            z.writestr(f\"xl/worksheets/sheet{i + 1}.xml\", xml)\n    return buf.getvalue()\n\n\ndef _abs(ref: str) -> str:\n    \"\"\"« Q15 » → « $Q$15 ».\"\"\"\n    lettres = \"\".join(c for c in ref if c.isalpha())\n    return f\"${lettres}${ref[len(lettres):]}\"\n", "app/main.py": "\"\"\"Point d'entrée Supply360 : configuration de page, thème, header et navigation.\n\nFonctionne à l'identique avec `streamlit run app/main.py` et dans le HTML stlite.\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\n# Rend `core` et `modules` importables, que l'app tourne sous Streamlit ou stlite.\n_APP_DIR = str(Path(__file__).resolve().parent)\nif _APP_DIR not in sys.path:\n    sys.path.insert(0, _APP_DIR)\n\nimport streamlit as st  # noqa: E402\n\nst.set_page_config(page_title=\"Supply360 · Air France Industries\", page_icon=\"✈️\",\n                   layout=\"wide\", initial_sidebar_state=\"collapsed\")\n\nfrom core import components as ui  # noqa: E402\nfrom core import journal  # noqa: E402\nfrom core import style  # noqa: E402\nfrom modules import MODULES  # noqa: E402\n\njournal.installer()  # stlite : erreurs Python transmises au bandeau de diagnostic de la page\n\nPAR_ID = {m.TAB_ID: m for m in MODULES}\nassert len(PAR_ID) == len(MODULES), \"TAB_ID en double dans le registre des modules\"\n\n# L'onglet actif est porté par le sélecteur de navigation (clé s360_nav).\nif st.session_state.get(\"s360_nav\") not in PAR_ID:\n    st.session_state[\"s360_nav\"] = MODULES[0].TAB_ID\n\nstyle.inject()\nui.header()\nst.segmented_control(\n    \"Onglet\",\n    options=list(PAR_ID),\n    format_func=lambda tab_id: PAR_ID[tab_id].TAB_LABEL,  # icône et couleur de chaque onglet : theme.css\n    required=True,\n    key=\"s360_nav\",\n    label_visibility=\"collapsed\",\n)\nst.session_state[\"active_tab\"] = st.session_state[\"s360_nav\"]\n\n# Seul l'onglet actif est exécuté (contrairement à st.tabs).\nPAR_ID[st.session_state[\"active_tab\"]].render()\nui.footer()\n", "app/modules/__init__.py": "\"\"\"Registre des onglets de Supply360, dans l'ordre d'affichage.\n\nAjouter un onglet = créer `app/modules/<tab_id>.py` (contrat : TAB_ID, TAB_LABEL, TAB_ICON,\nTAB_DESCRIPTION, render()) puis l'ajouter à MODULES.\n\"\"\"\n\nfrom modules import alertes, fournisseurs, pe_mousses, stock_chantier, textiles\n\nMODULES = [\n    stock_chantier,\n    textiles,\n    pe_mousses,\n    fournisseurs,   # en cours de développement\n    alertes,        # en cours de développement\n]\n", "app/modules/_planning_pe.py": "\"\"\"Sous-onglets « Avancement PE » et « Forecast » de l'onglet PE mousses : avancement de la politique d'entretien\ndes mousses de sièges (fichier PE mousses mensuel) et forecast des commandes (12 / 24 / 36 mois), par PN et par\nfournisseur.\n\nRendu seulement : les calculs sont dans core/pe.py. Fichier préfixé « _ » : ce n'est pas un onglet du registre.\n\"\"\"\n\nimport re\nfrom datetime import date\n\nimport pandas as pd\nimport streamlit as st\n\nfrom core import charts\nfrom core import components as ui\nfrom core import io as sio\nfrom core import pe\nfrom core.style import COLORS\n\nK = \"pe_mousses__\"\nELEMENTS = [\"J · Assise\", \"J · Dossier\", \"W · Assise\", \"Y · Assise\"]\nCOULEURS_ELEMENTS = {\"J · Assise\": COLORS[\"navy_2\"], \"J · Dossier\": \"#7FA7E0\", \"W · Assise\": \"#2A9D8F\", \"Y · Assise\": \"#F4A259\"}\nCFG = {\n    \"Dernier remplacement\": st.column_config.DateColumn(\"Dernier remplacement\", format=\"DD/MM/YYYY\"),\n    \"Échéance\": st.column_config.DateColumn(\"Échéance\", format=\"DD/MM/YYYY\"),\n    \"Prochaine visite\": st.column_config.DateColumn(\"Prochaine visite\", format=\"DD/MM/YYYY\"),\n    \"Date prévue\": st.column_config.DateColumn(\"Date prévue\", format=\"MM/YYYY\"),\n    \"Âge (mois)\": st.column_config.NumberColumn(\"Âge (mois)\", format=\"%d\"),\n    \"Rupture sans commande\": st.column_config.DateColumn(\"Rupture sans commande\", format=\"MM/YYYY\",\n                                                        help=\"Premier mois où le stock devient négatif sans nouvelle commande\"),\n    \"Prix (€)\": st.column_config.NumberColumn(\"Prix (€)\", format=\"%.0f €\"),\n    \"Valeur (€)\": st.column_config.NumberColumn(\"Valeur (€)\", format=\"%.0f €\"),\n    \"Stock\": st.column_config.NumberColumn(\"Stock\", format=\"%d\"),\n    \"En commande\": st.column_config.NumberColumn(\"En commande\", format=\"%d\"),\n    \"Stock de sécurité\": st.column_config.NumberColumn(\"Stock de sécurité\", format=\"%d\",\n                                                      help=\"% des avions de chaque flotte qui utilisent le PN (paramètre) × quantité par avion\"),\n    \"Besoin\": st.column_config.NumberColumn(\"Besoin\", format=\"%d\", help=\"Mousses à remplacer sur l'horizon\"),\n    \"À commander\": st.column_config.NumberColumn(\"À commander\", format=\"%d\",\n                                                help=\"Besoin + stock de sécurité − stock − commandes en cours (toutes, déjà passées)\"),\n    \"À avancer\": st.column_config.NumberColumn(\"À avancer\", format=\"%d\",\n                                              help=\"Commandes en cours promises après le mois où elles sont nécessaires : à relancer\"),\n    \"Avant\": st.column_config.DateColumn(\"Avant\", format=\"MM/YYYY\", help=\"Mois où la commande en cours est nécessaire\"),\n    \"Total\": st.column_config.NumberColumn(\"Total\", format=\"%d\"),\n}\nICONES_STATUT = {\"En retard\": \"🔴 En retard\", \"Délai toléré\": \"🟠 Délai toléré\", \"À faire < 3 mois\": \"🟡 À faire < 3 mois\",\n                 \"À faire < 12 mois\": \"🔵 À faire < 12 mois\", \"OK\": \"🟢 OK\"}\n\n\n# --------------------------------------------------------------------------\n# Paramètres (popover du bloc d'import)\n# --------------------------------------------------------------------------\ndef parametres() -> pe.ParamsPE:\n    \"\"\"Champs des paramètres du Planning PE (placés dans le popover « Paramètres » du bloc d'import).\"\"\"\n    d = pe.ParamsPE()\n    st.markdown(\"**Cycle de remplacement (mois)** · 0 = jamais remplacé\")\n    cols = st.columns(3)\n    cycles = []\n    for i, (cl, comp, mois) in enumerate(d.cycles):\n        v = cols[i % 3].number_input(f\"{cl} · {comp}\", 0, 240, mois, 6, key=f\"{K}cycle_{cl}_{comp}\", persist_state=\"page\")\n        cycles.append((cl, comp, int(v)))\n    a, b, c = st.columns(3)\n    tol = a.number_input(\"Délai toléré après l'échéance (mois)\", 0, 24, d.tolerance_mois, key=K + \"tol\", persist_state=\"page\",\n                         help=\"Échéance dépassée depuis moins longtemps : « Délai toléré » ; au-delà : « En retard ».\")\n    ratio = b.number_input(\"Stock de sécurité (% des avions)\", 0, 50, int(d.securite_ratio * 100), 5, key=K + \"ss\",\n                           persist_state=\"page\", help=\"Par flotte et par PN. 0 % : aucun stock de sécurité.\")\n    mini = c.number_input(\"Minimum d'avions de sécurité\", 0, 10, d.securite_min, key=K + \"ssmin\", persist_state=\"page\",\n                          help=\"Par flotte, si le stock de sécurité n'est pas à 0 %.\")\n    return pe.ParamsPE(cycles=tuple(cycles), tolerance_mois=int(tol), securite_ratio=ratio / 100, securite_min=int(mini))\n\n\n# --------------------------------------------------------------------------\n# Rendu\n# --------------------------------------------------------------------------\ndef _element(classe, composant):\n    return classe.astype(str) + \" · \" + composant.astype(str)\n\n\ndef _mois_label(m) -> str:\n    return pd.Timestamp(m).strftime(\"%m/%y\")\n\n\ndef _mois_clair(m) -> str:\n    \"\"\"« nov. 2026 » : période écrite en clair.\"\"\"\n    m = pd.Timestamp(m)\n    return f\"{pe.MOIS_COURTS[m.month - 1]} {m.year}\"\n\n\nCLASSES_LIBELLES = {\"J\": \"J · Business\", \"W\": \"W · Premium\", \"Y\": \"Y · Économie\"}\n\n\ndef _filtres(cal: pd.DataFrame, today: date | None = None) -> tuple[list, list, list, int | None]:\n    \"\"\"Barre « Périmètre » : flotte, classe et assise / dossier ; avec `today` (sous-onglet Prévision), une\n    seconde ligne « Période de prévision » (12 / 24 / 36 mois, période écrite en clair), mêmes boutons.\"\"\"\n    with ui.barre_perimetre(\"pe\"):\n        a, b, c = st.columns([1.5, 1.2, 0.9], gap=\"medium\")\n        flottes = sorted(cal[\"Flotte\"].dropna().unique())\n        f = ui.choix_multiple(a, \"Flotte\", flottes, K + \"flottes_v2\", \"Toutes\")\n        cl = ui.choix_multiple(b, \"Classe\", pe.CLASSES, K + \"classes_v2\", \"Toutes\", CLASSES_LIBELLES)\n        co = ui.choix_multiple(c, \"Assise / dossier\", pe.COMPOSANTS, K + \"composants_v2\", \"Tous\")\n        h = None\n        if today is not None:\n            debut = pd.Timestamp(today).to_period(\"M\").start_time\n            libelles = {n: f\"{n} mois  ·  {_mois_clair(debut)} → {_mois_clair(debut + pd.DateOffset(months=n - 1))}\"\n                        for n in pe.HORIZONS}\n            with st.container(key=\"s360periode_pe\"):\n                h = ui.choix_unique(st, \"Période de prévision\", list(pe.HORIZONS), K + \"periode\", 12, libelles)\n    return f, cl, co, h\n\n\ndef render(res: dict, today: date, avec_pieces: bool, partie: str = \"avancement\") -> None:\n    \"\"\"`partie` : « avancement » (KPI, calendrier par avion) ou « forecast » (mousses à commander, fournisseurs).\"\"\"\n    cal = res[\"cal\"]\n    flottes, classes, composants, horizon = _filtres(cal, today if partie != \"avancement\" else None)\n    c = cal[cal[\"Flotte\"].isin(flottes) & cal[\"Classe\"].isin(classes) & cal[\"Composant\"].isin(composants)]\n    if partie == \"avancement\":\n        _avancement(c, res[\"date_ref\"], today)\n        with st.popover(\"Règles de calcul\"):\n            st.markdown(REGLES_PE)\n        _calendrier(c, today)\n        return\n    if not avec_pieces or res[\"ev\"].empty:\n        ui.callout(\"Ajoutez <b>textile_all_parts<\/b> (Pièces par avion) pour la prévision des mousses à commander.\", \"info\", \"📦\")\n        return\n    ev = res[\"ev\"]\n    ev = ev[ev[\"Flotte\"].isin(flottes) & ev[\"Classe\"].isin(classes) & ev[\"Composant\"].isin(composants)]\n    pns = set(ev[\"PN\"])\n    synth, long = res[\"synth\"][res[\"synth\"][\"PN\"].isin(pns)], res[\"long\"][res[\"long\"][\"PN\"].isin(pns)]\n    _forecast(ev, synth, long, today, horizon)\n    _forecast_fournisseur(ev, synth, long, today, horizon)\n    _exports_controles(res, c, ev, synth, long, horizon)\n\n\nCLASSE_INFO = (\"Une classe = les mousses d'une classe (J, W ou Y) d'un avion, assise ou dossier. Exemple : l'A350 F-HTYA compte \"\n               \"4 classes suivies (assise J, dossier J, assise W, assise Y). Les dossiers W et Y ne sont jamais remplacés.\")\n\n\ndef _nom_element(classe, composant) -> pd.Series:\n    \"\"\"« Assise J », « Dossier J »… (libellé lisible d'une classe d'un avion).\"\"\"\n    return composant.astype(str) + \" \" + classe.astype(str)\n\n\ndef _avancement(c: pd.DataFrame, date_ref, today):\n    auj = pd.Timestamp(today)\n    n = len(c)\n    st_ = c[\"Statut\"].astype(str)\n    retard, tolere, trois = (st_ == \"En retard\").sum(), (st_ == \"Délai toléré\").sum(), (st_ == \"À faire < 3 mois\").sum()\n    nb_avions = c[\"Immatriculation\"].nunique()\n    avions_retard = c.loc[st_ == \"En retard\", \"Immatriculation\"].nunique()\n    visites = c.loc[c[\"Prochaine visite\"] <= auj + pd.DateOffset(months=3), \"Immatriculation\"].nunique()\n    conformite = (1 - retard / n) * 100 if n else 100\n    with ui.section(\"pe_mousses_pe_avancement\", \"Avancement de la PE mousses\",\n                    f\"{nb_avions} avions · {n} classes suivies\",\n                    info=f\"{CLASSE_INFO} Âges au {pd.Timestamp(date_ref):%d/%m/%Y} (fichier PE mousses), statut au {auj:%d/%m/%Y}.\",\n                    carte=False):\n        if retard:\n            ui.callout(f\"<b>{retard} classes en retard<\/b> sur <b>{avions_retard} avions<\/b> : à rattraper en priorité \"\n                       \"(prévues dès ce mois-ci dans la Prévision).\", \"ko\", \"🔴\")\n        ui.kpi_grid([\n            ui.kpi_card(\"Conformité PE\", f\"{conformite:.0f} %\", f\"{n - retard} classes sur {n} à l'heure\",\n                        \"ok\" if conformite >= 90 else \"warn\" if conformite >= 70 else \"ko\"),\n            ui.kpi_card(\"Classes en retard\", charts.entier(retard), \"échéance et délai toléré dépassés\", \"ko\"),\n            ui.kpi_card(\"Avions avec un retard\", charts.entier(avions_retard), f\"sur {nb_avions} avions suivis\", \"ko\"),\n            ui.kpi_card(\"Classes en délai toléré\", charts.entier(tolere), \"échéance dépassée, encore tolérée\", \"warn\"),\n            ui.kpi_card(\"Classes à faire < 3 mois\", charts.entier(trois), \"échéance dans les 3 prochains mois\", \"warn\"),\n            ui.kpi_card(\"Avions en visite < 3 mois\", charts.entier(visites), \"visite datée dans le fichier\", \"info\"),\n        ])\n        a, b = st.columns(2, gap=\"large\")\n        with a:\n            t = c.assign(L=c[\"Flotte\"].astype(str) + \" · \" + _nom_element(c[\"Classe\"], c[\"Composant\"]))\n            t = t.groupby([\"L\", \"Statut\"], observed=False).size().unstack(fill_value=0)\n            t = t.reindex(columns=[s for s in pe.STATUTS if s in t.columns])\n            t = t[t.sum(axis=1) > 0]\n            ui.graphe(charts.parts(t, pe.STATUT_COULEURS, \"Statut par flotte et classe\"), \"Nombre d'avions dans chaque statut\")\n        with b:\n            debut = auj.to_period(\"M\").start_time\n            mois = pd.date_range(debut, periods=12, freq=\"MS\")\n            d = c.assign(E=_element(c[\"Classe\"], c[\"Composant\"]))\n            d[\"Case\"] = d[\"Date prévue\"].dt.to_period(\"M\").dt.start_time\n            retard_b = d[\"Origine date prévue\"] == \"Mois en cours (retard)\"\n            cats = [\"À rattraper\"] + [_mois_label(m) for m in mois]\n            series = {}\n            for e in ELEMENTS:\n                x = d[d[\"E\"] == e]\n                if x.empty:\n                    continue\n                cnt = x[~retard_b.loc[x.index]].groupby(\"Case\").size()\n                classe, comp = e.split(\" · \")\n                series[f\"{comp} {classe}\"] = [int(retard_b.loc[x.index].sum())] + [int(cnt.get(m, 0)) for m in mois]\n            couleurs = {f\"{e.split(' · ')[1]} {e.split(' · ')[0]}\": c_ for e, c_ in COULEURS_ELEMENTS.items()}\n            ui.graphe(charts.barres(cats, series, couleurs, empile=True, hauteur=260,\n                                    titre=\"Classes à remplacer, mois par mois\")\n                      if series else charts.vide(\"Aucun remplacement prévu\"))\n\n\ndef _calendrier(c: pd.DataFrame, today):\n    auj = pd.Timestamp(today)\n    with ui.section(\"pe_mousses_pe_calendrier\", \"Calendrier des remplacements\",\n                    \"Classes à remplacer, par avion et par mois\",\n                    info=\"Survolez une case pour voir les classes concernées. « À rattraper » : échéance déjà dépassée. Sinon, le mois de la prochaine visite datée de l'avion, \"\n                         \"à défaut celui de l'échéance PE.\"):\n        debut = auj.to_period(\"M\").start_time\n        mois = pd.date_range(debut, periods=24, freq=\"MS\")\n        d = c.copy()\n        d[\"Col\"] = d[\"Date prévue\"].dt.to_period(\"M\").dt.start_time.map(_mois_label)\n        d.loc[d[\"Origine date prévue\"] == \"Mois en cours (retard)\", \"Col\"] = \"À rattraper\"\n        d[\"Ligne\"] = d[\"Immatriculation\"] + \" · \" + d[\"Flotte\"].astype(str)\n        d[\"Élément\"] = _nom_element(d[\"Classe\"], d[\"Composant\"])\n        cols = [\"À rattraper\"] + [_mois_label(m) for m in mois]\n        x = d[d[\"Col\"].isin(cols)]\n        t = x.groupby([\"Ligne\", \"Col\"]).size().unstack(fill_value=0).reindex(columns=cols, fill_value=0)\n        if t.empty:\n            ui.graphe(charts.vide(\"Aucun remplacement sur les 24 prochains mois\"))\n        else:\n            ordre = x.groupby(\"Ligne\")[\"Date prévue\"].min().sort_values().index\n            quoi = x.groupby([\"Ligne\", \"Col\"])[\"Élément\"].agg(lambda s: \", \".join(sorted(s))).unstack()\n            ui.graphe(charts.chaleur(t.reindex(ordre), libelle=\"classe(s)\", hauteur_max=\"34rem\", details=quoi))\n        _detail_avions(c)\n\n\n@st.fragment\ndef _detail_avions(c: pd.DataFrame):\n    with st.popover(f\"Détail par avion et par classe ({len(c)})\", width=\"content\"):\n        d = c\n        t = pd.DataFrame({\n            \"Statut\": d[\"Statut\"].astype(str).map(ICONES_STATUT), \"Immatriculation\": d[\"Immatriculation\"], \"Flotte\": d[\"Flotte\"],\n            \"Version\": d[\"Version cabine\"], \"Classe\": d[\"Classe\"], \"Assise / dossier\": d[\"Composant\"],\n            \"Âge (mois)\": d[\"Âge aujourd'hui (mois)\"].round(0), \"Âge minimum ?\": d[\"Âge\"].map(lambda v: \"oui\" if v else \"\"),\n            \"Dernier remplacement\": d[\"Dernier remplacement\"], \"Échéance\": d[\"Échéance\"], \"Prochaine visite\": d[\"Prochaine visite\"],\n            \"Date prévue\": d[\"Date prévue\"], \"Origine\": d[\"Origine date prévue\"], \"Visite liée\": d[\"Visite liée\"],\n        })\n        ui.tableau(t, column_config=CFG, width=1250, height=440)\n\n\ndef _forecast(ev, synth, long, today, h: int) -> None:\n    \"\"\"Prévision des mousses à commander : chiffres clés, quand (par mois), puis le détail par PN.\"\"\"\n    debut = pd.Timestamp(today).to_period(\"M\").start_time\n    with ui.section(\"pe_mousses_pe_forecast\", \"Prévision des mousses à commander\", carte=False,\n                    info=\"À commander = mousses à remplacer + stock de sécurité − stock − commandes déjà passées. \"\n                         \"Les commandes en cours sont toujours déduites.\"):\n        fin = debut + pd.DateOffset(months=h)\n        periode = f\"{_mois_clair(debut)} → {_mois_clair(fin - pd.DateOffset(months=1))}\"\n        e = ev[ev[\"Mois\"] < fin]\n        lg = long[long[\"Mois\"] < fin]\n        besoin, rattrapage = e[\"Qté\"].sum(), e.loc[e[\"Rattrapage du retard\"], \"Qté\"].sum()\n        a_cmd, valeur = lg[\"À livrer\"].sum(), lg[\"Valeur à livrer (€)\"].sum()\n        fours = lg.loc[lg[\"À livrer\"] > 0, \"Fournisseur\"].nunique()\n        ui.kpi_grid([\n            ui.kpi_card(\"Mousses à remplacer\", charts.entier(besoin), f\"{periode}, dont {charts.entier(rattrapage)} en retard\", \"navy\", \"layers\"),\n            ui.kpi_card(\"À commander\", charts.entier(a_cmd), \"en plus du stock et des commandes en cours\", \"ko\", \"cart\"),\n            ui.kpi_card(\"Valeur à commander\", charts.euros(valeur), periode, \"ko\", \"euro\"),\n            ui.kpi_card(\"Déjà disponibles\", charts.entier(synth[\"Stock\"].sum() + synth[\"En commande\"].sum()),\n                        f\"{charts.entier(synth['Stock'].sum())} en stock + {charts.entier(synth['En commande'].sum())} en commande\", \"ok\", \"package\"),\n            ui.kpi_card(\"Fournisseurs\", charts.entier(fours), \"à qui commander\", \"violet\", \"truck\"),\n        ])\n        avancer = synth[synth[\"À avancer (commandes en cours)\"] > 0]\n        if len(avancer):\n            ui.callout(f\"<b>{charts.entier(avancer['À avancer (commandes en cours)'].sum())} mousses déjà commandées arriveront trop tard<\/b> \"\n                       f\"({len(avancer)} PN) : relancez le fournisseur plutôt que de recommander (colonne « À avancer » du tableau par PN).\",\n                       \"warn\", \"📌\")\n    mois = pd.date_range(debut, periods=h, freq=\"MS\")\n    with ui.section(\"pe_mousses_pe_quand\", \"Mois par mois\", periode, carte=False,\n                    info=\"Le premier mois inclut les remplacements en retard.\"):\n        g1, g2 = st.columns(2, gap=\"medium\")\n        with g1:\n            x = e.assign(E=_element(e[\"Classe\"], e[\"Composant\"])).groupby([\"Mois\", \"E\"])[\"Qté\"].sum().unstack(fill_value=0)\n            x = x.reindex(index=mois, fill_value=0)\n            series = {f\"{k.split(' · ')[1]} {k.split(' · ')[0]}\": x[k] for k in ELEMENTS if k in x.columns}\n            couleurs = {f\"{k.split(' · ')[1]} {k.split(' · ')[0]}\": c_ for k, c_ in COULEURS_ELEMENTS.items()}\n            ui.graphe(charts.barres(mois, series, couleurs, empile=True, temporel=True, hauteur=240, titre=\"Mousses à remplacer\")\n                      if series else charts.vide(), \"Nombre de mousses à poser sur les avions, par classe\")\n        with g2:\n            liv = lg.groupby(\"Mois\")[\"À livrer\"].sum().reindex(mois, fill_value=0)\n            ui.graphe(charts.barres(mois, {\"À recevoir\": liv}, {\"À recevoir\": COLORS[\"ko\"]}, temporel=True, hauteur=240,\n                                    titre=\"Mousses à recevoir des fournisseurs\"),\n                      \"Quantités à commander, au mois où elles doivent arriver (tous fournisseurs)\")\n    with ui.section(\"pe_mousses_pe_pn\", \"Par PN\", \"La plus grosse valeur à commander en premier\",\n                    info=\"Stock de sécurité : de quoi équiper 10 % des avions de chaque flotte (réglable dans Paramètres). \"\n                         \"« À avancer » : mousses déjà commandées mais promises après le mois où elles sont nécessaires.\"):\n        t = synth.assign(**{\"Besoin\": synth[f\"Besoin {h} mois\"], \"À commander\": synth[f\"À commander {h} mois\"],\n                            \"Valeur (€)\": synth[f\"Valeur {h} mois (€)\"]})\n        t = t.sort_values(\"Valeur (€)\", ascending=False)\n        cols = {\"PN\": \"PN\", \"CCN\": \"CCN\", \"Désignation\": \"Désignation\", \"Classes\": \"Classe\", \"Composant\": \"Assise / dossier\", \"Flottes\": \"Flottes\",\n                \"Fournisseur\": \"Fournisseur\", \"Prix unitaire (€)\": \"Prix (€)\", \"Stock\": \"Stock\", \"En commande\": \"En commande\",\n                \"Stock de sécurité\": \"Stock de sécurité\", \"Besoin\": \"À remplacer\", \"À commander\": \"À commander\", \"Valeur (€)\": \"Valeur (€)\",\n                \"À avancer (commandes en cours)\": \"À avancer\", \"À avancer avant\": \"Avant\", \"Rupture sans commande\": \"Rupture sans commande\"}\n        ui.tableau(t[[c for c in cols if c in t]].rename(columns=cols), column_config=CFG, height=min(38 + 35 * len(t), 420))\n\n\n@st.fragment\ndef _forecast_fournisseur(ev, synth, long, today, h):\n    debut = pd.Timestamp(today).to_period(\"M\").start_time\n    mois = pd.date_range(debut, periods=h, freq=\"MS\")\n    lg = long[long[\"Mois\"].isin(mois)]\n    v = lg.groupby(\"Fournisseur\")[\"Valeur à livrer (€)\"].sum().sort_values(ascending=False)\n    if v.empty:\n        return\n    with ui.section(\"pe_mousses_pe_fournisseur\", \"Par fournisseur\",\n                    f\"{_mois_clair(mois[0])} → {_mois_clair(mois[-1])}, à partager avec chaque fournisseur\"):\n        # Vue d'ensemble : tous les fournisseurs, par année\n        qte_an = pe.par_annee(lg, mois, \"Fournisseur\").reindex(v.index)\n        val_an = pe.par_annee(lg, mois, \"Fournisseur\", \"Valeur à livrer (€)\").reindex(v.index)\n        annees = list(qte_an.columns)\n        vue = pd.DataFrame(index=v.index)\n        for an in annees:\n            vue[f\"{an} · qté\"] = qte_an[an]\n            vue[f\"{an} · €\"] = val_an[an]\n        vue[\"Total · qté\"], vue[\"Total · €\"] = qte_an.sum(axis=1), val_an.sum(axis=1)\n        cfg = {c: st.column_config.NumberColumn(c, format=\"%.0f €\" if c.endswith(\"€\") else \"%d\") for c in vue.columns}\n        a, b = st.columns([1, 1.5], gap=\"large\")\n        with a:\n            ui.graphe(charts.barres(annees, {\"Valeur (€)\": val_an.sum()}, {\"Valeur (€)\": COLORS[\"navy_2\"]}, fmt=charts.euros,\n                                    hauteur=220, titre=\"Valeur à commander par année (tous fournisseurs)\",\n                                    survol=[f\"{charts.entier(q)} mousses\" for q in qte_an.sum()]))\n        with b:\n            st.markdown(\"**Par fournisseur et par année**\")\n            ui.tableau(vue.reset_index(), column_config=cfg, height=\"content\" if len(vue) <= 6 else 260)\n\n        # Détail du fournisseur choisi\n        libelles = {f: f\"{f}  ·  {charts.euros(val)}\" for f, val in v.items()}\n        c1, c2 = st.columns([1.4, 1], vertical_alignment=\"center\")\n        f = c1.selectbox(\"Fournisseur\", list(libelles), format_func=libelles.get, key=K + \"fournisseur\", persist_state=\"page\",\n                         label_visibility=\"collapsed\")\n        with c2:\n            pas = st.segmented_control(\"Vue\", [\"Par année\", \"Par mois\"], default=\"Par année\", key=K + \"vue_fournisseur\",\n                                       required=True, persist_state=\"page\", label_visibility=\"collapsed\") or \"Par année\"\n        d = lg[lg[\"Fournisseur\"] == f]\n        a_livrer = d[d[\"À livrer\"] > 0]\n        premier = a_livrer[\"Mois\"].min()\n        ui.kpi_grid([\n            ui.kpi_card(\"À commander\", charts.entier(d[\"À livrer\"].sum()), f\"mousses sur {h} mois\", \"ko\"),\n            ui.kpi_card(\"Valeur\", charts.euros(d[\"Valeur à livrer (€)\"].sum()), \"\", \"ko\"),\n            ui.kpi_card(\"PN\", charts.entier(a_livrer[\"PN\"].nunique()), \"à livrer\", \"navy\"),\n            ui.kpi_card(\"Première livraison\", f\"{premier:%m/%Y}\" if pd.notna(premier) else \"—\",\n                        \"dès que possible\" if pd.notna(premier) and premier == debut else \"\", \"warn\"),\n        ])\n        piv = d.pivot_table(index=\"PN\", columns=\"Mois\", values=\"À livrer\", aggfunc=\"sum\", fill_value=0).reindex(columns=mois, fill_value=0)\n        piv = piv[piv.sum(axis=1) > 0]\n        an = pe.par_annee(d, mois).reindex(piv.index)\n        top = list(piv.sum(axis=1).sort_values(ascending=False).index[:8])\n        def _series(t):\n            s = {pn: t.loc[pn] for pn in top}\n            if len(t) > 8:\n                s[\"Autres PN\"] = t.drop(index=top).sum()\n            return s\n        if pas == \"Par année\":\n            graphe = charts.barres(annees, _series(an), empile=True, hauteur=240, titre=\"Mousses à livrer par année et par PN\")\n            tab = an.copy()\n        else:\n            graphe = charts.barres(mois, _series(piv), empile=True, temporel=True, hauteur=240,\n                                   titre=\"Mousses à livrer par mois et par PN\")\n            tab = piv.copy()\n            tab.columns = [m_.strftime(\"%m/%Y\") for m_ in tab.columns]\n        ui.graphe(graphe if len(piv) else charts.vide(\"Rien à livrer\"))\n        prix = synth.set_index(\"PN\")[\"Prix unitaire (€)\"].reindex(tab.index).fillna(0)\n        tab.insert(0, \"Valeur (€)\", piv.sum(axis=1) * prix)\n        tab.insert(0, \"Total\", piv.sum(axis=1))\n        tab.insert(0, \"Désignation\", synth.set_index(\"PN\")[\"Désignation\"].reindex(tab.index))\n        tab = tab.reset_index()\n        ui.tableau(tab, column_config=CFG, height=\"content\" if len(tab) <= 8 else 320)\n        par_mois = piv.copy()\n        par_mois.columns = [m_.strftime(\"%m/%Y\") for m_ in par_mois.columns]\n        ui.telecharger(lambda: _export_fournisseur(f, an, par_mois, ev[ev[\"PN\"].isin(piv.index)], synth), _nom_fichier(f\"prevision_{f}\"),\n                       K + \"export_fournisseur\", label=\"Exporter la prévision du fournisseur (Excel)\")\n\n\ndef _nom_fichier(base: str) -> str:\n    return f\"Supply360_{re.sub(r'[^A-Za-z0-9]+', '_', base).strip('_')}_{date.today():%Y%m%d}.xlsx\"\n\n\ndef _export_fournisseur(f, an, par_mois, ev, synth) -> bytes:\n    resume = synth[synth[\"PN\"].isin(an.index)][[\"PN\", \"Désignation\", \"Composant\", \"Classes\", \"Prix unitaire (€)\"]]\n    resume = resume.assign(Total=resume[\"PN\"].map(an.sum(axis=1)))\n    resume[\"Valeur (€)\"] = resume[\"Total\"] * resume[\"Prix unitaire (€)\"].fillna(0)\n    avions = ev.assign(Mois=ev[\"Mois\"].dt.strftime(\"%m/%Y\"))[[\"PN\", \"Mois\", \"Immatriculation\", \"Flotte\", \"Classe\", \"Composant\", \"Qté\"]]\n    return sio.exporter_excel({\"Commande globale\": resume, \"Par année\": an.reset_index(), \"Par mois\": par_mois.reset_index(),\n                               \"Besoins par avion\": avions})\n\n\nREGLES_PE = \"\"\"\n**Échéance d'une mousse** = date du dernier remplacement + cycle de remplacement (Paramètres).\nExemple : remplacée en janvier 2024, cycle de 36 mois → à remplacer en janvier 2027.\nQuand le fichier PE indique seulement « > 60 » mois, on prend 60 : l'échéance est la plus proche possible.\n\n**Ce que veut dire chaque statut (aujourd'hui)**\n\n| Statut | Ce que ça veut dire |\n|---|---|\n| **En retard** | Échéance dépassée de plus que le délai toléré (Paramètres) |\n| **Délai toléré** | Échéance dépassée, mais encore dans le délai toléré |\n| **À faire < 3 mois** | Échéance dans les 3 prochains mois |\n| **À faire < 12 mois** | Échéance dans l'année |\n| **OK** | Rien avant 12 mois |\n\n**Date prévue du remplacement** : la prochaine visite connue de l'avion ; sinon l'échéance (ce mois-ci si elle est\ndépassée). Ensuite, un remplacement à chaque cycle jusqu'à la fin de la période.\n\n**Stock de sécurité d'une mousse** : de quoi équiper 10 % des avions de chaque flotte qui l'utilisent (au moins 1\navion ; réglable dans Paramètres). Exemple : 20 avions, 30 mousses par avion → 2 avions × 30 = **60 mousses**.\n\n**À livrer chaque mois** : la quantité qui manque pour que le stock (stock + commandes en cours − remplacements\nprévus) ne descende jamais sous le stock de sécurité.\n\"\"\"\n\n\ndef _exports_controles(res, c, ev, synth, long, h):\n    with ui.section(\"pe_mousses_pe_exports\", \"Exports et contrôles\"):\n        a, b = st.columns(2)\n        with a:\n            debut = long[\"Mois\"].min()\n            liv = long[(long[\"À livrer\"] > 0) & (long[\"Mois\"] < debut + pd.DateOffset(months=h))]\n            feuilles = {\n                \"Avancement PE\": c.drop(columns=[\"Âge exact\"]).assign(Statut=c[\"Statut\"].astype(str)),\n                f\"Prévision PN {h} mois\": synth,\n                \"Livraisons à prévoir\": liv[[\"Fournisseur\", \"PN\", \"Désignation\", \"Mois\", \"À livrer\", \"Valeur à livrer (€)\"]],\n                \"Besoins par avion\": ev,\n            }\n            ui.telecharger(lambda: sio.exporter_excel(feuilles), _nom_fichier(\"planning_PE\"), K + \"export_tout\",\n                           label=\"Exporter le planning PE complet (Excel)\")\n        with b, st.popover(\"Règles de calcul\", width=\"stretch\"):\n            st.markdown(REGLES_PE)\n        with b, st.popover(\"Contrôles des données\", width=\"stretch\"):\n            nr, sans, absents = res[\"non_reconnues\"], res[\"sans_pn\"], res[\"pn_absents_stock\"]\n            age_min = int((~res[\"cal\"][\"Âge exact\"]).sum())\n            st.caption(\"Points à vérifier dans les fichiers importés.\")\n            st.markdown(f\"- **{age_min}** classes dont l'âge n'est connu qu'en minimum (« > 60 », « > 108 » dans le fichier PE) : \"\n                        \"leur échéance est calculée au plus tôt.\")\n            st.markdown(f\"- **{len(sans)}** classes sans référence de mousse dans textile_all_parts (immatriculation, classe ou \"\n                        \"introuvable) : elles ne sont pas dans la prévision.\")\n            if len(sans):\n                ui.tableau(sans.assign(Statut=sans[\"Statut\"].astype(str)), height=200)\n            st.markdown(f\"- **{len(nr)}** lignes MOUSSE de textile_all_parts non reconnues (ni assise « FOAM BOTTOM / BOTT », \"\n                        \"ni dossier « FOAM BACK… ») ou de classe inconnue.\")\n            if len(nr):\n                ui.tableau(nr, height=200)\n            st.markdown(f\"- **{len(absents)}** PN introuvables dans l'État du stock : leur stock est compté à 0\"\n                        + (f\" ({', '.join(absents[:15])})\" if absents else \"\") + \".\")\n", "app/modules/alertes.py": "\"\"\"Onglet « Alertes » : en cours de développement.\n\nEn attendant le calcul, la page présente ce que l'onglet contiendra : alertes par gestionnaire, infos urgentes,\nactions à lancer, ruptures, chantiers à risque, retards fournisseurs. Aucune donnée : texte et aperçu fictif.\n\"\"\"\n\nfrom core import components as ui\nfrom core.style import ONGLETS\n\nTAB_ID = \"alertes\"\nTAB_LABEL = \"Alertes\"\nTAB_ICON = \"🔔\"\nTAB_DESCRIPTION = \"Alertes par gestionnaire : urgences, actions à lancer, ruptures, chantiers à risque, retards.\"\n\nCARTES = [\n    {\"icone\": \"users\", \"titre\": \"Mes alertes\",\n     \"texte\": \"Chaque gestionnaire ne voit que ce qui le concerne.\",\n     \"points\": [\"Choix du gestionnaire : code agent appro, code Gestion ou acheteur\",\n                \"Seuils personnels : couverture minimale, jours avant chantier, retard toléré\",\n                \"Réglages retenus sur le poste, d'une session à l'autre\"]},\n    {\"icone\": \"alert\", \"titre\": \"Infos urgentes du jour\",\n     \"texte\": \"L'essentiel en une ligne, dès l'ouverture.\",\n     \"points\": [\"Bandeau en tête : « 2 chantiers démarrent cette semaine avec des pièces manquantes »\",\n                \"Nombre d'urgences affiché sur l'onglet Alertes, dans le menu\", \"Ce qui a changé depuis le dernier import\"]},\n    {\"icone\": \"check-circle\", \"titre\": \"Actions à lancer\",\n     \"texte\": \"Une seule liste, de la plus urgente à la moins urgente : qui, quoi, avant quand.\",\n     \"points\": [\"Commandes à passer : chantiers, prévision textile, mousses PE\", \"Relances fournisseurs à envoyer\",\n                \"Suivi : à faire, en cours, fait\", \"Export Excel ou texte prêt à coller dans un mail\"]},\n    {\"icone\": \"box-off\", \"titre\": \"Ruptures\",\n     \"texte\": \"Les pièces qui manquent ou vont manquer.\",\n     \"points\": [\"PN à stock nul avec un besoin chantier ou une consommation\",\n                \"PN critiques : moins de 1 mois de couverture (seuil réglable)\", \"Pièces de classe 8 / 9 demandées par un chantier\"]},\n    {\"icone\": \"calendar\", \"titre\": \"Chantiers à risque\",\n     \"texte\": \"Les chantiers qui risquent de démarrer sans leurs pièces.\",\n     \"points\": [\"Début dans 14 jours ou moins avec des pièces non couvertes\",\n                \"Livraison promise après le début du chantier\", \"PN demandé introuvable dans l'État du stock\"]},\n    {\"icone\": \"truck\", \"titre\": \"Retards fournisseurs\",\n     \"texte\": \"Les commandes qui dérapent.\",\n     \"points\": [\"Commandes en retard de plus de 30 jours\", \"Sans date promise, ou en attente de BFE\",\n                \"Commandes ouvertes chez un fournisseur classé C\"]},\n    {\"icone\": \"armchair\", \"titre\": \"PE mousses\",\n     \"texte\": \"La politique d'entretien des mousses, sous contrôle.\",\n     \"points\": [\"Classes en retard d'échéance\", \"Avions qui ne pourront pas être faits faute de mousses\",\n                \"Commandes de mousses à avancer\"]},\n    {\"icone\": \"file\", \"titre\": \"Qualité des données\",\n     \"texte\": \"Pour se fier aux chiffres.\",\n     \"points\": [\"Fichier importé trop ancien (plus de 7 jours)\", \"PN sans fournisseur ni prix\",\n                \"Pour info : stock dormant, aucune sortie depuis 3 ans\"]},\n]\n\nNIVEAUX = [\n    [ui.badge(\"Urgent\", \"ko\"), \"Bloque un chantier ou crée une rupture dans les 14 jours\", \"Agir aujourd'hui\"],\n    [ui.badge(\"À traiter\", \"orange\"), \"Risque dans le mois : commande à passer, relance à faire\", \"Planifier cette semaine\"],\n    [ui.badge(\"À surveiller\", \"warn\"), \"Signal faible : date promise absente, couverture qui baisse\", \"Vérifier au prochain point\"],\n    [ui.badge(\"Info\", \"info\"), \"Pour information : stock dormant, données à mettre à jour\", \"Rien d'urgent\"],\n]\n\nAPERCU = [\n    (\"ko\", \"Urgent\", \"Chantier A350, début dans 5 jours : 3 pièces non couvertes, dont 1 de classe 8\", \"Commander ou relancer\"),\n    (\"ko\", \"Urgent\", \"2 PN en rupture avec un besoin cette semaine\", \"Voir les PN\"),\n    (\"orange\", \"À traiter\", \"Fournisseur classé C : 6 commandes en retard de plus de 30 jours\", \"Relancer\"),\n    (\"orange\", \"À traiter\", \"Mousses PE : 120 assises à commander avant fin janvier\", \"Passer la commande\"),\n    (\"warn\", \"À surveiller\", \"12 lignes de commande sans date promise\", \"Demander une date\"),\n    (\"info\", \"Info\", \"Le fichier Commandes (SAP) date de 9 jours\", \"Mettre à jour\"),\n]\n\n\ndef render() -> None:\n    couleur = ONGLETS[TAB_ID][0]\n    ui.hero(TAB_ICON, \"Alertes\", \"Tout ce qui demande une action, au même endroit, filtré pour chaque gestionnaire.\",\n            \"Supply Chain · Production · Achats\",\n            ui.contexte((\"Statut\", \"Bientôt\", ui.badge(\"En développement\", \"warn\")),\n                        (\"Sources\", \"Fichiers déjà importés\", \"\")))\n\n    with ui.section(f\"{TAB_ID}_quoi\", \"Ce que vous trouverez\", \"Huit familles d'alertes\", carte=False):\n        ui.cartes_fonctions(CARTES, couleur, 4)\n\n    with ui.section(f\"{TAB_ID}_niveaux\", \"Quatre niveaux d'alerte\", \"Du plus urgent au simple signal\",\n                    info=\"Chaque alerte reçoit un niveau selon ce qu'elle bloque et dans combien de temps.\"):\n        ui.tableau_simple([\"Niveau\", \"Ce que ça veut dire\", \"Que faire\"], NIVEAUX)\n\n    with ui.section(f\"{TAB_ID}_apercu\", \"Aperçu\", \"Exemple fictif du fil d'alertes\"):\n        ui.apercu_alertes(APERCU)\n\n    ui.callout(\"<b>Aucun nouvel import<\/b> : les alertes reprendront les fichiers déjà chargés dans Stock par chantier, \"\n               \"Textile cabine et PE mousses. Les seuils proposés ici sont modifiables.\", \"info\", \"ℹ️\")\n", "app/modules/fournisseurs.py": "\"\"\"Onglet « Fournisseurs » : en cours de développement.\n\nEn attendant le calcul, la page présente ce que l'onglet contiendra : score fournisseur pondéré, indicateurs,\nfiche fournisseur, relances. Aucune donnée : texte et exemple fictif seulement.\n\"\"\"\n\nimport streamlit as st\n\nfrom core import components as ui\nfrom core.style import ONGLETS\n\nTAB_ID = \"fournisseurs\"\nTAB_LABEL = \"Fournisseurs\"\nTAB_ICON = \"🏭\"\nTAB_DESCRIPTION = \"Performance fournisseurs : score pondéré, OTD / OTIF, retards et relances.\"\n\nCARTES = [\n    {\"icone\": \"gauge\", \"titre\": \"Score fournisseur\",\n     \"texte\": \"Une note sur 100 par fournisseur pour savoir qui suivre en priorité.\",\n     \"points\": [\"Classe A / B / C, du plus fiable au moins fiable\", \"Poids des critères réglables dans Paramètres\",\n                \"Évolution mois par mois sur un an\"]},\n    {\"icone\": \"target\", \"titre\": \"Indicateurs clés\",\n     \"texte\": \"Les mêmes chiffres pour tous les fournisseurs, désignés par leur code.\",\n     \"points\": [\"OTD : livré à la date demandée (10 jours de tolérance)\", \"OTIF : à l'heure et en quantité complète\",\n                \"Retard moyen et retard maximal, en jours\", \"Lignes sans date promise, lignes en attente BFE\",\n                \"Délai moyen promis (commande → livraison)\", \"Valeur et nombre de lignes en commande\"]},\n    {\"icone\": \"file\", \"titre\": \"Fiche fournisseur\",\n     \"texte\": \"Tout sur un fournisseur, sur une seule page.\",\n     \"points\": [\"Commandes ouvertes, de la pire à la meilleure\", \"PN les plus en retard\",\n                \"Écart promis − demandé, ligne par ligne\", \"Chantiers touchés par ses retards (Stock par chantier)\"]},\n    {\"icone\": \"send\", \"titre\": \"Relances\",\n     \"texte\": \"La liste à envoyer, prête à l'emploi.\",\n     \"points\": [\"Par fournisseur : commande, PN, date demandée, date promise\",\n                \"D'abord ce qui bloque un chantier ou un PN en rupture\", \"Export Excel par fournisseur, à joindre au mail\"]},\n    {\"icone\": \"trend\", \"titre\": \"Comparaisons\",\n     \"texte\": \"Situer chaque fournisseur par rapport aux autres.\",\n     \"points\": [\"Par famille : ceintures, housses, mousses, rideaux\", \"Fournisseurs qui s'améliorent ou se dégradent\",\n                \"Poids des 5 premiers fournisseurs dans la valeur commandée\"]},\n    {\"icone\": \"alert\", \"titre\": \"Risques fournisseur\",\n     \"texte\": \"Repérer les dépendances avant qu'elles ne coûtent un siège.\",\n     \"points\": [\"PN critique avec un seul fournisseur\", \"Délais promis qui s'allongent d'un mois sur l'autre\",\n                \"Beaucoup de lignes sans date promise\"]},\n]\n\nCRITERES = [\n    (\"Ponctualité (OTD)\", 30, \"Lignes livrées au plus tard 10 jours après la date demandée\"),\n    (\"Livraison complète (OTIF)\", 20, \"À l'heure ET toute la quantité commandée\"),\n    (\"Promesses tenues\", 15, \"La date promise par le fournisseur est respectée\"),\n    (\"Retards en cours\", 15, \"Part des commandes ouvertes déjà en retard, selon leur valeur\"),\n    (\"Confirmation\", 10, \"Part des lignes avec une vraie date promise (ni vide, ni 2001, ni 2030 et après)\"),\n    (\"Délai d'approvisionnement\", 10, \"Délai promis comparé aux autres fournisseurs de la même famille\"),\n]\n\n\ndef render() -> None:\n    couleur = ONGLETS[TAB_ID][0]\n    ui.hero(TAB_ICON, \"Fournisseurs\", \"Performance, fiabilité et relances de chaque fournisseur, identifié par son code.\",\n            \"Achats · Pilotage fournisseur\",\n            ui.contexte((\"Statut\", \"Bientôt\", ui.badge(\"En développement\", \"warn\")), (\"Source\", \"Commandes (SAP)\", \"\")))\n\n    with ui.section(f\"{TAB_ID}_quoi\", \"Ce que vous trouverez\", \"Six vues pour piloter les fournisseurs\", carte=False):\n        ui.cartes_fonctions(CARTES, couleur)\n\n    with ui.section(f\"{TAB_ID}_score\", \"Score fournisseur pondéré\", \"Une note sur 100, six critères\",\n                    info=\"Chaque critère est noté de 0 à 100, puis compte selon son poids. Les poids sont réglables.\"):\n        ui.ponderation(CRITERES, couleur)\n        st.markdown(\"\")\n        a, b = st.columns([1.1, 1], gap=\"large\")\n        with a:\n            ui.tableau_simple([\"Classe\", \"Ce que ça veut dire\", \"Que faire\"], [\n                [ui.badge(\"A · 80 et plus\", \"ok\"), \"Fournisseur fiable\", \"Suivi normal\"],\n                [ui.badge(\"B · 60 à 79\", \"warn\"), \"Quelques retards ou promesses non tenues\", \"Point mensuel, relances ciblées\"],\n                [ui.badge(\"C · moins de 60\", \"ko\"), \"Retards fréquents, dates souvent absentes\", \"Plan d'action avec les Achats\"],\n            ])\n        with b:\n            ui.callout(\"<b>Exemple (fictif)<\/b> : ponctualité 85, livraison complète 70, promesses tenues 90, retards en \"\n                       \"cours 80, confirmation 100, délai 60. Chaque note compte selon son poids : \"\n                       \"<b>81 / 100 → classe A<\/b>.\", \"info\", \"ℹ️\")\n\n    ui.callout(\"<b>À valider ensemble<\/b> : l'OTD et l'OTIF réels demandent la <b>date de réception effective<\/b>. \"\n               \"Si l'extraction SAP ne la contient pas, le calcul se fera sur la date promise. Les poids proposés \"\n               \"ci-dessus sont modifiables.\", \"warn\", \"⚠️\")\n", "app/modules/pe_mousses.py": "\"\"\"Onglet « PE mousses » : politique d'entretien des mousses de sièges.\n\n- Année en cours (fichier Besoin Prod) : avions faisables par type d'avion et par classe, CCN à commander (PR).\n  Repris du Streamlit « Pilotage Politique d'entretien Mousse » (calculs dans core/pe2026.py).\n- Avancement PE et forecast 12 / 24 / 36 mois (fichier PE mousses mensuel) : rendu par modules/_planning_pe.py,\n  calculs dans core/pe.py (anciennement sous-onglet « Planning PE » du Textile).\n\"\"\"\n\nfrom datetime import date\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom core import cache, charts, dossiers\nfrom core import components as ui\nfrom core import io as sio\nfrom core import pe\nfrom core import pe2026 as p26\nfrom core import prevision as pv\nfrom core import textile as tx\nfrom core import style\nfrom core.style import COLORS\nfrom modules import _planning_pe as vue_pe\n\nTAB_ID = \"pe_mousses\"\nTAB_LABEL = \"PE mousses\"\nTAB_ICON = \"🪑\"\nTAB_DESCRIPTION = \"Politique d'entretien des mousses : avions faisables cette année, CCN à commander, avancement et prévision.\"\n\nK = f\"{TAB_ID}__\"\nSECTIONS = [\"Synthèse\", \"Avions faisables\", \"CCN et commandes\", \"Avancement PE\", \"Prévision\"]\n\n# Dossier Textile : règles de nommage prioritaires (sans accents ni majuscules), puis reconnaissance par le contenu.\n# Dossier Textile partagé avec Textile cabine : « Résultat … PE » = État du stock de cet onglet (le plus récent) ;\n# « Résultat … ALL TEXTILE » est celui de Textile cabine (source « stock_textile », ignorée ici sans être signalée).\nNOMS_DOSSIER = {\"stock_textile\": dossiers.RESULTAT_ALL_TEXTILE, \"stock\": [dossiers.RESULTAT_PE, r\"^resultat\"],\n                \"pieces\": r\"textile_all_parts\", \"pe\": r\"^pe_mousse\", \"besoin_prod\": r\"besoin_prod\"}\nNOMMAGE = (\"Dossier Textile : « Besoin_Prod… » = Besoin Prod mousses (objectif de l'année), « PE_MOUSSE… » = PE mousses \"\n           \"(mensuel), le « Résultat … PE » le plus récent = État du stock (les « Résultat … ALL TEXTILE » sont pour l'onglet \"\n           \"Textile cabine), « textile_all_parts » = Pièces par avion. À défaut, reconnaissance par le contenu ; s'il y a \"\n           \"plusieurs fichiers du même type, le plus récent est retenu. Commandes (SAP) : dossier COMMANDE.\")\nCOLONNES_ATTENDUES = {\n    \"besoin_prod\": [(\"Feuille « QUOTE en euro »\", \"en-tête détecté automatiquement\", False),\n                    (\"A/C, Flotte, Area, CCN, Qty per A/C, NB_AC\", \"type d'avion, classe, quantité par avion\", True),\n                    (\"NB_AC PE RESTANT\", \"avions restants (par défaut) ; recalcul possible (Paramètres) avec PE mousses + textile_all_parts\", False),\n                    (\"P/N OEM Seat Supplier, Seat Supplier, Description, P.U forecast PE\", \"\", False)],\n    \"stock\": [(\"PNR, QTE SUR ÉTAGÈRE\", \"\", True), (\"CCN\", \"clé du croisement avec le Besoin Prod\", True),\n              (\"QTE EN CDE, PMP (à défaut Dernier PU (achat) Euros)\", \"valorisation\", False)],\n    \"commandes\": [(\"PN, Commande\", \"\", True), (\"CCN\", \"sinon retrouvé par le PN\", False),\n                  (\"Quantité restant à livrer, Date de livraison promise, Fournisseur\", \"\", False)],\n    \"pe\": [(\"Feuille « … BOTTOM FOAM … »\", \"assises : âge par classe J / W / Y\", True),\n           (\"Feuille « … BACKREST FOAM … »\", \"dossiers J\", True),\n           (\"FLEET, AIRCRAFT, AGE (month), PAST / NEXT EXECUTION\", \"fichier mensuel tel quel\", True),\n           (\"Date dans le nom\", \"ex. PE_MOUSSE_29092026 : date des âges\", False)],\n    \"pieces\": [(\"equipment, registration, area, ccn, pn, description, qty_per_ac\", \"lignes MOUSSE\", True)],\n}\n# Premier choix = valeur par défaut : la colonne NB_AC PE RESTANT du Besoin Prod (demande de l'auteur)\nRESTANT_LIBELLES = {p26.RESTANT_FICHIER: \"Colonne NB_AC PE RESTANT du Besoin Prod (règle d'origine)\",\n                    p26.RESTANT_AUTO: \"Calculé avec le fichier PE mousses (sinon fichier Besoin Prod)\"}\nSURPLUS = \"#C9D3E3\"  # au-delà de l'objectif (gris bleuté)\nCFG = {\n    \"Besoin\": st.column_config.NumberColumn(\"Besoin\", format=\"%d\", help=\"Qté par avion × avions restants\"),\n    \"Stock\": st.column_config.NumberColumn(\"Stock\", format=\"%d\"),\n    \"En commande\": st.column_config.NumberColumn(\"En commande\", format=\"%d\", help=\"Reste à livrer des commandes (SAP)\"),\n    \"Couverture\": st.column_config.NumberColumn(\"Couverture\", format=\"%d\", help=\"Stock + en commande\"),\n    \"Écart\": st.column_config.NumberColumn(\"Écart\", format=\"%d\", help=\"Besoin − couverture\"),\n    \"À demander (PR)\": st.column_config.NumberColumn(\"À demander (PR)\", format=\"%d\"),\n    \"Couverture (%)\": st.column_config.ProgressColumn(\"Couverture (%)\", format=\"%.0f %%\", min_value=0, max_value=100),\n    \"PU (€)\": st.column_config.NumberColumn(\"PU (€)\", format=\"%.0f €\"),\n    \"Valeur stock (€)\": st.column_config.NumberColumn(\"Valeur stock (€)\", format=\"%.0f €\"),\n    \"Valeur à commander (€)\": st.column_config.NumberColumn(\"Valeur à commander (€)\", format=\"%.0f €\"),\n    \"Prochaine livraison\": st.column_config.DateColumn(\"Prochaine livraison\", format=\"DD/MM/YYYY\"),\n    \"Taux (%)\": st.column_config.ProgressColumn(\"Taux (%)\", format=\"%.0f %%\", min_value=0, max_value=100,\n                                                help=\"Complets maintenant ÷ objectif\"),\n}\n\n\n# --------------------------------------------------------------------------\n# Calculs mis en cache (clé = contenu des fichiers + paramètres)\n# --------------------------------------------------------------------------\n@st.cache_resource(show_spinner=\"Lecture du Besoin Prod…\", max_entries=2)\ndef _besoin_prod(data: bytes, nom: str):\n    return p26.lire_besoin_prod(data, nom)\n\n\n@st.cache_resource(show_spinner=\"Lecture des pièces par avion…\", max_entries=2)\ndef _pieces(data: bytes, nom: str):\n    return pv.preparer_pieces(pv.lire_pieces(data, nom), pv.Params())[0]\n\n\n@st.cache_resource(show_spinner=\"Lecture du fichier PE mousses…\", max_entries=2)\ndef _pe_mousses(data: bytes, nom: str):\n    return pe.lire_pe_mousses(data, nom)\n\n\n@st.cache_resource(show_spinner=\"Calcul de la PE de l'année…\", max_entries=4)\ndef _annee(besoin: tuple, stock: bytes, cmd: bytes | None, fichier_pe: tuple | None, pieces: tuple | None,\n           params: pe.ParamsPE, mode: str, today: date) -> dict:\n    bp = _besoin_prod(*besoin)[0]\n    parts = _pieces(*pieces) if pieces else None\n    rattachement = p26.rattacher_avions(bp, parts)\n    date_ref, faits = today, None\n    if fichier_pe:\n        lignes, dref = _pe_mousses(*fichier_pe)\n        date_ref = dref or today\n        faits = p26.remplaces_depuis(pe.calendrier(lignes, date_ref, today, params), p26.date_debut_annee(date_ref))\n    b = p26.avions_restants(bp, rattachement, faits if faits is not None else pd.DataFrame(), mode)\n    m = p26.analyse_ccn(b, cache.etat_stock(stock)[0], cache.commandes(cmd)[0] if cmd else None)\n    blocs, detail = p26.avions_faisables(b, m)\n    return {\"b\": b, \"m\": m, \"blocs\": blocs, \"detail\": detail, \"rattachement\": rattachement, \"annee\": date_ref.year,\n            \"avec_cmd\": cmd is not None, \"calcul_possible\": bool(fichier_pe) and len(rattachement) > 0}\n\n\n@st.cache_resource(show_spinner=\"Calcul du planning PE…\", max_entries=4)\ndef _planning_pe(stock: bytes | None, cmd: bytes | None, fichier_pe: tuple, pieces: tuple | None, params: pe.ParamsPE,\n                 today: date):\n    \"\"\"Planning PE des mousses + forecast (voir core/pe.py).\"\"\"\n    lignes, date_ref = _pe_mousses(*fichier_pe)\n    parts = _pieces(*pieces) if pieces else pd.DataFrame(columns=pv.RAW_COLS)\n    cmd_l = cache.commandes(cmd)[0] if cmd else None\n    cat = pe.catalogue_mousses(parts) if len(parts) else None\n    stock_lignes = cache.etat_stock(stock)[0] if stock else None\n    if stock_lignes is not None and cat is not None and len(cat):\n        pbi, o = tx.construire_tables(stock_lignes, cmd_l, cat, today, True)\n    else:\n        pbi, o = pd.DataFrame(columns=[\"PNR\", \"QTE SUR ÉTAGÈRE\"]), None\n    parts = pv.rattacher_pieces(parts, pbi) if len(pbi) else parts  # même CCN, PN écrit autrement : même pièce\n    # Fournisseur manquant : repris du Résultat (CODE FOURNISSEUR, à défaut dernier fournisseur)\n    ccn_par_pn = parts.assign(_c=parts[\"ccn\"].replace(\"\", np.nan)).dropna(subset=[\"_c\"]).drop_duplicates(\"pn\").set_index(\"pn\")[\"_c\"] \\\n        if len(parts) and \"ccn\" in parts else None\n    art = pe.completer_fournisseurs(pe.articles(pbi), stock_lignes, cat[\"PN\"] if cat is not None else [], ccn_par_pn)\n    return pe.planning_pe(lignes, date_ref or today, parts, art, o, today, params)\n\n\n# --------------------------------------------------------------------------\n# Import et paramètres\n# --------------------------------------------------------------------------\ndef _bloc_import():\n    with ui.section(f\"{TAB_ID}_import\", \"\"):\n        a, b, c = st.columns([2.4, 3.3, 1], vertical_alignment=\"center\")\n        with a:\n            ui.boutons_dossiers(\"Textile\", K + \"dossier__upload\")\n        puces = b.container()\n        reglages = c.popover(\"Paramètres\", width=\"stretch\")\n        bilan = st.container()\n        with ui.zone_repliable(K + \"manuel\", \"Import manuel\", interrupteur=c, aide=\"Choisir les fichiers à la main (Parcourir) et voir les colonnes attendues\"):\n            zone_dossier = st.container()\n            c1, c2, c3 = st.columns(3)\n            with c1:\n                f_besoin = ui.fichier(f\"{p26.FICHIER_BESOIN} (annuel)\", K + \"besoin\", [\"xlsx\", \"xlsm\"], COLONNES_ATTENDUES[\"besoin_prod\"])\n                f_pieces = ui.fichier(f\"{pv.FICHIER_PIECES} (textile_all_parts)\", K + \"pieces\", [\"csv\", \"xlsx\", \"xlsm\"],\n                                      COLONNES_ATTENDUES[\"pieces\"])\n            with c2:\n                f_stock = ui.fichier(sio.FICHIER_STOCK, K + \"stock\", [\"xlsx\", \"xlsm\"], COLONNES_ATTENDUES[\"stock\"])\n                f_pe = ui.fichier(f\"{pe.FICHIER_PE} (PE_MOUSSE, mensuel)\", K + \"pe\", [\"xlsx\", \"xlsm\"], COLONNES_ATTENDUES[\"pe\"])\n            with c3:\n                f_cmd = ui.import_commandes(COLONNES_ATTENDUES[\"commandes\"])\n        with bilan:\n            ui.import_dossier(K + \"dossier\", {\"besoin_prod\": K + \"besoin\", \"stock\": K + \"stock\", \"pieces\": K + \"pieces\", \"pe\": K + \"pe\"},\n                              label=\"Tout le dossier Textile (Ctrl+A pour tout sélectionner)\", aide=NOMMAGE, noms=NOMS_DOSSIER,\n                              zone=zone_dossier, autres=(\"references\", \"stock_textile\"))\n        with puces:\n            ui.etat_fichiers([(p26.FICHIER_BESOIN, K + \"besoin\", True), (sio.FICHIER_STOCK, K + \"stock\", True),\n                              (sio.FICHIER_COMMANDES, \"commun__commandes\", False), (pe.FICHIER_PE, K + \"pe\", False),\n                              (pv.FICHIER_PIECES, K + \"pieces\", False)])\n        with reglages:\n            t_gen, t_an, t_pe = st.tabs([\"Général\", \"Année (Besoin Prod)\", \"Planning PE\"])\n            with t_gen:\n                today = st.date_input(\"Date de référence\", value=date.today(), format=\"DD/MM/YYYY\", key=K + \"date\",\n                                      persist_state=\"page\", help=\"Statuts PE, retards et début de la prévision.\")\n            with t_an:\n                mode = st.radio(\"Avions restant à traiter\", list(RESTANT_LIBELLES), format_func=RESTANT_LIBELLES.get,\n                                key=K + \"restant\", persist_state=\"page\",\n                                help=\"Par défaut : colonne NB_AC PE RESTANT du Besoin Prod (à défaut NB_AC). \"\n                                     \"Calcul : NB_AC − avions du type dont la mousse (classe, assise ou dossier) a été remplacée \"\n                                     \"depuis le 1er janvier d'après le fichier PE mousses. Le type de chaque avion est \"\n                                     \"retrouvé par ses CCN de mousses (textile_all_parts).\")\n            with t_pe:\n                params_pe = vue_pe.parametres()\n    return f_besoin, f_stock, f_cmd, f_pe, f_pieces, today, params_pe, mode\n\n\ndef render() -> None:\n    entete = st.container()\n    f_besoin, f_stock, f_cmd, f_pe, f_pieces, today, params_pe, mode = _bloc_import()\n    with entete:\n        date_pe = pe.date_extraction(f_pe[0]) if f_pe else None\n        ui.hero(TAB_ICON, \"PE mousses\", TAB_DESCRIPTION, \"Production · Politique d'entretien\", ui.contexte(\n            *([(\"Fichier PE du\", f\"{date_pe:%d/%m/%Y}\", \"\")] if date_pe else []),\n            (\"Avions restants\", \"NB_AC PE RESTANT\" if mode == p26.RESTANT_FICHIER else \"Calculés (PE mousses)\", \"\")))\n    with st.container(key=\"s360barre\"):\n        section = ui.sous_onglets(K + \"section\", SECTIONS)\n    if section in (\"Avancement PE\", \"Prévision\"):\n        _section_planning(section, f_stock, f_cmd, f_pe, f_pieces, params_pe, today)\n        return\n    if not (f_besoin and f_stock):\n        with ui.section(f\"{TAB_ID}_vide\", \"PE mousses de l'année\"):\n            ui.empty_state(\"Importez le Besoin Prod et l'État du stock\",\n                           \"Avions restants : colonne NB_AC PE RESTANT (recalcul possible dans Paramètres avec le fichier \"\n                           \"PE mousses et textile_all_parts) ; les commandes (SAP) complètent la couverture.\",\n                           [(p26.FICHIER_BESOIN, bool(f_besoin)), (sio.FICHIER_STOCK, bool(f_stock)),\n                            (sio.FICHIER_COMMANDES, bool(f_cmd)), (pe.FICHIER_PE, bool(f_pe)), (pv.FICHIER_PIECES, bool(f_pieces))],\n                           icon=\"✈️\")\n        return\n    try:\n        res = _annee((f_besoin[1], f_besoin[0]), f_stock[1], f_cmd[1] if f_cmd else None,\n                     (f_pe[1], f_pe[0]) if f_pe else None, (f_pieces[1], f_pieces[0]) if f_pieces else None, params_pe, mode, today)\n    except ValueError as exc:\n        ui.callout(f\"<b>Import impossible.<\/b> {exc}\", \"ko\", \"⛔\")\n        return\n    if not res[\"avec_cmd\"]:\n        ui.callout(\"Sans <b>Commandes (SAP)<\/b>, « en commande » = QTE EN CDE de l'État du stock.\", \"warn\", \"⚠️\")\n    if mode == p26.RESTANT_AUTO and not res[\"calcul_possible\"]:\n        ui.callout(\"Avions restants lus dans le Besoin Prod (colonne NB_AC PE RESTANT) : ajoutez le fichier <b>PE mousses<\/b> \"\n                   \"et <b>textile_all_parts<\/b> pour les recalculer.\", \"info\", \"ℹ️\")\n    {\"Synthèse\": _synthese, \"Avions faisables\": _faisables, \"CCN et commandes\": _ccn}[section](res, today)\n\n\ndef _section_planning(section, f_stock, f_cmd, f_pe, f_pieces, params_pe, today):\n    if not f_pe:\n        with ui.section(f\"{TAB_ID}_pe_vide\", \"Planning PE des mousses\"):\n            ui.empty_state(f\"Importez le fichier {pe.FICHIER_PE}\", \"Le fichier mensuel PE_MOUSSE (feuilles BOTTOM FOAM et \"\n                           \"BACKREST FOAM), tel que vous le recevez. textile_all_parts et l'État du stock ajoutent la prévision \"\n                           \"des mousses à commander.\",\n                           [(pe.FICHIER_PE, False), (pv.FICHIER_PIECES, bool(f_pieces)), (sio.FICHIER_STOCK, bool(f_stock))],\n                           icon=\"📅\")\n        return\n    try:\n        res = _planning_pe(f_stock[1] if f_stock else None, f_cmd[1] if f_cmd else None, (f_pe[1], f_pe[0]),\n                           (f_pieces[1], f_pieces[0]) if f_pieces else None, params_pe, today)\n    except ValueError as exc:\n        ui.callout(f\"<b>{pe.FICHIER_PE} illisible.<\/b> {exc}\", \"ko\", \"⛔\")\n        return\n    if pe.date_extraction(f_pe[0]) is None:\n        ui.callout(\"Date des âges introuvable dans le nom du fichier (ex. PE_MOUSSE_29092026) : la date de référence est utilisée.\",\n                   \"warn\", \"⚠️\")\n    if section == \"Prévision\" and not f_stock:\n        ui.callout(\"Ajoutez l'<b>État du stock<\/b> pour déduire le stock des mousses à commander.\", \"warn\", \"⚠️\")\n    vue_pe.render(res, today, bool(f_pieces), \"avancement\" if section == \"Avancement PE\" else \"forecast\")\n\n\n# --------------------------------------------------------------------------\n# Synthèse\n# --------------------------------------------------------------------------\ndef _kpis_avions(blocs: pd.DataFrame, annee: int) -> list[str]:\n    \"\"\"Cartes de l'objectif. Unité : la CLASSE d'avion (un avion à traiter en J, W et Y compte 3 fois), car chaque\n    classe a ses propres CCN et son propre nombre d'avions restants.\"\"\"\n    obj, now = int(blocs[\"Objectif\"].sum()), int(blocs[\"Complets maintenant\"].sum())\n    rec, coter, appro = int(blocs[\"Complets à réception\"].sum()), int(blocs[\"À coter\"].sum()), int(blocs[\"À approvisionner\"].sum())\n    taux = now / obj * 100 if obj else 0\n    return [\n        ui.kpi_repartition(f\"Objectif {annee} : classes à traiter\", charts.entier(obj), \"classes d'avion\",\n                           [(n, int(blocs[n].sum()), p26.AVANCEMENT_COULEURS[n]) for n in p26.AVANCEMENT],\n                           note=f\"soit {charts.entier(p26.avions_distincts(blocs))} avions\", icone=\"target\", tone=\"violet\"),\n        ui.kpi_card(\"Complètes maintenant\", charts.entier(now), f\"{taux:.0f} % de l'objectif · tous leurs CCN en stock\", \"ok\", \"check-circle\"),\n        ui.kpi_card(\"Complètes à réception\", charts.entier(rec), \"une fois les commandes en cours livrées\", \"info\", \"truck\"),\n        ui.kpi_card(\"À coter\", charts.entier(coter), \"il ne manque que des CCN sans prix\", \"orange\", \"tag\"),\n        ui.kpi_card(\"À approvisionner\", charts.entier(appro), \"CCN manquants à commander\", \"ko\", \"cart\"),\n    ]\n\n\ndef _jauges_blocs(blocs: pd.DataFrame, titre: str) -> str:\n    lignes = []\n    for _, r in blocs.sort_values([\"Type avion\", \"Classe\"]).iterrows():\n        if r[\"Objectif\"] <= 0:\n            continue\n        info = [f\"CCN limitant : {r['CCN limitant']}\"] if r[\"Complets maintenant\"] < r[\"Objectif\"] else []\n        if r[\"À approvisionner\"] and r[\"CCN communs\"]:\n            info.append(f\"{int(r['CCN communs'])} CCN commun(s) à d'autres types : stock et commandes partagés entre eux\")\n        if r[\"À coter\"]:\n            info.append(\"Il ne manque que des CCN sans prix : à faire coter avant de commander\")\n        lignes.append((p26.nom_bloc(r[\"Type avion\"], r[\"Classe\"]), [(n, r[n], p26.AVANCEMENT_COULEURS[n]) for n in p26.AVANCEMENT],\n                       None, f\"{int(r['Complets maintenant'])} / {int(r['Objectif'])}\", info))\n    leg = [(n, c, \"barre\") for n, c in p26.AVANCEMENT_COULEURS.items()]\n    return charts.jauges(lignes, titre, leg, fmt=charts.entier, hauteur_max=\"30rem\") if lignes else charts.vide(\"Aucun avion à traiter\")\n\n\ndef _synthese(res: dict, today: date):\n    m, blocs, annee = res[\"m\"], res[\"blocs\"], res[\"annee\"]\n    a_pr = m[m[\"Écart\"] > 0]\n    resume = (f\"{len(a_pr)} PR à émettre · {charts.euros(a_pr['Valeur à commander (€)'].sum())}\" if len(a_pr)\n              else \"Besoin de l'année couvert\")\n    detail = (f\"{charts.entier(a_pr['À demander (PR)'].sum())} mousses à demander : {(a_pr['Action'] == p26.ACTIONS[0]).sum()} CCN sans \"\n              f\"commande, {(a_pr['Action'] == p26.ACTIONS[1]).sum()} avec des commandes insuffisantes.\" if len(a_pr) else \"\")\n    with ui.section(f\"{TAB_ID}_synthese\", f\"Synthèse de la PE mousses {annee}\", resume, export=_export(res), carte=False, info=detail):\n        ui.kpi_grid(_kpis_avions(blocs, annee))\n        ui.valeurs([\n            (\"Valeur du stock\", charts.euros(m[\"Valeur stock (€)\"].sum()), \"mousses sur étagère\"),\n            (\"Valeur en commande\", charts.euros(m[\"Valeur en commande (€)\"].sum()), \"déjà commandé, à recevoir\"),\n            (\"À commander\", charts.euros(m[\"Valeur à commander (€)\"].sum()), \"PR, hors CCN à coter\"),\n            (f\"Valeur du besoin {annee}\", charts.euros(m[\"Valeur du besoin (€)\"].sum()), \"avions restants\"),\n            (\"CCN à coter\", charts.entier(m[\"À coter\"].sum()), \"sans prix : coût sous-estimé\"),\n        ])\n    with ui.section(f\"{TAB_ID}_avions_ccn\", \"Avions et CCN\", f\"{m['CCN'].nunique()} CCN suivis\",\n                    info=\"Ce que permettent le stock et les commandes en cours.\"):\n        a, b = st.columns([1, 1.5], gap=\"medium\")\n        with a:\n            n = m[\"Action\"].value_counts()\n            ui.graphe(charts.barres_h([(act, n.get(act, 0), charts.entier(n.get(act, 0)), p26.ACTION_COULEURS[act])\n                                       for act in p26.ACTIONS], titre=\"CCN par action\"), \"Nombre de CCN selon l'action à mener\")\n        with b:\n            ui.graphe(_jauges_blocs(blocs, \"Avions par type et par classe, sur l'objectif\"),\n                      \"Une ligne = une classe d'un type d'avion ; survolez une ligne pour le CCN limitant\")\n    act = m[m[\"Priorité\"] <= 2]\n    with ui.section(f\"{TAB_ID}_actions\", \"Actions à lancer\", \"PR à émettre, la plus urgente en premier\", tag=str(len(act))):\n        if act.empty:\n            ui.callout(\"Aucune PR à émettre : stock et commandes couvrent le besoin de l'année.\", \"ok\", \"check-circle\")\n        else:\n            _c
