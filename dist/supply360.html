ask trfx\", \"task name\", \"task wp line\", \"trfx\")\n    c_rrs = trouver_colonne(df, \"requestid\", \"request id\", exact=True) or trouver_colonne(df, \"requestid\", \"request id\")\n    if c_pn is None:\n        raise ColonneIntrouvable(\"MPN Prime\", FICHIER_BESOINS, feuille, df.columns)\n    if c_qty is None:\n        raise ColonneIntrouvable(\"Qty\", FICHIER_BESOINS, feuille, df.columns)\n\n    out = pd.DataFrame({\n        \"PN\": cle_pn(df[c_pn]),\n        \"Qty\": nombre(df[c_qty], 0),\n        \"Description\": df[c_desc] if c_desc else np.nan,\n        \"TRFX\": texte(df[c_task]) if c_task else np.nan,\n        \"RRS\": _code(df[c_rrs]) if c_rrs else np.nan,  # Requestid de LOGOPS\n    })\n    return out[out[\"PN\"].notna()], feuille\n\n\ndef lire_besoins_asreq(data: bytes):\n    \"\"\"Étude ASREQ/NOREQ (classeur .xlsm, feuille « Ordered », en-tête en ligne 6).\"\"\"\n    xl = ouvrir_excel(data, FICHIER_ASREQ)\n    if \"Ordered\" not in xl.sheet_names:\n        raise FichierIllisible(\n            f\"Feuille « Ordered » introuvable dans le fichier {FICHIER_ASREQ}. \"\n            f\"Feuilles présentes : {', '.join(xl.sheet_names)}\")\n    df = lire_feuille(xl, \"Ordered\", 5)\n\n    c_barecode = trouver_colonne(df, \"id barecode\")\n    c_pn = trouver_colonne(df, \"pn + infos\", \"pn\")\n    c_qty = trouver_colonne(df, \"qty\", exact=True)\n    if c_pn is None:\n        raise ColonneIntrouvable(\"PN + infos pièce sortie\", FICHIER_ASREQ, \"Ordered\", df.columns)\n    if c_qty is None:\n        raise ColonneIntrouvable(\"Qty\", FICHIER_ASREQ, \"Ordered\", df.columns)\n\n    out = pd.DataFrame({\n        \"PN\": cle_pn(df[c_pn]),\n        \"Qty\": nombre(df[c_qty], 0),\n        \"TRFX\": texte(df[c_barecode]) if c_barecode else np.nan,\n        \"RRS\": np.nan,\n    })\n    return out[out[\"PN\"].notna()], \"Ordered\"\n\n\ndef _code(serie: pd.Series) -> pd.Series:\n    return texte(serie).str.replace(r\"\\.0$\", \"\", regex=True)\n\n\n# Colonnes complémentaires de l'État du stock (consommation, valeur…), lues si présentes.\nSTOCK_COMPLEMENTS = {\n    \"QTE CONSO 12M\": \"qte_conso_12m\", \"QTE CONSO 18M\": \"qte_conso_18m\", \"QTE CONSO 24M\": \"qte_conso_24m\",\n    # Conso nette : demandes de la production moins les réintégrations (équipement remis sur étagère, non consommé)\n    \"QTE CONSO NETTE REINT 12M\": \"qte_conso_nette_reint_12m\", \"QTE CONSO NETTE REINT 24M\": \"qte_conso_nette_reint_24m\",\n    \"TDD 6M\": \"tdd_6m\", \"TDD 12M\": \"tdd_12m\", \"QTE COUVERTURE\": \"qte_couverture\", \"QTE SAR\": \"qte_sar\",\n    \"Stock réservé\": \"stock_reserve\", \"B/O\": \"b/o\", \"Dernier PU (achat) Euros\": \"dernier_pu_(achat)_euros\",\n    \"PMP\": \"pmp\",  # prix moyen pondéré : prix de valorisation de Supply360 (transforms.prix_unitaire)\n    \"RP\": \"rp\", \"EOQ\": \"eoq\", \"LT observé moyen sur 2 ans\": \"lt_observe_moyen_sur_2_ans\",\n    \"Purchase Req.\": \"purchase_req.\",  # quantité en demande d'achat (PR)\n}\n\n\n_STOCK_EXACT = {\"pnr\", \"pn\", \"finalpnr\", \"gestion\", \"ccn\", \"class_code\"}\n_STOCK_CONTIENT = (\"pnr\", \"qte_sur_etagere\", \"qte_en_cde\", \"code_agt_appro\", \"code_fournisseur\", \"dernier_fournisseur\",\n                   \"description\", \"tracking_level\", \"qte_conso\", \"date_derniere_conso\", *STOCK_COMPLEMENTS.values())\n\n\ndef _garder_stock(n: str) -> bool:\n    return n in _STOCK_EXACT or any(c in n for c in _STOCK_CONTIENT)\n\n\ndef lire_etat_stock(data: bytes):\n    \"\"\"État du stock (PNR, QTE SUR ÉTAGÈRE, QTE EN CDE, GESTION…). Renvoie (lignes, feuille).\n\n    Les colonnes de consommation (QTE CONSO 12M…, QTE CONSO <année>), de prix et la date de\n    dernière consommation sont ajoutées quand elles existent (utilisées par l'onglet Textile).\n    \"\"\"\n    xl = ouvrir_excel(data, FICHIER_STOCK)\n    feuille, entete = choisir_feuille(xl, [\"pnr\", \"qte sur etagere\"])\n    df = lire_colonnes(xl, feuille, entete, [\"pnr\", \"qte sur etagere\"], _garder_stock)\n\n    c_pnr = (trouver_colonne(df, \"pnr\", exact=True) or trouver_colonne(df, \"pnr\")\n             or trouver_colonne(df, \"pn\", \"finalpnr\", exact=True))\n    c_stock = trouver_colonne(df, \"qte sur etagere\")\n    c_cde = trouver_colonne(df, \"qte en cde\")\n    c_gestion = trouver_colonne(df, \"gestion\", exact=True) or trouver_colonne(df, \"gestion\")\n    c_agent = trouver_colonne(df, \"code agt appro\")\n    c_fourn = trouver_colonne(df, \"code fournisseur\")\n    c_dernier = trouver_colonne(df, \"dernier fournisseur\")\n    c_desc = trouver_colonne(df, \"description\")\n    c_ccn = trouver_colonne(df, \"ccn\", exact=True)\n    c_class = trouver_colonne(df, \"class code\", exact=True)\n    c_tl = trouver_colonne(df, \"tracking level\")\n    if c_pnr is None:\n        raise ColonneIntrouvable(\"PNR\", FICHIER_STOCK, feuille, df.columns)\n    if c_stock is None:\n        raise ColonneIntrouvable(\"QTE SUR ÉTAGÈRE\", FICHIER_STOCK, feuille, df.columns)\n\n    n = len(df)\n    out = pd.DataFrame({\n        \"PN\": cle_pn(df[c_pnr]),\n        \"QTY_STOCK\": nombre(df[c_stock], 0),\n        \"QTY_CDE\": nombre(df[c_cde], 0) if c_cde else pd.Series(0.0, index=df.index),\n        \"GESTION\": nombre(df[c_gestion]) if c_gestion else np.nan,\n        \"CODE_AGENT\": texte(df[c_agent]) if c_agent else np.nan,\n        \"CODE_FOURNISSEUR\": _code(df[c_fourn]) if c_fourn else np.nan,\n        \"DERNIER_FOURNISSEUR\": texte(df[c_dernier]) if c_dernier else np.nan,\n        \"Description_stock\": df[c_desc] if c_desc else np.nan,\n        \"CCN\": _code(df[c_ccn]) if c_ccn else np.nan,\n        \"CLASS_CODE_STOCK\": nombre(df[c_class]) if c_class else np.full(n, np.nan),\n        # TRACKING LEVEL → TL : « 0 » (consommable) ou « 1 » (réparable), quelle que soit l'écriture (TL0, 1, 1.0…)\n        \"TL\": texte(df[c_tl]).str.extract(r\"([01])\", expand=False) if c_tl else np.full(n, np.nan),\n    })\n    noms = {normaliser(c): c for c in df.columns}\n    for cible, norm in STOCK_COMPLEMENTS.items():\n        if norm in noms:\n            out[cible] = nombre(df[noms[norm]])\n    for norm, col in noms.items():\n        m = re.fullmatch(r\"qte_conso_(20\\d\\d)\", norm)\n        if m:\n            out[f\"QTE CONSO {m.group(1)}\"] = nombre(df[col])\n    if \"date_derniere_conso\" in noms:\n        out[\"DATE DERNIERE CONSO\"] = dates(df[noms[\"date_derniere_conso\"]])\n    return out[out[\"PN\"].notna()], feuille\n\n\n_CMD_EXACT = {\"pn\", \"p/n\", \"part_number\", \"commande\", \"gestion\", \"ccn\", \"fournisseur\", \"statut\"}\n_CMD_CONTIENT = (\"code_acheteur\", \"code_fournisseur\", \"fournisseur\", \"livraison_promise\", \"livraison_demandee\", \"emission\",\n                 \"statut\", \"restant_a_livrer\", \"class_code\", \"code_classe\")\n\n\ndef _garder_commandes(n: str) -> bool:\n    return n in _CMD_EXACT or any(c in n for c in _CMD_CONTIENT)\n\n\ndef lire_commandes_sap(data: bytes):\n    \"\"\"Commandes (SAP), feuille « Toutes les commandes » de préférence. Renvoie (lignes, feuille).\n\n    Le fournisseur manquant est complété à partir du code fournisseur (voir\n    transforms.completer_fournisseurs).\n    \"\"\"\n    xl = ouvrir_excel(data, FICHIER_COMMANDES)\n    feuille, entete = choisir_feuille(xl, [\"pn\", \"code acheteur\", \"commande\"],\n                                      feuille_preferee=\"Toutes les commandes\")\n    df = lire_colonnes(xl, feuille, entete, [\"pn\", \"code acheteur\", \"commande\"], _garder_commandes).dropna(axis=1, how=\"all\")\n\n    c_pn = trouver_colonne(df, \"pn\", exact=True) or trouver_colonne(df, \"p/n\", \"part number\", exact=True)\n    c_cmd = trouver_colonne(df, \"commande\", exact=True)\n    c_acheteur = trouver_colonne(df, \"code acheteur\")\n    c_gestion = trouver_colonne(df, \"gestion\", exact=True)\n    c_fourn_code = trouver_colonne(df, \"code fournisseur\")\n    c_fourn = trouver_colonne(df, \"fournisseur\", exact=True) or trouver_colonne(df, \"fournisseur\")\n    c_psd = trouver_colonne(df, \"date de livraison promise\", \"livraison promise\")\n    c_date_dem = trouver_colonne(df, \"date de livraison demandee\", \"livraison demandee\")\n    c_emission = trouver_colonne(df, \"date d'emission de la commande\", \"date emission de la commande\", \"date emission\",\n                                 \"date d'emission\")\n    c_statut = trouver_colonne(df, \"statut de la commande\", \"statut\")\n    c_restant = trouver_colonne(df, \"quantite restant a livrer\", \"restant a livrer\")\n    c_class = trouver_colonne(df, \"class code\", \"code classe\")\n    c_ccn = trouver_colonne(df, \"ccn\", exact=True)\n    if c_pn is None:\n        raise ColonneIntrouvable(\"PN\", FICHIER_COMMANDES, feuille, df.columns)\n\n    nat = pd.Series(pd.NaT, index=df.index, dtype=\"datetime64[ns]\")\n    out = pd.DataFrame({\n        \"PN\": cle_pn(df[c_pn]),\n        \"Commande\": texte(df[c_cmd]) if c_cmd else np.nan,\n        \"Code_acheteur\": texte(df[c_acheteur]) if c_acheteur else np.nan,\n        \"Gestion_cmd\": nombre(df[c_gestion]) if c_gestion else np.nan,\n        \"Code_fournisseur_cmd\": _code(df[c_fourn_code]) if c_fourn_code else np.nan,\n        \"Fournisseur\": texte(df[c_fourn]) if c_fourn else np.nan,\n        \"PSD\": dates(df[c_psd]) if c_psd else nat,\n        \"Date_demandee\": dates(df[c_date_dem]) if c_date_dem else nat,\n        \"Date_emission\": dates(df[c_emission]) if c_emission else nat,\n        \"Statut\": texte(df[c_statut]) if c_statut else np.nan,\n        \"Qty_restant\": nombre(df[c_restant], 0) if c_restant else 0.0,\n        \"Class_code\": nombre(df[c_class]) if c_class else np.nan,\n        \"CCN_cmd\": _code(df[c_ccn]) if c_ccn else np.nan,\n    })\n    out = out[out[\"PN\"].notna()].copy()\n    out[\"Fournisseur\"] = tf.completer_fournisseurs(out)\n    # Date de livraison « effective » : la PSD si connue, sinon la date demandée.\n    out[\"PSD_effective\"] = out[\"PSD\"].fillna(out[\"Date_demandee\"])\n    out[\"PSD_est_estimee\"] = out[\"PSD\"].isna() & out[\"Date_demandee\"].notna()\n    return out, feuille\n\n\ndef lire_references_textile(data: bytes):\n    \"\"\"Références textile (feuille « PN Catalog » : pn, equipment, description, ccn). Renvoie (catalogue, feuille).\"\"\"\n    xl = ouvrir_excel(data, FICHIER_REFERENCES)\n    feuille, entete = choisir_feuille(xl, [\"pn\", \"equip\"], feuille_preferee=\"PN Catalog\")\n    df = lire_feuille(xl, feuille, entete)\n    c_pn = trouver_colonne(df, \"pn\", exact=True)\n    c_eq = trouver_colonne(df, \"equipment\", \"equipement\", exact=True) or trouver_colonne(df, \"equipment\", \"equipement\")\n    if c_pn is None:\n        raise ColonneIntrouvable(\"pn\", FICHIER_REFERENCES, feuille, df.columns)\n    if c_eq is None:\n        raise ColonneIntrouvable(\"equipment\", FICHIER_REFERENCES, feuille, df.columns)\n    c_desc = trouver_colonne(df, \"description\", exact=True)\n    c_ccn = trouver_colonne(df, \"ccn\", exact=True)\n    out = pd.DataFrame({\n        \"PN\": cle_pn(df[c_pn]),\n        \"Equipement\": texte(df[c_eq]).str.upper(),\n        \"Description\": texte(df[c_desc]) if c_desc else np.nan,\n        \"CCN\": _code(df[c_ccn]) if c_ccn else np.nan,\n    })\n    out = out[out[\"PN\"].notna()].drop_duplicates(\"PN\").reset_index(drop=True)\n    return out, feuille\n", "app/core/journal.py": "\"\"\"Diagnostic sous stlite : les erreurs Python (avertissements Streamlit, tracebacks) sont aussi transmises à la\npage, qui les garde pour le bandeau « L'application ne répond plus » (bouton « Détails techniques »).\n\nLe moteur Python tourne dans un « worker » du navigateur : ses erreurs n'apparaissent que dans la console de\ndéveloppement, invisible pour l'utilisateur. Ici, elles sont envoyées à la page par `postMessage` (message\ninterne au navigateur, aucun accès réseau). `sante()` répond à la surveillance de la page : elle ne relance le\nmoteur que sur une panne constatée, jamais pendant un long calcul. Sans effet en local (`streamlit run`).\n\"\"\"\n\nimport json\nimport logging\nimport re\nimport sys\nimport traceback\n\nIGNORES = (\"Failed to scan component manifests\",)\n_GARDES = [False]  # garde-fous installés (le compteur ci-dessous n'a de sens qu'avec eux)\n_RECUS = [0]  # messages de la page (clics, sondes) arrivés jusqu'au runtime : preuve que la session les lit\n\n\ndef _envoyer(texte: str, evenement: str = \"\") -> None:\n    try:\n        import js\n        from pyodide.ffi import to_js\n\n        js.postMessage(to_js({\"type\": \"s360:journal\", \"texte\": texte[-1500:], \"evenement\": evenement},\n                             dict_converter=js.Object.fromEntries))\n    except Exception:  # le diagnostic ne doit jamais casser l'app\n        pass\n\n\ndef _resume_exception() -> str:\n    typ, exc, tb = sys.exc_info()\n    if exc is None:\n        return \"\"\n    lieu = traceback.extract_tb(tb)[-1] if tb else None\n    return f\"{typ.__name__}: {exc}\" + (f\" ({lieu.filename.rsplit('/', 1)[-1]}:{lieu.lineno})\" if lieu else \"\")\n\n\ndef proteger_runtime() -> None:\n    \"\"\"Garde-fous sur le runtime Streamlit sous stlite (cause des pages figées sans message d'erreur).\n\n    Sous stlite, les clics passent par une seule session « websocket » vers le moteur. Si une exception remonte\n    jusqu'à elle, stlite l'avale : la session s'arrête, les clics suivants partent dans le vide et la page reste\n    sur « Calcul en cours ». Idem si l'envoi d'un message à la page échoue : la boucle d'envoi de Streamlit s'arrête.\n    - une erreur sur un message reçu est journalisée et ignorée, la session continue ;\n    - une erreur à l'envoi d'un message est journalisée et le message sauté, la boucle d'envoi continue ;\n    - si la session se ferme malgré tout, la page est prévenue tout de suite : elle vérifie (`sante`) et relance.\n    \"\"\"\n    from streamlit.runtime import Runtime\n    from streamlit.runtime.session_manager import SessionClientDisconnectedError\n\n    traiter, envoyer, deconnecter = Runtime.handle_backmsg, Runtime._send_message, Runtime.disconnect_session\n\n    def handle_backmsg(self, *args, **kwargs):\n        _RECUS[0] += 1\n        try:\n            return traiter(self, *args, **kwargs)\n        except Exception:\n            _envoyer(\"Erreur ignorée sur un message reçu : \" + _resume_exception())\n\n    def _send_message(self, *args, **kwargs):\n        try:\n            return envoyer(self, *args, **kwargs)\n        except SessionClientDisconnectedError:\n            raise\n        except Exception:\n            _envoyer(\"Message non envoyé (erreur ignorée) : \" + _resume_exception())\n\n    def disconnect_session(self, *args, **kwargs):\n        _envoyer(\"Session du moteur fermée\" + (\" : \" + _resume_exception() if sys.exc_info()[1] else \"\"), \"session_fermee\")\n        return deconnecter(self, *args, **kwargs)\n\n    Runtime.handle_backmsg, Runtime._send_message, Runtime.disconnect_session = handle_backmsg, _send_message, disconnect_session\n    _GARDES[0] = True\n\n\ndef sante() -> str:\n    \"\"\"État du moteur, demandé par la surveillance de la page (commande `run_python` de stlite, hors session).\n\n    Répondre prouve que Python est libre ; le contenu dit si la session est encore utilisable : sessions actives,\n    client fermé ou tâche d'envoi arrêtée (les réponses n'arrivent plus à la page), messages reçus (s'il ne bouge\n    plus alors que la page envoie, la lecture des clics est arrêtée).\n    \"\"\"\n    etat = {\"recus\": _RECUS[0] if _GARDES[0] else -1, \"sessions\": -1, \"ferme\": False, \"en_cours\": False}\n    try:  # mémoire du moteur (Pyodide ne la rend jamais au navigateur) : pour le journal des relances\n        import pyodide_js\n\n        etat[\"memoire\"] = round(pyodide_js._module.HEAP8.length / 1e6)\n    except Exception:\n        pass\n    try:\n        import streamlit.runtime as rt\n\n        runtime = rt.get_instance() if hasattr(rt, \"get_instance\") else rt.Runtime._instance\n        infos = runtime._session_mgr.list_active_sessions()\n        etat[\"sessions\"] = len(infos)\n        for info in infos:\n            client = info.client\n            ferme, envoi = getattr(client, \"_closed\", None), getattr(client, \"_sender_task\", None)\n            if (ferme is not None and ferme.is_set()) or (envoi is not None and envoi.done()):\n                etat[\"ferme\"] = True\n            if getattr(getattr(info.session, \"_state\", None), \"name\", \"\") == \"APP_IS_RUNNING\":  # calcul en cours : rien à conclure\n                etat[\"en_cours\"] = True\n    except Exception as exc:  # version de Streamlit différente : la page se fie au seul compteur\n        etat[\"inconnu\"] = f\"{type(exc).__name__}: {exc}\"\n    return json.dumps(etat)\n\n\nclass _VersPage(logging.Handler):\n    def emit(self, record: logging.LogRecord) -> None:\n        if getattr(record, \"_s360\", False):  # déjà transmis par un logger enfant (même gestionnaire sur toute la lignée)\n            return\n        record._s360 = True\n        texte = record.getMessage()\n        if any(i in texte for i in IGNORES):\n            return\n        if record.exc_info:\n            texte += \" | \" + logging.Formatter().formatException(record.exc_info).splitlines()[-1]\n        _envoyer(f\"{record.levelname} {record.name} : {texte}\")\n\n\nclass _Sortie:\n    \"\"\"Copie de sys.stderr (tracebacks imprimés, ex. arrêt de la boucle du runtime Streamlit).\"\"\"\n\n    def __init__(self, flux):\n        self._flux, self._tampon = flux, \"\"\n\n    def write(self, s):\n        n = self._flux.write(s)\n        self._tampon += s\n        if \"\\n\" in self._tampon:\n            bloc, self._tampon = self._tampon.rsplit(\"\\n\", 1)\n            # Seulement les erreurs (traceback, exception) : pas les avertissements de dépréciation de pandas.\n            if bloc.strip() and not any(i in bloc for i in IGNORES) and re.search(r\"Traceback|Error|Exception|report this bug\", bloc) \\\n                    and \"Warning\" not in bloc:\n                _envoyer(\"stderr : \" + bloc)\n        return n\n\n    def __getattr__(self, nom):\n        return getattr(self._flux, nom)\n\n\ndef installer() -> None:\n    \"\"\"À appeler au démarrage (une seule installation par session du moteur).\"\"\"\n    if sys.platform != \"emscripten\" or getattr(sys, \"_s360_journal\", False):\n        return\n    sys._s360_journal = True\n    sys._s360_sante = sante\n    gestionnaire = _VersPage(level=logging.WARNING)\n    # Les loggers de Streamlit ne remontent pas à leur parent (propagate=False) : on se branche sur chacun.\n    noms = [\"\"] + [n for n in logging.root.manager.loggerDict if n.startswith(\"streamlit\")]\n    for nom in noms:\n        logging.getLogger(nom).addHandler(gestionnaire)\n    sys.stderr = _Sortie(sys.stderr)\n    try:\n        proteger_runtime()\n    except Exception as exc:  # version de Streamlit différente : on garde au moins le journal\n        _envoyer(f\"Garde-fous du moteur non installés : {exc}\")\n", "app/core/pe.py": "\"\"\"Planning de la politique d'entretien (PE) des mousses de sièges et forecast des commandes d'équipements.\n\nEntrées :\n  - fichier « PE mousses » (régénéré chaque mois) : une feuille « … BOTTOM FOAM … » (assises, classes J / W / Y)\n    et une feuille « … BACKREST FOAM … » (dossiers J). Par immatriculation : flotte, version cabine, âge des\n    mousses en mois à la date de l'extraction (« > 60 » = au moins 60 mois), visite liée (texte avec une date) ;\n  - textile_all_parts (« Pièces par avion ») : PN et quantité par avion des lignes `equipment` = MOUSSE ;\n    classe = `area`, assise / dossier selon la `description` (FOAM BOTTOM / BOTT… ou FOAM BACKREST / BACK…) ;\n  - État du stock et Commandes (SAP) : stock, prix, commandes en cours, fournisseur.\n\nRègles :\n  - échéance = date du dernier remplacement (date d'extraction − âge) + cycle PE ; âge « > X » : X est pris\n    comme âge minimum (échéance au plus tôt) ;\n  - statut à la date du jour : En retard (au-delà du délai toléré), Délai toléré, À faire < 3 mois,\n    À faire < 12 mois, OK ;\n  - date prévue du remplacement : la prochaine visite connue, sinon l'échéance (le mois en cours si dépassée) ;\n    puis tous les cycles jusqu'à la fin de l'horizon ;\n  - stock de sécurité d'un PN : pour chaque flotte, 10 % des avions qui utilisent le PN (arrondi au-dessus,\n    au moins 1) × quantité par avion ;\n  - livraisons à prévoir : chaque mois, ce qui manque pour garder le stock projeté (stock + commandes en\n    cours − besoins) au niveau du stock de sécurité.\n\nFonctions pures, testables sans Streamlit.\n\"\"\"\n\nimport math\nimport re\nfrom dataclasses import dataclass\nfrom datetime import date\n\nimport numpy as np\nimport pandas as pd\n\nfrom core import io as sio\nfrom core import transforms as tf\n\nFICHIER_PE = \"PE mousses\"\nCLASSES = [\"J\", \"W\", \"Y\"]\nCOMPOSANTS = [\"Assise\", \"Dossier\"]\n# Cycle PE en mois (0 = jamais remplacé) : PE mousses long-courrier.\nCYCLES_DEFAUT = ((\"J\", \"Assise\", 36), (\"J\", \"Dossier\", 72), (\"W\", \"Assise\", 36), (\"W\", \"Dossier\", 0),\n                 (\"Y\", \"Assise\", 36), (\"Y\", \"Dossier\", 0))\nSTATUTS = [\"En retard\", \"Délai toléré\", \"À faire < 3 mois\", \"À faire < 12 mois\", \"OK\"]\nSTATUT_COULEURS = {\"En retard\": \"#C62828\", \"Délai toléré\": \"#F4A259\", \"À faire < 3 mois\": \"#E8A317\",\n                   \"À faire < 12 mois\": \"#2A9D8F\", \"OK\": \"#1E8E5A\"}\nHORIZONS = (12, 24, 36)\nFOURNISSEUR_ABSENT = \"Fournisseur non renseigné\"\n\n_MOIS = {\"JAN\": 1, \"FEB\": 2, \"FEV\": 2, \"MAR\": 3, \"APR\": 4, \"AVR\": 4, \"MAY\": 5, \"MAI\": 5, \"JUN\": 6, \"JUI\": 6, \"JUL\": 7,\n         \"JUIL\": 7, \"AUG\": 8, \"AOU\": 8, \"SEP\": 9, \"OCT\": 10, \"NOV\": 11, \"DEC\": 12}\n_DATE_TEXTE = re.compile(r\"(?<!\\d)(\\d{1,2})\\s*-?\\s*(JAN|FEB|FEV|MAR|APR|AVR|MAY|MAI|JUN|JUIL|JUI|JUL|AUG|AOU|SEP|OCT|NOV|DEC)\"\n                         r\"[A-Z]*\\.?\\s*-?\\s*(\\d{4}|\\d{2})(?!\\d)\")\n_IMMAT = re.compile(r\"^[A-Z]{1,2}-?[A-Z0-9]{3,5}$\")\n\n\n@dataclass(frozen=True)\nclass ParamsPE:\n    cycles: tuple = CYCLES_DEFAUT          # ((classe, composant, mois), …) : n-uplet, utilisable comme clé de cache\n    tolerance_mois: int = 3                # délai toléré après l'échéance avant « En retard »\n    securite_ratio: float = 0.10           # stock de sécurité : part des avions de la flotte\n    securite_min: int = 1                  # … au moins N avions (sauf à 0 % : pas de stock de sécurité)\n    horizon_mois: int = 36\n\n    def cycle(self, classe: str, composant: str) -> int:\n        return next((m for c, p, m in self.cycles if c == classe and p == composant), 0)\n\n\n# --------------------------------------------------------------------------\n# Lecture du fichier PE mousses\n# --------------------------------------------------------------------------\ndef date_texte(texte) -> date | None:\n    \"\"\"Date contenue dans un texte de visite (« … - BOD - 03-FEB-2025 », « 12APR2026 », « 16AOUT2026 », « 11JAN27 »).\"\"\"\n    if not isinstance(texte, str):\n        return None\n    t = texte.upper().replace(\"Û\", \"U\").replace(\"É\", \"E\")\n    for m in _DATE_TEXTE.finditer(t):\n        an = int(m.group(3))\n        try:\n            return date(an + 2000 if an < 100 else an, _MOIS[m.group(2)], int(m.group(1)))\n        except (KeyError, ValueError):\n            continue\n    return None\n\n\ndef date_extraction(nom: str, feuilles=()) -> date | None:\n    \"\"\"Date des âges : JJMMAAAA dans le nom du fichier (PE_MOUSSE_29092026…), sinon None.\"\"\"\n    for m in re.finditer(r\"(?<!\\d)(\\d{2})(\\d{2})(20\\d{2})(?!\\d)\", nom):\n        try:\n            return date(int(m.group(3)), int(m.group(2)), int(m.group(1)))\n        except ValueError:\n            continue\n    return None\n\n\ndef est_fichier_pe(feuilles) -> bool:\n    noms = [sio.normaliser(f) for f in feuilles]\n    return any(\"bottom_foam\" in n for n in noms) or any(\"backrest_foam\" in n for n in noms)\n\n\ndef _lire_feuille(raw: pd.DataFrame, composant: str) -> list[dict]:\n    \"\"\"Une feuille « … FOAM DETAILS » : en-têtes sur 3 lignes (FLEET / AIRCRAFT, classes, AGE (month) …).\"\"\"\n    norm = raw.map(lambda v: sio.normaliser(v) if isinstance(v, str) else \"\")\n    # ligne des sous-en-têtes : celle qui contient « age » ; la ligne au-dessus porte les classes J / W / Y\n    i_age = next((i for i in range(min(10, len(raw))) if norm.iloc[i].str.startswith(\"age\").any()), None)\n    if i_age is None or i_age == 0:\n        return []\n    c_avion = next((j for i in range(i_age) for j in range(raw.shape[1]) if norm.iat[i, j] in (\"aircraft\", \"immat\", \"registration\")), 1)\n    c_flotte = next((j for i in range(i_age) for j in range(raw.shape[1]) if norm.iat[i, j] in (\"fleet\", \"flotte\")), 0)\n    blocs = {}\n    for j in range(raw.shape[1]):\n        cl = str(raw.iat[i_age - 1, j]).strip().upper()\n        if cl in CLASSES and norm.iat[i_age, j].startswith(\"age\"):\n            c_vis = next((k for k in range(j + 1, min(j + 4, raw.shape[1])) if \"execution\" in norm.iat[i_age, k]), None)\n            blocs[cl] = (j, c_vis)\n    lignes, flotte, version = [], None, None\n    for i in range(i_age + 1, len(raw)):\n        c0, avion = raw.iat[i, c_flotte], raw.iat[i, c_avion]\n        avion = str(avion).strip().upper() if isinstance(avion, str) else \"\"\n        if isinstance(c0, str) and c0.strip():\n            if not avion:\n                flotte, version = c0.strip(), None\n                continue\n            version = c0.strip()\n        if not _IMMAT.match(avion):\n            continue\n        for cl, (j_age, j_vis) in blocs.items():\n            age, visite = raw.iat[i, j_age], raw.iat[i, j_vis] if j_vis is not None else None\n            visite = str(visite).strip() if isinstance(visite, str) and visite.strip() else None\n            age_mois, connu = None, True\n            if isinstance(age, str):\n                m = re.search(r\"\\d+(?:[.,]\\d+)?\", age)\n                age_mois, connu = (float(m.group(0).replace(\",\", \".\")) if m else None), False\n            elif age is not None and not pd.isna(age):\n                age_mois = float(age)\n            if age_mois is None and visite is None:\n                continue\n            lignes.append({\"Flotte\": flotte or version, \"Version cabine\": version or flotte, \"Immatriculation\": avion,\n                           \"Classe\": cl, \"Composant\": composant, \"Âge extraction (mois)\": age_mois, \"Âge exact\": connu,\n                           \"Visite liée\": visite, \"Date visite\": date_texte(visite)})\n    return lignes\n\n\ndef lire_pe_mousses(data: bytes, nom: str) -> tuple[pd.DataFrame, date | None]:\n    \"\"\"(lignes immat × classe × composant, date d'extraction) depuis le fichier PE mousses tel qu'il est reçu.\"\"\"\n    xl = sio.ouvrir_excel(data, FICHIER_PE)\n    lignes = []\n    for feuille in xl.sheet_names:\n        n = sio.normaliser(feuille)\n        composant = \"Assise\" if \"bottom\" in n else \"Dossier\" if \"backrest\" in n else None\n        if composant:\n            lignes += _lire_feuille(xl.parse(feuille, header=None, dtype=object), composant)\n    if not lignes:\n        raise sio.FichierIllisible(f\"Fichier {FICHIER_PE} : aucune feuille « BOTTOM FOAM » / « BACKREST FOAM » lisible \"\n                                   f\"(feuilles : {', '.join(xl.sheet_names)}).\")\n    return pd.DataFrame(lignes), date_extraction(nom, xl.sheet_names)\n\n\n# --------------------------------------------------------------------------\n# Calendrier : échéances, statuts, dates prévues\n# --------------------------------------------------------------------------\ndef _mois_entre(a, b) -> int:\n    \"\"\"Nombre de mois calendaires de a à b (b − a).\"\"\"\n    a, b = pd.Timestamp(a), pd.Timestamp(b)\n    return (b.year - a.year) * 12 + b.month - a.month\n\n\ndef calendrier(lignes: pd.DataFrame, date_ref: date, today: date, p: ParamsPE) -> pd.DataFrame:\n    \"\"\"Une ligne par immat × classe × composant soumis à la PE (cycle > 0) : âge, échéance, statut, date prévue.\"\"\"\n    d = lignes.copy()\n    d[\"Cycle PE (mois)\"] = [p.cycle(c, k) for c, k in zip(d[\"Classe\"], d[\"Composant\"])]\n    d = d[d[\"Cycle PE (mois)\"] > 0].copy()\n    ref, auj = pd.Timestamp(date_ref), pd.Timestamp(today)\n    ecart = _mois_entre(ref, auj)\n    d[\"Âge aujourd'hui (mois)\"] = d[\"Âge extraction (mois)\"] + ecart\n    d[\"Dernier remplacement\"] = [ref - pd.DateOffset(months=int(round(a))) if pd.notna(a) else pd.NaT\n                                 for a in d[\"Âge extraction (mois)\"]]\n    d[\"Échéance\"] = [r + pd.DateOffset(months=int(c)) if pd.notna(r) else pd.NaT\n                     for r, c in zip(d[\"Dernier remplacement\"], d[\"Cycle PE (mois)\"])]\n    tol = pd.DateOffset(months=p.tolerance_mois)\n    ech = d[\"Échéance\"]\n    d[\"Statut\"] = np.select(\n        [ech.isna(), ech + tol < auj, ech < auj, ech <= auj + pd.DateOffset(months=3), ech <= auj + pd.DateOffset(months=12)],\n        [\"En retard\", \"En retard\", \"Délai toléré\", \"À faire < 3 mois\", \"À faire < 12 mois\"], default=\"OK\")\n    d[\"Mois avant échéance\"] = [(e - auj).days / 30.44 if pd.notna(e) else np.nan for e in ech]\n    visite = pd.to_datetime(d[\"Date visite\"])\n    d[\"Prochaine visite\"] = visite.where(visite >= auj)\n    debut_mois = auj.to_period(\"M\").start_time\n    d[\"Date prévue\"] = d[\"Prochaine visite\"].fillna(ech.where(ech >= auj)).fillna(debut_mois)\n    d[\"Origine date prévue\"] = np.where(d[\"Prochaine visite\"].notna(), \"Visite planifiée\",\n                                        np.where(ech >= auj, \"Échéance PE\", \"Mois en cours (retard)\"))\n    d[\"Visite après l'échéance\"] = d[\"Prochaine visite\"].notna() & ech.notna() & (d[\"Prochaine visite\"] > ech + tol)\n    d[\"Âge\"] = np.where(d[\"Âge exact\"], \"\", \"âge minimum (« > » dans le fichier)\")\n    d[\"Statut\"] = pd.Categorical(d[\"Statut\"], STATUTS, ordered=True)\n    return d.sort_values([\"Statut\", \"Date prévue\", \"Immatriculation\"]).reset_index(drop=True)\n\n\n# --------------------------------------------------------------------------\n# Pièces : PN de mousse par immat × classe × composant\n# --------------------------------------------------------------------------\ndef composant_mousse(description: str) -> str | None:\n    \"\"\"FOAM BACKREST / FOAM BACK… → Dossier ; FOAM BOTTOM / FOAM BOTT… → Assise ; sinon None.\"\"\"\n    t = re.sub(r\"[^A-Z]+\", \" \", str(description).upper())\n    if re.search(r\"\\bBACK\", t):\n        return \"Dossier\"\n    if re.search(r\"\\b(BOT|BTM)\", t):\n        return \"Assise\"\n    return None\n\n\ndef classe_cabine(area: str) -> str | None:\n    t = str(area).strip().upper()\n    if t in CLASSES:\n        return t\n    for prefixe, cl in ((\"BUS\", \"J\"), (\"AFF\", \"J\"), (\"PRE\", \"W\"), (\"PEY\", \"W\"), (\"ECO\", \"Y\"), (\"CLASSE J\", \"J\"),\n                        (\"CLASSE W\", \"W\"), (\"CLASSE Y\", \"Y\")):\n        if t.startswith(prefixe):\n            return cl\n    return None\n\n\ndef _cle_immat(v) -> str:\n    return re.sub(r\"[^A-Z0-9]\", \"\", str(v).upper())\n\n\ndef pieces_mousses(parts: pd.DataFrame) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"(mousses reconnues : immat, classe, composant, PN, qté par avion ; lignes MOUSSE non reconnues).\"\"\"\n    m = parts[parts[\"equipment\"].str.upper() == \"MOUSSE\"].copy()\n    m[\"Classe\"] = m[\"area\"].map(classe_cabine)\n    m[\"Composant\"] = m[\"description\"].map(composant_mousse)\n    ok = m[\"Classe\"].notna() & m[\"Composant\"].notna()\n    m[\"cle\"] = m[\"registration\"].map(_cle_immat)\n    garde = m[ok].groupby([\"cle\", \"Classe\", \"Composant\", \"pn\"], as_index=False).agg(\n        **{\"Qté par avion\": (\"qty_per_ac\", \"sum\"), \"Désignation\": (\"description\", \"first\"), \"Type avion\": (\"aircraft_type\", \"first\")})\n    return garde, m[~ok][[\"registration\", \"area\", \"pn\", \"description\"]].drop_duplicates()\n\n\n# --------------------------------------------------------------------------\n# Besoins, stock de sécurité, forecast\n# --------------------------------------------------------------------------\ndef evenements(cal: pd.DataFrame, mousses: pd.DataFrame, today: date, horizon: int) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"(remplacements à faire par PN et par mois sur l'horizon ; lignes du calendrier sans PN connu).\"\"\"\n    debut = pd.Timestamp(today).to_period(\"M\").start_time\n    fin = debut + pd.DateOffset(months=horizon)\n    occ = []\n    for imm, cl, comp, prevue, cycle, origine in zip(cal[\"Immatriculation\"], cal[\"Classe\"], cal[\"Composant\"], cal[\"Date prévue\"],\n                                                     cal[\"Cycle PE (mois)\"], cal[\"Origine date prévue\"]):\n        d, k = pd.Timestamp(prevue), 0\n        while d < fin:\n            occ.append((imm, cl, comp, max(d, debut), k, k == 0 and origine == \"Mois en cours (retard)\"))\n            d, k = d + pd.DateOffset(months=int(cycle)), k + 1\n    o = pd.DataFrame(occ, columns=[\"Immatriculation\", \"Classe\", \"Composant\", \"Date\", \"Occurrence\", \"Rattrapage du retard\"])\n    o[\"cle\"] = o[\"Immatriculation\"].map(_cle_immat)\n    o[\"Mois\"] = o[\"Date\"].dt.to_period(\"M\").dt.start_time\n    ev = o.merge(mousses, on=[\"cle\", \"Classe\", \"Composant\"], how=\"inner\")\n    cles_avec_pn = set(zip(mousses[\"cle\"], mousses[\"Classe\"], mousses[\"Composant\"]))\n    sans = cal[[(_cle_immat(i), c, k) not in cles_avec_pn\n                for i, c, k in zip(cal[\"Immatriculation\"], cal[\"Classe\"], cal[\"Composant\"])]]\n    ev = ev.rename(columns={\"pn\": \"PN\", \"Qté par avion\": \"Qté\"}).drop(columns=\"cle\")\n    flotte = cal.drop_duplicates(\"Immatriculation\").set_index(\"Immatriculation\")[[\"Flotte\", \"Version cabine\"]]\n    ev = ev.join(flotte, on=\"Immatriculation\")\n    return ev, sans[[\"Flotte\", \"Immatriculation\", \"Classe\", \"Composant\", \"Statut\"]]\n\n\ndef stock_securite(cal: pd.DataFrame, mousses: pd.DataFrame, p: ParamsPE) -> pd.Series:\n    \"\"\"Par PN : pour chaque flotte, ceil(ratio × avions qui utilisent le PN) (au moins `securite_min`) × qté par avion.\n    Ratio à 0 % : aucun stock de sécurité (le minimum ne s'applique pas).\"\"\"\n    flotte = cal.drop_duplicates(\"Immatriculation\").assign(cle=lambda x: x[\"Immatriculation\"].map(_cle_immat))\n    m = mousses.merge(flotte[[\"cle\", \"Flotte\"]], on=\"cle\", how=\"inner\")\n    if m.empty:\n        return pd.Series(dtype=float)\n    g = m.groupby([\"pn\", \"Flotte\"]).agg(avions=(\"cle\", \"nunique\"), qte=(\"Qté par avion\", \"max\")).reset_index()\n    mini = p.securite_min if p.securite_ratio > 0 else 0\n    g[\"Stock de sécurité\"] = [max(math.ceil(p.securite_ratio * a - 1e-9), mini) * q for a, q in zip(g[\"avions\"], g[\"qte\"])]\n    return g.groupby(\"pn\")[\"Stock de sécurité\"].sum()\n\n\ndef forecast(ev: pd.DataFrame, articles: pd.DataFrame, livraisons_cmd: pd.DataFrame, securite: pd.Series,\n             today: date, horizon: int) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"Calcul mois par mois, par PN : besoin, commandes en cours, livraisons à prévoir, commandes à avancer.\n\n    Les commandes en cours sont déjà passées : elles sont TOUJOURS déduites, quelle que soit leur date promise.\n    À commander sur l'horizon = max(0, besoin + stock de sécurité − stock − commandes en cours) ; les livraisons\n    sont placées le mois où il en faut. Une commande en cours promise APRÈS le mois où elle est nécessaire est\n    signalée « à avancer » (relance fournisseur), au lieu d'être commandée une seconde fois.\n    `articles` : PN (index) → Stock, Prix ; `livraisons_cmd` : PN, Mois, Qté (commandes en cours).\n    Renvoie (tableau long PN × mois, synthèse par PN avec les totaux à 12 / 24 / 36 mois).\n    \"\"\"\n    debut = pd.Timestamp(today).to_period(\"M\").start_time\n    mois = pd.date_range(debut, periods=horizon, freq=\"MS\")\n    pns = sorted(set(ev[\"PN\"]))\n    besoin = ev.groupby([\"PN\", \"Mois\"])[\"Qté\"].sum().unstack(fill_value=0).reindex(index=pns, columns=mois, fill_value=0)\n    cmd = livraisons_cmd[livraisons_cmd[\"PN\"].isin(pns)].copy()\n    cmd[\"Mois\"] = cmd[\"Mois\"].clip(lower=debut)\n    arrivees = cmd.groupby([\"PN\", \"Mois\"])[\"Qté\"].sum().unstack(fill_value=0).reindex(index=pns, columns=mois, fill_value=0)\n    stock = articles.reindex(pns)[\"Stock\"].fillna(0).to_numpy(float)\n    ss = securite.reindex(pns).fillna(0).to_numpy(float)\n    B, A = besoin.to_numpy(float), arrivees.to_numpy(float)\n    en_cmd = cmd.groupby(\"PN\")[\"Qté\"].sum().reindex(pns).fillna(0).to_numpy()\n    proj = stock[:, None] + np.cumsum(A - B, axis=1)          # stock projeté sans nouvelle commande (dates promises réelles)\n    # Nouvelles commandes : stock + TOUTES les commandes en cours comme point de départ, on livre ce qui manque\n    # chaque mois pour rester au stock de sécurité (cumul = besoin + sécurité − stock − commandes en cours).\n    dispo = (stock + en_cmd)[:, None] - np.cumsum(B, axis=1)\n    cumul = np.maximum.accumulate(np.maximum(ss[:, None] - dispo, 0), axis=1)\n    livr = np.diff(cumul, axis=1, prepend=0)\n    # Commandes en cours à avancer : manque restant avec leurs vraies dates, une fois les nouvelles livraisons faites.\n    reste = np.maximum(ss[:, None] - (proj + cumul), 0)\n    a_avancer = np.minimum(reste.max(axis=1), en_cmd)\n    long = pd.DataFrame({\n        \"PN\": np.repeat(pns, len(mois)), \"Mois\": np.tile(mois, len(pns)),\n        \"Besoin\": B.ravel(), \"Arrivées commandes\": A.ravel(), \"Stock projeté sans commande\": proj.ravel(),\n        \"À livrer\": livr.ravel(), \"Stock projeté\": (proj + cumul).ravel(),\n    })\n    synth = pd.DataFrame(index=pd.Index(pns, name=\"PN\"))\n    synth[\"Stock\"] = stock\n    synth[\"En commande\"] = en_cmd\n    synth[\"Stock de sécurité\"] = ss\n    for h in HORIZONS:\n        if h <= len(mois):\n            synth[f\"Besoin {h} mois\"] = B[:, :h].sum(axis=1)\n            synth[f\"À commander {h} mois\"] = livr[:, :h].sum(axis=1)\n    rupture = [mois[np.argmax(row < 0)] if (row < 0).any() else pd.NaT for row in proj]\n    synth[\"Rupture sans commande\"] = rupture\n    synth[\"À avancer (commandes en cours)\"] = a_avancer\n    synth[\"À avancer avant\"] = [mois[np.argmax(row > 0)] if (row > 0).any() else pd.NaT for row in reste]\n    premier = [mois[np.argmax(row > 0)] if (row > 0).any() else pd.NaT for row in B]\n    synth[\"Premier besoin\"] = premier\n    return long, synth.reset_index()\n\n\ndef catalogue_mousses(parts: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"PN de mousse au format du catalogue textile : sert à filtrer État du stock et commandes sur ces PN.\"\"\"\n    m = parts[parts[\"equipment\"].str.upper() == \"MOUSSE\"].drop_duplicates(\"pn\")\n    ccn = m[\"ccn\"].replace(\"\", np.nan).to_numpy() if \"ccn\" in m else np.nan\n    return pd.DataFrame({\"PN\": m[\"pn\"].to_numpy(), \"Equipement\": \"MOUSSE\", \"Description\": m[\"description\"].to_numpy(),\n                         \"CCN\": ccn})  # CCN : les PN écrits autrement dans l'État du stock sont aussi retrouvés\n\n\ndef completer_fournisseurs(art: pd.DataFrame, stock_lignes: pd.DataFrame | None, pns, ccn_par_pn=None) -> pd.DataFrame:\n    \"\"\"Mousses sans fournisseur (PN introuvable dans la table stock, ou sans nom) : fournisseur lu directement dans\n    l'État du stock (« Résultat ») : CODE FOURNISSEUR, à défaut DERNIER FOURNISSEUR. Recherche par PN\n    (comparé sans espaces, tirets ni points : « 12-345.A » = « 12345A »), puis par CCN (`ccn_par_pn` : CCN de chaque\n    PN, ex. textile_all_parts). Ne change ni le stock ni le prix.\"\"\"\n    pns = list(dict.fromkeys(pns))\n    art = art.reindex(art.index.union(pd.Index(pns), sort=False)) if len(pns) else art\n    if stock_lignes is None or not len(stock_lignes) or \"PN\" not in stock_lignes:\n        return art\n    cle = lambda s: pd.Series(s, dtype=object).astype(str).str.upper().str.replace(r\"[^A-Z0-9]\", \"\", regex=True)  # noqa: E731\n    src = stock_lignes.assign(_k=cle(stock_lignes[\"PN\"]).to_numpy())\n    nom = src[\"DERNIER_FOURNISSEUR\"] if \"DERNIER_FOURNISSEUR\" in src else pd.Series(np.nan, index=src.index)\n    code = src[\"CODE_FOURNISSEUR\"] if \"CODE_FOURNISSEUR\" in src else pd.Series(np.nan, index=src.index)\n    vide = lambda s: s.isna() | s.astype(str).str.strip().isin([\"\", \"nan\", \"None\"])  # noqa: E731\n    libelle = code.astype(object).where(~vide(code), nom.where(~vide(nom)))  # code fournisseur, à défaut le nom\n    avec = src.assign(_f=libelle.to_numpy()).dropna(subset=[\"_f\"])\n    connus = avec.drop_duplicates(\"_k\").set_index(\"_k\")[\"_f\"]\n    manque = art[\"Fournisseur\"].isna() | (art[\"Fournisseur\"] == FOURNISSEUR_ABSENT)\n    art.loc[manque, \"Fournisseur\"] = cle(art.index[manque]).map(connus).to_numpy()\n    # Toujours rien : même CCN dans le Résultat (PN écrit autrement, ou autre PN de la même pièce)\n    manque = art[\"Fournisseur\"].isna() | (art[\"Fournisseur\"] == FOURNISSEUR_ABSENT)\n    if manque.any() and ccn_par_pn is not None and \"CCN\" in avec:\n        from core.textile import cle_ccn\n        par_ccn = avec.assign(_c=cle_ccn(avec[\"CCN\"]).to_numpy()).dropna(subset=[\"_c\"]).drop_duplicates(\"_c\").set_index(\"_c\")[\"_f\"]\n        ccn = cle_ccn(pd.Series(pd.Series(ccn_par_pn).reindex(art.index[manque]).to_numpy(), dtype=object))\n        art.loc[manque, \"Fournisseur\"] = ccn.map(par_ccn).to_numpy()\n    return art\n\n\ndef articles(pbi: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Stock, prix et fournisseur par PN (index), depuis la table stock du Textile (voir textile.construire_tables).\"\"\"\n    from core.prevision import fournisseur_prevision  # même règle que la Prévision : code fournisseur, à défaut le nom\n    if pbi.empty:\n        return pd.DataFrame(columns=[\"Stock\", \"Prix\", \"Fournisseur\"])\n    a = pd.DataFrame({\"Stock\": pd.to_numeric(pbi[\"QTE SUR ÉTAGÈRE\"], errors=\"coerce\").to_numpy(),\n                      \"Prix\": tf.prix_unitaire(pbi).to_numpy(),  # PMP, à défaut dernier prix d'achat\n                      \"Fournisseur\": fournisseur_prevision(pbi).to_numpy()}, index=pbi[\"PNR\"].to_numpy())\n    return a[~a.index.duplicated()]\n\n\nMOIS_COURTS = [\"janv.\", \"févr.\", \"mars\", \"avr.\", \"mai\", \"juin\", \"juil.\", \"août\", \"sept.\", \"oct.\", \"nov.\", \"déc.\"]\n\n\ndef libelles_annees(mois) -> dict[int, str]:\n    \"\"\"{année : libellé} des mois de l'horizon ; année incomplète : « 2026 (oct.–déc.) ».\"\"\"\n    mois = pd.DatetimeIndex(mois)\n    out = {}\n    for y in sorted(set(mois.year)):\n        m = mois[mois.year == y].month\n        if len(m) == 12:\n            out[y] = str(y)\n        else:\n            a, b = MOIS_COURTS[m.min() - 1], MOIS_COURTS[m.max() - 1]\n            out[y] = f\"{y} ({a})\" if a == b else f\"{y} ({a}–{b})\"\n    return out\n\n\ndef par_annee(long: pd.DataFrame, mois, index: str = \"PN\", valeur: str = \"À livrer\") -> pd.DataFrame:\n    \"\"\"Tableau `index` × année (colonnes libellées par libelles_annees) de `valeur`, sur les mois donnés.\"\"\"\n    noms = libelles_annees(mois)\n    d = long[long[\"Mois\"].isin(pd.DatetimeIndex(mois))]\n    t = d.assign(Année=d[\"Mois\"].dt.year).pivot_table(index=index, columns=\"Année\", values=valeur, aggfunc=\"sum\", fill_value=0)\n    return t.reindex(columns=list(noms), fill_value=0).rename(columns=noms)\n\n\ndef livraisons_commandes(o: pd.DataFrame, today: date) -> pd.DataFrame:\n    \"\"\"Commandes en cours (reste à livrer) par PN et mois de livraison (promise, sinon demandée, sinon tout de suite).\"\"\"\n    if o is None or o.empty:\n        return pd.DataFrame(columns=[\"PN\", \"Mois\", \"Qté\"])\n    d = o[o[\"Qte restante\"].fillna(0) > 0]\n    date_l = d[\"Date livraison promise\"].fillna(d[\"Date livraison demandee\"]).fillna(pd.Timestamp(today))\n    return pd.DataFrame({\"PN\": d[\"PNR\"].to_numpy(), \"Mois\": date_l.dt.to_period(\"M\").dt.start_time.to_numpy(),\n                         \"Qté\": d[\"Qte restante\"].to_numpy(float)})\n\n\ndef planning_pe(lignes: pd.DataFrame, date_ref: date, parts: pd.DataFrame, articles: pd.DataFrame, o: pd.DataFrame,\n                today: date, p: ParamsPE) -> dict:\n    \"\"\"Calcul complet : calendrier, événements, forecast (long + synthèse PN), contrôles de cohérence.\"\"\"\n    cal = calendrier(lignes, date_ref, today, p)\n    mousses, non_reconnues = pieces_mousses(parts) if len(parts) else (pd.DataFrame(), pd.DataFrame())\n    if mousses.empty:  # sans PN de mousse : avancement de la PE seulement, pas de forecast\n        vide = pd.DataFrame()\n        return {\"cal\": cal, \"ev\": vide, \"long\": vide, \"synth\": vide, \"sans_pn\": vide, \"non_reconnues\": non_reconnues,\n                \"pn_absents_stock\": [], \"date_ref\": date_ref}\n    ev, sans_pn = evenements(cal, mousses, today, p.horizon_mois)\n    ss = stock_securite(cal, mousses, p)\n    long, synth = forecast(ev, articles, livraisons_commandes(o, today), ss, today, p.horizon_mois)\n    if len(synth) and \"ccn\" in parts:  # CCN à côté du PN dans les tableaux\n        ccn = parts.assign(_c=parts[\"ccn\"].replace(\"\", np.nan)).dropna(subset=[\"_c\"]).drop_duplicates(\"pn\").set_index(\"pn\")[\"_c\"]\n        synth.insert(1, \"CCN\", synth[\"PN\"].map(ccn))\n    infos = ev.groupby(\"PN\").agg(**{\"Désignation\": (\"Désignation\", \"first\"), \"Composant\": (\"Composant\", \"first\"),\n                                    \"Classes\": (\"Classe\", lambda s: \" / \".join(sorted(set(s)))),\n                                    \"Flottes\": (\"Flotte\", lambda s: \" / \".join(sorted(set(map(str, s))))),\n                                    \"Avions\": (\"Immatriculation\", \"nunique\")}) if len(ev) else \\\n        pd.DataFrame(columns=[\"Désignation\", \"Composant\", \"Classes\", \"Flottes\", \"Avions\"])\n    art = articles.reindex(synth[\"PN\"])\n    synth = synth.join(infos, on=\"PN\")\n    synth[\"Fournisseur\"] = art[\"Fournisseur\"].fillna(FOURNISSEUR_ABSENT).to_numpy()\n    synth[\"Prix unitaire (€)\"] = art[\"Prix\"].to_numpy()\n    for h in HORIZONS:\n        if f\"À commander {h} mois\" in synth:\n            synth[f\"Valeur {h} mois (€)\"] = synth[f\"À commander {h} mois\"] * synth[\"Prix unitaire (€)\"].fillna(0)\n    long = long.merge(synth[[\"PN\", \"Désignation\", \"Composant\", \"Fournisseur\", \"Prix unitaire (€)\"]], on=\"PN\", how=\"left\")\n    long[\"Valeur à livrer (€)\"] = long[\"À livrer\"] * long[\"Prix unitaire (€)\"].fillna(0)\n    absents = sorted(set(synth[\"PN\"]) - set(articles.index[articles[\"Stock\"].notna()]))\n    return {\"cal\": cal, \"ev\": ev, \"long\": long, \"synth\": synth, \"sans_pn\": sans_pn, \"non_reconnues\": non_reconnues,\n            \"pn_absents_stock\": absents, \"date_ref\": date_ref}\n", "app/core/pe2026.py": "\"\"\"PE mousses de l'année : objectif du fichier Besoin Prod × État du stock × Commandes (SAP), par CCN.\n\nRepris du Streamlit « Pilotage Politique d'entretien Mousse » (legacy) :\n- par CCN : besoin de l'année, stock, en commande, écart, quantité à demander (PR), action ;\n- par type d'avion × classe : avions faisables avec le stock, à réception des commandes, à approvisionner ;\n- avions restant à traiter : recalculés avec le fichier PE mousses (remplacements faits depuis le 1er janvier).\n\nFonctions pures (testables sans Streamlit).\n\"\"\"\n\nfrom datetime import date\n\nimport numpy as np\nimport pandas as pd\n\nfrom core import io as sio\nfrom core import pe\nfrom core import transforms as tf\n\nFICHIER_BESOIN = \"Besoin Prod mousses\"\n\nACTIONS = [\"PR à émettre (aucune commande)\", \"PR complémentaire (commandes insuffisantes)\",\n           \"À réceptionner (commandes en cours)\", \"Couvert par le stock\"]\n# Mêmes couleurs dans tous les graphes : vert = couvert par le stock, bleu = couvert à réception des commandes en cours,\n# orange = à coter (pas de prix), rouge = à approvisionner (à commander). Jamais de rouge sur ce que le stock couvre.\nVERT, BLEU, ORANGE, ROUGE = \"#1E8E5A\", \"#2B6CB0\", \"#E8590C\", \"#A61B1B\"  # palette de core/style.py\nACTION_COULEURS = dict(zip(ACTIONS, [ROUGE, \"#E57373\", BLEU, VERT]))\nAVANCEMENT = [\"Complets maintenant\", \"Complets à réception\", \"À coter\", \"À approvisionner\"]\nAVANCEMENT_COULEURS = dict(zip(AVANCEMENT, [VERT, BLEU, ORANGE, ROUGE]))\nSEGMENTS_CCN = [\"Avions couverts par le stock\", \"Avions couverts à réception\", \"Avions manquants\", \"Au-delà de l'objectif\"]\nRESTANT_AUTO, RESTANT_FICHIER = \"auto\", \"fichier\"\nSTATUTS_CCN = [\"Stock suffisant\", \"Couvert à réception\", \"À coter\", \"À approvisionner\"]\n\n\ndef code_ccn(serie: pd.Series) -> pd.Series:\n    \"\"\"CCN en texte sans décimale (1501513.0 → « 1501513 »).\"\"\"\n    return sio.texte(serie).str.replace(r\"\\.0$\", \"\", regex=True)\n\n\n# --------------------------------------------------------------------------\n# Lecture du fichier Besoin Prod (feuille « QUOTE en euro »)\n# --------------------------------------------------------------------------\ndef lire_besoin_prod(data: bytes, nom: str = FICHIER_BESOIN):\n    \"\"\"Une ligne par type d'avion × classe × CCN. Renvoie (lignes, feuille).\n\n    Colonnes utilisées : A/C (type d'avion), Flotte, NB_AC, NB_AC PE RESTANT, Area (classe), CCN,\n    P/N OEM Seat Supplier, Seat Supplier, Description, Qty per A/C, prix (P.U forecast PE / P.U OEM).\n    \"\"\"\n    xl = sio.ouvrir_excel(data, FICHIER_BESOIN)\n    feuille, entete = sio.choisir_feuille(xl, [\"ccn\", \"qty per a/c\", \"nb_ac\"], feuille_preferee=\"QUOTE en euro\")\n    df = sio.lire_feuille(xl, feuille, entete)\n    col = {\n        \"type\": sio.trouver_colonne(df, \"a/c\", exact=True),\n        \"flotte\": sio.trouver_colonne(df, \"flotte\", exact=True),\n        \"nb\": sio.trouver_colonne(df, \"nb_ac\", exact=True),\n        \"restant\": sio.trouver_colonne(df, \"nb_ac pe restant\"),\n        \"area\": sio.trouver_colonne(df, \"area\", exact=True) or sio.trouver_colonne(df, \"classe\", \"area\"),\n        \"ccn\": sio.trouver_colonne(df, \"ccn\", exact=True),\n        \"pn\": sio.trouver_colonne(df, \"p/n oem seat supplier\", \"p/n oem\"),\n        \"fournisseur\": sio.trouver_colonne(df, \"seat supplier\", exact=True),\n        \"desc\": sio.trouver_colonne(df, \"description\", exact=True),\n        \"qte\": sio.trouver_colonne(df, \"qty per a/c\"),\n        \"pu_pe\": sio.trouver_colonne(df, \"p.u forecast pe\"),\n        \"pu_oem\": sio.trouver_colonne(df, \"p.u oem\"),\n    }\n    for cle, libelle in [(\"type\", \"A/C\"), (\"ccn\", \"CCN\"), (\"qte\", \"Qty per A/C\"), (\"nb\", \"NB_AC\"), (\"area\", \"Area\")]:\n        if col[cle] is None:\n            raise sio.ColonneIntrouvable(libelle, FICHIER_BESOIN, feuille, df.columns)\n\n    def num(c):\n        return sio.nombre(df[col[c]]) if col[c] else pd.Series(np.nan, index=df.index)\n\n    def txt(c):\n        return sio.texte(df[col[c]]) if col[c] else pd.Series(np.nan, index=df.index, dtype=object)\n\n    out = pd.DataFrame({\n        \"Type avion\": txt(\"type\"), \"Flotte\": txt(\"flotte\"), \"Classe\": txt(\"area\").str.upper(),\n        \"CCN\": code_ccn(df[col[\"ccn\"]]), \"PN\": sio.cle_pn(df[col[\"pn\"]]) if col[\"pn\"] else np.nan,\n        \"Fournisseur\": txt(\"fournisseur\"), \"Désignation\": txt(\"desc\"),\n        \"Qté par avion\": num(\"qte\").fillna(0), \"NB_AC\": num(\"nb\").fillna(0).astype(int),\n        \"Restant fichier\": num(\"restant\"), \"PU devis (€)\": num(\"pu_pe\").fillna(num(\"pu_oem\")),\n    })\n    out[\"Composant\"] = out[\"Désignation\"].map(pe.composant_mousse)\n    out = out[out[\"CCN\"].notna() & out[\"Type avion\"].notna()].reset_index(drop=True)\n    if out.empty:\n        raise sio.FichierIllisible(f\"Fichier {FICHIER_BESOIN} : aucune ligne avec un CCN et un type d'avion (A/C).\")\n    return out, feuille\n\n\n# --------------------------------------------------------------------------\n# Avions restant à traiter : recalcul avec le fichier PE mousses\n# --------------------------------------------------------------------------\ndef rattacher_avions(bp: pd.DataFrame, parts: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Type d'avion (A/C du Besoin Prod) de chaque immatriculation de textile_all_parts.\n\n    Aucun fichier ne relie directement immatriculation et type d'avion : on compare les CCN de mousses\n    de chaque avion (par classe) à ceux de chaque type ; le type qui en partage le plus est retenu.\n    Renvoie Immatriculation, cle, Type avion, CCN communs, Ambigu.\n    \"\"\"\n    vide = pd.DataFrame(columns=[\"Immatriculation\", \"cle\", \"Type avion\", \"CCN communs\", \"Ambigu\"])\n    if parts is None or parts.empty or \"ccn\" not in parts:\n        return vide\n    m = parts[parts[\"equipment\"].astype(str).str.upper() == \"MOUSSE\"]\n    m = pd.DataFrame({\"Immatriculation\": m[\"registration\"].astype(str), \"Classe\": m[\"area\"].astype(str).str.strip().str.upper(),\n                      \"CCN\": code_ccn(m[\"ccn\"])}).dropna().drop_duplicates()\n    if m.empty:\n        return vide\n    types = bp[[\"Type avion\", \"Classe\", \"CCN\"]].drop_duplicates()\n    commun = m.merge(types, on=[\"Classe\", \"CCN\"]).groupby([\"Immatriculation\", \"Type avion\"]).size().rename(\"CCN communs\")\n    if commun.empty:\n        return vide\n    commun = commun.reset_index().sort_values([\"Immatriculation\", \"CCN communs\", \"Type avion\"], ascending=[True, False, True])\n    meilleur = commun.groupby(\"Immatriculation\")[\"CCN communs\"].transform(\"max\")\n    ex_aequo = commun[commun[\"CCN communs\"] == meilleur].groupby(\"Immatriculation\").size()\n    out = commun.drop_duplicates(\"Immatriculation\").copy()\n    out[\"Ambigu\"] = out[\"Immatriculation\"].map(ex_aequo).fillna(1) > 1\n    out[\"cle\"] = out[\"Immatriculation\"].map(pe._cle_immat)\n    return out[[\"Immatriculation\", \"cle\", \"Type avion\", \"CCN communs\", \"Ambigu\"]].reset_index(drop=True)\n\n\ndef remplaces_depuis(cal: pd.DataFrame, debut: date) -> pd.DataFrame:\n    \"\"\"Éléments (immat, classe, composant) dont la mousse a été remplacée depuis `debut` (âge exact du fichier PE).\"\"\"\n    if cal is None or cal.empty:\n        return pd.DataFrame(columns=[\"cle\", \"Classe\", \"Composant\"])\n    fait = cal[cal[\"Âge exact\"] & (cal[\"Dernier remplacement\"] >= pd.Timestamp(debut))]\n    return pd.DataFrame({\"cle\": fait[\"Immatriculation\"].map(pe._cle_immat), \"Classe\": fait[\"Classe\"].astype(str),\n                         \"Composant\": fait[\"Composant\"].astype(str)}).drop_duplicates()\n\n\ndef avions_restants(bp: pd.DataFrame, rattachement: pd.DataFrame, faits: pd.DataFrame, mode: str = RESTANT_AUTO) -> pd.DataFrame:\n    \"\"\"Ajoute à `bp` : Avions rattachés, Remplacés cette année, Restant calculé, Avions restants (retenu), Source restant.\n\n    Restant calculé = NB_AC − avions du type déjà remplacés depuis le 1er janvier (classe et élément de la ligne),\n    seulement si des avions du type sont rattachés et l'élément reconnu (assise / dossier).\n    Mode « auto » : restant calculé, sinon NB_AC PE RESTANT du fichier, sinon NB_AC.\n    Mode « fichier » : NB_AC PE RESTANT du fichier, sinon NB_AC (règle du Streamlit d'origine).\n    \"\"\"\n    b = bp.copy()\n    nb_rattaches = rattachement.groupby(\"Type avion\").size() if len(rattachement) else pd.Series(dtype=int)\n    b[\"Avions rattachés\"] = b[\"Type avion\"].map(nb_rattaches).fillna(0).astype(int)\n    if len(rattachement) and len(faits):\n        f = faits.merge(rattachement[[\"cle\", \"Type avion\"]], on=\"cle\")\n        n_faits = f.groupby([\"Type avion\", \"Classe\", \"Composant\"]).size()\n        cles = list(zip(b[\"Type avion\"], b[\"Classe\"].map(pe.classe_cabine), b[\"Composant\"]))\n        b[\"Remplacés cette année\"] = [int(n_faits.get(k, 0)) for k in cles]\n    else:\n        b[\"Remplacés cette année\"] = 0\n    calculable = (b[\"Avions rattachés\"] > 0) & b[\"Composant\"].notna() & b[\"Classe\"].map(pe.classe_cabine).notna()\n    b[\"Restant calculé\"] = np.where(calculable, (b[\"NB_AC\"] - b[\"Remplacés cette année\"]).clip(lower=0), np.nan)\n    fichier = b[\"Restant fichier\"].where(b[\"Restant fichier\"].notna(), b[\"NB_AC\"])\n    if mode == RESTANT_FICHIER:\n        b[\"Avions restants\"], b[\"Source restant\"] = fichier, np.where(b[\"Restant fichier\"].notna(), \"Fichier\", \"NB_AC (restant vide)\")\n    else:\n        b[\"Avions restants\"] = b[\"Restant calculé\"].where(calculable, fichier)\n        b[\"Source restant\"] = np.where(calculable, \"Calculé (PE mousses)\",\n                                       np.where(b[\"Restant fichier\"].notna(), \"Fichier\", \"NB_AC (restant vide)\"))\n    b[\"Avions restants\"] = b[\"Avions restants\"].fillna(0).astype(int)\n    b[\"Besoin\"] = (b[\"Qté par avion\"] * b[\"Avions restants\"]).round().astype(int)\n    return b\n\n\n# --------------------------------------------------------------------------\n# Analyse par CCN\n# --------------------------------------------------------------------------\ndef _joindre(s: pd.Series) -> str:\n    vals = [str(v).strip() for v in s if pd.notna(v) and str(v).strip()]\n    return \", \".join(dict.fromkeys(vals))\n\n\ndef ccn_commandes(cmd: pd.DataFrame | None, stock: pd.DataFrame, bp: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Commandes ouvertes (reste à livrer > 0) avec leur CCN : colonne CCN du fichier Commandes si elle existe,\n    sinon retrouvé par le PN (État du stock, puis Besoin Prod).\"\"\"\n    if cmd is None or cmd.empty:\n        return pd.DataFrame(columns=[\"CCN\", \"PN\", \"Commande\", \"Fournisseur\", \"PSD_effective\", \"Qty_restant\"])\n    c = cmd[cmd[\"Qty_restant\"] > 0].copy()\n    if \"Code_fournisseur_cmd\" in cmd and len(c):  # fournisseur = code fournisseur (code du PN à défaut), sinon le nom\n        c[\"Fournisseur\"] = tf.fournisseur_par_code(cmd).loc[c.index]\n    par_pn = pd.concat([stock.dropna(subset=[\"CCN\"]).drop_duplicates(\"PN\").set_index(\"PN\")[\"CCN\"],\n                        bp.dropna(subset=[\"PN\"]).drop_duplicates(\"PN\").set_index(\"PN\")[\"CCN\"]])\n    par_pn = par_pn[~par_pn.index.duplicated()]\n    propre = c[\"CCN_cmd\"] if \"CCN_cmd\" in c else pd.Series(np.nan, index=c.index)\n    c[\"CCN\"] = propre.where(propre.notna(), c[\"PN\"].map(par_pn))\n    return c[c[\"CCN\"].notna()]\n\n\ndef analyse_ccn(b: pd.DataFrame, stock: pd.DataFrame, cmd: pd.DataFrame | None) -> pd.DataFrame:\n    \"\"\"Une ligne par CCN : besoin, stock, en commande, couverture, écart, à demander (PR), valeur, action.\n\n    Stock par CCN = max de QTE SUR ÉTAGÈRE des lignes du CCN (niveau recopié sur chaque PNR, règle d'origine).\n    En commande = reste à livrer des commandes (SAP) ; sans fichier Commandes : QTE EN CDE de l'État du stock.\n    Prix = PMP de l'État du stock (à défaut son dernier prix d'achat), à défaut le prix du devis (Besoin Prod) ;\n    sans prix : « à coter ».\n    \"\"\"\n    pv = b.groupby(\"CCN\").agg(**{\n        \"PN\": (\"PN\", _joindre), \"Désignation\": (\"Désignation\", \"first\"), \"Fournisseur devis\": (\"Fournisseur\", \"first\"),\n        \"Types avion\": (\"Type avion\", _joindre), \"Nb types\": (\"Type avion\", \"nunique\"), \"Classes\": (\"Classe\", _joindre),\n        \"Besoin\": (\"Besoin\", \"sum\"), \"PU devis (€)\": (\"PU devis (€)\", \"max\"),\n    }).reset_index()\n    s = stock.dropna(subset=[\"CCN\"])\n    st_ = s.groupby(\"CCN\").agg(**{\"Stock\": (\"QTY_STOCK\", \"max\"), \"En cde (stock)\": (\"QTY_CDE\", \"max\"),\n                                   \"PNR stock\": (\"PN\", _joindre)})\n    if \"PMP\" in s or \"Dernier PU (achat) Euros\" in s:\n        st_[\"PU stock (€)\"] = s.assign(_p=tf.prix_unitaire(s)).groupby(\"CCN\")[\"_p\"].max()\n    m = pv.merge(st_.reset_index(), on=\"CCN\", how=\"left\")\n    m[\"Dans l'État du stock\"] = m[\"CCN\"].isin(set(s[\"CCN\"]))\n    c = ccn_commandes(cmd, stock, b)\n    if cmd is not None:\n        g = c.groupby(\"CCN\").agg(**{\"En commande\": (\"Qty_restant\", \"sum\"), \"Nb commandes\": (\"Commande\", \"nunique\"),\n                                    \"Commandes\": (\"Commande\", _joindre), \"Fournisseur\": (\"Fournisseur\", \"first\"),\n                                    \"Prochaine livraison\": (\"PSD_effective\", \"min\"), \"Dernière livraison\": (\"PSD_effective\", \"max\")})\n        m = m.merge(g.reset_index(), on=\"CCN\", how=\"left\")\n    else:\n        m[\"En commande\"] = m[\"En cde (stock)\"]\n        for k in [\"Nb commandes\", \"Commandes\", \"Fournisseur\", \"Prochaine livraison\", \"Dernière livraison\"]:\n            m[k] = np.nan\n    m[\"Fournisseur\"] = m[\"Fournisseur\"].fillna(m[\"Fournisseur devis\"])\n    for k in [\"Stock\", \"En commande\", \"Nb commandes\"]:\n        m[k] = m[k].fillna(0)\n    m[\"Commandes\"] = m[\"Commandes\"].fillna(\"\")\n    m[\"Couverture\"] = m[\"Stock\"] + m[\"En commande\"]\n    m[\"Écart\"] = m[\"Besoin\"] - m[\"Couverture\"]\n    m[\"À demander (PR)\"] = m[\"Écart\"].clip(lower=0)\n    m[\"Taux de couverture (%)\"] = np.where(m[\"Besoin\"] > 0, (m[\"Couverture\"] / m[\"Besoin\"] * 100).round(0), np.nan)\n    pu = m[\"PU stock (€)\"] if \"PU stock (€)\" in m else pd.Series(np.nan, index=m.index)\n    m[\"PU (€)\"] = pu.where(pu > 0, m[\"PU devis (€)\"]).fillna(0)\n    m[\"À coter\"] = (m[\"PU (€)\"] <= 0) & (m[\"Besoin\"] > 0)\n    m[\"Valeur stock (€)\"] = m[\"Stock\"] * m[\"PU (€)\"]\n    m[\"Valeur en commande (€)\"] = m[\"En commande\"] * m[\"PU (€)\"]\n    m[\"Valeur à commander (€)\"] = m[\"À demander (PR)\"] * m[\"PU (€)\"]\n    m[\"Valeur du besoin (€)\"] = m[\"Besoin\"] * m[\"PU (€)\"]\n    commande = m[\"En commande\"] > 0\n    m[\"Action\"] = np.select([(m[\"Écart\"] > 0) & ~commande, m[\"Écart\"] > 0, m[\"Stock\"] < m[\"Besoin\"]], ACTIONS[:3], ACTIONS[3])\n    m[\"Priorité\"] = m[\"Action\"].map({a: i + 1 for i, a in enumerate(ACTIONS)})\n    return m.sort_values([\"Priorité\", \"À demander (PR)\"], ascending=[True, False]).reset_index(drop=True)\n\n\n# --------------------------------------------------------------------------\n# Avions faisables (stock commun réparti entre les types d'avion)\n# --------------------------------------------------------------------------\ndef repartir_detail(blocs: list[tuple], dispo: dict) -> tuple[dict, dict]:\n    \"\"\"(avions complets par bloc, quantité restante par CCN) — voir repartir.\"\"\"\n    reste = {k: float(v) for k, v in dispo.items()}\n    fait = {cle: 0 for cle, _, _ in blocs}\n    actifs = [(cle, obj, {c: q for c, q in besoins.items() if q > 0}) for cle, obj, besoins in blocs if obj > 0 and besoins]\n    while True:\n        possibles = [(fait[cle] / obj, -obj, i) for i, (cle, obj, besoins) in enumerate(actifs)\n                     if fait[cle] < obj and all(reste.get(c, 0) >= q for c, q in besoins.items())]\n        if not possibles:\n            return fait, reste\n        cle, _, besoins = actifs[min(possibles)[2]]\n        for c, q in besoins.items():\n            reste[c] -= q\n        fait[cle] += 1\n\n\ndef repartir(blocs: list[tuple], dispo: dict) -> dict:\n    \"\"\"Avions complets par bloc, le stock d'un CCN commun étant partagé entre les blocs.\n\n    `blocs` : [(clé, objectif, {CCN: qté par avion})] ; `dispo` : {CCN: quantité}. Un avion n'est équipé que si\n    tous les CCN du bloc sont disponibles. À chaque tour, l'avion suivant va au bloc le moins avancé\n    (avions équipés / objectif) : la répartition reste équilibrée entre types d'avion.\n    \"\"\"\n    return repartir_detail(blocs, dispo)[0]\n\n\ndef _attribuer(d: pd.DataFrame, fait: dict, reste: dict) -> pd.Series:\n    \"\"\"Quantité d'un CCN attribuée à chaque bloc (type × classe) : ce qu'ont consommé ses avions complets, plus une\n    part du reste du CCN au prorata de ce qu'il manque encore à chaque bloc. Un CCN propre à un bloc lui revient en\n    entier. Ainsi le détail par CCN concorde avec les avions complets du bloc.\"\"\"\n    cle = list(zip(d[\"Type avion\"], d[\"Classe\"]))\n    fait_l = np.array([fait.get(k, 0) for k in cle], dtype=float)\n    q = d[\"Qté par avion\"].to_numpy(float)\n    consomme = fait_l * q\n    a_venir = np.maximum(d[\"Objectif\"].to_numpy(float) - fait_l, 0) * q\n    total_a_venir = pd.Series(a_venir, index=d.index).groupby(d[\"CCN\"]).transform(\"sum\").to_numpy()\n    nb = d.groupby(\"CCN\")[\"CCN\"].transform(\"size\").to_numpy()\n    part = np.where(total_a_venir > 0, a_venir / np.where(total_a_venir > 0, total_a_venir, 1), 1 / nb)\n    return pd.Series(consomme + np.array([reste.get(c, 0.0) for c in d[\"CCN\"]]) * part, index=d.index)\n\n\ndef avions_faisables(b: pd.DataFrame, m: pd.DataFrame) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"(blocs, détail) — blocs : une ligne par type d'avion × classe ; détail : une ligne par bloc × CCN.\n\n    Objectif = avions restant à traiter. Complets maintenant = répartition du stock ; complets à réception =\n    répartition du stock + commandes, moins les complets maintenant ; le reste est à coter (seuls des CCN sans prix\n    manquent) ou à approvisionner. Détail : avions couvrables par chaque CCN avec la quantité attribuée au bloc\n    (un CCN commun à plusieurs blocs est partagé selon la répartition des avions complets, voir _attribuer).\n    \"\"\"\n    d = b.groupby([\"Type avion\", \"Classe\", \"CCN\"], sort=False).agg(**{\n        \"Flotte\": (\"Flotte\", \"first\"), \"Qté par avion\": (\"Qté par avion\", \"first\"), \"Objectif\": (\"Avions restants\", \"max\"),\n        \"Besoin\": (\"Besoin\", \"sum\"), \"PN\": (\"PN\", _joindre), \"Désignation\": (\"Désignation\", \"first\")}).reset_index()\n    info = m.set_index(\"CCN\")\n    d[\"Stock CCN\"] = d[\"CCN\"].map(info[\"Stock\"]).fillna(0)\n    d[\"Couverture CCN\"] = d[\"CCN\"].map(info[\"Couverture\"]).fillna(0)\n    d[\"PU (€)\"] = d[\"CCN\"].map(info[\"PU (€)\"]).fillna(0)\n    d[\"À coter\"] = d[\"CCN\"].map(info[\"À coter\"]).fillna(False).astype(bool)\n    d[\"Types partageant le CCN\"] = d[\"CCN\"].map(info[\"Nb types\"]).fillna(1).astype(int)\n    d[\"Besoin total CCN\"] = d[\"CCN\"].map(info[\"Besoin\"]).fillna(d[\"Besoin\"])\n    d[\"Manque (unités)\"] = d[\"CCN\"].map(info[\"À demander (PR)\"]).fillna(0).astype(int)\n    d[\"CCN couvert\"] = d[\"CCN\"].map(info[\"Écart\"]).fillna(1) <= 0  # stock + commandes ≥ besoin du CCN, tous types confondus\n\n    blocs = d.groupby([\"Type avion\", \"Classe\"], sort=False).agg(**{\n        \"Flotte\": (\"Flotte\", \"first\"), \"Objectif\": (\"Objectif\", \"max\"), \"Nb CCN\": (\"CCN\", \"nunique\")}).reset_index()\n    cles = list(zip(blocs[\"Type avion\"], blocs[\"Classe\"]))\n    besoins = {k: dict(zip(g[\"CCN\"], g[\"Qté par avion\"])) for k, g in d.groupby([\"Type avion\", \"Classe\"], sort=False)}\n    entree = [(k, int(o), besoins.get(k, {})) for k, o in zip(cles, blocs[\"Objectif\"])]\n    maintenant, reste_stock = repartir_detail(entree, info[\"Stock\"].to_dict())\n    avec_cde, reste_couv = repartir_detail(entree, info[\"Couverture\"].to_dict())\n\n    # Détail par CCN : quantité attribuée au bloc, avions couverts, et avions de l'objectif par origine.\n    d[\"Stock\"] = _attribuer(d, maintenant, reste_stock).where(d[\"CCN\"].isin(info.index), 0)\n    d[\"Couverture\"] = _attribuer(d, avec_cde, reste_couv).where(d[\"CCN\"].isin(info.index), 0)\n    q = d[\"Qté par avion\"].where(d[\"Qté par avion\"] > 0)\n    d[\"Avions (stock)\"] = np.floor(d[\"Stock\"] / q + 1e-9).fillna(0).astype(int)\n    d[\"Avions (stock + commandes)\"] = np.maximum(np.floor(d[\"Couverture\"] / q + 1e-9).fillna(0).astype(int), d[\"Avions (stock)\"])\n    obj = d[\"Objectif\"]\n    d[SEGMENTS_CCN[0]] = np.minimum(d[\"Avions (stock)\"], obj)\n    d[SEGMENTS_CCN[1]] = np.minimum(d[\"Avions (stock + commandes)\"], obj) - d[SEGMENTS_CCN[0]]\n    d[SEGMENTS_CCN[2]] = obj - d[SEGMENTS_CCN[0]] - d[SEGMENTS_CCN[1]]\n    d[SEGMENTS_CCN[3]] = (d[\"Avions (stock + commandes)\"] - obj).clip(lower=0)\n    d[\"Statut CCN\"] = np.select([d[\"Avions (stock)\"] >= obj, d[\"Avions (stock + commandes)\"] >= obj, d[\"À coter\"]],\n                                STATUTS_CCN[:3], STATUTS_CCN[3])\n\n    blocs[\"Complets maintenant\"] = [maintenant[k] for k in cles]\n    blocs[\"Complets à réception\"] = [max(avec_cde[k] - maintenant[k], 0) for k in cles]\n    manque = blocs[\"Objectif\"] - blocs[\"Complets maintenant\"] - blocs[\"Complets à réception\"]\n    # Manque dû uniquement à des CCN sans prix (à faire coter avant de commander) : orange ; sinon à approvisionner : rouge.\n    limitants = d[d[\"Avions (stock + commandes)\"] < d[\"Objectif\"]].groupby([\"Type avion\", \"Classe\"])[\"À coter\"].all()\n    que_coter = np.array([bool(limitants.get(k, False)) for k in cles])\n    blocs[\"À coter\"] = np.where(que_coter, manque, 0)\n    blocs[\"À approvisionner\"] = np.where(que_coter, 0, manque)\n    blocs[\"Taux (%)\"] = np.where(blocs[\"Objectif\"] > 0, (blocs[\"Complets maintenant\"] / blocs[\"Objectif\"] * 100).round(0), np.nan)\n    pire = d.sort_values([\"Avions (stock + commandes)\", \"Avions (stock)\"]).drop_duplicates([\"Type avion\", \"Classe\"]) \\\n        .set_index([\"Type avion\", \"Classe\"])\n    blocs[\"CCN limitant\"] = [pire[\"CCN\"].get(k) for k in cles]\n    par_bloc = d.assign(commun=d[\"Types partageant le CCN\"] > 1).groupby([\"Type avion\", \"Classe\"], sort=False).agg(\n        couverts=(\"CCN couvert\", \"sum\"), a_coter=(\"À coter\", \"sum\"), communs=(\"commun\", \"sum\"))\n    blocs[\"CCN communs\"] = [int(par_bloc[\"communs\"].get(k, 0)) for k in cles]\n    blocs[\"CCN couverts\"] = [int(par_bloc[\"couverts\"].get(k, 0)) for k in cles]\n    blocs[\"Tout commandé\"] = blocs[\"CCN couverts\"] == blocs[\"Nb CCN\"]\n    blocs[\"PN à coter\"] = [int(par_bloc[\"a_coter\"].get(k, 0)) for k in cles]\n    return blocs, d\n\n\ndef avions_distincts(blocs: pd.DataFrame) -> int:\n    \"\"\"Nombre d'avions de l'objectif (et non de classes) : par type d'avion, la classe qui en compte le plus.\n\n    L'objectif est suivi par classe (un avion à traiter en J, W et Y compte 3 fois) ; ce total donne l'ordre de\n    grandeur en avions. Exemple : 18 AFR01 en J, 18 en W, 17 en Y → 53 classes, 18 avions.\"\"\"\n    return int(blocs.groupby(\"Type avion\")[\"Objectif\"].max().sum()) if len(blocs) else 0\n\n\ndef date_debut_annee(date_ref: date) -> date:\n    return date(date_ref.year, 1, 1)\n\n\ndef nom_bloc(type_avion: str, classe: str) -> str:\n    return f\"{type_avion} · {classe}\"\n", "app/core/prevision.py": "\"\"\"Prévision de commandes textile, pilotée par la consommation réelle (État du stock « Résultat »).\n\n  1. rythme de consommation de chaque PN : QTE CONSO 12M, 18M et 24M, le plus récent pesant le plus\n     (`tendance_conso`) ; évolution des 12 derniers mois par rapport aux 12 mois d'avant ;\n  2. stock à tenir = le plus grand de : stock minimum par flotte (de quoi équiper 10 % des avions de chaque groupe\n     d'avions, pièces par avion) et stock de sécurité statistique (selon l'irrégularité de la consommation et le délai\n     fournisseur, taux de service visé) ;\n  3. on commande, en tenant compte du délai fournisseur, pour que le stock reste au-dessus du stock à tenir alors que\n     la consommation prévue le fait baisser chaque mois.\nPas de politique d'entretien (PE) ni de sortie de flotte : la PE n'existe pas pour tous les équipements textile.\nFournisseur d'un PN : CODE FOURNISSEUR du Résultat (`fournisseur_prevision`).\n\"\"\"\n\nimport io\nimport re\nfrom dataclasses import dataclass\n\nimport numpy as np\nimport pandas as pd\n\nfrom core import io as sio\nfrom core import textile as tx\nfrom core import transforms as tf\n\nMAX_LT = 24\nRAW_COLS = [\"equipment\", \"aircraft_type\", \"group\", \"registration\", \"area\", \"ccn\", \"pn\", \"description\", \"qty_per_ac\"]\nOBSOLETE = \"Obsolète / supprimé : pas de commande\"  # classe code 3, 8 ou 9 (textile.fin_de_vie)\nHORS = \"Hors prévision (ni flotte ni conso)\"\nSTATUS_ORDER = [\"A commander\", \"A planifier\", \"OK\", \"Dormant / inactif : pas de commande\", OBSOLETE, HORS]\nSTATUS_COLORS = {\"A commander\": \"#A61B1B\", \"A planifier\": \"#DBA100\", \"OK\": \"#1E8E5A\",\n                 \"Dormant / inactif : pas de commande\": \"#7B61C9\", OBSOLETE: \"#5B6478\", HORS: \"#B5BDCB\"}\n# Tendance de consommation : 12 derniers mois comparés aux 12 mois d'avant (± 20 % = stable)\nSEUIL_TENDANCE = 0.20\nTENDANCES = [\"En hausse\", \"Nouveau\", \"Stable\", \"En baisse\", \"Sans conso\", \"Non mesurée\"]\nTENDANCE_COLORS = {\"En hausse\": \"#E8590C\", \"Nouveau\": \"#7B61C9\", \"Stable\": \"#1E8E5A\", \"En baisse\": \"#2B6CB0\",\n                   \"Sans conso\": \"#8A94A6\", \"Non mesurée\": \"#B5BDCB\"}\n# Taux de service visé → coefficient de la loi normale (stock de sécurité)\nZ_SERVICE = {0.90: 1.28, 0.95: 1.65, 0.98: 2.05}\n# Prévision donnée pour les 12, 24 et 36 prochains mois (cumuls), à partir du mois en cours\nPERIODES = (12, 24, 36)\nBLOQUEE = \"Commande bloquée (PN dormant, inactif ou obsolète) (qté)\"\nGROUP_STATUS_ORDER = [\"Sous l'objectif\", \"Couvert si commandes livrées\", \"Objectif atteint\"]\n# Même code couleur que partout : vert = stock, bleu = à réception des commandes, rouge = à commander.\nGROUP_STATUS_COLORS = {\"Sous l'objectif\": \"#A61B1B\", \"Couvert si commandes livrées\": \"#2B6CB0\", \"Objectif atteint\": \"#1E8E5A\"}\nCLASS_ORDER = [\"J\", \"W\", \"Y\"]\nDEFAULT_PE = {\n    \"HOUSSE\": {(\"J\", \"Assise\"): 3, (\"J\", \"Dossier\"): 6, (\"W\", \"Assise\"): 3, (\"W\", \"Dossier\"): 0, (\"Y\", \"Assise\"): 3, (\"Y\", \"Dossier\"): 0},\n    \"MOUSSE\": {(c, p): 3 for c in CLASS_ORDER for p in (\"Assise\", \"Dossier\")},\n}\nFICHIER_PIECES = \"Pièces par avion\"\n\n\n@dataclass(frozen=True)\nclass Params:\n    buffer_ratio: float = 0.10\n    buffer_min: int = 1\n    buffer_on_never: bool = True\n    horizon_months: int = 36                  # = la plus longue des PERIODES (12, 24, 36 mois)\n    lt_default: int = 60\n    lt_basis: str = \"observe\"\n    bfe_delay_months: int = 6\n    assise_kw: str = \"bott, btm, seat, cushion, ottoman, legrest, calfrest, footrest, base\"\n    dossier_kw: str = \"back, headrest, head, neck\"\n    default_component: str = \"Assise\"\n    taux_service: float = 0.95                # stock de sécurité : 95 % des mois sans rupture\n    poids_conso: tuple = (0.5, 0.3, 0.2)      # poids des rythmes 12, 18 et 24 mois\n\n\ndef _norm_str(v):\n    return \"\" if v is None or (not isinstance(v, str) and pd.isna(v)) else str(v).strip()\n\n\ndef _norm_pn(v):\n    return \"\" if v is None or (not isinstance(v, str) and pd.isna(v)) else re.sub(r\"\\s+\", \"\", str(v)).upper()\n\n\n# --------------------------------------------------------------------------\n# Lecture des fichiers « Pièces par avion » et « Planning PE »\n# --------------------------------------------------------------------------\ndef lire_pieces(data: bytes, nom: str) -> pd.DataFrame:\n    \"\"\"CSV ou Excel avec les colonnes equipment, aircraft_type, group, registration, area, ccn, pn, description, qty_per_ac.\"\"\"\n    if nom.lower().endswith(\".csv\"):\n        df = pd.read_csv(io.BytesIO(data), sep=None, engine=\"python\")\n        if set(RAW_COLS) <= set(df.columns):\n            return df\n    else:\n        xl = sio.ouvrir_excel(data, FICHIER_PIECES)\n        for feuille in sorted(xl.sheet_names, key=lambda n: 0 if \"registration\" in n.lower() else 1):\n            df = xl.parse(feuille)\n            if set(RAW_COLS) <= set(df.columns):\n                return df\n    raise sio.FichierIllisible(f\"Fichier {FICHIER_PIECES} : aucune feuille avec les colonnes {', '.join(RAW_COLS)}.\")\n\n\n# --------------------------------------------------------------------------\n# Pièces par avion / groupe\n# --------------------------------------------------------------------------\ndef _group_num(g):\n    m = re.search(r\"(\\d+)\\s*$\", str(g))\n    return int(m.group(1)) if m else 0\n\n\ndef preparer_pieces(raw: pd.DataFrame, p: Params):\n    \"\"\"Nettoie les lignes (par immatriculation), classe Assise/Dossier. Retourne (pièces, flotte par groupe, lignes sans PN).\"\"\"\n    manquantes = [c for c in RAW_COLS if c not in raw.columns]\n    if manquantes:\n        raise sio.ColonneIntrouvable(\", \".join(manquantes), FICHIER_PIECES)\n    d = raw[RAW_COLS].copy()\n    for c in [\"equipment\", \"aircraft_type\", \"group\", \"registration\", \"area\", \"ccn\", \"description\"]:\n        d[c] = d[c].map(_norm_str)\n    d[\"equipment\"] = d[\"equipment\"].str.upper()\n    d[\"registration\"] = d[\"registration\"].str.upper()\n    d[\"pn\"] = d[\"pn\"].map(_norm_pn)\n    d[\"area\"] = d[\"area\"].replace(\"\", \"NA\")\n    d[\"qty_per_ac\"] = pd.to_numeric(d[\"qty_per_ac\"], errors=\"coerce\").fillna(0)\n    fleet = d.groupby([\"equipment\", \"aircraft_type\", \"group\"])[\"registration\"].nunique().rename(\"Avions du groupe\").reset_index()\n    no_pn = d[d[\"pn\"] == \"\"].reset_index(drop=True)\n    d = d[d[\"pn\"] != \"\"].copy()\n    kw = lambda t: \"|\".join(re.escape(k.strip().lower()) for k in t.split(\",\") if k.strip())  # noqa: E731\n    desc = d[\"description\"].str.lower()\n    k_dos, k_ass = kw(p.dossier_kw), kw(p.assise_kw)\n    is_dos = desc.str.contains(k_dos, regex=True) if k_dos else pd.Series(False, index=d.index)\n    is_ass = desc.str.contains(k_ass, regex=True) if k_ass else pd.Series(False, index=d.index)\n    seat = d[\"equipment\"].isin([\"HOUSSE\", \"MOUSSE\"])\n    d[\"Composant\"] = np.where(~seat, \"Ensemble\", np.where(is_dos, \"Dossier\", np.where(is_ass, \"Assise\", p.default_component)))\n    return d.reset_index(drop=True), fleet, no_pn\n\n\ndef rattacher_pieces(parts: pd.DataFrame, pbi: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Pièces par avion dont le PN n'existe pas sous ce nom dans l'État du stock : rattachées au PN du stock de même\n    CCN (celui qui a le plus de stock). Sans effet si le PN est déjà connu ou si le CCN est inconnu.\"\"\"\n    if not len(parts) or \"CCN\" not in pbi or \"ccn\" not in parts:\n        return parts\n    par_ccn = (pbi.assign(_c=tx.cle_ccn(pbi[\"CCN\"]), _s=pd.to_numeric(pbi[\"QTE SUR ÉTAGÈRE\"], errors=\"coerce\").fillna(0))\n               .dropna(subset=[\"_c\"]).sort_values(\"_s\", ascending=False, kind=\"stable\").drop_duplicates(\"_c\").set_index(\"_c\")[\"PNR\"])\n    inconnu = ~parts[\"pn\"].isin(set(pbi[\"PNR\"]))\n    via = tx.cle_ccn(parts[\"ccn\"].replace(\"\", np.nan)).map(par_ccn)\n    parts = parts.copy()\n    parts.loc[inconnu & via.notna(), \"pn\"] = via[inconnu & via.notna()]\n    return parts\n\n\ndef group_pn_table(parts):\n    \"\"\"1 ligne par groupe x classe x composant x PN : quantité par avion.\"\"\"\n    base = parts.drop_duplicates([\"equipment\", \"group\", \"registration\", \"area\", \"ccn\", \"pn\", \"description\", \"qty_per_ac\"])\n    per_reg = base.groupby([\"equipment\", \"aircraft_type\", \"group\", \"registration\", \"area\", \"Composant\", \"pn\"], as_index=False)[\"qty_per_ac\"].sum()\n    g = per_reg.groupby([\"equipment\", \"aircraft_type\", \"group\", \"area\", \"Composant\", \"pn\"]).agg(\n        qty_per_ac=(\"qty_per_ac\", \"median\"), avions_avec_pn=(\"registration\", \"nunique\")).reset_index()\n    g[\"qty_per_ac\"] = np.ceil(g[\"qty_per_ac\"])\n    return g\n\n\ndef cle_regle(equipement, classe, composant) -> str:\n    \"\"\"Identifiant ASCII d'une règle PE (clé de widget).\"\"\"\n    return re.sub(r\"[^A-Za-z0-9]+\", \"_\", f\"{equipement}_{classe}_{composant}\").strip(\"_\").lower()\n\n\ndef regles_pe_defaut(parts) -> pd.DataFrame:\n    keys = parts[[\"equipment\", \"area\", \"Composant\"]].drop_duplicates()\n    df = pd.DataFrame({\n        \"Equipement\": keys[\"equipment\"].to_numpy(), \"Classe\": keys[
