<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css">
<style>
  :root { --navy:#002157; --navy-2:#1F4E9C; --bg:#F4F6FA; --muted:#5B6478; }
  html, body { margin:0; background:var(--bg); }
  #s360-loading {
    position:fixed; inset:0; z-index:1000000; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.25rem; padding:1rem;
    background:#FFFFFF; font-family:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    text-align:center; transition:opacity .35s ease;
  }
  #s360-loading.fini { opacity:0; pointer-events:none; }
  /* Logo sur fond transparent, texte bleu marine : toujours sur fond blanc. */
  #s360-loading img { width:min(22rem, 80vw); height:auto; }
  #s360-loading .titre { color:var(--navy); font-size:1.75rem; font-weight:700; }
  #s360-loading .texte { color:var(--muted); font-size:1rem; max-width:32rem; }
  #s360-loading .barre { width:min(18rem, 70vw); height:4px; border-radius:4px; overflow:hidden; background:#E3E8F1; }
  #s360-loading .barre::after {
    content:""; display:block; width:40%; height:100%; border-radius:4px;
    background:linear-gradient(90deg, var(--navy), var(--navy-2)); animation:s360-glisse 1.3s ease-in-out infinite;
  }
  @keyframes s360-glisse { 0% { transform:translateX(-100%); } 100% { transform:translateX(250%); } }
  #s360-loading .lent { display:none; color:var(--muted); font-size:.9375rem; max-width:34rem; }
  #s360-loading.lent .lent { display:block; }
  #s360-loading button {
    font:inherit; font-weight:600; color:#fff; border:0; border-radius:8px; padding:.5rem 1rem; cursor:pointer;
    background:linear-gradient(90deg, var(--navy), var(--navy-2));
  }
</style>

 AFI (sur fond clair, le logo est transparent) + Supply360 + onglet actif.\"\"\"\n    logo = (\n        f'<img src=\"data:image/png;base64,{LOGO_B64}\" alt=\"Air France Industries KLM Engineering &amp; Maintenance\">'\n        if LOGO_B64 else \"\"\n    )\n    current = f'<span class=\"s360-current\">{escape(tab_label)}<\/span>' if tab_label else \"\"\n    st.html(\n        f'<div class=\"s360-header\">{logo}<span class=\"s360-sep\"><\/span>'\n        f'<div class=\"s360-brand\"><b>Supply360<\/b>'\n        f\"<small>Pilotage supply chain · équipements cabine<\/small><\/div>{current}<\/div>\"\n    )\n\n\ndef page_intro(title: str, description: str, fichiers: list[str] | None = None) -> None:\n    \"\"\"En-tête d'onglet : titre, description courte et rappel des fichiers attendus.\"\"\"\n    chips = \"\".join(f'<span class=\"s360-chip\">📄 {escape(f)}<\/span>' for f in fichiers or [])\n    st.html(\n        f'<div class=\"s360-intro\"><h1>{escape(title)}<\/h1><p>{escape(description)}<\/p>'\n        f'<div class=\"s360-chips\">{chips}<\/div><\/div>'\n    )\n\n\n@contextmanager\ndef section(key: str, title: str, subtitle: str = \"\"):\n    \"\"\"Bloc carte blanche à en-tête dégradé. `key` doit être unique (préfixé par le TAB_ID).\"\"\"\n    box = st.container(key=f\"s360sec_{key}\")\n    with box:\n        sub = f\"<p>{escape(subtitle)}<\/p>\" if subtitle else \"\"\n        st.html(f'<div class=\"s360-section-head\"><h3>{escape(title)}<\/h3>{sub}<\/div>')\n        yield box\n\n\ndef kpi_card(label: str, value, sub: str = \"\", tone: str = \"navy\") -> str:\n    \"\"\"HTML d'une carte KPI (à passer à `kpi_grid`).\"\"\"\n    sub_html = f'<div class=\"sub\">{sub}<\/div>' if sub else \"\"\n    return (\n        f'<div class=\"s360-kpi\" style=\"--tone:{_tone(tone)}\">'\n        f'<div class=\"lbl\">{escape(str(label))}<\/div>'\n        f'<div class=\"val\">{escape(str(value))}<\/div>{sub_html}<\/div>'\n    )\n\n\ndef kpi_grid(cards: list[str]) -> None:\n    \"\"\"Grille responsive de cartes KPI (passe à la ligne sur écran étroit).\"\"\"\n    st.html(f'<div class=\"s360-kpis\">{\"\".join(cards)}<\/div>')\n\n\ndef badge(text: str, tone: str = \"navy\") -> str:\n    return f'<span class=\"s360-badge\" style=\"--tone:{_tone(tone)}\">{escape(text)}<\/span>'\n\n\ndef chantier_badge(statut: str, jours_avant_debut: int | None = None) -> str:\n    \"\"\"Badge de statut chantier : uniquement Terminé / En cours / À venir.\"\"\"\n    if statut not in CHANTIER_STATUTS:\n        raise ValueError(f\"Statut de chantier inconnu : {statut}\")\n    text = statut\n    if statut == \"À venir\" and jours_avant_debut is not None:\n        text += f\" · J-{jours_avant_debut}\"\n    return badge(text, CHANTIER_STATUTS[statut])\n\n\ndef callout(message_html: str, tone: str = \"navy\", icon: str = \"ℹ️\") -> None:\n    \"\"\"Bandeau de message (action à mener, alerte). `message_html` est du HTML de confiance.\"\"\"\n    st.html(\n        f'<div class=\"s360-callout\" style=\"--tone:{_tone(tone)}\">'\n        f'<span class=\"ico\">{icon}<\/span><div>{message_html}<\/div><\/div>'\n    )\n\n\ndef empty_state(title: str, message: str, steps: list[str] | None = None, icon: str = \"📥\") -> None:\n    \"\"\"État vide soigné, affiché tant que les fichiers ne sont pas importés.\"\"\"\n    steps_html = \"\".join(f\"<li>{s}<\/li>\" for s in steps or [])\n    st.html(\n        f'<div class=\"s360-empty\"><div class=\"ico\">{icon}<\/div><h4>{escape(title)}<\/h4>'\n        f\"<p>{escape(message)}<\/p>{f'<ol>{steps_html}<\/ol>' if steps_html else ''}<\/div>\"\n    )\n\n\ndef footer() -> None:\n    st.html(\n        '<div class=\"s360-footer\">Supply360 · Air France Industries — les fichiers sont traités '\n        \"localement dans votre navigateur et ne sont envoyés nulle part. \"\n        \"Rafraîchir la page réinitialise la session.<\/div>\"\n    )\n\n\ndef style_figure(fig, height: int = 380):\n    \"\"\"Applique la charte à une figure Plotly : fond transparent, police, légende en bas.\"\"\"\n    fig.update_layout(\n        height=height,\n        font=dict(family=FONT_STACK, size=14, color=COLORS[\"text\"]),\n        paper_bgcolor=\"rgba(0,0,0,0)\",\n        plot_bgcolor=\"rgba(0,0,0,0)\",\n        margin=dict(l=10, r=30, t=30, b=10),\n        legend=dict(orientation=\"h\", yanchor=\"top\", y=-0.15, xanchor=\"center\", x=0.5),\n        hoverlabel=dict(font_family=FONT_STACK),\n    )\n    fig.update_xaxes(gridcolor=COLORS[\"border\"], zerolinecolor=COLORS[\"border\"])\n    fig.update_yaxes(gridcolor=COLORS[\"border\"], zerolinecolor=COLORS[\"border\"])\n    return fig\n\n\nPLOTLY_CONFIG = {\"displaylogo\": False, \"locale\": \"fr\"}\n", "app/core/io.py": "\"\"\"Lecture des fichiers importés, normalisation / validation des colonnes, export Excel.\n\nAucune dépendance à Streamlit : tout est testable avec pytest. Les fichiers arrivent\nsous forme d'octets (`UploadedFile.getvalue()`), jamais via un chemin.\n\"\"\"\n\nimport io\nimport re\nimport unicodedata\nfrom datetime import date\n\nimport numpy as np\nimport pandas as pd\n\nNAVY_HEX = \"002157\"\n\n\nclass ColonneIntrouvable(ValueError):\n    \"\"\"Erreur métier lisible : une colonne attendue manque dans un fichier importé.\"\"\"\n\n    def __init__(self, libelle: str, fichier: str, feuille: str | None = None, colonnes=None):\n        msg = f\"Colonne « {libelle} » introuvable dans le fichier {fichier}\"\n        msg += f\" (feuille « {feuille} »).\" if feuille else \".\"\n        if colonnes is not None:\n            msg += \" Colonnes détectées : \" + \", \".join(str(c) for c in colonnes)\n        super().__init__(msg)\n\n\nclass FichierIllisible(ValueError):\n    \"\"\"Le fichier importé ne peut pas être lu (format, feuille absente…).\"\"\"\n\n\n# --------------------------------------------------------------------------\n# Normalisation des en-têtes et recherche de colonnes\n# --------------------------------------------------------------------------\ndef normaliser(s) -> str:\n    \"\"\"Minuscules, sans accents, espaces → `_` (« Qté sur\\\\nÉtagère » → « qte_sur_etagere »).\"\"\"\n    s = str(s).replace(\"\\n\", \" \").strip()\n    s = unicodedata.normalize(\"NFKD\", s).encode(\"ascii\", \"ignore\").decode(\"ascii\")\n    return re.sub(r\"\\s+\", \"_\", s).strip(\"_\").lower()\n\n\ndef nettoyer_entetes(df: pd.DataFrame) -> pd.DataFrame:\n    df = df.copy()\n    df.columns = [str(c).replace(\"\\n\", \" \").strip() for c in df.columns]\n    return df\n\n\ndef trouver_colonne(df: pd.DataFrame, *alias: str, exact: bool = False):\n    \"\"\"Renvoie la première colonne dont le nom normalisé correspond à un alias.\n\n    Correspondance exacte d'abord, puis partielle (alias contenu dans le nom) sauf si\n    `exact=True`. Renvoie None si rien ne correspond.\n    \"\"\"\n    noms = {c: normaliser(c) for c in df.columns}\n    cibles = [normaliser(a) for a in alias]\n    for col, n in noms.items():\n        if n in cibles:\n            return col\n    if exact:\n        return None\n    for col, n in noms.items():\n        for cible in cibles:\n            if cible in n:\n                return col\n    return None\n\n\ndef trouver_ligne_entete(raw: pd.DataFrame, mots_cles, max_scan: int = 15):\n    \"\"\"Indice de la ligne d'en-tête (feuille lue sans header) contenant tous les mots-clés.\"\"\"\n    cles = [normaliser(m) for m in mots_cles]\n    for i in range(min(max_scan, len(raw))):\n        cellules = [normaliser(v) for v in raw.iloc[i].tolist()]\n        jointes = \"|\".join(cellules)\n        if all(any(m in c for c in cellules) or m in jointes for m in cles):\n            return i\n    return None\n\n\n# --------------------------------------------------------------------------\n# Ouverture des classeurs\n# --------------------------------------------------------------------------\ndef ouvrir_excel(data: bytes, fichier: str) -> pd.ExcelFile:\n    try:\n        return pd.ExcelFile(io.BytesIO(data), engine=\"openpyxl\")\n    except Exception as exc:  # format non Excel, fichier corrompu ou protégé\n        raise FichierIllisible(\n            f\"Le fichier {fichier} n'a pas pu être ouvert comme classeur Excel ({exc}).\"\n        ) from exc\n\n\ndef choisir_feuille(xl: pd.ExcelFile, mots_cles, feuille_preferee: str | None = None):\n    \"\"\"(nom_feuille, ligne_entete) de la feuille contenant les colonnes attendues.\n\n    La feuille dont le nom contient `feuille_preferee` est testée en premier ; à défaut\n    on renvoie la première feuille avec l'en-tête en ligne 0.\n    \"\"\"\n    feuilles = list(xl.sheet_names)\n    if feuille_preferee:\n        cible = normaliser(feuille_preferee)\n        feuilles.sort(key=lambda s: 0 if cible in normaliser(s) else 1)\n    for s in feuilles:\n        try:\n            raw = xl.parse(s, header=None, nrows=15)\n        except Exception:\n            continue\n        h = trouver_ligne_entete(raw, mots_cles)\n        if h is not None:\n            return s, h\n    return xl.sheet_names[0], 0\n\n\ndef lire_feuille(xl: pd.ExcelFile, feuille: str, entete: int) -> pd.DataFrame:\n    \"\"\"Lit une feuille en conservant les types bruts d'Excel (dtype=object) :\n    un PN numérique reste un entier (pas de « 12345.0 »).\"\"\"\n    return nettoyer_entetes(xl.parse(feuille, header=entete, dtype=object))\n\n\n# --------------------------------------------------------------------------\n# Typage explicite\n# --------------------------------------------------------------------------\ndef _sans_decimale(v):\n    if isinstance(v, float) and v.is_integer():\n        return int(v)\n    return v\n\n\ndef cle_pn(serie: pd.Series) -> pd.Series:\n    \"\"\"Référence pièce en texte pour les jointures : majuscules, espaces de bord retirés.\n\n    Les zéros en tête sont conservés s'ils sont saisis en texte dans Excel.\n    \"\"\"\n    s = serie.map(_sans_decimale, na_action=\"ignore\")\n    s = s.map(str, na_action=\"ignore\").str.strip().str.upper()\n    return s.where(~s.isin([\"\", \"NAN\", \"NONE\", \"NAT\"]), np.nan).astype(object)\n\n\ndef texte(serie: pd.Series) -> pd.Series:\n    \"\"\"Texte nettoyé, valeurs vides → NaN (évite la chaîne « nan »).\"\"\"\n    s = serie.map(_sans_decimale, na_action=\"ignore\").map(str, na_action=\"ignore\").str.strip()\n    return s.where(s.notna() & (s != \"\"), np.nan).astype(object)\n\n\ndef nombre(serie: pd.Series, defaut=None) -> pd.Series:\n    s = pd.to_numeric(serie, errors=\"coerce\")\n    return s.fillna(defaut) if defaut is not None else s\n\n\ndef dates(serie: pd.Series) -> pd.Series:\n    \"\"\"Dates Excel ou texte JJ/MM/AAAA → datetime64 (NaT si invalide).\"\"\"\n    return pd.to_datetime(serie, errors=\"coerce\", dayfirst=True, format=\"mixed\")\n\n\n# --------------------------------------------------------------------------\n# Export Excel\n# --------------------------------------------------------------------------\ndef nom_export(tab_id: str, jour: date | None = None) -> str:\n    jour = jour or date.today()\n    return f\"Supply360_{tab_id}_{jour:%Y%m%d}.xlsx\"\n\n\ndef exporter_excel(feuilles: dict, couleurs_lignes: dict | None = None) -> bytes:\n    \"\"\"Écrit {nom_feuille: DataFrame} dans un classeur mis en forme.\n\n    En-têtes en gras sur fond bleu marine, volets figés, filtres automatiques, largeurs\n    ajustées, dates au format JJ/MM/AAAA. `couleurs_lignes` = {nom_feuille: liste de\n    couleurs hexa (ou None) alignée sur les lignes} pour surligner certaines lignes.\n    \"\"\"\n    from openpyxl.styles import Alignment, Font, PatternFill\n    from openpyxl.utils import get_column_letter\n\n    entete_fill = PatternFill(\"solid\", start_color=NAVY_HEX, end_color=NAVY_HEX)\n    entete_font = Font(bold=True, color=\"FFFFFF\")\n    buf = io.BytesIO()\n    with pd.ExcelWriter(buf, engine=\"openpyxl\") as wr:\n        for nom, df in feuilles.items():\n            onglet = nom[:31]\n            df = df.copy()\n            col_dates = [c for c in df.columns if pd.api.types.is_datetime64_any_dtype(df[c])]\n            df.to_excel(wr, sheet_name=onglet, index=False)\n            ws = wr.sheets[onglet]\n            nrows, ncols = len(df), len(df.columns)\n\n            for j in range(1, ncols + 1):\n                cell = ws.cell(row=1, column=j)\n                cell.fill, cell.font = entete_fill, entete_font\n                cell.alignment = Alignment(vertical=\"center\", wrap_text=True)\n            ws.freeze_panes = \"A2\"\n            if ncols and nrows:\n                ws.auto_filter.ref = f\"A1:{get_column_letter(ncols)}{nrows + 1}\"\n\n            for j, col in enumerate(df.columns, start=1):\n                echantillon = df[col].head(500)\n                if col in col_dates:\n                    largeur = 12\n                    for i in range(2, nrows + 2):\n                        ws.cell(row=i, column=j).number_format = \"DD/MM/YYYY\"\n                else:\n                    longueurs = echantillon.map(lambda v: len(str(v)) if pd.notna(v) else 0)\n                    largeur = int(longueurs.max()) if nrows else 0\n                largeur = max(largeur, len(str(col))) + 2\n                ws.column_dimensions[get_column_letter(j)].width = min(max(largeur, 8), 60)\n\n            couleurs = (couleurs_lignes or {}).get(nom)\n            if couleurs is not None and nrows:\n                fills = {}\n                for i, hexa in enumerate(couleurs, start=2):\n                    if not hexa:\n                        continue\n                    fill = fills.setdefault(hexa, PatternFill(\"solid\", start_color=hexa, end_color=hexa))\n                    for j in range(1, ncols + 1):\n                        ws.cell(row=i, column=j).fill = fill\n    return buf.getvalue()\n\n\n# --------------------------------------------------------------------------\n# Lecture des sources (une ligne par ligne de fichier, colonnes normalisées)\n# --------------------------------------------------------------------------\nFICHIER_BESOINS = \"Besoins chantier (LOGOPS)\"\nFICHIER_ASREQ = \"Étude ASREQ/NOREQ\"\nFICHIER_STOCK = \"État du stock\"\nFICHIER_COMMANDES = \"Commandes (SAP)\"\n\n\ndef lire_besoins_geav(data: bytes):\n    \"\"\"Besoins chantier « classiques » (colonnes MPN Prime / Qty). Renvoie (lignes, feuille).\"\"\"\n    xl = ouvrir_excel(data, FICHIER_BESOINS)\n    feuille, entete = choisir_feuille(xl, [\"mpn prime\", \"qty\"], feuille_preferee=\"PartRequirements\")\n    df = lire_feuille(xl, feuille, entete)\n\n    c_pn = trouver_colonne(df, \"mpn prime\", exact=True) or trouver_colonne(df, \"mpn prime\")\n    c_qty = trouver_colonne(df, \"qty\", exact=True) or trouver_colonne(df, \"quantite\", \"quantity\")\n    c_desc = trouver_colonne(df, \"description\")\n    c_task = trouver_colonne(df, \"task trfx\", exact=True) or trouver_colonne(\n        df, \"task trfx\", \"task name\", \"task wp line\", \"trfx\")\n    if c_pn is None:\n        raise ColonneIntrouvable(\"MPN Prime\", FICHIER_BESOINS, feuille, df.columns)\n    if c_qty is None:\n        raise ColonneIntrouvable(\"Qty\", FICHIER_BESOINS, feuille, df.columns)\n\n    out = pd.DataFrame({\n        \"PN\": cle_pn(df[c_pn]),\n        \"Qty\": nombre(df[c_qty], 0),\n        \"Description\": df[c_desc] if c_desc else np.nan,\n        \"TRFX\": texte(df[c_task]) if c_task else np.nan,\n    })\n    return out[out[\"PN\"].notna()], feuille\n\n\ndef lire_besoins_asreq(data: bytes):\n    \"\"\"Étude ASREQ/NOREQ (classeur .xlsm, feuille « Ordered », en-tête en ligne 6).\"\"\"\n    xl = ouvrir_excel(data, FICHIER_ASREQ)\n    if \"Ordered\" not in xl.sheet_names:\n        raise FichierIllisible(\n            f\"Feuille « Ordered » introuvable dans le fichier {FICHIER_ASREQ}. \"\n            f\"Feuilles présentes : {', '.join(xl.sheet_names)}\")\n    df = lire_feuille(xl, \"Ordered\", 5)\n\n    c_barecode = trouver_colonne(df, \"id barecode\")\n    c_pn = trouver_colonne(df, \"pn + infos\", \"pn\")\n    c_qty = trouver_colonne(df, \"qty\", exact=True)\n    if c_pn is None:\n        raise ColonneIntrouvable(\"PN + infos pièce sortie\", FICHIER_ASREQ, \"Ordered\", df.columns)\n    if c_qty is None:\n        raise ColonneIntrouvable(\"Qty\", FICHIER_ASREQ, \"Ordered\", df.columns)\n\n    out = pd.DataFrame({\n        \"PN\": cle_pn(df[c_pn]),\n        \"Qty\": nombre(df[c_qty], 0),\n        \"TRFX\": texte(df[c_barecode]) if c_barecode else np.nan,\n    })\n    return out[out[\"PN\"].notna()], \"Ordered\"\n\n\ndef _code(serie: pd.Series) -> pd.Series:\n    return texte(serie).str.replace(r\"\\.0$\", \"\", regex=True)\n\n\ndef lire_etat_stock(data: bytes):\n    \"\"\"État du stock (PNR, QTE SUR ÉTAGÈRE, QTE EN CDE, GESTION…). Renvoie (lignes, feuille).\"\"\"\n    xl = ouvrir_excel(data, FICHIER_STOCK)\n    feuille, entete = choisir_feuille(xl, [\"pnr\", \"qte sur etagere\"])\n    df = lire_feuille(xl, feuille, entete)\n\n    c_pnr = trouver_colonne(df, \"pnr\", exact=True) or trouver_colonne(df, \"pnr\")\n    c_stock = trouver_colonne(df, \"qte sur etagere\")\n    c_cde = trouver_colonne(df, \"qte en cde\")\n    c_gestion = trouver_colonne(df, \"gestion\", exact=True) or trouver_colonne(df, \"gestion\")\n    c_agent = trouver_colonne(df, \"code agt appro\")\n    c_fourn = trouver_colonne(df, \"code fournisseur\")\n    c_dernier = trouver_colonne(df, \"dernier fournisseur\")\n    c_desc = trouver_colonne(df, \"description\")\n    c_ccn = trouver_colonne(df, \"ccn\", exact=True)\n    c_class = trouver_colonne(df, \"class code\", exact=True)\n    if c_pnr is None:\n        raise ColonneIntrouvable(\"PNR\", FICHIER_STOCK, feuille, df.columns)\n    if c_stock is None:\n        raise ColonneIntrouvable(\"QTE SUR ÉTAGÈRE\", FICHIER_STOCK, feuille, df.columns)\n\n    n = len(df)\n    out = pd.DataFrame({\n        \"PN\": cle_pn(df[c_pnr]),\n        \"QTY_STOCK\": nombre(df[c_stock], 0),\n        \"QTY_CDE\": nombre(df[c_cde], 0) if c_cde else pd.Series(0.0, index=df.index),\n        \"GESTION\": nombre(df[c_gestion]) if c_gestion else np.nan,\n        \"CODE_AGENT\": texte(df[c_agent]) if c_agent else np.nan,\n        \"CODE_FOURNISSEUR\": texte(df[c_fourn]) if c_fourn else np.nan,\n        \"DERNIER_FOURNISSEUR\": texte(df[c_dernier]) if c_dernier else np.nan,\n        \"Description_stock\": df[c_desc] if c_desc else np.nan,\n        \"CCN\": _code(df[c_ccn]) if c_ccn else np.nan,\n        \"CLASS_CODE_STOCK\": nombre(df[c_class]) if c_class else np.full(n, np.nan),\n    })\n    return out[out[\"PN\"].notna()], feuille\n\n\ndef lire_commandes_sap(data: bytes):\n    \"\"\"Commandes (SAP), feuille « Toutes les commandes » de préférence. Renvoie (lignes, feuille).\"\"\"\n    xl = ouvrir_excel(data, FICHIER_COMMANDES)\n    feuille, entete = choisir_feuille(xl, [\"pn\", \"code acheteur\", \"commande\"],\n                                      feuille_preferee=\"Toutes les commandes\")\n    df = lire_feuille(xl, feuille, entete).dropna(axis=1, how=\"all\")\n\n    c_pn = trouver_colonne(df, \"pn\", exact=True)\n    c_cmd = trouver_colonne(df, \"commande\", exact=True)\n    c_acheteur = trouver_colonne(df, \"code acheteur\")\n    c_gestion = trouver_colonne(df, \"gestion\", exact=True)\n    c_fourn_code = trouver_colonne(df, \"code fournisseur\")\n    c_fourn = trouver_colonne(df, \"fournisseur\", exact=True) or trouver_colonne(df, \"fournisseur\")\n    c_psd = trouver_colonne(df, \"date de livraison promise\", \"livraison promise\")\n    c_date_dem = trouver_colonne(df, \"date de livraison demandee\", \"livraison demandee\")\n    c_statut = trouver_colonne(df, \"statut de la commande\", \"statut\")\n    c_restant = trouver_colonne(df, \"quantite restant a livrer\", \"restant a livrer\")\n    c_class = trouver_colonne(df, \"class code\", \"code classe\")\n    c_ccn = trouver_colonne(df, \"ccn\", exact=True)\n    if c_pn is None:\n        raise ColonneIntrouvable(\"PN\", FICHIER_COMMANDES, feuille, df.columns)\n\n    nat = pd.Series(pd.NaT, index=df.index, dtype=\"datetime64[ns]\")\n    out = pd.DataFrame({\n        \"PN\": cle_pn(df[c_pn]),\n        \"Commande\": texte(df[c_cmd]) if c_cmd else np.nan,\n        \"Code_acheteur\": texte(df[c_acheteur]) if c_acheteur else np.nan,\n        \"Gestion_cmd\": nombre(df[c_gestion]) if c_gestion else np.nan,\n        \"Code_fournisseur_cmd\": texte(df[c_fourn_code]) if c_fourn_code else np.nan,\n        \"Fournisseur\": texte(df[c_fourn]) if c_fourn else np.nan,\n        \"PSD\": dates(df[c_psd]) if c_psd else nat,\n        \"Date_demandee\": dates(df[c_date_dem]) if c_date_dem else nat,\n        \"Statut\": texte(df[c_statut]) if c_statut else np.nan,\n        \"Qty_restant\": nombre(df[c_restant], 0) if c_restant else 0.0,\n        \"Class_code\": nombre(df[c_class]) if c_class else np.nan,\n        \"CCN_cmd\": _code(df[c_ccn]) if c_ccn else np.nan,\n    })\n    out = out[out[\"PN\"].notna()].copy()\n    # Date de livraison « effective » : la PSD si connue, sinon la date demandée.\n    out[\"PSD_effective\"] = out[\"PSD\"].fillna(out[\"Date_demandee\"])\n    out[\"PSD_est_estimee\"] = out[\"PSD\"].isna() & out[\"Date_demandee\"].notna()\n    return out, feuille\n", "app/core/style.py": "\"\"\"CSS global de Supply360 (charte Air France Industries) et injection dans la page.\"\"\"\n\nimport streamlit as st\n\n# Couleurs de la charte, réutilisées côté Python (Plotly, export Excel).\nCOLORS = {\n    \"navy\": \"#002157\",\n    \"navy_2\": \"#1F4E9C\",\n    \"accent\": \"#E4002B\",\n    \"bg\": \"#F4F6FA\",\n    \"surface\": \"#FFFFFF\",\n    \"text\": \"#1A1F36\",\n    \"muted\": \"#5B6478\",\n    \"border\": \"#DDE3EE\",\n    \"ok\": \"#1E8E5A\",\n    \"warn\": \"#E8A317\",\n    \"ko\": \"#C62828\",\n}\n\nFONT_STACK = '\"Segoe UI\", system-ui, -apple-system, Roboto, Arial, sans-serif'\n\nHEADER_HEIGHT = \"4.5rem\"\n\nCSS = f\"\"\"\n:root {{\n  --navy: {COLORS[\"navy\"]};\n  --navy-2: {COLORS[\"navy_2\"]};\n  --accent: {COLORS[\"accent\"]};\n  --bg: {COLORS[\"bg\"]};\n  --surface: {COLORS[\"surface\"]};\n  --text: {COLORS[\"text\"]};\n  --muted: {COLORS[\"muted\"]};\n  --border: {COLORS[\"border\"]};\n  --ok: {COLORS[\"ok\"]};\n  --warn: {COLORS[\"warn\"]};\n  --ko: {COLORS[\"ko\"]};\n  --radius: 12px;\n  --shadow: 0 1px 2px rgba(0, 33, 87, .06), 0 4px 14px rgba(0, 33, 87, .06);\n  --header-h: {HEADER_HEIGHT};\n}}\n\nhtml, body, .stApp, [data-testid=\"stAppViewContainer\"] {{\n  background: var(--bg);\n  color: var(--text);\n  font-family: {FONT_STACK};\n}}\n/* Pas de règle sur span/div : les icônes Streamlit utilisent leur propre police. */\n.stApp :is(p, li, label, input, textarea, button, td, th, h1, h2, h3, h4) {{\n  font-family: {FONT_STACK};\n}}\n\n/* ---- Habillage Streamlit masqué ---- */\nheader[data-testid=\"stHeader\"],\n[data-testid=\"stToolbar\"],\n[data-testid=\"stDecoration\"],\n[data-testid=\"stStatusWidget\"],\n[data-testid=\"stMainMenu\"],\n[data-testid=\"stAppDeployButton\"],\n#MainMenu, footer {{\n  display: none !important;\n}}\n\n[data-testid=\"stMainBlockContainer\"], .block-container {{\n  max-width: 1500px;\n  padding: calc(var(--header-h) + 1.25rem) 1.5rem 3rem;\n}}\n@media (max-width: 640px) {{\n  [data-testid=\"stMainBlockContainer\"], .block-container {{\n    padding-left: 1rem;\n    padding-right: 1rem;\n  }}\n}}\n\n/* ---- Header fixe ---- */\n.s360-header {{\n  position: fixed;\n  inset: 0 0 auto 0;\n  z-index: 999990;\n  height: var(--header-h);\n  display: flex;\n  align-items: center;\n  gap: 1.25rem;\n  padding: 0 1.5rem;\n  background: var(--surface);\n  border-bottom: 1px solid var(--border);\n  box-shadow: 0 2px 10px rgba(0, 33, 87, .06);\n}}\n.s360-header::after {{\n  content: \"\";\n  position: absolute;\n  inset: auto 0 -3px 0;\n  height: 3px;\n  background: linear-gradient(90deg, var(--navy), var(--navy-2));\n}}\n/* Le logo est sur fond transparent avec un texte bleu marine :\n   il doit toujours être posé sur un fond clair. */\n.s360-header img {{\n  height: 2.75rem;\n  width: auto;\n  display: block;\n}}\n.s360-header .s360-sep {{\n  width: 1px;\n  align-self: stretch;\n  margin: 1rem 0;\n  background: var(--border);\n}}\n.s360-brand {{\n  display: flex;\n  flex-direction: column;\n  line-height: 1.15;\n}}\n.s360-brand b {{\n  color: var(--navy);\n  font-size: 1.375rem;\n  font-weight: 700;\n  letter-spacing: .01em;\n}}\n.s360-brand small {{\n  color: var(--muted);\n  font-size: .875rem;\n}}\n.s360-header .s360-current {{\n  margin-left: auto;\n  padding: .4rem .9rem;\n  border-radius: 999px;\n  background: linear-gradient(90deg, var(--navy), var(--navy-2));\n  color: #fff;\n  font-size: .9375rem;\n  font-weight: 600;\n  white-space: nowrap;\n}}\n@media (max-width: 760px) {{\n  .s360-header {{ gap: .75rem; padding: 0 1rem; }}\n  .s360-header img {{ height: 2rem; }}\n  .s360-brand small, .s360-header .s360-sep {{ display: none; }}\n  .s360-header .s360-current {{ font-size: .875rem; padding: .3rem .7rem; }}\n}}\n@media (max-width: 560px) {{\n  .s360-header .s360-current {{ display: none; }}\n}}\n\n/* ---- Navigation entre onglets ---- */\n.st-key-s360_nav [data-testid=\"stButtonGroup\"] {{\n  flex-wrap: wrap;\n}}\n.st-key-s360_nav button {{\n  min-height: 2.6rem;\n  padding: .45rem 1.1rem;\n  color: var(--navy);\n  background: var(--surface);\n  border-color: var(--border);\n}}\n.st-key-s360_nav button p {{\n  font-size: 1rem;\n  font-weight: 600;\n  color: inherit;\n}}\n.st-key-s360_nav button[aria-checked=\"true\"] {{\n  background: linear-gradient(90deg, var(--navy), var(--navy-2));\n  border-color: var(--navy);\n}}\n.st-key-s360_nav button[aria-checked=\"true\"] p {{ color: #fff; }}\n\n/* ---- Intro d'onglet ---- */\n.s360-intro h1 {{\n  margin: 0 0 .25rem;\n  padding: 0;\n  color: var(--navy);\n  font-size: 1.75rem;\n  font-weight: 700;\n}}\n.s360-intro p {{\n  margin: 0 0 .6rem;\n  color: var(--muted);\n  font-size: 1rem;\n  max-width: 70rem;\n}}\n.s360-chips {{ display: flex; flex-wrap: wrap; gap: .4rem; }}\n.s360-chip {{\n  display: inline-flex;\n  align-items: center;\n  gap: .35rem;\n  padding: .2rem .7rem;\n  border-radius: 999px;\n  border: 1px solid var(--border);\n  background: var(--surface);\n  color: var(--navy);\n  font-size: .875rem;\n  font-weight: 600;\n}}\n\n/* ---- Sections (cartes à en-tête dégradé) ---- */\n[class*=\"st-key-s360sec_\"] {{\n  background: var(--surface);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  border: 1px solid var(--border);\n  padding: 0 1.25rem 1.25rem;\n  overflow: hidden;\n}}\n.s360-section-head {{\n  margin: 0 -1.25rem .25rem;\n  padding: .8rem 1.25rem;\n  background: linear-gradient(90deg, var(--navy), var(--navy-2));\n  color: #fff;\n}}\n.s360-section-head h3 {{\n  margin: 0;\n  padding: 0;\n  color: #fff;\n  font-size: 1.125rem;\n  font-weight: 650;\n}}\n.s360-section-head p {{\n  margin: .15rem 0 0;\n  color: rgba(255, 255, 255, .85);\n  font-size: .875rem;\n}}\n\n/* ---- Cartes KPI ---- */\n.s360-kpis {{\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));\n  gap: .9rem;\n}}\n.s360-kpi {{\n  position: relative;\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  padding: .9rem 1rem .85rem;\n  box-shadow: var(--shadow);\n  overflow: hidden;\n}}\n.s360-kpi::before {{\n  content: \"\";\n  position: absolute;\n  inset: 0 auto 0 0;\n  width: 4px;\n  background: var(--tone, var(--navy));\n}}\n.s360-kpi .lbl {{\n  color: var(--muted);\n  font-size: .875rem;\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: .03em;\n}}\n.s360-kpi .val {{\n  margin: .3rem 0 .15rem;\n  color: var(--tone, var(--navy));\n  font-size: 2rem;\n  font-weight: 700;\n  line-height: 1.1;\n}}\n.s360-kpi .sub {{ color: var(--muted); font-size: .875rem; }}\n\n/* ---- Badges ---- */\n.s360-badge {{\n  display: inline-block;\n  padding: .15rem .6rem;\n  border-radius: 999px;\n  font-size: .875rem;\n  font-weight: 600;\n  color: var(--tone, var(--navy));\n  background: color-mix(in srgb, var(--tone, var(--navy)) 12%, white);\n  border: 1px solid color-mix(in srgb, var(--tone, var(--navy)) 35%, white);\n  white-space: nowrap;\n}}\n\n/* ---- Bandeaux d'alerte / message d'action ---- */\n.s360-callout {{\n  display: flex;\n  gap: .75rem;\n  align-items: flex-start;\n  padding: .85rem 1rem;\n  border-radius: 10px;\n  border: 1px solid color-mix(in srgb, var(--tone, var(--navy)) 35%, white);\n  border-left: 5px solid var(--tone, var(--navy));\n  background: color-mix(in srgb, var(--tone, var(--navy)) 7%, white);\n  color: var(--text);\n  font-size: 1rem;\n}}\n.s360-callout .ico {{ font-size: 1.25rem; line-height: 1.3; }}\n.s360-callout b {{ color: var(--tone, var(--navy)); }}\n\n/* ---- État vide ---- */\n.s360-empty {{\n  text-align: center;\n  padding: 2.5rem 1.5rem;\n  border: 2px dashed var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n}}\n.s360-empty .ico {{ font-size: 2.5rem; }}\n.s360-empty h4 {{ margin: .5rem 0 .35rem; color: var(--navy); font-size: 1.25rem; }}\n.s360-empty p {{ margin: 0 auto .75rem; color: var(--muted); max-width: 40rem; }}\n.s360-empty ol {{\n  display: inline-block;\n  text-align: left;\n  margin: 0;\n  color: var(--text);\n}}\n.s360-empty li {{ margin: .2rem 0; }}\n\n/* ---- Boutons (style unique) ---- */\n.stButton > button, .stDownloadButton > button {{\n  min-height: 2.6rem;\n  border-radius: 8px;\n  font-weight: 600;\n  font-size: 1rem;\n  color: #fff;\n  background: linear-gradient(90deg, var(--navy), var(--navy-2));\n  border: 1px solid var(--navy);\n  transition: filter .15s ease, box-shadow .15s ease;\n}}\n.stButton > button:hover, .stDownloadButton > button:hover {{\n  color: #fff;\n  border-color: var(--navy);\n  filter: brightness(1.12);\n  box-shadow: 0 3px 10px rgba(0, 33, 87, .25);\n}}\n.stButton > button:focus-visible, .stDownloadButton > button:focus-visible {{\n  outline: 3px solid color-mix(in srgb, var(--navy-2) 45%, white);\n  color: #fff;\n}}\n\n/* ---- Imports, tableaux, expanders ---- */\n[data-testid=\"stFileUploaderDropzone\"] {{\n  border: 1.5px dashed color-mix(in srgb, var(--navy-2) 45%, white);\n  background: #F8FAFD;\n  border-radius: 10px;\n}}\n/* Textes du composant d'import traduits (Streamlit ne les localise pas). */\n[data-testid=\"stFileUploaderDropzone\"] [data-testid=\"stBaseButton-secondary\"] p {{ font-size: 0; }}\n[data-testid=\"stFileUploaderDropzone\"] [data-testid=\"stBaseButton-secondary\"] p::after {{\n  content: \"Parcourir\";\n  font-size: 1rem;\n}}\n[data-testid=\"stFileUploaderDropzoneInstructions\"] span {{ font-size: 0; }}\n[data-testid=\"stFileUploaderDropzoneInstructions\"] span::after {{\n  content: \"ou glisser-déposer le fichier ici\";\n  font-size: .875rem;\n}}\n[data-testid=\"stDataFrame\"] {{\n  border: 1px solid var(--border);\n  border-radius: 10px;\n  overflow: hidden;\n}}\n[data-testid=\"stExpander\"] details {{\n  border-color: var(--border);\n  border-radius: 10px;\n  background: var(--surface);\n}}\n[data-testid=\"stCaptionContainer\"] {{ color: var(--muted); font-size: .875rem; }}\n\n.s360-footer {{\n  margin-top: 1rem;\n  text-align: center;\n  color: var(--muted);\n  font-size: .875rem;\n}}\n\"\"\"\n\n\ndef inject() -> None:\n    \"\"\"Injecte le CSS global (à appeler une fois par exécution, depuis main.py).\"\"\"\n    st.html(f\"<style>{CSS}<\/style>\")\n", "app/core/transforms.py": "\"\"\"Agrégations et croisements réutilisables : besoins chantier × état du stock × commandes.\n\nFonctions pures (pandas uniquement), testables sans Streamlit. Logique métier reprise\nà l'identique du script d'origine `legacy/streamlit_GEAV.py`, vectorisée pour Pyodide.\n\"\"\"\n\nimport numpy as np\nimport pandas as pd\n\nCLASSES_RISQUE = [8.0, 9.0]\n# Les fournisseurs saisissent une PSD en 2031 quand ils n'ont pas encore donné de date.\nANNEE_PSD_NON_FOURNIE = 2031\nSEP = \" | \"\n\n# --------------------------------------------------------------------------\n# Codes action (du pire au meilleur)\n# --------------------------------------------------------------------------\nACTION_ORDRE = [\"commander\", \"relancer_urgent\", \"relancer\", \"inconnu\", \"en_cours\", \"hors_perimetre\", \"ok\"]\nACTIONS_A_LANCER = [\"commander\", \"relancer_urgent\", \"relancer\", \"inconnu\"]\nACTION_LABELS = {\n    \"commander\": \"🔴 À commander\",\n    \"relancer_urgent\": \"🔴 Relance urgente (retard vs chantier)\",\n    \"relancer\": \"🟠 À relancer\",\n    \"inconnu\": \"❓ PN introuvable\",\n    \"en_cours\": \"🔵 En cours de livraison\",\n    \"hors_perimetre\": \"⚠️ Hors périmètre gestion\",\n    \"ok\": \"🟢 Stock suffisant\",\n}\n# Tons de la charte (core/style.py) associés à chaque action.\nACTION_TONES = {\n    \"commander\": \"ko\", \"relancer_urgent\": \"accent\", \"relancer\": \"warn\", \"inconnu\": \"muted\",\n    \"en_cours\": \"navy_2\", \"hors_perimetre\": \"border\", \"ok\": \"ok\",\n}\n# Fonds pastel de l'export Excel (repris du script d'origine).\nACTION_FILL_HEX = {\n    \"commander\": \"F8D7DA\", \"relancer_urgent\": \"F5B7B1\", \"relancer\": \"FCE4D6\",\n    \"en_cours\": \"D6E4F0\", \"ok\": \"D9F2E6\", \"hors_perimetre\": \"FDF0D5\", \"inconnu\": \"E2E3E5\",\n}\n\n\n# --------------------------------------------------------------------------\n# Utilitaires d'agrégation\n# --------------------------------------------------------------------------\ndef joindre_uniques(serie: pd.Series, sep: str = SEP):\n    \"\"\"Valeurs non vides, dédoublonnées dans l'ordre, jointes par `sep` (NaN si aucune).\"\"\"\n    vals = [str(v).strip() for v in serie\n            if pd.notna(v) and str(v).strip() and str(v).strip().lower() != \"nan\"]\n    return sep.join(dict.fromkeys(vals)) if vals else np.nan\n\n\ndef joindre_par_groupe(df: pd.DataFrame, cle: str, col: str, sep: str = SEP) -> pd.Series:\n    \"\"\"Équivalent vectorisé de `groupby(cle)[col].agg(joindre_uniques)` (index = clé).\"\"\"\n    s = df[col].map(str, na_action=\"ignore\").str.strip()\n    garde = s.notna() & (s != \"\") & (s.str.lower() != \"nan\")\n    tmp = pd.DataFrame({cle: df[cle], col: s})[garde].drop_duplicates()\n    return tmp.groupby(cle, sort=False)[col].agg(sep.join)\n\n\ndef _premier_prioritaire(df: pd.DataFrame, cle: str, col: str, prioritaires) -> pd.Series:\n    \"\"\"Par groupe : première valeur figurant dans `prioritaires`, sinon première non vide.\"\"\"\n    rang = (~df[col].isin(prioritaires)).astype(int)\n    ordonne = df.assign(_rang=rang).sort_values(\"_rang\", kind=\"stable\")\n    return ordonne.groupby(cle)[col].first()\n\n\n# --------------------------------------------------------------------------\n# Agrégation par PN\n# --------------------------------------------------------------------------\ndef agreger_besoins(lignes: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Une ligne par PN : quantités sommées (doublons du fichier besoins additionnés).\"\"\"\n    g = lignes.groupby(\"PN\")\n    out = pd.DataFrame({\"QTY_GEAV\": g[\"Qty\"].sum(), \"Nb_lignes\": g[\"Qty\"].size()})\n    if \"Description\" in lignes.columns:\n        out[\"Description\"] = joindre_par_groupe(lignes, \"PN\", \"Description\").reindex(out.index)\n    out[\"TRFX\"] = g[\"TRFX\"].first()\n    out[\"QTY_GEAV\"] = out[\"QTY_GEAV\"].astype(int)\n    return out.reset_index()\n\n\ndef agreger_stock(lignes: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Une ligne par PN. Un PNR est censé être unique ; en cas de doublon on prend le max\n    du stock / des quantités en commande et la classe 8/9 si elle apparaît.\"\"\"\n    g = lignes.groupby(\"PN\")\n    out = pd.DataFrame({\n        \"QTY_STOCK\": g[\"QTY_STOCK\"].max(),\n        \"QTY_CDE\": g[\"QTY_CDE\"].max(),\n        \"GESTION\": g[\"GESTION\"].first(),\n        \"CODE_AGENT\": g[\"CODE_AGENT\"].first(),\n        \"CODE_FOURNISSEUR\": g[\"CODE_FOURNISSEUR\"].first(),\n        \"DERNIER_FOURNISSEUR\": g[\"DERNIER_FOURNISSEUR\"].first(),\n        \"Description_stock\": g[\"Description_stock\"].first(),\n        \"CCN\": g[\"CCN\"].first(),\n    })\n    out[\"CLASS_CODE_STOCK\"] = _premier_prioritaire(lignes, \"PN\", \"CLASS_CODE_STOCK\", CLASSES_RISQUE)\n    return out.reset_index()\n\n\ndef agreger_commandes(lignes: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Une ligne par PN, triée par date de livraison : la PSD retenue est la plus proche.\"\"\"\n    d = lignes.sort_values(\"PSD_effective\", kind=\"stable\")\n    g = d.groupby(\"PN\")\n    out = pd.DataFrame({\n        \"Commande\": joindre_par_groupe(d, \"PN\", \"Commande\"),\n        \"Code_acheteur\": joindre_par_groupe(d, \"PN\", \"Code_acheteur\"),\n    }).reindex(g.size().index)\n    out[\"Gestion_cmd\"] = g[\"Gestion_cmd\"].first()\n    out[\"Code_fournisseur_cmd\"] = joindre_par_groupe(d, \"PN\", \"Code_fournisseur_cmd\")\n    out[\"Fournisseur\"] = joindre_par_groupe(d, \"PN\", \"Fournisseur\")\n    out[\"PSD\"] = g[\"PSD_effective\"].min()\n    out[\"PSD_est_estimee\"] = g[\"PSD_est_estimee\"].first()\n    out[\"Statut\"] = joindre_par_groupe(d, \"PN\", \"Statut\")\n    out[\"Qty_restant_cmd\"] = g[\"Qty_restant\"].sum()\n    out[\"Nb_commandes\"] = g[\"Commande\"].nunique()\n    out[\"Class_code\"] = g[\"Class_code\"].first()\n    out[\"Has_risk_class\"] = d[\"Class_code\"].isin(CLASSES_RISQUE).groupby(d[\"PN\"]).any()\n    out[\"CCN_cmd\"] = g[\"CCN_cmd\"].first()\n    return out.reset_index()\n\n\n# --------------------------------------------------------------------------\n# Croisement besoins × stock × commandes et action recommandée\n# --------------------------------------------------------------------------\ndef _non_vide(s: pd.Series) -> pd.Series:\n    return s.notna() & (s.astype(str).str.strip() != \"\")\n\n\ndef croiser_geav(besoin: pd.DataFrame, stock: pd.DataFrame, commandes: pd.DataFrame,\n                 gestion_scope, date_chantier) -> pd.DataFrame:\n    \"\"\"Croise les trois sources (agrégées par PN) et calcule l'action recommandée.\n\n    - Deficit = max(0, QTY_GEAV - QTY_STOCK) : quantité manquante maintenant ;\n    - Qty_a_commander = max(0, Deficit - QTY_CDE) : quantité non couverte par les commandes ;\n    - la PSD est comparée à la date de début du chantier pour savoir si la livraison\n      arrivera à temps.\n    \"\"\"\n    date_chantier = pd.Timestamp(date_chantier)\n    m = besoin.copy()\n    m[\"GEAV_DATE\"] = date_chantier\n    if \"TRFX\" not in m.columns:\n        m[\"TRFX\"] = np.nan\n\n    m = m.merge(stock, on=\"PN\", how=\"left\")\n    # Gestion : celle du fichier Commandes fait foi, repli sur l'État du stock.\n    gest_cmd = commandes[[\"PN\", \"Gestion_cmd\"]].drop_duplicates(\"PN\")\n    m = m.merge(gest_cmd, on=\"PN\", how=\"left\")\n    m[\"GESTION\"] = m[\"Gestion_cmd\"].where(m[\"Gestion_cmd\"].notna(), m[\"GESTION\"])\n    m = m.drop(columns=[\"Gestion_cmd\"])\n    m[\"in_stock_file\"] = m[\"QTY_STOCK\"].notna() | m[\"QTY_CDE\"].notna()\n    m[[\"QTY_STOCK\", \"QTY_CDE\"]] = m[[\"QTY_STOCK\", \"QTY_CDE\"]].fillna(0)\n    m[\"gestion_in_scope\"] = m[\"GESTION\"].isin({float(g) for g in gestion_scope})\n\n    m = m.merge(commandes.drop(columns=[\"Gestion_cmd\"]), on=\"PN\", how=\"left\")\n    m[\"Deficit\"] = (m[\"QTY_GEAV\"] - m[\"QTY_STOCK\"]).clip(lower=0).astype(int)\n    m[\"Qty_a_commander\"] = (m[\"Deficit\"] - m[\"QTY_CDE\"]).clip(lower=0).astype(int)\n\n    m[\"FOURNISSEUR\"] = m[\"Fournisseur\"].where(_non_vide(m[\"Fournisseur\"]), m[\"DERNIER_FOURNISSEUR\"])\n    m[\"CODE_FOURNISSEUR\"] = m[\"CODE_FOURNISSEUR\"].where(m[\"CODE_FOURNISSEUR\"].notna(), m[\"Code_fournisseur_cmd\"])\n    # Le code acheteur du fichier Commandes fait foi ; repli sur CODE AGT APPRO.\n    m[\"CODE_ACHETEUR\"] = m[\"Code_acheteur\"].where(m[\"Code_acheteur\"].notna(), m[\"CODE_AGENT\"])\n    m[\"CCN\"] = m[\"CCN\"].where(m[\"CCN\"].notna(), m[\"CCN_cmd\"])\n    # Classe 8/9 : alerte si présente dans les commandes ou dans l'État du stock.\n    m[\"CLASS_CODE\"] = m[\"Class_code\"].where(m[\"Class_code\"].isin(CLASSES_RISQUE), m[\"CLASS_CODE_STOCK\"])\n    m[\"CLASS_CODE\"] = m[\"CLASS_CODE\"].where(m[\"CLASS_CODE\"].notna(), m[\"Class_code\"])\n    m[\"RISK_CLASS\"] = m[\"CLASS_CODE\"].isin(CLASSES_RISQUE) | m[\"Has_risk_class\"].eq(True)\n\n    code, message = _actions(m)\n    m[\"ACTION\"] = message\n    m[\"ACTION_CODE\"] = code\n    risque = m[\"RISK_CLASS\"] & (m[\"ACTION_CODE\"] != \"inconnu\")\n    m.loc[risque, \"ACTION\"] = \"🚨 CLASSE 8/9 — PRIORITÉ : \" + m.loc[risque, \"ACTION\"]\n    return m\n\n\ndef _actions(m: pd.DataFrame):\n    \"\"\"(codes, messages) de l'action recommandée, ligne à ligne mais vectorisé.\"\"\"\n    agent = m[\"CODE_ACHETEUR\"].where(m[\"CODE_ACHETEUR\"].notna(), \"?\").astype(str)\n    fourn = (m[\"FOURNISSEUR\"].where(_non_vide(m[\"FOURNISSEUR\"]),\n                                    m[\"CODE_FOURNISSEUR\"].where(_non_vide(m[\"CODE_FOURNISSEUR\"]),\n                                                                \"fournisseur inconnu\"))\n             .astype(str))\n    psd = pd.to_datetime(m[\"PSD\"])\n    psd_txt = psd.dt.strftime(\"%d/%m/%Y\")\n    psd_manquante = psd.notna() & (psd.dt.year == ANNEE_PSD_NON_FOURNIE)\n    psd_tardive = (m[\"GEAV_DATE\"].notna() & psd.notna()\n                   & (psd.dt.normalize() > m[\"GEAV_DATE\"].dt.normalize()) & ~psd_manquante)\n    gestion = m[\"GESTION\"].map(lambda g: \"?\" if pd.isna(g) else str(int(g)))\n    deficit = m[\"Deficit\"].astype(str)\n    a_cmd = m[\"Qty_a_commander\"].astype(str)\n    contact = \" (contact: \" + agent + \")\"\n\n    regles = [  # (condition, code, message) — la première condition vraie l'emporte\n        (~m[\"in_stock_file\"], \"inconnu\",\n         pd.Series(\"❓ PN introuvable dans le fichier État du stock (à vérifier manuellement)\", index=m.index)),\n        (~m[\"gestion_in_scope\"], \"hors_perimetre\",\n         \"⚠️ Besoin de \" + deficit + \" — Gestion \" + gestion + \" hors périmètre (contacter \" + agent + \")\"),\n        ((m[\"Qty_a_commander\"] > 0) & (m[\"QTY_CDE\"] > 0), \"commander\",\n         \"🔴 Commander le complément (\" + a_cmd + \") + relancer \" + fourn + contact),\n        (m[\"Qty_a_commander\"] > 0, \"commander\",\n         \"🔴 Commander \" + a_cmd + \" — aucune commande en cours\" + contact),\n        (m[\"Deficit\"] <= 0, \"ok\",\n         pd.Series(\"🟢 Stock suffisant — aucune action\", index=m.index)),\n        (psd.isna() | psd_manquante, \"relancer\",\n         \"🟠 Relancer \" + fourn + \" — commande en cours, PSD manquante ou à confirmer\" + contact),\n        (psd_tardive, \"relancer_urgent\",\n         \"🔴 Relancer \" + fourn + \" — PSD \" + psd_txt.fillna(\"\") + \" après la date limite GEAV\" + contact),\n        (pd.Series(True, index=m.index), \"en_cours\",\n         \"🔵 Livraison en cours — PSD \" + psd_txt.fillna(\"\") + \" (\" + fourn + \")\"),\n    ]\n    code = pd.Series(None, index=m.index, dtype=object)\n    message = pd.Series(None, index=m.index, dtype=object)\n    for cond, c, msg in regles:\n        libre = code.isna() & cond.fillna(False).astype(bool)\n        code[libre] = c\n        message[libre] = msg[libre]\n    return code, message\n\n\n# --------------------------------------------------------------------------\n# Synthèse et priorisation\n# --------------------------------------------------------------------------\ndef synthese_geav(m_scope: pd.DataFrame) -> dict:\n    codes = m_scope[\"ACTION_CODE\"]\n    return {\n        \"n_total\": int(len(m_scope)),\n        \"n_commander\": int((codes == \"commander\").sum()),\n        \"qty_a_commander\": int(m_scope.loc[codes == \"commander\", \"Qty_a_commander\"].sum()),\n        \"n_relance\": int(codes.isin([\"relancer\", \"relancer_urgent\"]).sum()),\n        \"n_relance_urgente\": int((codes == \"relancer_urgent\").sum()),\n        \"n_en_cours\": int((codes == \"en_cours\").sum()),\n        \"n_ok\": int((codes == \"ok\").sum()),\n        \"n_inconnu\": int((codes == \"inconnu\").sum()),\n        \"n_risque\": int(m_scope[\"RISK_CLASS\"].sum()),\n    }\n\n\ndef actions_a_lancer(m_scope: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Lignes qui demandent une action, du pire au meilleur : classe 8/9 d'abord,\n    puis commander > relance urgente > relancer > PN introuvable, puis quantité.\"\"\"\n    a = m_scope[m_scope[\"ACTION_CODE\"].isin(ACTIONS_A_LANCER)].copy()\n    a[\"_ordre\"] = a[\"ACTION_CODE\"].map({c: i for i, c in enumerate(ACTION_ORDRE)})\n    a = a.sort_values([\"RISK_CLASS\", \"_ordre\", \"Qty_a_commander\", \"PSD\"],\n                      ascending=[False, True, False, True], kind=\"stable\")\n    return a.drop(columns=\"_ordre\")\n\n\ndef jours_avant(date_debut, aujourd_hui) -> int:\n    return int((pd.Timestamp(date_debut).normalize() - pd.Timestamp(aujourd_hui).normalize()).days)\n", "app/main.py": "\"\"\"Point d'entrée Supply360 : configuration de page, style, header et navigation.\n\nFonctionne à l'identique avec `streamlit run app/main.py` et dans le HTML stlite.\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\n# Rend `core` et `modules` importables, que l'app tourne sous Streamlit ou stlite.\n_APP_DIR = str(Path(__file__).resolve().parent)\nif _APP_DIR not in sys.path:\n    sys.path.insert(0, _APP_DIR)\n\nimport streamlit as st  # noqa: E402\n\nst.set_page_config(page_title=\"Supply360 · Air France Industries\", page_icon=\"✈️\",\n                   layout=\"wide\", initial_sidebar_state=\"collapsed\")\n\nfrom core import components as ui  # noqa: E402\nfrom core import style  # noqa: E402\nfrom modules import MODULES  # noqa: E402\n\nPAR_ID = {m.TAB_ID: m for m in MODULES}\nassert len(PAR_ID) == len(MODULES), \"TAB_ID en double dans le registre des modules\"\n\nif st.session_state.get(\"active_tab\") not in PAR_ID:\n    st.session_state[\"active_tab\"] = MODULES[0].TAB_ID\n\n\ndef _changer_onglet() -> None:\n    st.session_state[\"active_tab\"] = st.session_state[\"s360_nav\"]\n\n\nstyle.inject()\nactif = PAR_ID[st.session_state[\"active_tab\"]]\nui.header(f\"{actif.TAB_ICON} {actif.TAB_LABEL}\")\n\n# Sélecteur horizontal : seul l'onglet actif est exécuté (contrairement à st.tabs).\nst.segmented_control(\n    \"Onglet\",\n    options=list(PAR_ID),\n    format_func=lambda tab_id: f\"{PAR_ID[tab_id].TAB_ICON} {PAR_ID[tab_id].TAB_LABEL}\",\n    default=st.session_state[\"active_tab\"],\n    required=True,\n    key=\"s360_nav\",\n    on_change=_changer_onglet,\n    label_visibility=\"collapsed\",\n)\n\nactif.render()\nui.footer()\n", "app/modules/__init__.py": "\"\"\"Registre des onglets de Supply360, dans l'ordre d'affichage.\n\nAjouter un onglet = créer `app/modules/<tab_id>.py` (contrat : TAB_ID, TAB_LABEL, TAB_ICON,\nTAB_DESCRIPTION, render()) puis l'ajouter à MODULES ci-dessous.\n\"\"\"\n\nfrom modules import stock_chantier\n\nMODULES = [\n    stock_chantier,\n]\n", "app/modules/stock_chantier.py": "\"\"\"Onglet « Stock par chantier » : croisement besoins chantier (GEAV) × état du stock × commandes.\n\nRepris de legacy/streamlit_GEAV.py. Identifie les pièces à commander et les fournisseurs\nà relancer pour sécuriser les équipements avant le début du chantier.\n\"\"\"\n\nfrom datetime import date\n\nimport pandas as pd\nimport plotly.graph_objects as go\nimport streamlit as st\n\nfrom core import components as ui\nfrom core import io as sio\nfrom core import transforms as tf\nfrom core.style import COLORS\n\nTAB_ID = \"stock_chantier\"\nTAB_LABEL = \"Stock par chantier\"\nTAB_ICON = \"🛠️\"\nTAB_DESCRIPTION = (\"Croise les besoins d'un chantier (GEAV) avec l'état du stock et les commandes \"\n                   \"pour lister les pièces à commander et les fournisseurs à relancer avant le début du chantier.\")\n\nK = f\"{TAB_ID}__\"  # préfixe des clés de widgets / session\n\nGESTIONS_DEFAUT = [245, 246, 247, 400, 401, 230]\nGESTIONS_PROPOSEES = sorted(set(GESTIONS_DEFAUT) | {230, 245, 246, 247, 251, 256, 300, 375, 400, 401, 443, 487, 500})\n\nETUDE_CLASSIQUE = \"Classique\"\nETUDE_ASREQ = \"ASREQ/NOREQ\"\n\nCOLONNES_ATTENDUES = {\n    ETUDE_CLASSIQUE: [\n        (\"MPN Prime\", \"référence pièce (clé de croisement)\", True),\n        (\"Qty\", \"quantité requise\", True),\n        (\"Task TRFX / Task Name / Task WP Line\", \"code TRFX\", False),\n        (\"Description\", \"\", False),\n    ],\n    ETUDE_ASREQ: [\n        (\"PN + infos pièce sortie\", \"référence pièce, feuille « Ordered »\", True),\n        (\"Qty\", \"quantité requise\", True),\n        (\"ID BARECODE\", \"code TRFX\", False),\n    ],\n    \"stock\": [\n        (\"PNR\", \"référence pièce\", True),\n        (\"QTE SUR ÉTAGÈRE\", \"stock disponible\", True),\n        (\"QTE EN CDE\", \"quantité en commande\", False),\n        (\"GESTION\", \"code de gestion\", False),\n        (\"CODE AGT APPRO\", \"contact par défaut\", False),\n        (\"CODE FOURNISSEUR / DERNIER FOURNISSEUR\", \"\", False),\n        (\"CCN, CLASS CODE, Description\", \"\", False),\n    ],\n    \"commandes\": [\n        (\"PN\", \"référence pièce\", True),\n        (\"Commande\", \"n° de commande\", False),\n        (\"Code acheteur\", \"\", False),\n        (\"Gestion\", \"fait foi sur l'État du stock\", False),\n        (\"Fournisseur / Code fournisseur\", \"\", False),\n        (\"Date de livraison promise (PSD)\", \"à défaut : date de livraison demandée\", False),\n        (\"Statut, Quantité restant à livrer, Class code, CCN\", \"\", False),\n    ],\n}\n\nCOLONNES_TABLEAU = {\n    \"PN\": \"PN\",\n    \"CCN\": \"CCN\",\n    \"TRFX\": \"TRFX\",\n    \"QTY_GEAV\": \"QTY GEAV\",\n    \"QTY_STOCK\": \"QTY en stock\",\n    \"QTY_CDE\": \"QTY en cmd\",\n    \"Qty_a_commander\": \"QTY à commander\",\n    \"STATUT\": \"Statut\",\n    \"ACTION\": \"Action\",\n    \"PSD\": \"PSD\",\n    \"FOURNISSEUR\": \"Fournisseur\",\n    \"CODE_FOURNISSEUR\": \"Code fournisseur\",\n    \"CODE_ACHETEUR\": \"Code acheteur\",\n    \"Commande\": \"N° Commande\",\n    \"GESTION\": \"Gestion\",\n    \"CLASS_CODE\": \"Class code\",\n    \"GEAV_DATE\": \"Date chantier\",\n}\n\nCOLUMN_CONFIG = {\n    \"PSD\": st.column_config.DateColumn(\"PSD\", format=\"DD/MM/YYYY\"),\n    \"Date chantier\": st.column_config.DateColumn(\"Date chantier\", format=\"DD/MM/YYYY\"),\n    \"Gestion\": st.column_config.NumberColumn(\"Gestion\", format=\"%d\"),\n    \"Class code\": st.column_config.NumberColumn(\"Class code\", format=\"%d\"),\n    \"QTY GEAV\": st.column_config.NumberColumn(\"QTY GEAV\", format=\"%d\"),\n    \"QTY en stock\": st.column_config.NumberColumn(\"QTY en stock\", format=\"%d\"),\n    \"QTY en cmd\": st.column_config.NumberColumn(\"QTY en cmd\", format=\"%d\"),\n    \"QTY à commander\": st.column_config.NumberColumn(\"QTY à commander\", format=\"%d\"),\n    \"Action\": st.column_config.TextColumn(\"Action\", width=\"large\"),\n    \"Statut\": st.column_config.TextColumn(\"Statut\", width=\"medium\"),\n}\n\n\n# --------------------------------------------------------------------------\n# Lectures mises en cache (une fois par fichier importé)\n# --------------------------------------------------------------------------\n@st.cache_data(show_spinner=False, max_entries=8)\ndef _besoins(data: bytes, etude: str):\n    lignes, feuille = (sio.lire_besoins_geav if etude == ETUDE_CLASSIQUE else sio.lire_besoins_asreq)(data)\n    return tf.agreger_besoins(lignes), feuille\n\n\n@st.cache_data(show_spinner=False, max_entries=4)\ndef _stock(data: bytes):\n    lignes, feuille = sio.lire_etat_stock(data)\n    return tf.agreger_stock(lignes), feuille\n\n\n@st.cache_data(show_spinner=False, max_entries=4)\ndef _commandes(data: bytes):\n    lignes, feuille = sio.lire_commandes_sap(data)\n    return tf.agreger_commandes(lignes), feuille\n\n\n@st.cache_data(show_spinner=False, max_entries=8)\ndef _croiser(besoin, stock, commandes, gestion_scope: tuple, date_chantier: date):\n    return tf.croiser_geav(besoin, stock, commandes, gestion_scope, pd.Timestamp(date_chantier))\n\n\ndef tableau(m: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Vue d'affichage / d'export : colonnes renommées, statut court.\"\"\"\n    v = m.assign(STATUT=m[\"ACTION_CODE\"].map(tf.ACTION_LABELS))\n    return v[list(COLONNES_TABLEAU)].rename(columns=COLONNES_TABLEAU)\n\n\n@st.cache_data(show_spinner=False, max_entries=4)\ndef _export(m: pd.DataFrame, m_scope: pd.DataFrame, params: dict) -> bytes:\n    s = tf.synthese_geav(m_scope)\n    synthese = pd.DataFrame(\n        [\n            (\"Type d'étude\", params[\"etude\"]),\n            (\"Date de début du chantier\", f\"{params['date']:%d/%m/%Y}\"),\n            (\"Codes Gestion du périmètre\", \", \".join(str(g) for g in params[\"gestions\"])),\n            (\"Date de l'analyse\", f\"{date.today():%d/%m/%Y}\"),\n            (\"Références (périmètre)\", s[\"n_total\"]),\n            (\"À commander (références)\", s[\"n_commander\"]),\n            (\"À commander (unités)\", s[\"qty_a_commander\"]),\n            (\"À relancer (dont urgentes)\", f\"{s['n_relance']} ({s['n_relance_urgente']})\"),\n            (\"En cours de livraison\", s[\"n_en_cours\"]),\n            (\"Stock suffisant\", s[\"n_ok\"]),\n            (\"PN introuvables\", s[\"n_inconnu\"]),\n            (\"Références classe 8/9\", s[\"n_risque\"]),\n        ],\n        columns=[\"Indicateur\", \"Valeur\"],\n    )\n    actions = tf.actions_a_lancer(m_scope)\n    detail = m_scope.sort_values(\"Qty_a_commander\", ascending=False, kind=\"stable\")\n    annexe = m.sort_values(\"Qty_a_commander\", ascending=False, kind=\"stable\")\n\n    def fills(d):\n        return d[\"ACTION_CODE\"].map(tf.ACTION_FILL_HEX).tolist()\n\n    return sio.exporter_excel(\n        {\"Synthèse\": synthese, \"Actions à lancer\": tableau(actions), \"Détail\": tableau(detail),\n         \"Annexe (toutes réf.)\": tableau(annexe)},\n        couleurs_lignes={\"Actions à lancer\": fills(actions), \"Détail\": fills(detail),\n                         \"Annexe (toutes réf.)\": fills(annexe)},\n    )\n\n\n# --------------------------------------------------------------------------\n# Rendu\n# --------------------------------------------------------------------------\ndef _liste_colonnes(cle: str) -> None:\n    with st.expander(\"Colonnes attendues\"):\n        lignes = []\n        for nom, aide, obligatoire in COLONNES_ATTENDUES[cle]:\n            tag = \"**obligatoire**\" if obligatoire else \"facultatif\"\n            lignes.append(f\"- `{nom}` — {tag}\" + (f\" · {aide}\" if aide else \"\"))\n        st.markdown(\"\\n\".join(lignes))\n        st.caption(\"Détection automatique, insensible aux accents et majuscules : \"\n                   \"la feuille et la ligne d'en-tête sont trouvées seules.\")\n\n\ndef _bloc_import():\n    with ui.section(f\"{TAB_ID}_import\", \"1 · Import des fichiers et paramètres\",\n                    \"Importez les trois fichiers : l'analyse se lance automatiquement.\"):\n        p1, p2, p3 = st.columns([1.1, 1, 2])\n        etude = p1.radio(\"Type d'étude\", [ETUDE_CLASSIQUE, ETUDE_ASREQ], horizontal=True, key=K + \"etude\",\n                         help=\"Les fichiers État du stock et Commandes sont communs aux deux études.\")\n        date_chantier = p2.date_input(\"Date de début du chantier\", value=date.today(), format=\"DD/MM/YYYY\",\n                                      key=K + \"date\",\n                                      help=\"Sert à vérifier que les commandes en cours arriveront à temps.\")\n        gestions = p3.multiselect(\"Codes Gestion du périmètre\", GESTIONS_PROPOSEES, default=GESTIONS_DEFAUT,\n                                  key=K + \"gestions\", placeholder=\"Choisir les codes Gestion\",\n                                  help=\"Seuls ces codes entrent dans l'analyse principale ; \"\n                                       \"les autres sont listés en annexe.\")\n\n        c1, c2, c3 = st.columns(3)\n        with c1:\n            if etude == ETUDE_CLASSIQUE:\n                f_besoin = st.file_uploader(f\"① {sio.FICHIER_BESOINS}\", type=[\"xlsx\", \"xlsm\"],\n                                            key=K + \"besoin_classique\")\n            else:\n                f_besoin = st.file_uploader(f\"① {sio.FICHIER_ASREQ} (.xlsm, feuille « Ordered »)\",\n                                            type=[\"xlsm\", \"xlsx\"], key=K + \"besoin_asreq\")\n            _liste_colonnes(etude)\n        with c2:\n            f_stock = st.file_uploader(f\"② {sio.FICHIER_STOCK}\", type=[\"xlsx\", \"xlsm\"], key=K + \"stock_file\")\n            _liste_colonnes(\"stock\")\n        with c3:\n            f_cmd = st.file_uploader(f\"③ {sio.FICHIER_COMMANDES}\", type=[\"xlsx\", \"xlsm\"], key=K + \"cmd_file\")\n            _liste_colonnes(\"commandes\")\n    return etude, date_chantier, gestions, f_besoin, f_stock, f_cmd\n\n\ndef _figure_actions(m_scope: pd.DataFrame):\n    # « Hors périmètre » est exclu : par construction il n'y en a pas dans le périmètre.\n    codes = [c for c in tf.ACTION_ORDRE if c != \"hors_perimetre\"]\n    counts = m_scope[\"ACTION_CODE\"].value_counts().reindex(codes, fill_value=0)\n    fig = go.Figure(go.Bar(\n        x=counts.values,\n        y=[tf.ACTION_LABELS[c].split(\" \", 1)[1] for c in codes],\n        orientation=\"h\",\n        marker_color=[COLORS[tf.ACTION_TONES[c]] for c in codes],\n        text=counts.values,\n        textposition=\"outside\",\n        cliponaxis=False,\n        hovertemplate=\"<b>%{y}<\/b><br>%{x} référence(s)<extra><\/extra>\",\n    ))\n    ui.style_figure(fig, height=340)\n    fig.update_layout(showlegend=False, bargap=0.35)\n    fig.update_yaxes(autorange=\"reversed\", showgrid=False)\n    fig.update_xaxes(title_text=\"Nombre de références\", rangemode=\"tozero\")\n    return fig\n\n\ndef _bouton_export(data: bytes, cle: str) -> None:\n    st.download_button(\"⬇️ Télécharger l'analyse (Excel)\", data=data, file_name=sio.nom_export(TAB_ID),\n                       mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n                       key=K + cle, width=\"content\")\n\n\ndef render() -> None:\n    ui.page_intro(\n        \"Stock par chantier — GEAV\",\n        TAB_DESCRIPTION,\n        [f\"{sio.FICHIER_BESOINS} ou {sio.FICHIER_ASREQ}\", sio.FICHIER_STOCK, sio.FICHIER_COMMANDES],\n    )\n    etude, date_chantier, gestions, f_besoin, f_stock, f_cmd = _bloc_import()\n\n    fichiers = [(f_besoin, sio.FICHIER_BESOINS if etude == ETUDE_CLASSIQUE else sio.FICHIER_ASREQ),\n                (f_stock, sio.FICHIER_STOCK), (f_cmd, sio.FICHIER_COMMANDES)]\n    if not all(f for f, _ in fichiers):\n        etapes = [(\"✅ \" if f else \"\") + f\"<b>{nom}<\/b>\" + (f\" — {f.name}\" if f else \" — à importer\")\n                  for f, nom in fichiers]\n        ui.empty_state(\"Importez vos fichiers pour lancer l'analyse\",\n                       \"Les trois fichiers sont nécessaires. Ils restent sur votre poste : \"\n                       \"rien n'est envoyé sur un serveur.\", etapes)\n        return\n    if not gestions:\n        ui.callout(\"Sélectionnez au moins un <b>code Gestion<\/b> pour définir le périmètre de l'analyse.\",\n                   \"warn\", \"⚠️\")\n        return\n\n    try:\n        with st.spinner(\"Lecture et croisement des fichiers…\"):\n            besoin, feuille_b = _besoins(f_besoin.getvalue(), etude)\n            stock, feuille_s = _stock(f_stock.getvalue())\n            commandes, feuille_c = _commandes(f_cmd.getvalue())\n            m = _croiser(besoin, stock, commandes, tuple(sorted(gestions)), date_chantier)\n    except ValueError as exc:  # ColonneIntrouvable, FichierIllisible\n        ui.callout(f\"<b>Import impossible.<\/b> {exc}\", \"ko\", \"⛔\")\n        return\n\n    st.caption(f\"Feuilles détectées — besoins : **{feuille_b}** · état du stock : **{feuille_s}** · \"\n               f\"commandes : **{feuille_c}** · analyse du {date.today():%d/%m/%Y}\")\n\n    m_scope = m[m[\"gestion_in_scope\"]].copy()\n    s = tf.synthese_geav(m_scope)\n    export = _export(m, m_scope, {\"etude\": etude, \"date\": date_chantier, \"gestions\": sorted(gestions)})\n\n    # ---- Synthèse ----\n    with ui.section(f\"{TAB_ID}_synthese\", \"2 · Synthèse\",\n                    f\"Étude {etude} · {len(m)} référence(s) au total, {s['n_total']} dans le périmètre\"):\n        j = tf.jours_avant(date_chantier, date.today())\n        statut = (ui.chantier_badge(\"À venir\", j) if j > 0\n                  else ui.badge(f\"Début le {date_chantier:%d/%m/%Y}\" + (\" (aujourd'hui)\" if j == 0 else \"\"), \"muted\"))\n        echeance = f\"avant le {date_chantier:%d/%m/%Y}\"\n        if s[\"n_commander\"] or s[\"n_relance\"]:\n            urgentes = f\" dont {s['n_relance_urgente']} urgente(s)\" if s[\"n_relance_urgente\"] else \"\"\n            ui.callout(\n                f\"Chantier du <b>{date_chantier:%d/%m/%Y}<\/b> {statut}<br>\"\n                f\"<b>{s['n_commander']} référence(s) à commander<\/b> ({s['qty_a_commander']} unités) et \"\n                f\"<b>{s['n_relance']} relance(s) fournisseur<\/b>{urgentes} {echeance}.\",\n                \"ko\" if s[\"n_commander\"] else \"warn\", \"📌\")\n        else:\n            ui.callout(f\"Chantier du <b>{date_chantier:%d/%m/%Y}<\/b> {statut}<br>\"\n                       \"Aucune commande ni relance à lancer sur le périmètre.\", \"ok\", \"✅\")\n        if s[\"n_risque\"]:\n            risques = m_scope.loc[m_scope[\"RISK_CLASS\"], \"PN\"].unique()\n            extrait = \", \".join(risques[:5]) + (\"…\" if len(risques) > 5 else \"\")\n            ui.callout(f\"<b>{s['n_risque']} référence(s) classe 8/9<\/b> : pièces critiques, vérifier \"\n                       f\"délais et stocks en priorité. {extrait}\", \"accent\", \"🚨\")\n\n        ui.kpi_grid([\n            ui.kpi_card(\"Références (périmètre)\", s[\"n_total\"], f\"{len(m) - s['n_total']} hors périmètre\"),\n            ui.kpi_card(\"À commander\", s[\"n_commander\"], f\"{s['qty_a_commander']} unités\", \"ko\"),\n            ui.kpi_card(\"À relancer\", s[\"n_relance\"], f\"dont {s['n_relance_urgente']} urgente(s)\", \"warn\"),\n            ui.kpi_card(\"En cours de livraison\", s[\"n_en_cours\"], \"PSD avant le chantier\", \"info\"),\n            ui.kpi_card(\"Stock suffisant\", s[\"n_ok\"], \"aucune action\", \"ok\"),\n        ])\n        _bouton_export(export, \"export_haut\")\n\n    # ---- Actions à lancer ----\n    actions = tf.actions_a_lancer(m_scope)\n    with ui.section(f\"{TAB_ID}_actions\", f\"3 · Actions à lancer ({len(actions)})\",\n                    \"Du plus urgent au moins urgent : classe 8/9, commandes à passer, relances, PN à vérifier.\"):\n        if actions.empty:\n            ui.callout(\"Aucune action à lancer : le besoin du périmètre est couvert.\", \"ok\", \"✅\")\n        else:\n            st.dataframe(tableau(actions), hide_index=True, column_config=COLUMN_CONFIG,\n                         height=min(38 + 35 * len(actions), 420), key=K + \"actions_df\")\n        if s[\"n_inconnu\"]:\n            st.caption(f\"❓ {s['n_inconnu']} PN introuvable(s) dans l'État du stock : à vérifier manuellement \"\n                       \"(erreur de saisie, pièce obsolète ?).\")\n\n    # ---- Répartition + tableau croisé ----\n    with ui.section(f\"{TAB_ID}_detail\", \"4 · Détail du périmètre\",\n                    f\"Codes Gestion : {', '.join(str(g) for g in sorted(gestions))}\"):\n        st.plotly_chart(_figure_actions(m_scope), config=ui.PLOTLY_CONFIG, key=K + \"fig_actions\")\n\n        f1, f2 = st.columns([1, 2])\n        recherche = f1.text_input(\"🔎 Rechercher un PN\", key=K + \"recherche\")\n        filtre = f2.multiselect(\"Filtrer par action\", options=tf.ACTION_ORDRE,\n                                format_func=lambda c: tf.ACTION_LABELS[c], key=K + \"filtre_action\",\n                                placeholder=\"Toutes les actions\")\n        vue = m_scope\n        if recherche:\n            vue = vue[vue[\"PN\"].str.contains(recherche.strip().upper(), na=False, regex=False)]\n        if filtre:\n            vue = vue[vue[\"ACTION_CODE\"].isin(filtre)]\n        vue = vue.sort_values(\"Qty_a_commander\", ascending=False, kind=\"stable\")\n        st.markdown(f\"**{len(vue)} référence(s)** correspondant aux critères\")\n        st.dataframe(tableau(vue), hide_index=True, column_config=COLUMN_CONFIG, height=440,\n                     key=K + \"detail_df\")\n\n        with st.expander(f\"📎 Annexe — toutes les références ({len(m)}), y compris hors périmètre\"):\n            annexe = m.sort_values(\"Qty_a_commander\", ascending=False, kind=\"stable\")\n            st.dataframe(tableau(annexe), hide_index=True, column_config=COLUMN_CONFIG,\n                         key=K + \"annexe_df\")\n        _bouton_export(export, \"export_bas\")\n        st.caption(\"L'export contient les feuilles Synthèse, Actions à lancer, Détail (périmètre complet, \"\n                   \"sans les filtres ci-dessus) et Annexe, surlignées par action.\")\n\n    _aide()\n\n\ndef _aide() -> None:\n    with st.expander(\"📖 Règles de calcul et légende des actions\"):\n        st.markdown(f\"\"\"\n**Croisement** (clé : PN en majuscules, espaces de début et de fin retirés)\n\n1. Besoins chantier + État du stock → stock sur étagère, quantité en commande, gestion, agent appro.\n2. + Commandes (SAP) → n° de commande, acheteur, fournisseur, **PSD la plus proche** (à défaut : date de\n   livraison demandée). La gestion du fichier Commandes fait foi sur celle de l'État du stock.\n3. Les doublons du fichier besoins sont **additionnés** par PN.\n\n**Quantités**\n\n| Variable | Formule |\n|---|---|\n| Déficit | max(0, QTY GEAV − QTY en stock) |\n| QTY à commander | max(0, Déficit − QTY en cmd) |\n\n**Action recommandée** (la première règle vérifiée l'emporte)\n\n| Statut | Condition |\n|---|---|\n| {tf.ACTION_LABELS['inconnu']} | PN absent de l'État du stock |\n| {tf.ACTION_LABELS['hors_perimetre']} | code Gestion hors du périmètre sélectionné (annexe) |\n| {tf.ACTION_LABELS['commander']} | QTY à commander > 0 (avec relance si une commande existe déjà) |\n| {tf.ACTION_LABELS['ok']} | Déficit = 0 |\n| {tf.ACTION_LABELS['relancer']} | déficit couvert par une commande sans PSD (ou PSD {tf.ANNEE_PSD_NON_FOURNIE} = non fournie) |\n| {tf.ACTION_LABELS['relancer_urgent']} | PSD postérieure à la date de début du chantier |\n| {tf.ACTION_LABELS['en_cours']} | PSD avant ou le jour du début du chantier |\n\nLes références **classe 8 ou 9** (fichier Commandes ou État du stock) sont préfixées\n« 🚨 CLASSE 8/9 — PRIORITÉ » et remontent en tête des actions.\n\"\"\")\n", ".streamlit/config.toml": "[theme]\nbase = \"light\"\nprimaryColor = \"#002157\"\nbackgroundColor = \"#F4F6FA\"\nsecondaryBackgroundColor = \"#EEF2F8\"\ntextColor = \"#1A1F36\"\nfont = \"sans serif\"\n\n[client]\ntoolbarMode = \"minimal\"\nshowSidebarNavigation = false\n\n[browser]\ngatherUsageStats = false\n"},
    streamlitConfig: {"theme.base": "light", "theme.primaryColor": "#002157", "theme.backgroundColor": "#F4F6FA", "theme.secondaryBackgroundColor": "#EEF2F8", "theme.textColor": "#1A1F36", "theme.font": "sans serif", "client.toolbarMode": "minimal", "client.showSidebarNavigation": false},
    disableProgressToasts: true,
  },
  document.getElementById("root"),
);

// Masque l'écran de chargement dès que l'app (ou une erreur) est affichée.
const ecran = document.getElementById("s360-loading");
const pret = () => document.querySelector(".s360-header, .stException, [data-testid='stException']");
const obs = new MutationObserver(() => {
  if (pret()) { ecran.classList.add("fini"); obs.disconnect(); }
});
obs.observe(document.body, { childList: true, subtree: true });
setTimeout(() => { if (!pret()) ecran.classList.add("lent"); }, 120000);
</script>
