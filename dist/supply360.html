"/>\")\n            for n, fi, fo in self.xfs)\n        return ('<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n                '<styleSheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\">'\n                f'<numFmts count=\"1\"><numFmt numFmtId=\"{self.FMT_DATE}\" formatCode=\"dd/mm/yyyy\"/><\/numFmts>'\n                '<fonts count=\"2\"><font><sz val=\"11\"/><name val=\"Calibri\"/><family val=\"2\"/><\/font>'\n                '<font><b/><sz val=\"11\"/><color rgb=\"FFFFFFFF\"/><name val=\"Calibri\"/><family val=\"2\"/><\/font><\/fonts>'\n                f'<fills count=\"{len(fills)}\">{\"\".join(fills)}<\/fills>'\n                '<borders count=\"1\"><border><left/><right/><top/><bottom/><diagonal/><\/border><\/borders>'\n                '<cellStyleXfs count=\"1\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\"/><\/cellStyleXfs>'\n                f'<cellXfs count=\"{len(self.xfs)}\">{xfs}<\/cellXfs>'\n                '<cellStyles count=\"1\"><cellStyle name=\"Normal\" xfId=\"0\" builtinId=\"0\"/><\/cellStyles>'\n                '<\/styleSheet>')\n\n\ndef _valeur(v):\n    \"\"\"(type, valeur XML) d'une cellule ou None si vide.\"\"\"\n    if v is None or v is pd.NaT:\n        return None\n    if isinstance(v, (pd.Timestamp, datetime, date, np.datetime64)):\n        ts = pd.Timestamp(v)\n        if pd.isna(ts):\n            return None\n        ts = ts.tz_localize(None) if ts.tzinfo else ts\n        return \"d\", (ts.to_pydatetime() - EPOCH).total_seconds() / 86400\n    if isinstance(v, (bool, np.bool_)):\n        return \"b\", \"1\" if v else \"0\"\n    if isinstance(v, (int, float, np.integer, np.floating)):\n        f = float(v)\n        if math.isnan(f) or math.isinf(f):\n            return None\n        return \"n\", repr(int(f)) if f.is_integer() and abs(f) < 1e15 else repr(f)\n    s = str(v)\n    return (\"s\", s) if s else None\n\n\ndef _feuille(df: pd.DataFrame, styles: _Styles, fonds) -> tuple[str, str | None]:\n    ncols, nrows = len(df.columns), len(df)\n    largeurs = [len(str(c)) for c in df.columns]\n    lignes = []\n    entete = \"\".join(f'<c r=\"{_col(j + 1)}1\" t=\"inlineStr\" s=\"{styles.header}\"><is><t>{_xml_text(c)}<\/t><\/is><\/c>'\n                     for j, c in enumerate(df.columns))\n    lignes.append(f'<row r=\"1\">{entete}<\/row>')\n    for i, rec in enumerate(df.itertuples(index=False, name=None), start=2):\n        fond = fonds[i - 2] if fonds is not None else None\n        cells = []\n        for j, v in enumerate(rec):\n            ref = f\"{_col(j + 1)}{i}\"\n            val = _valeur(v)\n            if val is None:\n                if fond:\n                    cells.append(f'<c r=\"{ref}\" s=\"{styles.cellule(False, fond)}\"/>')\n                continue\n            t, x = val\n            if t == \"d\":\n                cells.append(f'<c r=\"{ref}\" s=\"{styles.cellule(True, fond)}\"><v>{x:.6f}<\/v><\/c>')\n                largeurs[j] = max(largeurs[j], 10)\n            elif t == \"s\":\n                st = styles.cellule(False, fond)\n                cells.append(f'<c r=\"{ref}\" t=\"inlineStr\"{f\" s={chr(34)}{st}{chr(34)}\" if st else \"\"}><is><t xml:space=\"preserve\">'\n                             f'{_xml_text(x)}<\/t><\/is><\/c>')\n                if i < 502:\n                    largeurs[j] = max(largeurs[j], len(x))\n            else:\n                st = styles.cellule(False, fond)\n                cells.append(f'<c r=\"{ref}\"{f\" t={chr(34)}b{chr(34)}\" if t == \"b\" else \"\"}'\n                             f'{f\" s={chr(34)}{st}{chr(34)}\" if st else \"\"}><v>{x}<\/v><\/c>')\n                if i < 502:\n                    largeurs[j] = max(largeurs[j], len(x))\n        lignes.append(f'<row r=\"{i}\">{\"\".join(cells)}<\/row>')\n    cols = \"\".join(f'<col min=\"{j + 1}\" max=\"{j + 1}\" width=\"{min(max(w + 2, 8), 60)}\" customWidth=\"1\"/>'\n                   for j, w in enumerate(largeurs))\n    ref_filtre = f\"A1:{_col(ncols)}{nrows + 1}\" if ncols and nrows else None\n    xml = ('<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n           '<worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" '\n           'xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\">'\n           '<sheetViews><sheetView workbookViewId=\"0\">'\n           '<pane ySplit=\"1\" topLeftCell=\"A2\" activePane=\"bottomLeft\" state=\"frozen\"/>'\n           '<selection pane=\"bottomLeft\" activeCell=\"A2\" sqref=\"A2\"/><\/sheetView><\/sheetViews>'\n           '<sheetFormatPr defaultRowHeight=\"15\"/>'\n           + (f\"<cols>{cols}<\/cols>\" if cols else \"\")\n           + f'<sheetData>{\"\".join(lignes)}<\/sheetData>'\n           + (f'<autoFilter ref=\"{ref_filtre}\"/>' if ref_filtre else \"\")\n           + '<\/worksheet>')\n    return xml, ref_filtre\n\n\ndef classeur(feuilles: dict, couleurs_lignes: dict | None = None) -> bytes:\n    \"\"\"{nom_feuille: DataFrame} → octets d'un fichier .xlsx. `couleurs_lignes` : {nom: [hexa|None]}.\"\"\"\n    styles = _Styles()\n    noms, xml_feuilles, filtres = [], [], []\n    for nom, df in feuilles.items():\n        nom31 = \"\".join(ch for ch in str(nom) if ch not in '[]:*?/\\\\')[:31] or \"Feuille\"\n        xml, ref = _feuille(df.reset_index(drop=True), styles, (couleurs_lignes or {}).get(nom))\n        noms.append(nom31)\n        xml_feuilles.append(xml)\n        filtres.append(ref)\n    n = len(noms)\n    sheets = \"\".join(f'<sheet name=\"{_xml_text(s)}\" sheetId=\"{i + 1}\" r:id=\"rId{i + 1}\"/>' for i, s in enumerate(noms))\n    defs = \"\".join(f'<definedName name=\"_xlnm._FilterDatabase\" localSheetId=\"{i}\" hidden=\"1\">'\n                   f\"'{_xml_text(s)}'!{':'.join(_abs(p) for p in ref.split(':'))}<\/definedName>\"\n                   for i, (s, ref) in enumerate(zip(noms, filtres)) if ref)\n    workbook = ('<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n                '<workbook xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" '\n                'xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\">'\n                f'<bookViews><workbookView/><\/bookViews><sheets>{sheets}<\/sheets>'\n                + (f\"<definedNames>{defs}<\/definedNames>\" if defs else \"\") + '<\/workbook>')\n    rels = \"\".join(f'<Relationship Id=\"rId{i + 1}\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet\" '\n                   f'Target=\"worksheets/sheet{i + 1}.xml\"/>' for i in range(n))\n    rels += (f'<Relationship Id=\"rId{n + 1}\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles\" '\n             'Target=\"styles.xml\"/>')\n    types = \"\".join(f'<Override PartName=\"/xl/worksheets/sheet{i + 1}.xml\" '\n                    'ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml\"/>' for i in range(n))\n    buf = io.BytesIO()\n    with zipfile.ZipFile(buf, \"w\", zipfile.ZIP_DEFLATED) as z:\n        z.writestr(\"[Content_Types].xml\",\n                   '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n                   '<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\">'\n                   '<Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/>'\n                   '<Default Extension=\"xml\" ContentType=\"application/xml\"/>'\n                   '<Override PartName=\"/xl/workbook.xml\" '\n                   'ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml\"/>'\n                   '<Override PartName=\"/xl/styles.xml\" '\n                   'ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml\"/>'\n                   f'{types}<\/Types>')\n        z.writestr(\"_rels/.rels\",\n                   '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n                   '<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">'\n                   '<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" '\n                   'Target=\"xl/workbook.xml\"/><\/Relationships>')\n        z.writestr(\"xl/workbook.xml\", workbook)\n        z.writestr(\"xl/_rels/workbook.xml.rels\",\n                   '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n                   f'<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">{rels}<\/Relationships>')\n        z.writestr(\"xl/styles.xml\", styles.xml())\n        for i, xml in enumerate(xml_feuilles):\n            z.writestr(f\"xl/worksheets/sheet{i + 1}.xml\", xml)\n    return buf.getvalue()\n\n\ndef _abs(ref: str) -> str:\n    \"\"\"« Q15 » → « $Q$15 ».\"\"\"\n    lettres = \"\".join(c for c in ref if c.isalpha())\n    return f\"${lettres}${ref[len(lettres):]}\"\n", "app/main.py": "\"\"\"Point d'entrée Supply360 : configuration de page, thème, header et navigation.\n\nFonctionne à l'identique avec `streamlit run app/main.py` et dans le HTML stlite.\n\"\"\"\n\nimport sys\nfrom pathlib import Path\n\n# Rend `core` et `modules` importables, que l'app tourne sous Streamlit ou stlite.\n_APP_DIR = str(Path(__file__).resolve().parent)\nif _APP_DIR not in sys.path:\n    sys.path.insert(0, _APP_DIR)\n\nimport streamlit as st  # noqa: E402\n\nst.set_page_config(page_title=\"Supply360 · Air France Industries\", page_icon=\"✈️\",\n                   layout=\"wide\", initial_sidebar_state=\"collapsed\")\n\nfrom core import components as ui  # noqa: E402\nfrom core import journal  # noqa: E402\nfrom core import style  # noqa: E402\nfrom modules import MODULES  # noqa: E402\n\njournal.installer()  # stlite : erreurs Python transmises au bandeau de diagnostic de la page\n\nPAR_ID = {m.TAB_ID: m for m in MODULES}\nassert len(PAR_ID) == len(MODULES), \"TAB_ID en double dans le registre des modules\"\n\n# L'onglet actif est porté par le sélecteur de navigation (clé s360_nav).\nif st.session_state.get(\"s360_nav\") not in PAR_ID:\n    st.session_state[\"s360_nav\"] = MODULES[0].TAB_ID\n\nstyle.inject()\nui.header()\nst.segmented_control(\n    \"Onglet\",\n    options=list(PAR_ID),\n    format_func=lambda tab_id: f\"{PAR_ID[tab_id].TAB_ICON} {PAR_ID[tab_id].TAB_LABEL}\",\n    required=True,\n    key=\"s360_nav\",\n    label_visibility=\"collapsed\",\n)\nst.session_state[\"active_tab\"] = st.session_state[\"s360_nav\"]\n\n# Seul l'onglet actif est exécuté (contrairement à st.tabs).\nPAR_ID[st.session_state[\"active_tab\"]].render()\nui.footer()\n", "app/modules/__init__.py": "\"\"\"Registre des onglets de Supply360, dans l'ordre d'affichage.\n\nAjouter un onglet = créer `app/modules/<tab_id>.py` (contrat : TAB_ID, TAB_LABEL, TAB_ICON,\nTAB_DESCRIPTION, render()) puis l'ajouter à MODULES.\n\"\"\"\n\nfrom modules import alertes, fournisseurs, pe_mousses, stock_chantier, textiles\n\nMODULES = [\n    stock_chantier,\n    textiles,\n    pe_mousses,\n    fournisseurs,   # en cours de développement\n    alertes,        # en cours de développement\n]\n", "app/modules/_planning_pe.py": "\"\"\"Sous-onglets « Avancement PE » et « Forecast » de l'onglet PE mousses : avancement de la politique d'entretien\ndes mousses de sièges (fichier PE mousses mensuel) et forecast des commandes (12 / 24 / 36 mois), par PN et par\nfournisseur.\n\nRendu seulement : les calculs sont dans core/pe.py. Fichier préfixé « _ » : ce n'est pas un onglet du registre.\n\"\"\"\n\nimport re\nfrom datetime import date\n\nimport pandas as pd\nimport streamlit as st\n\nfrom core import charts\nfrom core import components as ui\nfrom core import io as sio\nfrom core import pe\nfrom core.style import COLORS\n\nK = \"pe_mousses__\"\nELEMENTS = [\"J · Assise\", \"J · Dossier\", \"W · Assise\", \"Y · Assise\"]\nCOULEURS_ELEMENTS = {\"J · Assise\": COLORS[\"navy_2\"], \"J · Dossier\": \"#7FA7E0\", \"W · Assise\": \"#2A9D8F\", \"Y · Assise\": \"#F4A259\"}\nCFG = {\n    \"Dernier remplacement\": st.column_config.DateColumn(\"Dernier remplacement\", format=\"DD/MM/YYYY\"),\n    \"Échéance\": st.column_config.DateColumn(\"Échéance\", format=\"DD/MM/YYYY\"),\n    \"Prochaine visite\": st.column_config.DateColumn(\"Prochaine visite\", format=\"DD/MM/YYYY\"),\n    \"Date prévue\": st.column_config.DateColumn(\"Date prévue\", format=\"MM/YYYY\"),\n    \"Âge (mois)\": st.column_config.NumberColumn(\"Âge (mois)\", format=\"%d\"),\n    \"Rupture sans commande\": st.column_config.DateColumn(\"Rupture sans commande\", format=\"MM/YYYY\",\n                                                        help=\"Premier mois où le stock devient négatif sans nouvelle commande\"),\n    \"Prix (€)\": st.column_config.NumberColumn(\"Prix (€)\", format=\"%.0f €\"),\n    \"Valeur (€)\": st.column_config.NumberColumn(\"Valeur (€)\", format=\"%.0f €\"),\n    \"Stock\": st.column_config.NumberColumn(\"Stock\", format=\"%d\"),\n    \"En commande\": st.column_config.NumberColumn(\"En commande\", format=\"%d\"),\n    \"Stock de sécurité\": st.column_config.NumberColumn(\"Stock de sécurité\", format=\"%d\",\n                                                      help=\"% des avions de chaque flotte qui utilisent le PN (paramètre) × quantité par avion\"),\n    \"Besoin\": st.column_config.NumberColumn(\"Besoin\", format=\"%d\", help=\"Mousses à remplacer sur l'horizon\"),\n    \"À commander\": st.column_config.NumberColumn(\"À commander\", format=\"%d\",\n                                                help=\"Besoin + stock de sécurité − stock − commandes en cours (toutes, déjà passées)\"),\n    \"À avancer\": st.column_config.NumberColumn(\"À avancer\", format=\"%d\",\n                                              help=\"Commandes en cours promises après le mois où elles sont nécessaires : à relancer\"),\n    \"Avant\": st.column_config.DateColumn(\"Avant\", format=\"MM/YYYY\", help=\"Mois où la commande en cours est nécessaire\"),\n    \"Total\": st.column_config.NumberColumn(\"Total\", format=\"%d\"),\n}\nICONES_STATUT = {\"En retard\": \"🔴 En retard\", \"Délai toléré\": \"🟠 Délai toléré\", \"À faire < 3 mois\": \"🟡 À faire < 3 mois\",\n                 \"À faire < 12 mois\": \"🔵 À faire < 12 mois\", \"OK\": \"🟢 OK\"}\n\n\n# --------------------------------------------------------------------------\n# Paramètres (popover du bloc d'import)\n# --------------------------------------------------------------------------\ndef parametres() -> pe.ParamsPE:\n    \"\"\"Champs des paramètres du Planning PE (placés dans le popover « Paramètres » du bloc d'import).\"\"\"\n    d = pe.ParamsPE()\n    st.markdown(\"**Cycle de remplacement (mois)** · 0 = jamais remplacé\")\n    cols = st.columns(3)\n    cycles = []\n    for i, (cl, comp, mois) in enumerate(d.cycles):\n        v = cols[i % 3].number_input(f\"{cl} · {comp}\", 0, 240, mois, 6, key=f\"{K}cycle_{cl}_{comp}\", persist_state=\"page\")\n        cycles.append((cl, comp, int(v)))\n    a, b, c = st.columns(3)\n    tol = a.number_input(\"Délai toléré après l'échéance (mois)\", 0, 24, d.tolerance_mois, key=K + \"tol\", persist_state=\"page\",\n                         help=\"Échéance dépassée depuis moins longtemps : « Délai toléré » ; au-delà : « En retard ».\")\n    ratio = b.number_input(\"Stock de sécurité (% des avions)\", 0, 50, int(d.securite_ratio * 100), 5, key=K + \"ss\",\n                           persist_state=\"page\", help=\"Par flotte et par PN. 0 % : aucun stock de sécurité.\")\n    mini = c.number_input(\"Minimum d'avions de sécurité\", 0, 10, d.securite_min, key=K + \"ssmin\", persist_state=\"page\",\n                          help=\"Par flotte, si le stock de sécurité n'est pas à 0 %.\")\n    return pe.ParamsPE(cycles=tuple(cycles), tolerance_mois=int(tol), securite_ratio=ratio / 100, securite_min=int(mini))\n\n\n# --------------------------------------------------------------------------\n# Rendu\n# --------------------------------------------------------------------------\ndef _element(classe, composant):\n    return classe.astype(str) + \" · \" + composant.astype(str)\n\n\ndef _mois_label(m) -> str:\n    return pd.Timestamp(m).strftime(\"%m/%y\")\n\n\ndef _filtres(cal: pd.DataFrame) -> tuple[list, list, list]:\n    with st.container(key=\"s360barre_pe\"):\n        a, b, c = st.columns([1.3, 1, 1.1], vertical_alignment=\"center\")\n        flottes = sorted(cal[\"Flotte\"].dropna().unique())\n        f = a.pills(\"Flotte\", flottes, selection_mode=\"multi\", default=flottes, key=K + \"flottes\", persist_state=\"page\")\n        cl = b.pills(\"Classe\", pe.CLASSES, selection_mode=\"multi\", default=pe.CLASSES, key=K + \"classes\", persist_state=\"page\")\n        co = c.pills(\"Élément\", pe.COMPOSANTS, selection_mode=\"multi\", default=pe.COMPOSANTS, key=K + \"composants\",\n                     persist_state=\"page\")\n    return f or flottes, cl or pe.CLASSES, co or pe.COMPOSANTS\n\n\ndef render(res: dict, today: date, avec_pieces: bool, partie: str = \"avancement\") -> None:\n    \"\"\"`partie` : « avancement » (KPI, calendrier par avion) ou « forecast » (mousses à commander, fournisseurs).\"\"\"\n    cal = res[\"cal\"]\n    flottes, classes, composants = _filtres(cal)\n    c = cal[cal[\"Flotte\"].isin(flottes) & cal[\"Classe\"].isin(classes) & cal[\"Composant\"].isin(composants)]\n    if partie == \"avancement\":\n        _avancement(c, res[\"date_ref\"], today)\n        _calendrier(c, today)\n        return\n    if not avec_pieces or res[\"ev\"].empty:\n        ui.callout(\"Ajoutez <b>textile_all_parts<\/b> (Pièces par avion) pour le forecast des mousses à commander.\", \"info\", \"📦\")\n        return\n    ev = res[\"ev\"]\n    ev = ev[ev[\"Flotte\"].isin(flottes) & ev[\"Classe\"].isin(classes) & ev[\"Composant\"].isin(composants)]\n    pns = set(ev[\"PN\"])\n    synth, long = res[\"synth\"][res[\"synth\"][\"PN\"].isin(pns)], res[\"long\"][res[\"long\"][\"PN\"].isin(pns)]\n    horizon = _forecast(ev, synth, long, today)\n    _forecast_fournisseur(ev, synth, long, today, horizon)\n    _exports_controles(res, c, ev, synth, long, horizon)\n\n\nELEMENT = \"1 élément = la mousse d'une classe et d'une partie (assise ou dossier) d'un avion\"\n\n\ndef _nom_element(classe, composant) -> pd.Series:\n    \"\"\"« Assise J », « Dossier J »… (libellé lisible d'un élément).\"\"\"\n    return composant.astype(str) + \" \" + classe.astype(str)\n\n\ndef _avancement(c: pd.DataFrame, date_ref, today):\n    auj = pd.Timestamp(today)\n    n = len(c)\n    st_ = c[\"Statut\"].astype(str)\n    retard, tolere, trois = (st_ == \"En retard\").sum(), (st_ == \"Délai toléré\").sum(), (st_ == \"À faire < 3 mois\").sum()\n    nb_avions = c[\"Immatriculation\"].nunique()\n    avions_retard = c.loc[st_ == \"En retard\", \"Immatriculation\"].nunique()\n    visites = c.loc[c[\"Prochaine visite\"] <= auj + pd.DateOffset(months=3), \"Immatriculation\"].nunique()\n    conformite = (1 - retard / n) * 100 if n else 100\n    with ui.section(\"pe_mousses_pe_avancement\", \"Avancement de la PE mousses\",\n                    f\"Âges au {pd.Timestamp(date_ref):%d/%m/%Y} (fichier PE mousses) · statut au {auj:%d/%m/%Y}\",\n                    tag=f\"{nb_avions} avions suivis\"):\n        exemple = c.groupby(\"Immatriculation\").size()\n        st.html(f'<div class=\"s360-note\"><b>Comment lire<\/b> : {ELEMENT}, soumise à la PE (dossiers W et Y : jamais remplacés). '\n                f'{nb_avions} avions du fichier PE mousses × leurs éléments = <b>{n} éléments suivis<\/b>'\n                + (f\" (ex. {exemple.index[0]} : {int(exemple.iloc[0])} éléments)\" if len(exemple) else \"\") + \". \"\n                \"Tous les avions du fichier, quelle que soit leur échéance (l'objectif de l'année, lui, vient du Besoin Prod).\"\n                \"<\/div>\")\n        if retard:\n            ui.callout(f\"<b>{retard} éléments en retard<\/b>, répartis sur <b>{avions_retard} avions<\/b> : à rattraper en priorité \"\n                       f\"(prévus dès ce mois-ci dans le forecast).\", \"ko\", \"🔴\")\n        ui.kpi_grid([\n            ui.kpi_card(\"Conformité PE\", f\"{conformite:.0f} %\", f\"{n - retard} éléments sur {n} ne sont pas en retard\",\n                        \"ok\" if conformite >= 90 else \"warn\" if conformite >= 70 else \"ko\"),\n            ui.kpi_card(\"Éléments en retard\", charts.entier(retard), \"échéance + délai toléré dépassés\", \"ko\"),\n            ui.kpi_card(\"Avions avec un retard\", charts.entier(avions_retard), f\"sur {nb_avions} avions suivis\", \"ko\"),\n            ui.kpi_card(\"Éléments en délai toléré\", charts.entier(tolere), \"échéance dépassée, encore dans la tolérance\", \"warn\"),\n            ui.kpi_card(\"Éléments à faire < 3 mois\", charts.entier(trois), \"échéance dans les 3 prochains mois\", \"warn\"),\n            ui.kpi_card(\"Avions en visite < 3 mois\", charts.entier(visites), \"visite datée dans le fichier\", \"info\"),\n        ])\n        a, b = st.columns(2, gap=\"large\")\n        with a:\n            t = c.assign(L=c[\"Flotte\"].astype(str) + \" · \" + _nom_element(c[\"Classe\"], c[\"Composant\"]))\n            t = t.groupby([\"L\", \"Statut\"], observed=False).size().unstack(fill_value=0)\n            t = t.reindex(columns=[s for s in pe.STATUTS if s in t.columns])\n            t = t[t.sum(axis=1) > 0]\n            ui.graphe(charts.parts(t, pe.STATUT_COULEURS, \"Statut par flotte et élément (nombre d'avions)\"))\n        with b:\n            debut = auj.to_period(\"M\").start_time\n            mois = pd.date_range(debut, periods=12, freq=\"MS\")\n            d = c.assign(E=_element(c[\"Classe\"], c[\"Composant\"]))\n            d[\"Case\"] = d[\"Date prévue\"].dt.to_period(\"M\").dt.start_time\n            retard_b = d[\"Origine date prévue\"] == \"Mois en cours (retard)\"\n            cats = [\"À rattraper\"] + [_mois_label(m) for m in mois]\n            series = {}\n            for e in ELEMENTS:\n                x = d[d[\"E\"] == e]\n                if x.empty:\n                    continue\n                cnt = x[~retard_b.loc[x.index]].groupby(\"Case\").size()\n                classe, comp = e.split(\" · \")\n                series[f\"{comp} {classe}\"] = [int(retard_b.loc[x.index].sum())] + [int(cnt.get(m, 0)) for m in mois]\n            couleurs = {f\"{e.split(' · ')[1]} {e.split(' · ')[0]}\": c_ for e, c_ in COULEURS_ELEMENTS.items()}\n            ui.graphe(charts.barres(cats, series, couleurs, empile=True, hauteur=260,\n                                    titre=\"Éléments à remplacer : à rattraper (échéance dépassée), puis les 12 prochains mois\")\n                      if series else charts.vide(\"Aucun remplacement prévu\"))\n\n\ndef _calendrier(c: pd.DataFrame, today):\n    auj = pd.Timestamp(today)\n    with ui.section(\"pe_mousses_pe_calendrier\", \"Calendrier des remplacements\",\n                    \"Une ligne par avion, une colonne par mois : nombre d'éléments à remplacer (ex. 2 = assise J + assise Y). \"\n                    \"Survolez une case pour voir lesquels. « À rattraper » = échéance déjà dépassée (en retard ou en délai \"\n                    \"toléré) ; sinon mois de la prochaine visite datée, à défaut de l'échéance PE\"):\n        debut = auj.to_period(\"M\").start_time\n        mois = pd.date_range(debut, periods=24, freq=\"MS\")\n        d = c.copy()\n        d[\"Col\"] = d[\"Date prévue\"].dt.to_period(\"M\").dt.start_time.map(_mois_label)\n        d.loc[d[\"Origine date prévue\"] == \"Mois en cours (retard)\", \"Col\"] = \"À rattraper\"\n        d[\"Ligne\"] = d[\"Immatriculation\"] + \" · \" + d[\"Flotte\"].astype(str)\n        d[\"Élément\"] = _nom_element(d[\"Classe\"], d[\"Composant\"])\n        cols = [\"À rattraper\"] + [_mois_label(m) for m in mois]\n        x = d[d[\"Col\"].isin(cols)]\n        t = x.groupby([\"Ligne\", \"Col\"]).size().unstack(fill_value=0).reindex(columns=cols, fill_value=0)\n        if t.empty:\n            ui.graphe(charts.vide(\"Aucun remplacement sur les 24 prochains mois\"))\n        else:\n            ordre = x.groupby(\"Ligne\")[\"Date prévue\"].min().sort_values().index\n            quoi = x.groupby([\"Ligne\", \"Col\"])[\"Élément\"].agg(lambda s: \", \".join(sorted(s))).unstack()\n            ui.graphe(charts.chaleur(t.reindex(ordre), libelle=\"élément(s)\", hauteur_max=\"34rem\", details=quoi))\n        _detail_avions(c)\n\n\n@st.fragment\ndef _detail_avions(c: pd.DataFrame):\n    with st.popover(f\"📋 Détail par avion et par élément ({len(c)})\", width=\"content\"):\n        f1, f2 = st.columns([1, 2])\n        q = f1.text_input(\"Immatriculation\", placeholder=\"🔎 Immatriculation\", key=K + \"q\", label_visibility=\"collapsed\")\n        statuts = f2.multiselect(\"Statut\", pe.STATUTS, key=K + \"statuts\", placeholder=\"Tous les statuts\", label_visibility=\"collapsed\")\n        d = c\n        if q:\n            d = d[d[\"Immatriculation\"].str.contains(re.sub(r\"[^A-Z0-9-]\", \"\", q.upper()), regex=False)]\n        if statuts:\n            d = d[d[\"Statut\"].astype(str).isin(statuts)]\n        t = pd.DataFrame({\n            \"Statut\": d[\"Statut\"].astype(str).map(ICONES_STATUT), \"Immatriculation\": d[\"Immatriculation\"], \"Flotte\": d[\"Flotte\"],\n            \"Version\": d[\"Version cabine\"], \"Classe\": d[\"Classe\"], \"Élément\": d[\"Composant\"],\n            \"Âge (mois)\": d[\"Âge aujourd'hui (mois)\"].round(0), \"Âge minimum ?\": d[\"Âge\"].map(lambda v: \"oui\" if v else \"\"),\n            \"Dernier remplacement\": d[\"Dernier remplacement\"], \"Échéance\": d[\"Échéance\"], \"Prochaine visite\": d[\"Prochaine visite\"],\n            \"Date prévue\": d[\"Date prévue\"], \"Origine\": d[\"Origine date prévue\"], \"Visite liée\": d[\"Visite liée\"],\n        })\n        ui.tableau(t, column_config=CFG, width=1250, height=440)\n\n\ndef _horizon() -> int:\n    h = st.segmented_control(\"Horizon\", [f\"{h} mois\" for h in pe.HORIZONS], default=\"12 mois\", key=K + \"horizon\",\n                             required=True, persist_state=\"page\", label_visibility=\"collapsed\")\n    return int((h or \"12 mois\").split()[0])\n\n\ndef _forecast(ev, synth, long, today) -> int:\n    debut = pd.Timestamp(today).to_period(\"M\").start_time\n    with ui.section(\"pe_mousses_pe_forecast\", \"Forecast des mousses à commander\",\n                    \"À commander = besoin + stock de sécurité − stock − commandes en cours (déjà passées, toujours déduites), par PN\"):\n        a, _ = st.columns([1, 2])\n        with a:\n            h = _horizon()\n        fin = debut + pd.DateOffset(months=h)\n        e = ev[ev[\"Mois\"] < fin]\n        lg = long[long[\"Mois\"] < fin]\n        besoin, rattrapage = e[\"Qté\"].sum(), e.loc[e[\"Rattrapage du retard\"], \"Qté\"].sum()\n        a_cmd, valeur = lg[\"À livrer\"].sum(), lg[\"Valeur à livrer (€)\"].sum()\n        fours = lg.loc[lg[\"À livrer\"] > 0, \"Fournisseur\"].nunique()\n        avancer = synth[synth[\"À avancer (commandes en cours)\"] > 0]\n        if len(avancer):\n            ui.callout(f\"<b>{charts.entier(avancer['À avancer (commandes en cours)'].sum())} pièces en commande à faire avancer<\/b> \"\n                       f\"sur {len(avancer)} PN : elles sont promises après le mois où elles sont nécessaires. \"\n                       \"Relancez les fournisseurs (colonnes « À avancer » et « Avant » du tableau par PN) plutôt que de recommander.\",\n                       \"warn\", \"📌\")\n        ui.kpi_grid([\n            ui.kpi_card(f\"Mousses à remplacer ({h} mois)\", charts.entier(besoin), f\"dont {charts.entier(rattrapage)} de retard à rattraper\", \"navy\"),\n            ui.kpi_card(\"À commander\", charts.entier(a_cmd), \"besoin + sécurité − stock − en commande\", \"ko\"),\n            ui.kpi_card(\"Valeur à commander\", charts.euros(valeur), f\"horizon {h} mois\", \"ko\"),\n            ui.kpi_card(\"Stock disponible\", charts.entier(synth[\"Stock\"].sum()), f\"+ {charts.entier(synth['En commande'].sum())} déjà en commande (déduits)\", \"info\"),\n            ui.kpi_card(\"Fournisseurs\", charts.entier(fours), \"à solliciter\", \"violet\"),\n        ])\n        mois = pd.date_range(debut, periods=h, freq=\"MS\")\n        x = e.assign(E=_element(e[\"Classe\"], e[\"Composant\"])).groupby([\"Mois\", \"E\"])[\"Qté\"].sum().unstack(fill_value=0)\n        x = x.reindex(index=mois, fill_value=0)\n        series = {k: x[k] for k in ELEMENTS if k in x.columns}\n        ui.graphe(charts.barres(mois, series, COULEURS_ELEMENTS, empile=True, temporel=True, hauteur=260,\n                                titre=\"Mousses à remplacer par mois (le 1er mois inclut le retard à rattraper)\")\n                  if series else charts.vide())\n        a, b = st.columns([1.2, 1], gap=\"large\")\n        with a:\n            liv = lg.groupby(\"Mois\")[\"À livrer\"].sum().reindex(mois, fill_value=0)\n            ui.graphe(charts.barres(mois, {\"À livrer\": liv}, {\"À livrer\": COLORS[\"ko\"]}, temporel=True, hauteur=230,\n                                    titre=\"Livraisons à prévoir par mois (tous fournisseurs)\"))\n        with b:\n            v = lg.groupby(\"Fournisseur\")[\"Valeur à livrer (€)\"].sum().sort_values(ascending=False)\n            v = v[v > 0]\n            ui.graphe(charts.barres_h([(f, val, charts.euros(val)) for f, val in v.items()], couleur=COLORS[\"navy_2\"],\n                                      titre=\"Valeur à commander par fournisseur\") if len(v) else charts.vide(\"Rien à commander\"))\n        t = synth.assign(**{\"Besoin\": synth[f\"Besoin {h} mois\"], \"À commander\": synth[f\"À commander {h} mois\"],\n                            \"Valeur (€)\": synth[f\"Valeur {h} mois (€)\"]})\n        t = t.sort_values(\"Valeur (€)\", ascending=False)\n        cols = {\"PN\": \"PN\", \"Désignation\": \"Désignation\", \"Classes\": \"Classe\", \"Composant\": \"Élément\", \"Flottes\": \"Flottes\",\n                \"Fournisseur\": \"Fournisseur\", \"Prix unitaire (€)\": \"Prix (€)\", \"Stock\": \"Stock\", \"En commande\": \"En commande\",\n                \"Stock de sécurité\": \"Stock de sécurité\", \"Besoin\": \"Besoin\", \"À commander\": \"À commander\", \"Valeur (€)\": \"Valeur (€)\",\n                \"À avancer (commandes en cours)\": \"À avancer\", \"À avancer avant\": \"Avant\", \"Rupture sans commande\": \"Rupture sans commande\"}\n        st.markdown(f\"**Par PN** · horizon {h} mois\")\n        ui.tableau(t[list(cols)].rename(columns=cols), column_config=CFG, height=min(38 + 35 * len(t), 420))\n    return h\n\n\n@st.fragment\ndef _forecast_fournisseur(ev, synth, long, today, h):\n    debut = pd.Timestamp(today).to_period(\"M\").start_time\n    mois = pd.date_range(debut, periods=h, freq=\"MS\")\n    lg = long[long[\"Mois\"].isin(mois)]\n    v = lg.groupby(\"Fournisseur\")[\"Valeur à livrer (€)\"].sum().sort_values(ascending=False)\n    if v.empty:\n        return\n    with ui.section(\"pe_mousses_pe_fournisseur\", \"Forecast par fournisseur\",\n                    f\"Ce que vous allez commander, par année et par mois, sur {h} mois : à partager avec chaque fournisseur\"):\n        # Vue d'ensemble : tous les fournisseurs, par année\n        qte_an = pe.par_annee(lg, mois, \"Fournisseur\").reindex(v.index)\n        val_an = pe.par_annee(lg, mois, \"Fournisseur\", \"Valeur à livrer (€)\").reindex(v.index)\n        annees = list(qte_an.columns)\n        vue = pd.DataFrame(index=v.index)\n        for an in annees:\n            vue[f\"{an} · qté\"] = qte_an[an]\n            vue[f\"{an} · €\"] = val_an[an]\n        vue[\"Total · qté\"], vue[\"Total · €\"] = qte_an.sum(axis=1), val_an.sum(axis=1)\n        cfg = {c: st.column_config.NumberColumn(c, format=\"%.0f €\" if c.endswith(\"€\") else \"%d\") for c in vue.columns}\n        a, b = st.columns([1, 1.5], gap=\"large\")\n        with a:\n            ui.graphe(charts.barres(annees, {\"Valeur (€)\": val_an.sum()}, {\"Valeur (€)\": COLORS[\"navy_2\"]}, fmt=charts.euros,\n                                    hauteur=220, titre=\"Valeur à commander par année (tous fournisseurs)\",\n                                    survol=[f\"{charts.entier(q)} mousses\" for q in qte_an.sum()]))\n        with b:\n            st.markdown(\"**Par fournisseur et par année**\")\n            ui.tableau(vue.reset_index(), column_config=cfg, height=\"content\" if len(vue) <= 6 else 260)\n\n        # Détail du fournisseur choisi\n        libelles = {f: f\"{f}  ·  {charts.euros(val)}\" for f, val in v.items()}\n        c1, c2 = st.columns([1.4, 1], vertical_alignment=\"center\")\n        f = c1.selectbox(\"Fournisseur\", list(libelles), format_func=libelles.get, key=K + \"fournisseur\", persist_state=\"page\",\n                         label_visibility=\"collapsed\")\n        with c2:\n            pas = st.segmented_control(\"Vue\", [\"Par année\", \"Par mois\"], default=\"Par année\", key=K + \"vue_fournisseur\",\n                                       required=True, persist_state=\"page\", label_visibility=\"collapsed\") or \"Par année\"\n        d = lg[lg[\"Fournisseur\"] == f]\n        a_livrer = d[d[\"À livrer\"] > 0]\n        premier = a_livrer[\"Mois\"].min()\n        ui.kpi_grid([\n            ui.kpi_card(\"Commande globale\", charts.entier(d[\"À livrer\"].sum()), f\"mousses sur {h} mois\", \"ko\"),\n            ui.kpi_card(\"Valeur\", charts.euros(d[\"Valeur à livrer (€)\"].sum()), \"\", \"ko\"),\n            ui.kpi_card(\"PN\", charts.entier(a_livrer[\"PN\"].nunique()), \"à livrer\", \"navy\"),\n            ui.kpi_card(\"Première livraison\", f\"{premier:%m/%Y}\" if pd.notna(premier) else \"—\",\n                        \"dès que possible\" if pd.notna(premier) and premier == debut else \"\", \"warn\"),\n        ])\n        piv = d.pivot_table(index=\"PN\", columns=\"Mois\", values=\"À livrer\", aggfunc=\"sum\", fill_value=0).reindex(columns=mois, fill_value=0)\n        piv = piv[piv.sum(axis=1) > 0]\n        an = pe.par_annee(d, mois).reindex(piv.index)\n        top = list(piv.sum(axis=1).sort_values(ascending=False).index[:8])\n        def _series(t):\n            s = {pn: t.loc[pn] for pn in top}\n            if len(t) > 8:\n                s[\"Autres PN\"] = t.drop(index=top).sum()\n            return s\n        if pas == \"Par année\":\n            graphe = charts.barres(annees, _series(an), empile=True, hauteur=240, titre=\"Mousses à livrer par année et par PN\")\n            tab = an.copy()\n        else:\n            graphe = charts.barres(mois, _series(piv), empile=True, temporel=True, hauteur=240,\n                                   titre=\"Mousses à livrer par mois et par PN\")\n            tab = piv.copy()\n            tab.columns = [m_.strftime(\"%m/%Y\") for m_ in tab.columns]\n        ui.graphe(graphe if len(piv) else charts.vide(\"Rien à livrer\"))\n        prix = synth.set_index(\"PN\")[\"Prix unitaire (€)\"].reindex(tab.index).fillna(0)\n        tab.insert(0, \"Valeur (€)\", piv.sum(axis=1) * prix)\n        tab.insert(0, \"Total\", piv.sum(axis=1))\n        tab.insert(0, \"Désignation\", synth.set_index(\"PN\")[\"Désignation\"].reindex(tab.index))\n        tab = tab.reset_index()\n        ui.tableau(tab, column_config=CFG, height=\"content\" if len(tab) <= 8 else 320)\n        par_mois = piv.copy()\n        par_mois.columns = [m_.strftime(\"%m/%Y\") for m_ in par_mois.columns]\n        ui.telecharger(lambda: _export_fournisseur(f, an, par_mois, ev[ev[\"PN\"].isin(piv.index)], synth), _nom_fichier(f\"forecast_{f}\"),\n                       K + \"export_fournisseur\", label=\"⬇️ Forecast fournisseur (Excel)\")\n\n\ndef _nom_fichier(base: str) -> str:\n    return f\"Supply360_{re.sub(r'[^A-Za-z0-9]+', '_', base).strip('_')}_{date.today():%Y%m%d}.xlsx\"\n\n\ndef _export_fournisseur(f, an, par_mois, ev, synth) -> bytes:\n    resume = synth[synth[\"PN\"].isin(an.index)][[\"PN\", \"Désignation\", \"Composant\", \"Classes\", \"Prix unitaire (€)\"]]\n    resume = resume.assign(Total=resume[\"PN\"].map(an.sum(axis=1)))\n    resume[\"Valeur (€)\"] = resume[\"Total\"] * resume[\"Prix unitaire (€)\"].fillna(0)\n    avions = ev.assign(Mois=ev[\"Mois\"].dt.strftime(\"%m/%Y\"))[[\"PN\", \"Mois\", \"Immatriculation\", \"Flotte\", \"Classe\", \"Composant\", \"Qté\"]]\n    return sio.exporter_excel({\"Commande globale\": resume, \"Par année\": an.reset_index(), \"Par mois\": par_mois.reset_index(),\n                               \"Besoins par avion\": avions})\n\n\ndef _exports_controles(res, c, ev, synth, long, h):\n    with ui.section(\"pe_mousses_pe_exports\", \"Exports et contrôles\"):\n        a, b = st.columns(2)\n        with a:\n            debut = long[\"Mois\"].min()\n            liv = long[(long[\"À livrer\"] > 0) & (long[\"Mois\"] < debut + pd.DateOffset(months=h))]\n            feuilles = {\n                \"Avancement PE\": c.drop(columns=[\"Âge exact\"]).assign(Statut=c[\"Statut\"].astype(str)),\n                f\"Forecast PN {h} mois\": synth,\n                \"Livraisons à prévoir\": liv[[\"Fournisseur\", \"PN\", \"Désignation\", \"Mois\", \"À livrer\", \"Valeur à livrer (€)\"]],\n                \"Besoins par avion\": ev,\n            }\n            ui.telecharger(lambda: sio.exporter_excel(feuilles), _nom_fichier(\"planning_PE\"), K + \"export_tout\",\n                           label=\"⬇️ Planning PE complet (Excel)\")\n        with b, st.popover(\"🔎 Contrôles des données\", width=\"stretch\"):\n            nr, sans, absents = res[\"non_reconnues\"], res[\"sans_pn\"], res[\"pn_absents_stock\"]\n            age_min = int((~res[\"cal\"][\"Âge exact\"]).sum())\n            st.markdown(f\"- **{age_min}** éléments avec un âge minimum seulement (« > 60 », « > 108 » dans le fichier PE) : \"\n                        \"échéance calculée au plus tôt.\")\n            st.markdown(f\"- **{len(sans)}** éléments sans PN de mousse dans textile_all_parts (immat / classe / élément) : \"\n                        \"absents du forecast.\")\n            if len(sans):\n                ui.tableau(sans.assign(Statut=sans[\"Statut\"].astype(str)), height=200)\n            st.markdown(f\"- **{len(nr)}** lignes MOUSSE de textile_all_parts non reconnues (ni FOAM BOTTOM / BOTT, ni FOAM BACK…) \"\n                        \"ou classe inconnue.\")\n            if len(nr):\n                ui.tableau(nr, height=200)\n            st.markdown(f\"- **{len(absents)}** PN absents de l'État du stock (stock compté à 0)\" + (f\" : {', '.join(absents[:15])}\" if absents else \"\"))\n", "app/modules/alertes.py": "\"\"\"Onglet « Alertes » : en cours de développement.\"\"\"\n\nfrom core import components as ui\n\nTAB_ID = \"alertes\"\nTAB_LABEL = \"Alertes\"\nTAB_ICON = \"🔔\"\nTAB_DESCRIPTION = \"Alertes regroupées : ruptures, retards fournisseurs, chantiers à risque.\"\n\n\ndef render() -> None:\n    ui.en_developpement(TAB_ICON, TAB_LABEL, [\"Ruptures et équipements critiques\",\n                                             \"Retards fournisseurs avant le début des chantiers\"])\n", "app/modules/fournisseurs.py": "\"\"\"Onglet « Fournisseurs » : en cours de développement.\"\"\"\n\nfrom core import components as ui\n\nTAB_ID = \"fournisseurs\"\nTAB_LABEL = \"Fournisseurs\"\nTAB_ICON = \"🏭\"\nTAB_DESCRIPTION = \"Performance fournisseurs : OTD / OTIF, retards et commandes en cours.\"\n\n\ndef render() -> None:\n    ui.en_developpement(TAB_ICON, TAB_LABEL, [\"OTD / OTIF et score par fournisseur\",\n                                             \"Commandes en cours classées du pire au meilleur statut\"])\n", "app/modules/pe_mousses.py": "\"\"\"Onglet « PE mousses » : politique d'entretien des mousses de sièges.\n\n- Année en cours (fichier Besoin Prod) : avions faisables par type d'avion et par classe, CCN à commander (PR).\n  Repris du Streamlit « Pilotage Politique d'entretien Mousse » (calculs dans core/pe2026.py).\n- Avancement PE et forecast 12 / 24 / 36 mois (fichier PE mousses mensuel) : rendu par modules/_planning_pe.py,\n  calculs dans core/pe.py (anciennement sous-onglet « Planning PE » du Textile).\n\"\"\"\n\nfrom datetime import date\n\nimport pandas as pd\nimport streamlit as st\n\nfrom core import cache, charts\nfrom core import components as ui\nfrom core import io as sio\nfrom core import pe\nfrom core import pe2026 as p26\nfrom core import prevision as pv\nfrom core import textile as tx\nfrom core.style import COLORS\nfrom modules import _planning_pe as vue_pe\n\nTAB_ID = \"pe_mousses\"\nTAB_LABEL = \"PE mousses\"\nTAB_ICON = \"🪑\"\nTAB_DESCRIPTION = \"Politique d'entretien des mousses : avions faisables cette année, CCN à commander, avancement et forecast.\"\n\nK = f\"{TAB_ID}__\"\nSECTIONS = [\"Synthèse\", \"Avions faisables\", \"CCN et commandes\", \"Avancement PE\", \"Forecast\"]\nICONES = {\"Synthèse\": \"📊\", \"Avions faisables\": \"✈️\", \"CCN et commandes\": \"📦\", \"Avancement PE\": \"📅\", \"Forecast\": \"🔮\"}\n\n# Dossier Textile : règles de nommage prioritaires (sans accents ni majuscules), puis reconnaissance par le contenu.\nNOMS_DOSSIER = {\"stock\": r\"^resultat\", \"pieces\": r\"textile_all_parts\", \"pe\": r\"^pe_mousse\", \"besoin_prod\": r\"besoin_prod\"}\nNOMMAGE = (\"Dossier Textile : « Besoin_Prod… » = Besoin Prod mousses (objectif de l'année), « PE_MOUSSE… » = PE mousses \"\n           \"(mensuel), « Résultat… » = État du stock, « textile_all_parts » = Pièces par avion. À défaut, reconnaissance \"\n           \"par le contenu. Commandes (SAP) : dossier COMMANDE.\")\nCOLONNES_ATTENDUES = {\n    \"besoin_prod\": [(\"Feuille « QUOTE en euro »\", \"en-tête détecté automatiquement\", False),\n                    (\"A/C, Flotte, Area, CCN, Qty per A/C, NB_AC\", \"type d'avion, classe, quantité par avion\", True),\n                    (\"NB_AC PE RESTANT\", \"avions restants (fichier) ; recalculé si PE mousses + textile_all_parts\", False),\n                    (\"P/N OEM Seat Supplier, Seat Supplier, Description, P.U forecast PE\", \"\", False)],\n    \"stock\": [(\"PNR, QTE SUR ÉTAGÈRE\", \"\", True), (\"CCN\", \"clé du croisement avec le Besoin Prod\", True),\n              (\"QTE EN CDE, Dernier PU (achat) Euros\", \"\", False)],\n    \"commandes\": [(\"PN, Commande\", \"\", True), (\"CCN\", \"sinon retrouvé par le PN\", False),\n                  (\"Quantité restant à livrer, Date de livraison promise, Fournisseur\", \"\", False)],\n    \"pe\": [(\"Feuille « … BOTTOM FOAM … »\", \"assises : âge par classe J / W / Y\", True),\n           (\"Feuille « … BACKREST FOAM … »\", \"dossiers J\", True),\n           (\"FLEET, AIRCRAFT, AGE (month), PAST / NEXT EXECUTION\", \"fichier mensuel tel quel\", True),\n           (\"Date dans le nom\", \"ex. PE_MOUSSE_29092026 : date des âges\", False)],\n    \"pieces\": [(\"equipment, registration, area, ccn, pn, description, qty_per_ac\", \"lignes MOUSSE\", True)],\n}\nRESTANT_LIBELLES = {p26.RESTANT_AUTO: \"Calculé avec le fichier PE mousses (sinon fichier Besoin Prod)\",\n                    p26.RESTANT_FICHIER: \"Colonne NB_AC PE RESTANT du Besoin Prod (règle d'origine)\"}\nSURPLUS = \"#C9D3E3\"  # au-delà de l'objectif (gris bleuté)\nCFG = {\n    \"Besoin\": st.column_config.NumberColumn(\"Besoin\", format=\"%d\", help=\"Qté par avion × avions restants\"),\n    \"Stock\": st.column_config.NumberColumn(\"Stock\", format=\"%d\"),\n    \"En commande\": st.column_config.NumberColumn(\"En commande\", format=\"%d\", help=\"Reste à livrer des commandes (SAP)\"),\n    \"Couverture\": st.column_config.NumberColumn(\"Couverture\", format=\"%d\", help=\"Stock + en commande\"),\n    \"Écart\": st.column_config.NumberColumn(\"Écart\", format=\"%d\", help=\"Besoin − couverture\"),\n    \"À demander (PR)\": st.column_config.NumberColumn(\"À demander (PR)\", format=\"%d\"),\n    \"Couverture (%)\": st.column_config.ProgressColumn(\"Couverture (%)\", format=\"%.0f %%\", min_value=0, max_value=100),\n    \"PU (€)\": st.column_config.NumberColumn(\"PU (€)\", format=\"%.0f €\"),\n    \"Valeur stock (€)\": st.column_config.NumberColumn(\"Valeur stock (€)\", format=\"%.0f €\"),\n    \"Valeur à commander (€)\": st.column_config.NumberColumn(\"Valeur à commander (€)\", format=\"%.0f €\"),\n    \"Prochaine livraison\": st.column_config.DateColumn(\"Prochaine livraison\", format=\"DD/MM/YYYY\"),\n    \"Taux (%)\": st.column_config.ProgressColumn(\"Taux (%)\", format=\"%.0f %%\", min_value=0, max_value=100,\n                                                help=\"Complets maintenant ÷ objectif\"),\n}\n\n\n# --------------------------------------------------------------------------\n# Calculs mis en cache (clé = contenu des fichiers + paramètres)\n# --------------------------------------------------------------------------\n@st.cache_resource(show_spinner=\"Lecture du Besoin Prod…\", max_entries=2)\ndef _besoin_prod(data: bytes, nom: str):\n    return p26.lire_besoin_prod(data, nom)\n\n\n@st.cache_resource(show_spinner=\"Lecture des pièces par avion…\", max_entries=2)\ndef _pieces(data: bytes, nom: str):\n    return pv.preparer_pieces(pv.lire_pieces(data, nom), pv.Params())[0]\n\n\n@st.cache_resource(show_spinner=\"Lecture du fichier PE mousses…\", max_entries=2)\ndef _pe_mousses(data: bytes, nom: str):\n    return pe.lire_pe_mousses(data, nom)\n\n\n@st.cache_resource(show_spinner=\"Calcul de la PE de l'année…\", max_entries=4)\ndef _annee(besoin: tuple, stock: bytes, cmd: bytes | None, fichier_pe: tuple | None, pieces: tuple | None,\n           params: pe.ParamsPE, mode: str, today: date) -> dict:\n    bp = _besoin_prod(*besoin)[0]\n    parts = _pieces(*pieces) if pieces else None\n    rattachement = p26.rattacher_avions(bp, parts)\n    date_ref, faits = today, None\n    if fichier_pe:\n        lignes, dref = _pe_mousses(*fichier_pe)\n        date_ref = dref or today\n        faits = p26.remplaces_depuis(pe.calendrier(lignes, date_ref, today, params), p26.date_debut_annee(date_ref))\n    b = p26.avions_restants(bp, rattachement, faits if faits is not None else pd.DataFrame(), mode)\n    m = p26.analyse_ccn(b, cache.etat_stock(stock)[0], cache.commandes(cmd)[0] if cmd else None)\n    blocs, detail = p26.avions_faisables(b, m)\n    return {\"b\": b, \"m\": m, \"blocs\": blocs, \"detail\": detail, \"rattachement\": rattachement, \"annee\": date_ref.year,\n            \"avec_cmd\": cmd is not None, \"calcul_possible\": bool(fichier_pe) and len(rattachement) > 0}\n\n\n@st.cache_resource(show_spinner=\"Calcul du planning PE…\", max_entries=4)\ndef _planning_pe(stock: bytes | None, cmd: bytes | None, fichier_pe: tuple, pieces: tuple | None, params: pe.ParamsPE,\n                 today: date):\n    \"\"\"Planning PE des mousses + forecast (voir core/pe.py).\"\"\"\n    lignes, date_ref = _pe_mousses(*fichier_pe)\n    parts = _pieces(*pieces) if pieces else pd.DataFrame(columns=pv.RAW_COLS)\n    cmd_l = cache.commandes(cmd)[0] if cmd else None\n    cat = pe.catalogue_mousses(parts) if len(parts) else None\n    if stock and cat is not None and len(cat):\n        pbi, o = tx.construire_tables(cache.etat_stock(stock)[0], cmd_l, cat, today, True)\n    else:\n        pbi, o = pd.DataFrame(columns=[\"PNR\", \"QTE SUR ÉTAGÈRE\"]), None\n    return pe.planning_pe(lignes, date_ref or today, parts, pe.articles(pbi), o, today, params)\n\n\n# --------------------------------------------------------------------------\n# Import et paramètres\n# --------------------------------------------------------------------------\ndef _bloc_import():\n    with ui.section(f\"{TAB_ID}_import\", \"Import et paramètres\", \"Les fichiers sont lus sur votre poste : rien n'est envoyé\"):\n        a, b, c = st.columns([3, 1, 1], vertical_alignment=\"bottom\")\n        with a:\n            ui.boutons_dossiers(\"Textile\", K + \"dossier__upload\")\n        today = b.date_input(\"Date de référence\", value=date.today(), format=\"DD/MM/YYYY\", key=K + \"date\", persist_state=\"page\",\n                             help=\"Statuts PE, retards et début du forecast.\")\n        reglages = c.popover(\"⚙️ Paramètres\", width=\"stretch\")\n        puces, bilan = st.container(), st.container()\n        with ui.zone_repliable(K + \"manuel\", \"📎 Import manuel (Parcourir) et colonnes attendues\"):\n            zone_dossier = st.container()\n            c1, c2, c3 = st.columns(3)\n            with c1:\n                f_besoin = ui.fichier(f\"{p26.FICHIER_BESOIN} (annuel)\", K + \"besoin\", [\"xlsx\", \"xlsm\"], COLONNES_ATTENDUES[\"besoin_prod\"])\n                f_pieces = ui.fichier(f\"{pv.FICHIER_PIECES} (textile_all_parts)\", K + \"pieces\", [\"csv\", \"xlsx\", \"xlsm\"],\n                                      COLONNES_ATTENDUES[\"pieces\"])\n            with c2:\n                f_stock = ui.fichier(sio.FICHIER_STOCK, K + \"stock\", [\"xlsx\", \"xlsm\"], COLONNES_ATTENDUES[\"stock\"])\n                f_pe = ui.fichier(f\"{pe.FICHIER_PE} (PE_MOUSSE, mensuel)\", K + \"pe\", [\"xlsx\", \"xlsm\"], COLONNES_ATTENDUES[\"pe\"])\n            with c3:\n                f_cmd = ui.import_commandes(COLONNES_ATTENDUES[\"commandes\"])\n        with bilan:\n            ui.import_dossier(K + \"dossier\", {\"besoin_prod\": K + \"besoin\", \"stock\": K + \"stock\", \"pieces\": K + \"pieces\", \"pe\": K + \"pe\"},\n                              label=\"Tout le dossier Textile (Ctrl+A pour tout sélectionner)\", aide=NOMMAGE, noms=NOMS_DOSSIER,\n                              zone=zone_dossier, autres=(\"references\",))\n        with puces:\n            ui.etat_fichiers([(p26.FICHIER_BESOIN, K + \"besoin\", True), (sio.FICHIER_STOCK, K + \"stock\", True),\n                              (sio.FICHIER_COMMANDES, \"commun__commandes\", False), (pe.FICHIER_PE, K + \"pe\", False),\n                              (pv.FICHIER_PIECES, K + \"pieces\", False)])\n        with reglages:\n            t_an, t_pe = st.tabs([\"✈️ Année (Besoin Prod)\", \"📅 Planning PE\"])\n            with t_an:\n                mode = st.radio(\"Avions restant à traiter\", list(RESTANT_LIBELLES), format_func=RESTANT_LIBELLES.get,\n                                key=K + \"restant\", persist_state=\"page\",\n                                help=\"Calcul : NB_AC − avions du type dont la mousse (classe, assise ou dossier) a été remplacée \"\n                                     \"depuis le 1er janvier d'après le fichier PE mousses. Le type de chaque avion est \"\n                                     \"retrouvé par ses CCN de mousses (textile_all_parts).\")\n            with t_pe:\n                params_pe = vue_pe.parametres()\n    return f_besoin, f_stock, f_cmd, f_pe, f_pieces, today, params_pe, mode\n\n\ndef render() -> None:\n    ui.hero(TAB_ICON, \"PE mousses\", TAB_DESCRIPTION)\n    f_besoin, f_stock, f_cmd, f_pe, f_pieces, today, params_pe, mode = _bloc_import()\n    with st.container(key=\"s360barre\"):\n        section = ui.sous_onglets(K + \"section\", SECTIONS, ICONES)\n    if section in (\"Avancement PE\", \"Forecast\"):\n        _section_planning(section, f_stock, f_cmd, f_pe, f_pieces, params_pe, today)\n        return\n    if not (f_besoin and f_stock):\n        with ui.section(f\"{TAB_ID}_vide\", \"PE mousses de l'année\"):\n            ui.empty_state(\"Importez le Besoin Prod et l'État du stock\",\n                           \"Le fichier PE mousses et textile_all_parts recalculent les avions restants ; les commandes (SAP) \"\n                           \"complètent la couverture.\",\n                           [(p26.FICHIER_BESOIN, bool(f_besoin)), (sio.FICHIER_STOCK, bool(f_stock)),\n                            (sio.FICHIER_COMMANDES, bool(f_cmd)), (pe.FICHIER_PE, bool(f_pe)), (pv.FICHIER_PIECES, bool(f_pieces))],\n                           icon=\"✈️\")\n        return\n    try:\n        res = _annee((f_besoin[1], f_besoin[0]), f_stock[1], f_cmd[1] if f_cmd else None,\n                     (f_pe[1], f_pe[0]) if f_pe else None, (f_pieces[1], f_pieces[0]) if f_pieces else None, params_pe, mode, today)\n    except ValueError as exc:\n        ui.callout(f\"<b>Import impossible.<\/b> {exc}\", \"ko\", \"⛔\")\n        return\n    if not res[\"avec_cmd\"]:\n        ui.callout(\"Sans <b>Commandes (SAP)<\/b>, « en commande » = QTE EN CDE de l'État du stock.\", \"warn\", \"⚠️\")\n    if mode == p26.RESTANT_AUTO and not res[\"calcul_possible\"]:\n        ui.callout(\"Avions restants lus dans le Besoin Prod (colonne NB_AC PE RESTANT) : ajoutez le fichier <b>PE mousses<\/b> \"\n                   \"et <b>textile_all_parts<\/b> pour les recalculer.\", \"info\", \"ℹ️\")\n    {\"Synthèse\": _synthese, \"Avions faisables\": _faisables, \"CCN et commandes\": _ccn}[section](res, today)\n\n\ndef _section_planning(section, f_stock, f_cmd, f_pe, f_pieces, params_pe, today):\n    if not f_pe:\n        with ui.section(f\"{TAB_ID}_pe_vide\", \"Planning PE des mousses\"):\n            ui.empty_state(f\"Importez le fichier {pe.FICHIER_PE}\", \"Le fichier mensuel PE_MOUSSE (feuilles BOTTOM FOAM et \"\n                           \"BACKREST FOAM), tel que vous le recevez. textile_all_parts et l'État du stock ajoutent le forecast \"\n                           \"des mousses à commander.\",\n                           [(pe.FICHIER_PE, False), (pv.FICHIER_PIECES, bool(f_pieces)), (sio.FICHIER_STOCK, bool(f_stock))],\n                           icon=\"📅\")\n        return\n    try:\n        res = _planning_pe(f_stock[1] if f_stock else None, f_cmd[1] if f_cmd else None, (f_pe[1], f_pe[0]),\n                           (f_pieces[1], f_pieces[0]) if f_pieces else None, params_pe, today)\n    except ValueError as exc:\n        ui.callout(f\"<b>{pe.FICHIER_PE} illisible.<\/b> {exc}\", \"ko\", \"⛔\")\n        return\n    if pe.date_extraction(f_pe[0]) is None:\n        ui.callout(\"Date des âges introuvable dans le nom du fichier (ex. PE_MOUSSE_29092026) : la date de référence est utilisée.\",\n                   \"warn\", \"⚠️\")\n    if section == \"Forecast\" and not f_stock:\n        ui.callout(\"Ajoutez l'<b>État du stock<\/b> pour déduire le stock des mousses à commander.\", \"warn\", \"⚠️\")\n    vue_pe.render(res, today, bool(f_pieces), \"avancement\" if section == \"Avancement PE\" else \"forecast\")\n\n\n# --------------------------------------------------------------------------\n# Synthèse\n# --------------------------------------------------------------------------\ndef _kpis_avions(blocs: pd.DataFrame, annee: int) -> list[str]:\n    \"\"\"Cartes de l'objectif. Unité : la CLASSE d'avion (un avion à traiter en J, W et Y compte 3 fois), car chaque\n    classe a ses propres CCN et son propre nombre d'avions restants.\"\"\"\n    obj, now = int(blocs[\"Objectif\"].sum()), int(blocs[\"Complets maintenant\"].sum())\n    rec, coter, appro = int(blocs[\"Complets à réception\"].sum()), int(blocs[\"À coter\"].sum()), int(blocs[\"À approvisionner\"].sum())\n    taux = now / obj * 100 if obj else 0\n    return [\n        ui.kpi_card(f\"Objectif {annee} : classes à traiter\", charts.entier(obj),\n                    f\"soit {charts.entier(p26.avions_distincts(blocs))} avions · un avion compte une fois par classe\", \"navy\"),\n        ui.kpi_card(\"Classes complètes maintenant\", charts.entier(now), f\"{taux:.0f} % de l'objectif · tous leurs CCN en stock\", \"ok\"),\n        ui.kpi_card(\"Classes complètes à réception\", charts.entier(rec), \"une fois les commandes en cours livrées\", \"info\"),\n        ui.kpi_card(\"Classes à coter\", charts.entier(coter), \"il ne manque que des CCN sans prix\", \"warn\"),\n        ui.kpi_card(\"Classes à approvisionner\", charts.entier(appro), \"CCN manquants à commander\", \"ko\"),\n    ]\n\n\ndef _jauges_blocs(blocs: pd.DataFrame, titre: str) -> str:\n    lignes = []\n    for _, r in blocs.sort_values([\"Type avion\", \"Classe\"]).iterrows():\n        if r[\"Objectif\"] <= 0:\n            continue\n        info = [f\"CCN limitant : {r['CCN limitant']}\"] if r[\"Complets maintenant\"] < r[\"Objectif\"] else []\n        if r[\"À approvisionner\"] and r[\"CCN communs\"]:\n            info.append(f\"{int(r['CCN communs'])} CCN commun(s) à d'autres types : stock et commandes partagés entre eux\")\n        if r[\"À coter\"]:\n            info.append(\"Il ne manque que des CCN sans prix : à faire coter avant de commander\")\n        lignes.append((p26.nom_bloc(r[\"Type avion\"], r[\"Classe\"]), [(n, r[n], p26.AVANCEMENT_COULEURS[n]) for n in p26.AVANCEMENT],\n                       None, f\"{int(r['Complets maintenant'])} / {int(r['Objectif'])}\", info))\n    leg = [(n, c, \"barre\") for n, c in p26.AVANCEMENT_COULEURS.items()]\n    return charts.jauges(lignes, titre, leg, fmt=charts.entier, hauteur_max=\"30rem\") if lignes else charts.vide(\"Aucun avion à traiter\")\n\n\ndef _synthese(res: dict, today: date):\n    m, blocs, annee = res[\"m\"], res[\"blocs\"], res[\"annee\"]\n    a_pr = m[m[\"Écart\"] > 0]\n    with ui.section(f\"{TAB_ID}_synthese\", f\"Synthèse de la PE mousses {annee}\",\n                    \"Avions faisables avec le stock (CCN communs répartis entre types d'avion) et CCN à approvisionner\",\n                    tag=f\"{m['CCN'].nunique()} CCN\"):\n        if len(a_pr):\n            ui.callout(f\"<b>{len(a_pr)} PR à émettre<\/b> pour {charts.entier(a_pr['À demander (PR)'].sum())} mousses \"\n                       f\"({charts.euros(a_pr['Valeur à commander (€)'].sum())}) : \"\n                       f\"{(a_pr['Action'] == p26.ACTIONS[0]).sum()} CCN sans aucune commande, \"\n                       f\"{(a_pr['Action'] == p26.ACTIONS[1]).sum()} avec des commandes insuffisantes.\", \"ko\", \"🔴\")\n        ui.kpi_grid(_kpis_avions(blocs, annee))\n        ui.kpi_grid([\n            ui.kpi_card(\"Valeur du stock\", charts.euros(m[\"Valeur stock (€)\"].sum()), \"mousses sur étagère\", \"ok\"),\n            ui.kpi_card(\"Valeur en commande\", charts.euros(m[\"Valeur en commande (€)\"].sum()), \"déjà commandé, à recevoir\", \"info\"),\n            ui.kpi_card(\"À commander\", charts.euros(m[\"Valeur à commander (€)\"].sum()), \"PR, hors CCN à coter\", \"ko\"),\n            ui.kpi_card(f\"Valeur du besoin {annee}\", charts.euros(m[\"Valeur du besoin (€)\"].sum()), \"avions restants\", \"navy\"),\n            ui.kpi_card(\"CCN à coter\", charts.entier(m[\"À coter\"].sum()), \"sans prix : coût sous-estimé\", \"warn\"),\n        ])\n        a, b = st.columns([1, 1.5], gap=\"large\")\n        with a:\n            n = m[\"Action\"].value_counts()\n            ui.graphe(charts.barres_h([(act, n.get(act, 0), charts.entier(n.get(act, 0)), p26.ACTION_COULEURS[act])\n                                       for act in p26.ACTIONS], titre=\"CCN par action\"))\n        with b:\n            ui.graphe(_jauges_blocs(blocs, \"Avions par type et par classe, sur l'objectif (une ligne = une classe d'un type d'avion)\"))\n        st.markdown(\"**Actions à lancer** · PR à émettre, du plus urgent au moins urgent\")\n        act = m[m[\"Priorité\"] <= 2]\n        if act.empty:\n            ui.callout(\"Aucune PR à émettre : stock et commandes couvrent le besoin de l'année.\", \"ok\", \"✅\")\n        else:\n            ui.tableau(_tableau_ccn(act), column_config=CFG, height=\"content\" if len(act) <= 10 else 400)\n        _exports(res)\n\n\ndef _tableau_ccn(m: pd.DataFrame) -> pd.DataFrame:\n    return pd.DataFrame({\n        \"Action\": m[\"Action\"], \"CCN\": m[\"CCN\"], \"PN\": m[\"PN\"], \"Désignation\": m[\"Désignation\"], \"Types avion\": m[\"Types avion\"],\n        \"Classes\": m[\"Classes\"], \"Fournisseur\": m[\"Fournisseur\"], \"Besoin\": m[\"Besoin\"], \"Stock\": m[\"Stock\"],\n        \"En commande\": m[\"En commande\"], \"Couverture\": m[\"Couverture\"], \"Écart\": m[\"Écart\"],\n        \"À demander (PR)\": m[\"À demander (PR)\"], \"Couverture (%)\": m[\"Taux de couverture (%)\"].clip(upper=100),\n        \"PU (€)\": m[\"PU (€)\"], \"Valeur à commander (€)\": m[\"Valeur à commander (€)\"], \"À coter\": m[\"À coter\"].map({True: \"oui\", False: \"\"}),\n        \"Commandes\": m[\"Commandes\"], \"Prochaine livraison\": m[\"Prochaine livraison\"],\n    })\n\n\ndef _exports(res: dict):\n    b, m, blocs, d, rat = res[\"b\"], res[\"m\"], res[\"blocs\"], res[\"detail\"], res[\"rattachement\"]\n    a, c = st.columns(2)\n    with a:\n        feuilles = {\n            \"Actions à lancer\": _tableau_ccn(m[m[\"Priorité\"] <= 2]),\n            \"CCN (récap)\": _tableau_ccn(m),\n            \"Avions faisables\": blocs,\n            \"Détail CCN par type\": d,\n            \"Avions restants\": _table_restants(b),\n            \"Rattachement avions\": rat,\n        }\n        ui.telecharger(lambda: sio.exporter_excel(feuilles), sio.nom_export(TAB_ID), K + \"export\", label=\"⬇️ PE mousses complète (Excel)\")\n    with c, st.popover(\"🔎 Contrôles des données\", width=\"stretch\"):\n        absents = m[~m[\"Dans l'État du stock\"]]\n        st.markdown(f\"- **{len(absents)}** CCN du Besoin Prod absents de l'État du stock (stock compté à 0)\"\n                    + (f\" : {', '.join(absents['CCN'].head(20))}\" if len(absents) else \"\"))\n        st.markdown(f\"- **{int(m['À coter'].sum())}** CCN sans prix (ni Dernier PU de l'État du stock, ni prix du devis) : à coter.\")\n        partages = m[m[\"Nb types\"] > 1]\n        st.markdown(f\"- **{len(partages)}** CCN communs à plusieurs types d'avion : leur stock est réparti entre les types.\")\n        if len(rat):\n            amb = int(rat[\"Ambigu\"].sum())\n            st.markdown(f\"- **{len(rat)}** avions rattachés à un type d'avion par leurs CCN de mousses\"\n                        + (f\", dont **{amb}** ex æquo entre deux types (premier retenu).\" if amb else \".\"))\n            ui.tableau(rat.drop(columns=[\"cle\"]), height=220)\n\n\ndef _table_restants(b: pd.DataFrame) -> pd.DataFrame:\n    t = b.groupby([\"Type avion\", \"Classe\", \"Composant\"], dropna=False).agg(**{\n        \"Flotte\": (\"Flotte\", \"first\"), \"NB_AC\": (\"NB_AC\", \"max\"), \"Restant (fichier)\": (\"Restant fichier\", \"max\"),\n        \"Avions rattachés\": (\"Avions rattachés\", \"max\"), \"Remplacés cette année\": (\"Remplacés cette année\", \"max\"),\n        \"Restant calculé\": (\"Restant calculé\", \"max\"), \"Avions restants (retenu)\": (\"Avions restants\", \"max\"),\n        \"Source\": (\"Source restant\", \"first\")}).reset_index()\n    return t[[\"Type avion\", \"Flotte\", \"Classe\", \"Composant\", \"NB_AC\", \"Restant (fichier)\", \"Avions rattachés\",\n              \"Remplacés cette année\", \"Restant calculé\", \"Avions restants (retenu)\", \"Source\"]]\n\n\n# --------------------------------------------------------------------------\n# Avions faisables\n# --------------------------------------------------------------------------\ndef _faisables(res: dict, today: date):\n    blocs, d, b, annee = res[\"blocs\"], res[\"detail\"], res[\"b\"], res[\"annee\"]\n    with ui.section(f\"{TAB_ID}_faisables\", f\"Avions faisables {annee}\",\n                    \"Un avion d'une classe est complet quand tous ses CCN sont disponibles ; le stock d'un CCN commun est \"\n                    \"réparti entre les types d'avion\"):\n        ui.kpi_grid(_kpis_avions(blocs, annee))\n        ui.graphe(_jauges_blocs(blocs, \"Avancement par type d'avion et par classe (nombre d'avions de chaque classe)\"))\n        t = blocs.assign(Bloc=[p26.nom_bloc(x, y) for x, y in zip(blocs[\"Type avion\"], blocs[\"Classe\"])])\n        cols = [\"Type avion\", \"Flotte\", \"Classe\", \"Objectif\", \"Complets maintenant\", \"Complets à réception\", \"À coter\", \"À approvisionner\",\n                \"Taux (%)\", \"Nb CCN\", \"CCN couverts\", \"CCN communs\", \"CCN limitant\", \"PN à coter\"]\n        ui.tableau(t[cols], column_config=CFG, height=\"content\" if len(t) <= 12 else 420)\n        with st.popover(\"ℹ️ Règles de calcul et avions restants\", width=\"content\"):\n            st.markdown(\n                \"- **Objectif** = avions restant à traiter (voir tableau ci-dessous et ⚙️ Paramètres).\\n\"\n                \"- **Complets maintenant** : avions équipables avec le stock ; un CCN commun à plusieurs types est réparti, \"\n                \"l'avion suivant allant toujours au type le moins avancé.\\n\"\n                \"- **Complets à réception** : en plus, une fois les commandes en cours livrées (stock + en commande).\\n\"\n                \"- **À approvisionner** : le reste de l'objectif, impossible sans nouvelle commande. Avec un **CCN commun** \"\n                \"à plusieurs types, les commandes en cours peuvent suffire pour un type seul mais pas pour tous : le reste \"\n                \"est alors à approvisionner (voir « CCN communs » et le détail par type).\\n\"\n                \"- Le stock est partagé entre classes et types : ces chiffres montrent ce que permet le stock, pas une affectation.\")\n            ui.tableau(_table_restants(b), width=1100, height=360)\n    _detail_type(d, blocs)\n\n\n@st.fragment\ndef _detail_type(d: pd.DataFrame, blocs: pd.DataFrame):\n    types = sorted(blocs[\"Type avion\"].unique())\n    if not types:\n        return\n    with ui.section(f\"{TAB_ID}_detail_type\", \"Détail par type d'avion\",\n                    \"Avions de l'objectif couverts par chaque CCN : par le stock (vert), à réception des commandes (bleu), \"\n                    \"manquants (orange : à coter, rouge : à approvisionner) ; trait = objectif de la classe\"):\n        a, b = st.columns([1.2, 2], vertical_alignment=\"center\")\n        typ = a.selectbox(\"Type d'avion\", types, key=K + \"type\", persist_state=\"page\", label_visibility=\"collapsed\")\n        x = d[d[\"Type avion\"] == typ].sort_values([\"Classe\", \"Avions (stock)\"])\n        bt = blocs[blocs[\"Type avion\"] == typ]\n        with b:\n            st.html('<div class=\"s360-note\">' + \" · \".join(\n                f\"<b>{r['Classe']}<\/b> : {int(r['Complets maintenant'])} / {int(r['Objectif'])} complets maintenant\"\n                + (f\", {int(r['Complets à réception'])} à réception\" if r[\"Complets à réception\"] else \"\")\n                + (f\" (limitant : {r['CCN limitant']})\" if r[\"Complets maintenant\"] < r[\"Objectif\"] else \"\")\n                for _, r in bt.iterrows()) + \"<\/div>\")\n        lignes = []\n        for _, r in x.iterrows():\n            commun = r[\"Types partageant le CCN\"] > 1\n            libelle = f\"{r['Classe']} · {r['CCN']} · {r['PN']}\" + (f\" · commun à {r['Types partageant le CCN']} types\" if commun else \"\")\n            manque = int(r[p26.SEGMENTS_CCN[2]])\n            couleur_manque = p26.ORANGE if r[\"À coter\"] else p26.ROUGE\n            segs = [(\"Avions couverts par le stock\", r[p26.SEGMENTS_CCN[0]], p26.VERT),\n                    (\"Avions couverts à réception des commandes\", r[p26.SEGMENTS_CCN[1]], p26.BLEU),\n                    (\"Avions manquants : \" + (\"CCN à coter\" if r[\"À coter\"] else \"à approvisionner\"), manque, couleur_manque),\n                    (\"Au-delà de l'objectif\", r[p26.SEGMENTS_CCN[3]], SURPLUS)]\n            info = [f\"Statut : {r['Statut CCN']}\",\n                    f\"Stock {charts.entier(r['Stock'])} · stock + commandes {charts.entier(r['Couverture'])} \"\n                    f\"· {charts.entier(r['Qté par avion'])} par avion\"\n                    + (f\" (part de ce type sur un CCN commun ; besoin total {charts.entier(r['Besoin total CCN'])})\" if commun else \"\")]\n            texte = f\"manque {manque}\" if manque else \"✓ couvert\"\n            lignes.append((libelle, segs, r[\"Objectif\"], texte, info))\n        leg = [(\"Couvert par le stock\", p26.VERT, \"barre\"), (\"Couvert à réception des commandes\", p26.BLEU, \"barre\"),\n               (\"À coter (sans prix)\", p26.ORANGE, \"barre\"), (\"À approvisionner\", p26.ROUGE, \"barre\"),\n               (\"Au-delà de l'objectif\", SURPLUS, \"barre\"), (\"Objectif de la classe\", COLORS[\"text\"], \"trait\")]\n        ui.graphe(charts.jauges(lignes, f\"{typ} : avions couvrables par CCN\", leg, repere_nom=\"Objectif\", fmt=charts.entier,\n                                hauteur_max=\"34rem\"))\n        t = x[[\"Statut CCN\", \"Classe\", \"CCN\", \"PN\", \"Désignation\", \"Qté par avion\", \"Objectif\", \"Besoin\", \"Besoin total CCN\", \"Stock\",\n               \"Couverture\", \"Avions (stock)\", \"Avions (stock + commandes)\", \"Manque (unités)\", \"PU (€)\", \"Types partageant le CCN\"]]\n        ui.tableau(t, column_config=CFG, height=\"content\" if len(t) <= 10 else 380)\n\n\n# --------------------------------------------------------------------------\n# CCN et commandes\n# --------------------------------------------------------------------------\ndef _ccn(res: dict, today: date):\n    m, annee = res[\"m\"], res[\"annee\"]\n    with ui.section(f\"{TAB_ID}_ccn\", \"CCN et commandes\",\n                    f\"Besoin {annee} face au stock et aux commandes en cours, par CCN : quantités à demander (PR)\"):\n        ui.kpi_grid([\n            ui.kpi_card(\"CCN suivis\", charts.entier(len(m)), \"dans le Besoin Prod\", \"navy\"),\n            ui.kpi_card(\"Stock\", charts.entier(m[\"Stock\"].sum()), \"mousses sur étagère\", \"ok\"),\n            ui.kpi_card(\"CCN à approvisionner\", charts.entier((m[\"Écart\"] > 0).sum()), \"= PR à émettre\", \"warn\"),\n            ui.kpi_card(\"Quantité à demander\", charts.entier(m[\"À demander (PR)\"].sum()), \"toutes PR confondues\", \"ko\"),\n            ui.kpi_card(\"CCN couverts\", charts.entier((m[\"Écart\"] <= 0).sum()), \"stock + commandes suffisent\", \"ok\"),\n        ])\n        acoter = m[m[\"À coter\"]]\n        if len(acoter):\n            ui.callout(f\"<b>{len(acoter)} CCN à faire coter<\/b> (aucun prix) : coût à commander sous-estimé.\", \"warn\", \"🟡\")\n        _liste_ccn(m)\n\n\n@st.fragment\ndef _liste_ccn(m: pd.DataFrame):\n    a, b, c = st.columns([1.2, 2, 1], vertical_alignment=\"center\")\n    q = a.text_input(\"Recherche\", placeholder=\"🔎 CCN, PN, fournisseur\", key=K + \"q\", label_visibility=\"collapsed\")\n    actions = b.multiselect(\"Action\", p26.ACTIONS, key=K + \"actions\", placeholder=\"Toutes les actions\", label_visibility=\"collapsed\")\n    coter = c.toggle(\"À coter seulement\", key=K + \"coter\")\n    x = m\n    if q:\n        cle = q.strip().upper()\n        x = x[x[\"CCN\"].str.upper().str.contains(cle, regex=False) | x[\"PN\"].str.upper().str.contains(cle, regex=False)\n              | x[\"Fournisseur\"].fillna(\"\").str.upper().str.contains(cle, regex=False)]\n    if actions:\n        x = x[x[\"Action\"].isin(actions)]\n    if coter:\n        x = x[x[\"À coter\"]]\n    ui.graphe(_graphe_couverture(x))\n    ui.tableau(_tableau_ccn(x), column_config=CFG, height=\"content\" if len(x) <= 10 else 440)\n\n\n\n\ndef _graphe_couverture(x: pd.DataFrame) -> str:\n    \"\"\"Une barre par CCN = 100 % de son besoin de l'année : part couverte par le stock, par les commandes en cours,\n    et ce qui manque (à commander). Les moins couverts en premier ; au-delà de 100 %, le surplus est indiqué à droite.\"\"\"\n    v = x[x[\"Besoin\"] > 0].copy()\n    if v.empty:\n        return charts.vide(\"Aucun besoin sur la sélection\")\n    b = v[\"Besoin\"].astype(float)\n    v[\"p_stock\"] = (v[\"Stock\"].clip(upper=b) / b * 100)\n    v[\"p_cde\"] = (v[\"En commande\"].clip(upper=(b - v[\"Stock\"]).clip(lower=0)) / b * 100)\n    v[\"p_manque\"] = (100 - v[\"p_stock\"] - v[\"p_cde\"]).clip(lower=0)\n    v = v.sort_values([\"p_manque\", \"Besoin\"], ascending=[False, False])\n    lignes = []\n    for _, r in v.iterrows():\n        manque = int(r[\"À demander (PR)\"])\n        surplus = r[\"Couverture\"] - r[\"Besoin\"]\n        texte = f\"manque {charts.entier(manque)}\" if manque > 0 else (f\"✓ +{charts.entier(surplus)}\" if surplus > 0 else \"✓ couvert\")\n        info = [f\"Besoin {charts.entier(r['Besoin'])} · stock {charts.entier(r['Stock'])} · en commande {charts.entier(r['En commande'])}\",\n                f\"À demander (PR) : {charts.entier(manque)}\" if manque > 0 else \"Couvert\" + (\" par le stock\" if r[\"Stock\"] >= r[\"Besoin\"] else \" avec les commandes\")]\n        if pd.notna(r.get(\"Prochaine livraison\")):\n            info.append(f\"Prochaine livraison : {pd.Timestamp(r['Prochaine livraison']):%d/%m/%Y}\")\n        lignes.append((f\"{r['CCN']} · {r['PN']}\",\n                       [(\"Stock\", r[\"p_stock\"], p26.VERT), (\"Commandes en cours\", r[\"p_cde\"], p26.BLEU),\n                        (\"Manque : \" + (\"à coter\" if r[\"À coter\"] else \"à commander\"), r[\"p_manque\"],\n                         p26.ORANGE if r[\"À coter\"] else p26.ROUGE)], None, texte, info))\n    leg = [(\"Couvert par le stock\", p26.VERT, \"barre\"), (\"Couvert par les commandes en cours\", p26.BLEU, \"barre\"),\n           (\"À coter (sans prix)\", p26.ORANGE, \"barre\"), (\"Manque : à commander\", p26.ROUGE, \"barre\")]\n    return charts.jauges(lignes, f\"Couverture du besoin de l'année par CCN, en % du besoin ({len(v)} CCN, les moins couverts en haut)\",\n                         leg, fmt=lambda val: f\"{val:.0f} %\", hauteur_max=\"34rem\")\n", "app/modules/stock_chantier.py": "\"\"\"Onglet « Stock par chantier » : besoins chantier (GEAV) × état du stock × commandes.\n\nRepris de legacy/streamlit_GEAV.py. Identifie les pièces à commander et les fournisseurs\nà relancer pour sécuriser les équipements avant le début du chantier.\n\"\"\"\n\nfrom datetime import date\n\nimport pandas as pd\nimport streamlit as st\n\nfrom core import cache, charts\nfrom core import components as ui\nfrom core import io as sio\nfrom core import transforms as tf\nfrom core.style import COLORS\n\nTAB_ID = \"stock_chantier\"\nTAB_LABEL = \"Stock par chantier\"\nTAB_ICON = \"🛠️\"\nTAB_DESCRIPTION = \"Pièces à commander et fournisseurs à relancer avant le début d'un chantier (GEAV).\"\n\nK = f\"{TAB_ID}__\"  # préfixe des clés de widgets / session\n\nGESTIONS_DEFAUT = [245, 246, 247, 400, 401, 230]\nGESTIONS_PROPOSEES = sorted(set(GESTIONS_DEFAUT) | {251, 256, 300, 375, 443, 487, 500})\nETUDE_CLASSIQUE = \"Classique\"\nETUDE_ASREQ = \"ASREQ/NOREQ\"\n\nCOLONNES_ATTENDUES = {\n    ETUDE_CLASSIQUE: [(\"MPN Prime\", \"référence pièce\", True), (\"Qty\", \"quantité requise\", True),\n                      (\"Task TRFX / Task Name\", \"code TRFX\", False), (\"Description\", \"\", False)],\n    ETUDE_ASREQ: [(\"PN + infos pièce sortie\", \"feuille « Ordered »\", True), (\"Qty\", \"\", True), (\"ID BARECODE\", \"code TRFX\", False)],\n    \"stock\": [(\"PNR\", \"\", True), (\"QTE SUR ÉTAGÈRE\", \"\", True), (\"QTE EN CDE\", \"\", False), (\"GESTION\", \"\", False),\n              (\"CODE AGT APPRO\", \"contact par défaut\", False), (\"CODE / DERNIER FOURNISSEUR\", \"\", False), (\"CCN, CLASS CODE\", \"\", False)],\n    \"commandes\": [(\"PN\", \"\", True), (\"Commande\", \"\", False), (\"Code acheteur\", \"\", False), (\"Gestion\", \"fait foi\", False),\n                  (\"Fournisseur, Code fournisseur\", \"le nom manquant est retrouvé par le code\", False),\n                  (\"Date de livraison promise / demandée\", \"\", False), (\"Class code, CCN\", \"\", False)],\n}\n\nCOLONNES_TABLEAU = {\n    \"PN\": \"PN\", \"TL\": \"TL\", \"STATUT\": \"Statut\", \"Qty_a_commander\": \"À commander\", \"QTY_GEAV\": \"Besoin\", \"QTY_STOCK\": \"Stock\",\n    \"QTY_CDE\": \"En cmd\", \"PSD\": \"PSD\", \"FOURNISSEUR\": \"Fournisseur\", \"CODE_ACHETEUR\": \"Acheteur\", \"ACTION\": \"Action\",\n    \"Commande\": \"N° commande\", \"CODE_FOURNISSEUR\": \"Code fournisseur\", \"TRFX\": \"TRFX\", \"CCN\": \"CCN\", \"GESTION\": \"Gestion\",\n    \"CLASS_CODE\": \"Class code\", \"GEAV_DATE\": \"Date chantier\",\n}\nCOLUMN_CONFIG = {\n    \"PSD\": st.column_config.DateColumn(\"PSD\", format=\"DD/MM/YYYY\"),\n    \"Date chantier\": st.column_config.DateColumn(\"Date chantier\", format=\"DD/MM/YYYY\"),\n    \"Gestion\": st.column_config.NumberColumn(\"Gestion\", format=\"%d\"),\n    \"Class code\": st.column_config.NumberColumn(\"Class code\", format=\"%d\"),\n    \"Besoin\": st.column_config.NumberColumn(\"Besoin\", format=\"%d\"),\n    \"Stock\": st.column_config.NumberColumn(\"Stock\", format=\"%d\"),\n    \"En cmd\": st.column_config.NumberColumn(\"En cmd\", format=\"%d\"),\n    \"À commander\": st.column_config.NumberColumn(\"À commander\", format=\"%d\"),\n    \"Action\": st.column_config.TextColumn(\"Action\", width=\"large\"),\n    \"TL\": st.column_config.TextColumn(\"TL\", help=\"Tracking level (État du stock) : 0 = consommable (TL0), 1 = réparable (TL1)\",\n                                      width=\"small\"),\n}\nACTION_COULEURS = {\"commander\": COLORS[\"ko\"], \"relancer_urgent\": COLORS[\"accent\"], \"relancer\": COLORS[\"warn\"],\n                   \"inconnu\": COLORS[\"muted\"], \"en_cours\": COLORS[\"navy_2\"], \"hors_perimetre\": COLORS[\"gris\"], \"ok\": COLORS[\"ok\"]}\n\n\n# --------------------------------------------------------------------------\n# Lectures et calculs mis en cache (une fois par fichier / jeu de paramètres)\n# --------------------------------------------------------------------------\n@st.cache_resource(show_spinner=False, max_entries=4)\ndef _besoins(data: bytes, etude: str):\n    lignes, feuille = (sio.lire_besoins_geav if etude == ETUDE_CLASSIQUE else sio.lire_besoins_asreq)(data)\n    return tf.agreger_besoins(lignes), feuille\n\n\n@st.cache_resource(show_spinner=False, max_entries=2)\ndef _stock(data: bytes):\n    lignes, feuille = cache.etat_stock(data)\n    return tf.agreger_stock(lignes), feuille\n\n\n@st.cache_resource(show_spinner=False, max_entries=2)\ndef _commandes(data: bytes):\n    lignes, feuille = cache.commandes(data)\n    return tf.agreger_commandes(lignes), feuille\n\n\n@st.cache_resource(show_spinner=False, max_entries=4)\ndef _analyse(b_besoin: bytes, etude: str, b_stock: bytes, b_cmd: bytes, gestions: tuple, date_chantier: date):\n    \"\"\"(m, m_scope) : clé de cache = contenu des fichiers + paramètres (pas de hachage de tables).\"\"\"\n    besoin, _ = _besoins(b_besoin, etude)\n    stock, _ = _stock(b_stock)\n    commandes, _ = _commandes(b_cmd)\n    m = tf.croiser_geav(besoin, stock, commandes, gestions, pd.Timestamp(date_chantier))\n    return m, m[m[\"gestion_in_scope\"]].copy()\n\n\ndef tableau(m: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Vue d'affichage / d'export : colonnes renommées, statut court.\"\"\"\n    v = m.assign(STATUT=m[\"ACTION_CODE\"].map(tf.ACTION_LABELS))\n    return v[list(COLONNES_TABLEAU)].rename(columns=COLONNES_TABLEAU)\n\n\n@st.cache_resource(show_spinner=False, max_entries=2)\ndef _export(b_besoin: bytes, etude: str, b_stock: bytes, b_cmd: bytes, gestions: tuple, date_chantier: date) -> bytes:\n    m, m_scope = _analyse(b_besoin, etude, b_stock, b_cmd, gestions, date_chantier)\n    params = {\"etude\": etude, \"date\": date_chantier, \"gestions\": list(gestions)}\n    s = tf.synthese_geav(m_scope)\n    synthese = pd.DataFrame([\n        (\"Type d'étude\", params[\"etude\"]), (\"Date de début du chantier\", f\"{params['date']:%d/%m/%Y}\"),\n        (\"Codes Gestion du périmètre\", \", \".join(str(g) for g in params[\"gestions\"])),\n        (\"Date de l'analyse\", f\"{date.today():%d/%m/%Y}\"), (\"Références (périmètre)\", s[\"n_total\"]),\n        (\"À commander (références)\", s[\"n_commander\"]), (\"À commander (unités)\", s[\"qty_a_commander\"]),\n        (\"À relancer (dont urgentes)\", f\"{s['n_relance']} ({s['n_relance_urgente']})\"),\n        (\"En cours de livraison\", s[\"n_en_cours\"]), (\"Stock suffisant\", s[\"n_ok\"]),\n        (\"PN introuvables\", s[\"n_inconnu\"]), (\"Références classe 8/9\", s[\"n_risque\"]),\n    ], columns=[\"Indicateur\", \"Valeur\"])\n    actions = tf.actions_a_lancer(m_scope)\n    detail = m_scope.sort_values(\"Qty_a_commander\", ascending=False, kind=\"stable\")\n    annexe = m.sort_values(\"Qty_a_commander\", ascending=False, kind=\"stable\")\n\
