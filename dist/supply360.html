  transition: width .25s ease; }

#s360-loading.lent .lent { display: block; }
#s360-loading .avancement { display: none; width: 18rem; height: 8px; border-radius: 8px; overflow: hidden; background: #E3E9F1; }
#s360-loading .avancement i { display: block; height: 100%; width: 3%; border-radius: 8px; transition: width .4s ease;

  background: var(--navy);
}

<script>
// Surveillance du moteur Python (Pyodide, dans un « worker » du navigateur). On note les messages envoyés à
// l'application (clics) et reçus en retour, les erreurs, et on peut sonder le moteur (message « heartbeat » de
// Streamlit, sans effet sur l'app). Si le moteur ne répond plus, un bandeau le signale au lieu d'une page figée.
window.s360Moteur = (function () {
  const journal = [];
  const noter = (m) => {
    journal.push(new Date().toLocaleTimeString("fr-FR") + "  " + String(m).replace(/\s+/g, " ").slice(0, 600));
    if (journal.length > 30) journal.shift();
  };
  window.addEventListener("error", (e) => noter("Erreur : " + (e.message || e.error)));
  window.addEventListener("unhandledrejection", (e) => noter("Erreur : " + ((e.reason && e.reason.message) || e.reason)));
  const consoleErreur = console.error;
  console.error = function (...a) { try { noter(a.map((x) => (x && x.message) || x).join(" ")); } catch (_) {} return consoleErreur.apply(this, a); };
  const etat = { worker: null, envoi: 0, recu: Date.now(), mort: "" };
  const W = window.Worker;
  window.Worker = function (...args) {
    const w = new W(...args);
    etat.worker = w;
    w.addEventListener("message", (e) => {
      etat.recu = Date.now();
      const d = e.data;
      if (d && d.type === "s360:journal") {  // erreur Python transmise par core/journal.py
        noter("Python " + d.texte);
        if (/report this bug|RuntimeStoppedError/.test(d.texte)) etat.mort = "erreur interne de Streamlit";
        if (d.evenement === "session_fermee") etat.mort = "session du moteur fermée";
      }
    });
    w.addEventListener("error", (e) => { etat.mort = e.message || "erreur du moteur"; noter("Moteur arrêté : " + etat.mort); });
    const envoyer = w.postMessage.bind(w);
    w.postMessage = function (m, t) {
      if (m && m.type === "websocket:send") etat.envoi = Date.now();
      if (m && m.type === "http:request") window.s360Moteur.ecouteurs.forEach((f) => f(m));  // suivi des imports
      return envoyer(m, t);
    };
    return w;
  };
  window.Worker.prototype = W.prototype;
  // BackMsg { appHeartbeat: true } (champ 17, booléen ; étiquette varint 0x88 0x01, valeur 1) : Streamlit répond par un « heartbeat_ack ».
  const sonder = () => {
    if (!etat.worker) return;
    const canal = new MessageChannel();
    canal.port1.onmessage = () => canal.port1.close();
    etat.worker.postMessage({ type: "websocket:send", data: { payload: new Uint8Array([136, 1, 1]) } }, [canal.port2]);
  };
  // Python lui-même répond-il ? (commande interne de stlite, hors session Streamlit) : s'il répond alors que la
  // session ne répond plus, la session est bloquée (pas un long calcul) → relance immédiate.
  const pingPython = (delai = 3000) => new Promise((ok) => {
    if (!etat.worker) return ok(false);
    const canal = new MessageChannel();
    const t = setTimeout(() => ok(false), delai);
    canal.port1.onmessage = () => { clearTimeout(t); canal.port1.close(); ok(true); };
    etat.worker.postMessage({ type: "run_python", data: { code: "1" } }, [canal.port2]);
  });
  return { etat, journal, noter, sonder, pingPython, ecouteurs: new Set() };
})();
</script>
<script>
// Le bouton de téléchargement de Streamlit « vérifie » son adresse interne (https://stlite.invalid/…) par une vraie
// requête réseau, qui part vers le proxy et échoue. On y répond localement : aucune requête inutile.
const fetchOrigine = window.fetch;
window.fetch = function (ressource, options) {
  const url = typeof ressource === "string" ? ressource : ressource && ressource.url;
  if (url && url.startsWith("https://stlite.invalid/")) return Promise.resolve(new Response(null, { status: 204 }));
  return fetchOrigine.apply(this, arguments);
};
</script>
<script>
// Surveillance du chargement (script classique : elle fonctionne même si stlite ne se télécharge pas).
(function () {
  const ecran = document.getElementById("s360-loading");
  const etape = document.getElementById("s360-etape");
  const erreur = document.getElementById("s360-erreur");
  const lent = document.getElementById("s360-lent");
  const debut = Date.now();
  const ETAPES = [
    [/Loading Pyodide/i, "Téléchargement du moteur Python (cdn.jsdelivr.net)…", "cdn.jsdelivr.net"],
    [/Mounting files|Unpacking archives/i, "Préparation des fichiers de l'application…", ""],
    [/Installing packages/i, "Installation de pandas, numpy… (cdn.jsdelivr.net, pypi.org)", "cdn.jsdelivr.net et pypi.org"],
    [/Loading streamlit/i, "Chargement de Streamlit…", "cdn.jsdelivr.net"],
    [/loggers|Mocking|Booting/i, "Démarrage de l'application…", ""],
  ];
  let libelle = etape.textContent, hote = "cdn.jsdelivr.net";
  const pret = () => document.querySelector(".s360-header, .stException, [data-testid='stException']");
  // Après le démarrage : bandeau si le moteur s'arrête, ne répond plus (aucune réponse 20 s après un clic ou une
  // sonde) ou si un calcul dure anormalement (plus de 90 s). La sonde part toutes les 30 s d'inactivité, et dès
  // que l'on revient sur l'onglet : un blocage est signalé avant même le prochain clic.
  const surveiller = () => {
    const M = window.s360Moteur;
    let depuis = null, affiche = "";
    const bandeau = document.createElement("div");
    bandeau.id = "s360-bloque";
    document.body.append(bandeau);
    const afficher = (titre, texte) => {
      const cle = titre + texte;
      if (cle === affiche) return;
      affiche = cle;
      if (!titre) { bandeau.classList.remove("visible"); return; }
      bandeau.innerHTML = "<b></b> <span></span><div class='actions'><button type='button' class='relancer'>Relancer en gardant mes " +
        "fichiers</button><button type='button' class='recharger'>Recharger la page</button></div>" +
        "<details><summary>Détails techniques</summary><pre></pre><button type='button' class='copier'>Copier</button></details>";
      bandeau.querySelector("b").textContent = titre;
      bandeau.querySelector("span").textContent = texte;
      bandeau.querySelector("pre").textContent = M.journal.join("\n") || "Aucune erreur enregistrée.";
      bandeau.querySelector(".recharger").onclick = () => location.reload();
      bandeau.querySelector(".relancer").onclick = () => { bandeau.classList.remove("visible"); affiche = ""; window.s360Relancer(); };
      bandeau.querySelector(".copier").onclick = () => navigator.clipboard && navigator.clipboard.writeText(
        titre + "\n" + navigator.userAgent + "\n" + M.journal.join("\n"));
      bandeau.classList.add("visible");
    };
    // Attente d'une réponse du moteur : « Calcul en cours » affiché tout de suite (même pendant un traitement d'import,
    // avant que Streamlit ne signale le calcul). Sans réponse pendant 60 s (onglet visible, sonde comprise), le moteur
    // est relancé AUTOMATIQUEMENT en gardant les fichiers ; une seconde fois en moins de 5 min : bandeau.
    let attente = null, derniereRelance = 0, sondeEnvoyee = false, ping = "";
    const relancerAuto = (raison) => {
      if (Date.now() - derniereRelance < 300000) return false;
      derniereRelance = Date.now();
      M.noter("Relance automatique : " + raison);
      window.s360Relancer(raison);
      return true;
    };
    const bloque = () => afficher("⚠️ L'application ne répond plus.", "Relancez le moteur : vos fichiers sont réimportés automatiquement.");
    const verifier = () => {
      const e = M.etat, now = Date.now();
      const enCours = !!document.querySelector(".stApp[data-test-script-state='running']");
      depuis = enCours ? depuis || now : null;
      attente = e.envoi > e.recu && !enCours ? attente || e.envoi : null;
      if (!attente) { sondeEnvoyee = false; ping = ""; }
      document.body.classList.toggle("s360-attente", !!attente && now - attente > 500 && !window.s360EnRelance);
      const visible = document.visibilityState === "visible";
      if (window.s360EnRelance) { afficher("", ""); return; }
      if (e.mort) {
        if (!relancerAuto(e.mort)) afficher("⛔ Le moteur de calcul s'est arrêté.", "Relancez-le : vos fichiers sont réimportés automatiquement.");
        return;
      }
      // 6 s sans réponse : Python répond-il en direct ? Oui → session bloquée : relance tout de suite.
      // Non → Python calcule ou est arrêté : relance au bout de 30 s sans aucune réponse.
      if (attente && visible && now - attente > 6000 && !ping) {
        ping = "en cours";
        M.pingPython().then((repond) => {
          if (!attente) return;
          ping = repond ? "session bloquée" : "occupé";
          if (repond && !relancerAuto("session bloquée (le moteur répond, mais plus aux clics)")) bloque();
        });
      }
      if (attente && visible && now - attente > 20000 && !sondeEnvoyee) { sondeEnvoyee = true; M.sonder(); }
      // Python muet lui aussi (moteur arrêté, ou calcul bloquant hors calcul Streamlit) : relance au bout de 30 s.
      if (attente && visible && now - attente > 30000 && ping === "occupé") {
        if (!relancerAuto("aucune réponse depuis " + Math.round((now - attente) / 1000) + " s")) bloque();
      } else if (depuis && now - depuis > 90000)
        afficher("⏳ Le calcul dure plus longtemps que prévu.", "Si la page ne répond plus, relancez le moteur (fichiers conservés).");
      else if (ping !== "session bloquée") afficher("", "");
      if (!enCours && visible && e.envoi <= e.recu && now - e.recu > 30000) { e.envoi = now; M.sonder(); }
    };
    setInterval(verifier, 1000);
    // Export Excel préparé à la demande (components.telecharger) : le bouton de téléchargement apparaît, on le clique.
    setInterval(() => {
      document.querySelectorAll('[class*="__auto"] [data-testid="stDownloadButton"] button:not([data-s360-clique])').forEach((b) => {
        b.setAttribute("data-s360-clique", "1");
        b.click();
      });
    }, 400);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      if (attente) attente = Date.now();  // onglet en arrière-plan : le moteur a pu être ralenti, on lui laisse 60 s
      else { M.etat.envoi = Date.now(); M.sonder(); }
    });
  };
  // Préchargement (voir PRECHARGEMENT dans build.py) : un fichier à la fois, quand le navigateur est libre ;
  // les échecs sont retentés une minute plus tard. Ensuite, l'app n'a plus besoin du réseau.
  const precharger = (liste = ["Checkbox-E_kqAaSQ-XDNDyBvK.js", "Close.esm-53Kdm0pn-BTjbStjM.js", "DataFrame-D3ov19Re-DgV6QYb0.js", "DataFrame-D3ov19Re-DiVf96O7.js", "Delete.esm-eQnZPoP6-BmgQoQ39.js", "DownloadButton-BCKLqfXu-CxjBVa7P.js", "FileDownload.esm-iHteBN-O-B2zuyOVq.js", "InputInstructions-kdC8ngsh-DtoZPH3K.js", "NumberInput-DB8CmU_F-CTAxqc36.js", "Selectbox-CPd6VRVc-CEBySJwc.js", "Slider-DZ2YwD_e-BCLslQhV.js", "TextField-DMz8flDd-BYc8lIbh.js", "TextInput-5lGdvVSD-jkOP18uQ.js", "_baseAssignValue-IQwDL8b1-wSPyEqHN.js", "assets/1b1a876c211e4f13.wasm", "assets/512f7db3dabc21be.woff2", "assets/a804e71d97445f8d.woff2", "colors-BD7LS4qt-BehGd4Ls.js", "createDownloadLinkElement-QSfNRYy1-k2qjp4Ep.js", "cubic-Dir1Ko---Ccey17jF.js", "defaultLocale-2bEbhetO-QGFVckfi.js", "formatMoment-DEtsTHwA-Cy3S6Sp4.js", "formatNumber-xp1Ep0f5-DHq-Xx7V.js", "iconPosition-DY1kTtFE-C8pN-O4s.js", "index-Bh_NXBPX-BZVlUpTI.js", "index-CVld_lKx-DBjTNNj_.js", "index-CsubvKbq-FbSnpms7.js", "index-CtOUUcfI-DNqIEPU5.js", "index-DVjwAKiP-zTZQenW8.js", "index-Df-1Z3LJ-BbKzDPIK.js", "index-DgYQCen1-Bimy2-LT.js", "init-5BClRdiB-LyILMlTE.js", "inputUtils-DCYiajnz-DpM8zsby.js", "linear-CJvvCWKw-rrRTERsA.js", "moment-C29_LcvN-QgIIpCw9.js", "numbro-CDdPhOTG-vF1UvoJy.js", "ordinal-DkyryJlW-DURmPlUH.js", "pandasStylerUtils--IM_7ZsY-CD0uJ7uR.js", "range-C0hfWAYi-cb33LuVx.js", "range-DdOGybNB-Ba7Spj1J.js", "reactJsonViewCompat-BquGJEzn-BKjUVnQo.js", "resolveDefaultExport-Cy5TTESD-CcwO08HL.js", "serialization-BSMBF8e2-CqZaT18J.js", "sprintfjs-lt-CVrXF-__7wvrub.js", "string-BvOnLx8K-BsWpS-s0.js", "styled-components-BNQOantF-DPuk6Rjb.js", "threshold-je-9V4hw-qdwK0deF.js", "time-p2i1Qn9v-RYMFf5JC.js", "useUpdateUiValue-Dpx7InB9-BtZthHVv.js", "value-Fb9HFOxE-BHCNJ526.js", "withCalculatedWidth-qkUd4en1-CpQUhavR.js", "withFullScreenWrapper-D-Ly5q5J-Cy5NDgpz.js", "zoom-C9yGXsgU-cg-4X7cE.js"]) => {
    const echecs = [];
    const suivant = (i) => {
      if (i >= liste.length) { if (echecs.length) setTimeout(() => precharger(echecs), 60000); return; }
      const url = "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/" + liste[i];
      const p = url.endsWith(".js") ? import(url) : fetch(url, { cache: "force-cache" }).then((r) => r.arrayBuffer());
      p.catch(() => echecs.push(liste[i])).finally(() => (window.requestIdleCallback || setTimeout)(() => suivant(i + 1)));
    };
    suivant(0);
  };
  window.s360Echec = (message) => {
    if (ecran.classList.contains("echec")) return;
    erreur.textContent = "Le chargement a échoué : " + message;
    lent.textContent = "Vérifiez l'accès à cdn.jsdelivr.net et pypi.org (proxy), puis rechargez la page.";
    ecran.classList.add("echec");
  };
  const suivre = () => {
    if (pret()) { ecran.classList.add("fini"); clearInterval(minuteur); obs.disconnect(); precharger(); surveiller(); return; }
    const toasts = document.querySelectorAll(".Toastify__toast");
    const err = document.querySelector(".Toastify__toast--error");
    if (err) window.s360Echec(err.innerText.trim().slice(0, 400));
    if (toasts.length) {
      const t = toasts[toasts.length - 1].innerText;
      for (const [motif, texte, h] of ETAPES) if (motif.test(t)) { libelle = texte; if (h) hote = h; }
    }
    const sec = Math.round((Date.now() - debut) / 1000);
    const texte = libelle + "  " + sec + " s";
    if (etape.textContent !== texte) etape.textContent = texte;  // n'écrit que si besoin (pas de boucle)
    if (sec >= 60 && !ecran.classList.contains("echec") && !ecran.classList.contains("lent")) {
      lent.textContent = "Le chargement est plus long que prévu (étape : " + libelle.replace(/….*$/, "") +
        "). Le navigateur doit pouvoir accéder à " + hote + " ; le premier lancement sur un nouveau poste ou une nouvelle adresse est le plus long.";
      if (!ecran.classList.contains("lent")) ecran.classList.add("lent");
    }
  };
  // Observe uniquement l'app (#root, où stlite affiche ses étapes), jamais l'écran de chargement lui-même.
  const obs = new MutationObserver(suivre);
  obs.observe(document.getElementById("root"), { childList: true, subtree: true });
  const minuteur = setInterval(suivre, 1000);
})();
</script>
<script>
// Dossiers mémorisés (Edge / Chrome, API File System Access) : le dossier R2 ou Textile, choisi une fois,
// est retenu dans le navigateur (IndexedDB). Ensuite « Ouvrir R2 » + « Autoriser » liste les chantiers ; les
// fichiers du chantier choisi sont déposés dans la zone d'import de l'app, comme un « Parcourir ». Rien ne
// sort du poste : les fichiers sont lus localement, dans le dossier OneDrive synchronisé.
window.s360Chemins = new Map();  // « nom|taille|date » → chemin relatif (« R2/F-XKAA - 151126/x.xlsx »)
window.s360Poignees = new WeakMap();  // fichier → poignée du dossier mémorisé
(function () {
  const EXT = /\.(xlsx|xlsm|csv)$/i;
  const CHANTIER = /([A-Z]{1,2}-?[A-Z0-9]{3,5})\s*-\s*(\d{2})(\d{2})(\d{2})(?!\d)/i;
  const base = () => new Promise((ok, ko) => {
    const r = indexedDB.open("supply360", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("dossiers");
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  });
  const lire = async (cle) => { const db = await base(); return new Promise((ok, ko) => {
    const t = db.transaction("dossiers").objectStore("dossiers").get(cle); t.onsuccess = () => ok(t.result); t.onerror = () => ko(t.error); }); };
  const ecrire = async (cle, v) => { const db = await base(); return new Promise((ok, ko) => {
    const t = db.transaction("dossiers", "readwrite"); t.objectStore("dossiers").put(v, cle); t.oncomplete = ok; t.onerror = () => ko(t.error); }); };
  const autoriser = async (h) => {
    if (!h.queryPermission || (await h.queryPermission({ mode: "read" })) === "granted") return true;
    return (await h.requestPermission({ mode: "read" })) === "granted";
  };
  // Barre de progression des imports : lecture des fichiers (i / n), envoi au moteur Python (i / n : un fichier
  // OneDrive « en ligne seulement » est téléchargé à ce moment-là), puis analyse (jusqu'à la fin du calcul).
  const progres = (() => {
    let el = null, fin = null;
    const montrer = (titre, i, n) => {
      if (!el) {
        el = document.createElement("div");
        el.id = "s360-progres";
        el.innerHTML = "<div class='l'><b></b><span></span></div><div class='piste'><i></i></div>";
        document.body.append(el);
      }
      clearTimeout(fin);
      el.className = "visible" + (n ? "" : " indet");
      el.querySelector("b").textContent = titre;
      el.querySelector("span").textContent = n ? `${i} / ${n}` : "";
      el.querySelector("i").style.width = n ? `${Math.max(4, Math.round(i / n * 100))}%` : "";
    };
    const cacher = (texte) => {
      if (!el) return;
      if (texte) { montrer(texte, 1, 1); el.classList.add("ok"); el.querySelector("span").textContent = ""; }
      fin = setTimeout(() => el.classList.remove("visible"), texte ? 1800 : 0);
    };
    const suivre = (n) => {
      const M = window.s360Moteur, debut = Date.now();
      let envoyes = 0, dernier = Date.now(), vu = false;
      const ecoute = (m) => {
        const r = (m.data && m.data.request) || {};
        if (/upload_file/.test(String(r.path || r.url || ""))) { envoyes++; dernier = Date.now(); }
      };
      M.ecouteurs.add(ecoute);
      montrer("Envoi des fichiers à Supply360…", 0, n);
      const tic = setInterval(() => {
        const enCours = !!document.querySelector(".stApp[data-test-script-state='running']");
        vu = vu || enCours;
        if (!vu && envoyes < n) montrer("Envoi des fichiers à Supply360…", envoyes, n);
        else if (enCours || !vu) montrer("Analyse des fichiers…", 0, 0);
        const fini = (vu && !enCours) || (envoyes >= n && !vu && Date.now() - dernier > 6000);
        if (fini || Date.now() - debut > 300000) {
          clearInterval(tic);
          M.ecouteurs.delete(ecoute);
          cacher(fini ? `✓ ${n} fichier${n > 1 ? "s" : ""} importé${n > 1 ? "s" : ""}` : "");
        }
      }, 250);
    };
    return { montrer, cacher, suivre };
  })();
  window.s360Progres = progres;
  async function fichiers(dir, chemin, profondeur) {
    const poignees = [];
    const parcourir = async (d, ch, p) => {
      for await (const [nom, e] of d.entries()) {
        if (e.kind === "file" && EXT.test(nom) && !nom.startsWith("~$")) poignees.push([e, `${ch}/${nom}`]);
        else if (e.kind === "directory" && p > 0) await parcourir(e, `${ch}/${nom}`, p - 1);
      }
    };
    await parcourir(dir, chemin, profondeur);
    const out = [];
    for (const [i, [e, ch]] of poignees.entries()) {
      progres.montrer("Lecture des fichiers…", i, poignees.length);
      const f = await e.getFile();
      window.s360Chemins.set(`${f.name}|${f.size}|${f.lastModified}`, ch);
      window.s360Poignees.set(f, e);  // relance du moteur : fichier relu sur le disque (OneDrive a pu le mettre à jour)
      out.push(f);
    }
    return out;
  }
  function deposer(cible, liste) {
    const input = document.querySelector(`[class*="st-key-${cible}"] input[type=file]`);  // clé versionnée (…upload3)
    if (!input) throw new Error("zone d'import introuvable sur la page");
    const dt = new DataTransfer();
    liste.forEach((f) => dt.items.add(f));
    input.files = dt.files;
    input.dispatchEvent(new Event("change", { bubbles: true }));
    progres.suivre(liste.length);
  }
  function fenetre(html) {
    fermer();
    const f = document.createElement("div");
    f.id = "s360-fenetre";
    f.innerHTML = `<div class="boite" role="dialog" aria-modal="true"><button type="button" class="fermer" aria-label="Fermer">✕</button>${html}</div>`;
    f.addEventListener("click", (e) => { if (e.target === f || e.target.closest(".fermer")) fermer(); });
    document.body.append(f);
    return f;
  }
  const fermer = () => document.getElementById("s360-fenetre")?.remove();
  const message = (texte) => fenetre(`<p class="msg">${texte}</p>`);
  async function listeChantiers(h, cible) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const items = [];
    for await (const [nom, e] of h.entries()) {
      const m = e.kind === "directory" && nom.match(CHANTIER);
      if (!m) continue;
      const d = new Date(2000 + +m[4], +m[3] - 1, +m[2]);
      if (!isNaN(d)) items.push({ nom, e, immat: m[1].toUpperCase(), d, j: Math.round((d - today) / 864e5) });
    }
    if (!items.length) {
      message(`Aucun dossier « IMMAT - JJMMAA » dans « ${h.name} ». Vérifiez le dossier choisi (bouton « Changer de dossier »).`);
      return;
    }
    const avenir = items.filter((x) => x.j >= 0).sort((a, b) => a.d - b.d);
    const passes = items.filter((x) => x.j < 0).sort((a, b) => b.d - a.d);
    const dernier = localStorage.getItem("s360-dernier-chantier");
    const ligne = (x, i) => `<button type="button" class="ch${x.nom === dernier ? " dernier" : ""}" data-i="${i}">
      <b>${x.immat}</b><span>début ${x.d.toLocaleDateString("fr-FR")}</span>
      <em>${x.j > 0 ? "À venir · J-" + x.j : x.j === 0 ? "Aujourd'hui" : "Démarré il y a " + -x.j + " j"}</em></button>`;
    const tous = [...avenir, ...passes];
    const f = fenetre(`<h3>Chantier à analyser</h3><p class="sous">Dossier « ${h.name} » · ${tous.length} chantiers</p>
      <input type="search" placeholder="🔎 Immatriculation…" class="filtre">
      <div class="liste">${avenir.map((x) => ligne(x, tous.indexOf(x))).join("")}
      ${passes.length ? `<div class="sep">Chantiers démarrés</div>${passes.map((x) => ligne(x, tous.indexOf(x))).join("")}` : ""}</div>`);
    const filtre = f.querySelector(".filtre");
    filtre.focus();
    filtre.addEventListener("input", () => f.querySelectorAll(".ch").forEach((b) => {
      b.style.display = b.textContent.toUpperCase().includes(filtre.value.trim().toUpperCase()) ? "" : "none"; }));
    f.querySelectorAll(".ch").forEach((b) => b.addEventListener("click", async () => {
      const x = tous[+b.dataset.i];
      localStorage.setItem("s360-dernier-chantier", x.nom);
      fermer();
      try {
        const liste = await fichiers(x.e, `${h.name}/${x.nom}`, 2);
        if (!liste.length) { progres.cacher(); message(`Aucun fichier Excel dans « ${x.nom} ».`); return; }
        deposer(cible, liste);
      } catch (err) { progres.cacher(); message("Lecture impossible : " + err.message); }
    }));
  }
  document.addEventListener("click", async (ev) => {
    const b = ev.target.closest(".s360-dossier-btn");
    if (!b) return;
    ev.preventDefault();
    const { dossier, cible, mode } = b.dataset;
    if (!window.showDirectoryPicker) {
      message("Le dossier mémorisé fonctionne avec Edge ou Chrome. Utilisez « Parcourir » ci-dessous.");
      return;
    }
    try {
      let h = b.dataset.changer ? null : await lire(dossier);
      if (h && !(await autoriser(h))) return;
      if (!h) {
        h = await window.showDirectoryPicker({ id: `s360-${dossier}`, mode: "read" });
        await ecrire(dossier, h);
      }
      if (mode === "chantier") await listeChantiers(h, cible);
      else if (mode === "dernier") {  // dossier COMMANDE : le fichier le plus récemment modifié
        const liste = await fichiers(h, h.name, 0);
        if (!liste.length) { progres.cacher(); message(`Aucun fichier Excel dans « ${h.name} ».`); return; }
        deposer(cible, [liste.reduce((a, b) => (b.lastModified > a.lastModified ? b : a))]);
      } else {
        const liste = await fichiers(h, h.name, 0);
        if (!liste.length) { progres.cacher(); message(`Aucun fichier Excel ou CSV dans « ${h.name} ».`); return; }
        deposer(cible, liste);
      }
    } catch (err) {
      progres.cacher();
      if (err.name !== "AbortError") message("Accès au dossier impossible : " + err.message);
    }
  });
})();
</script>
<script>
// Relance du moteur sans perdre les fichiers. Chaque import (📂 Ouvrir ou Parcourir) est retenu EN MÉMOIRE de la
// page (rien n'est écrit sur le disque) : clé de la zone d'import + fichiers. Si le moteur Python s'arrête ou ne
// répond plus, « Relancer » redémarre stlite (sans recharger la page) puis redépose chaque import dans sa zone,
// onglet par onglet, dans l'ordre d'origine.
(function () {
  const ONGLETS = {"alertes": "Alertes", "fournisseurs": "Fournisseurs", "pe_mousses": "PE mousses", "stock_chantier": "Stock par chantier", "textiles": "Textile cabine"};  // TAB_ID → libellé de l'onglet
  const imports = [];
  window.s360Imports = imports;  // (lecture seule : diagnostic)
  let rejeu = false;
  const cleDe = (el) => {
    const c = el.closest('[class*="st-key-"]');
    const m = c && [...c.classList].map((x) => x.match(/^st-key-(.+)$/)).find(Boolean);
    return m ? m[1].replace(/(__upload)\d*$/, "$1") : null;
  };
  const ongletActif = () => {
    const b = document.querySelector('.st-key-s360_nav button[aria-checked="true"], .st-key-s360_nav button[data-selected="true"]');
    const lib = b ? b.textContent : "";
    return Object.keys(ONGLETS).find((id) => lib.includes(ONGLETS[id])) || Object.keys(ONGLETS)[0];
  };
  document.addEventListener("change", (e) => {
    const inp = e.target;
    if (rejeu || !(inp instanceof HTMLInputElement) || inp.type !== "file" || !inp.files || !inp.files.length) return;
    const cle = cleDe(inp);
    if (!cle) return;
    const onglet = cle.startsWith("commun__") ? ongletActif() : cle.split("__")[0];
    for (let i = imports.length - 1; i >= 0; i--) if (imports[i].cle === cle) imports.splice(i, 1);  // une sélection remplace l'autre
    imports.push({ cle, onglet, fichiers: [...inp.files] });
  }, true);
  const pause = (ms) => new Promise((ok) => setTimeout(ok, ms));
  const M = () => window.s360Moteur;
  const occupe = () => !document.querySelector(".s360-header") || !!document.querySelector(".stApp[data-test-script-state='running']")
    || M().etat.envoi > M().etat.recu;
  const libre = async (max = 180000) => {  // attend la fin du calcul Streamlit (et des réponses du moteur)
    const debut = Date.now();
    await pause(400);
    let calme = 0;
    while (Date.now() - debut < max) {
      calme = occupe() ? 0 : calme + 1;
      if (calme >= 6) return;
      await pause(250);
    }
  };
  // Dépôt de fichiers dans une zone d'import, puis attente : envoi de TOUS les fichiers au moteur, puis fin du calcul.
  const deposerEtAttendre = (input, fichiers) => new Promise((ok) => {
    let envoyes = 0, dernier = Date.now(), vu = false;
    const debut = Date.now();
    const ecoute = (m) => {
      const r = (m.data && m.data.request) || {};
      if (/upload_file/.test(String(r.path || ""))) { envoyes++; dernier = Date.now(); }
    };
    M().ecouteurs.add(ecoute);
    const dt = new DataTransfer();
    fichiers.forEach((f) => dt.items.add(f));
    input.files = dt.files;
    input.dispatchEvent(new Event("change", { bubbles: true }));
    const tic = setInterval(() => {
      const o = occupe();
      if (envoyes >= fichiers.length && o) vu = true;
      const fini = envoyes >= fichiers.length && !o && Date.now() - dernier > 1200 && (vu || Date.now() - dernier > 6000);
      if (fini || Date.now() - debut > 240000) { clearInterval(tic); M().ecouteurs.delete(ecoute); ok(fini); }
    }, 150);
  });
  const ouvrirOnglet = async (id) => {
    const b = [...document.querySelectorAll(".st-key-s360_nav button")].find((x) => x.textContent.includes(ONGLETS[id]));
    if (b && !b.matches('[aria-checked="true"], [data-selected="true"]')) { b.click(); await libre(); }
  };
  // Écran de relance : celui du chargement (logo, Supply360, avion) avec une barre d'avancement.
  const ecran = (() => {
    const el = document.getElementById("s360-loading");
    let barre = el.querySelector(".avancement");
    if (!barre) {
      barre = document.createElement("div");
      barre.className = "avancement";
      barre.innerHTML = "<i></i>";
      el.querySelector(".barre").after(barre);
    }
    return {
      montrer(texte, etape, pct) {
        el.classList.remove("fini", "lent", "echec");
        el.classList.add("relance");
        el.querySelector(".texte").textContent = texte;
        el.querySelector(".etape").textContent = etape;
        barre.querySelector("i").style.width = Math.max(3, Math.min(100, pct)) + "%";
      },
      cacher() { el.classList.add("fini"); setTimeout(() => el.classList.remove("relance"), 600); },
    };
  })();
  window.s360Relancer = async (raison) => {
    const Mo = M(), retour = ongletActif();
    if (window.s360EnRelance) return;
    window.s360EnRelance = true;
    const titre = raison ? "Le moteur de calcul ne répondait plus : relance automatique, vos fichiers sont conservés."
      : "Relance du moteur de calcul, vos fichiers sont conservés.";
    let pct = 2;
    const montee = setInterval(() => { pct += (55 - pct) * 0.06; ecran.montrer(titre, "Redémarrage du moteur Python…", pct); }, 400);
    const echecs = [];
    try {
      ecran.montrer(titre, "Redémarrage du moteur Python…", pct);
      try { window.s360App && window.s360App.unmount(); } catch (_) { /* moteur déjà arrêté */ }
      Mo.etat.mort = ""; Mo.etat.envoi = 0; Mo.etat.recu = Date.now();
      await window.s360Monter();
      await libre(300000);
      clearInterval(montee);
      rejeu = true;
      const ordre = [...new Set(imports.map((x) => x.onglet))];
      let n = 0;
      for (const id of ordre) {
        await ouvrirOnglet(id);
        for (const imp of imports.filter((x) => x.onglet === id)) {
          n++;
          ecran.montrer(titre, `Réimport de vos fichiers (${n} / ${imports.length}) : ${ONGLETS[id] || ""}…`, 55 + 45 * (n - 1) / imports.length);
          // fichiers relus sur le disque quand ils viennent d'un dossier mémorisé (version à jour, lisible)
          const fichiers = [];
          for (const f of imp.fichiers) {
            const h = window.s360Poignees.get(f);
            try { fichiers.push(h ? await h.getFile() : f); } catch (_) { fichiers.push(f); }
          }
          // zone d'origine ; à défaut (zone absente, ex. type d'étude différent) l'import du dossier de l'onglet,
          // qui reconnaît chaque fichier par son contenu
          const input = document.querySelector(`[class*="st-key-${imp.cle}"] input[type=file]`)
            || document.querySelector(`[class*="st-key-${id}__dossier__upload"] input[type=file]`);
          if (!input || !(await deposerEtAttendre(input, fichiers))) echecs.push(imp.fichiers.map((f) => f.name).join(", "));
        }
      }
      await ouvrirOnglet(retour);
      ecran.montrer(titre, echecs.length ? "Terminé, sauf : " + echecs.join(" ; ") : "✓ Moteur relancé, fichiers réimportés", 100);
      if (echecs.length) Mo.noter("Réimport incomplet : " + echecs.join(" ; "));
      await pause(echecs.length ? 4000 : 900);
      ecran.cacher();
    } catch (err) {
      Mo.noter("Relance impossible : " + err);
      location.reload();
    } finally {
      clearInterval(montee);
      rejeu = false;
      window.s360EnRelance = false;
    }
  };
})();
</script>
<script type="module">
// Import d'un dossier : stlite n'envoie que le nom du fichier. On transmet son chemin relatif
// (« R2/F-XKAA - 151126/extraction.xlsx ») pour que l'app regroupe les fichiers par dossier chantier.
const ajouterFormData = FormData.prototype.append;
FormData.prototype.append = function (nom, valeur, fichier) {
  if (valeur instanceof File && fichier === undefined) {
    const chemin = window.s360Chemins.get(`${valeur.name}|${valeur.size}|${valeur.lastModified}`) || valeur.webkitRelativePath;
    if (chemin) return ajouterFormData.call(this, nom, valeur, chemin);
  }
  return ajouterFormData.apply(this, arguments);
};

// Import dynamique : un échec de téléchargement de stlite est affiché au lieu de bloquer l'écran de chargement.
// s360Monter est réutilisé par la relance du moteur (bandeau « L'application ne répond plus »).
const OPTIONS = {
  entrypoint: "app/main.py",
  requirements: ["pandas", "numpy", "python-calamine"],
  files: {"app/core/__init__.py": "", "app/core/cache.py": "\"\"\"Lectures des sources communes, mises en cache et partagées entre onglets.\n\nUn même fichier « État du stock » ou « Commandes (SAP) » importé dans un onglet est lu une seule\nfois : l'autre onglet réutilise le résultat. La clé de cache est le contenu du fichier (octets).\n\n`st.cache_resource` plutôt que `st.cache_data` : le résultat est gardé tel quel en mémoire, sans\ncopie par pickle. Sous Pyodide, relire par pickle un DataFrame contenant des dates échoue\n(NotImplementedError) et coûte du temps à chaque interaction. Les fonctions appelantes ne\nmodifient jamais les tables reçues (elles travaillent sur des copies).\n\"\"\"\n\nimport streamlit as st\n\nfrom core import io as sio\n\n\n@st.cache_resource(show_spinner=\"Lecture de l'État du stock…\", max_entries=2)\ndef etat_stock(data: bytes):\n    return sio.lire_etat_stock(data)\n\n\n@st.cache_resource(show_spinner=\"Lecture des commandes…\", max_entries=2)\ndef commandes(data: bytes):\n    return sio.lire_commandes_sap(data)\n\n\n@st.cache_resource(show_spinner=\"Lecture des références textile…\", max_entries=2)\ndef references_textile(data: bytes):\n    return sio.lire_references_textile(data)\n", "app/core/charts.py": "\"\"\"Graphes HTML / SVG légers, dans le style du prototype Supply360.\n\nFonctions pures : elles renvoient du HTML affiché par `components.graphe` (st.markdown). Aucune\ndépendance et aucun JavaScript : rendu instantané, rien à charger. Les positions horizontales sont\nen %, les hauteurs en px : les textes gardent leur taille quelle que soit la largeur.\n\nSurvol : chaque colonne (ou ligne, ou case) porte une infobulle `data-tip` affichée en CSS\n(core/theme.css) avec toutes ses valeurs.\n\"\"\"\n\nimport math\nfrom html import escape\n\nimport pandas as pd\n\nfrom core.style import COLORS\n\nPALETTE = [COLORS[\"navy_2\"], \"#2A9D8F\", \"#F4A259\", \"#BC4B51\", COLORS[\"violet\"], \"#8AB17D\", COLORS[\"gris\"]]\nHAUT = 20  # marge au-dessus des barres (étiquettes de valeur)\n\n\n# --------------------------------------------------------------------------\n# Formats\n# --------------------------------------------------------------------------\ndef _nan(v) -> bool:\n    try:\n        return v is None or math.isnan(float(v))\n    except (TypeError, ValueError):\n        return True\n\n\ndef court(v) -> str:\n    \"\"\"1 234 → « 1,2k », 3 400 000 → « 3,4 M » (format français).\"\"\"\n    if _nan(v):\n        return \"\"\n    v = float(v)\n    a = abs(v)\n    if a >= 1e6:\n        s = f\"{v / 1e6:.1f} M\"\n    elif a >= 1e4:\n        s = f\"{v / 1e3:.0f}k\"\n    elif a >= 1e3:\n        s = f\"{v / 1e3:.1f}k\"\n    else:\n        s = f\"{v:.0f}\" if v.is_integer() else f\"{v:.1f}\"\n    return s.replace(\".\", \",\")\n\n\ndef euros(v) -> str:\n    if _nan(v):\n        return \"0 €\"\n    v = float(v)\n    a = abs(v)\n    if a >= 1e6:\n        return f\"{v / 1e6:.1f} M€\".replace(\".\", \",\")\n    if a >= 1e3:\n        return f\"{v / 1e3:.0f} k€\"\n    return f\"{v:.0f} €\"\n\n\ndef entier(v) -> str:\n    return \"\" if _nan(v) else f\"{float(v):,.0f}\".replace(\",\", \" \")\n\n\ndef pourcent(v) -> str:\n    return \"\" if _nan(v) else f\"{float(v):.0f} %\"\n\n\ndef jours(v) -> str:\n    return \"\" if _nan(v) else f\"{float(v):+.0f} j\".replace(\"+0 j\", \"0 j\")\n\n\n# --------------------------------------------------------------------------\n# Briques communes\n# --------------------------------------------------------------------------\ndef _tip(lignes) -> str:\n    \"\"\"Attribut data-tip (une ligne par élément, vides ignorés).\"\"\"\n    texte = \"\\n\".join(str(l) for l in lignes if l not in (None, \"\"))\n    return f' data-tip=\"{escape(texte, quote=True)}\"'.replace(\"\\n\", \"&#10;\")\n\n\ndef _titre(t):\n    return f\"<h5>{escape(t)}<\/h5>\" if t else \"\"\n\n\ndef legende(items) -> str:\n    \"\"\"items : [(libellé, couleur, 'barre' | 'ligne' | 'repere' | 'trait')].\"\"\"\n    if not items:\n        return \"\"\n    cls = {\"ligne\": \"ln\", \"repere\": \"rp\", \"trait\": \"tr\"}\n    spans = \"\".join(f'<span><i class=\"{cls.get(k, \"\")}\" style=\"background:{c}\"><\/i>{escape(str(n))}<\/span>' for n, c, k in items)\n    return f'<div class=\"s360-legend\">{spans}<\/div>'\n\n\ndef vide(message=\"Aucune donnée à afficher\") -> str:\n    return f'<div class=\"s360-chart\"><p class=\"s360-vide\">{escape(message)}<\/p><\/div>'\n\n\ndef _libelle(c, temporel):\n    if temporel:\n        return pd.Timestamp(c).strftime(\"%m/%y\")\n    return str(c)\n\n\ndef _etiquettes_x(cats, temporel=False):\n    \"\"\"Étiquettes sous les colonnes : inclinées si longues ; mois : une sur k si nombreux.\"\"\"\n    n = len(cats)\n    if temporel:\n        pas = max(1, math.ceil(n / 14))\n        spans = \"\".join(f\"<span>{escape(c) if i % pas == 0 else ''}<\/span>\" for i, c in enumerate(cats))\n        return f'<div class=\"s360-xl\" style=\"grid-template-columns:repeat({n},minmax(0,1fr))\">{spans}<\/div>', False\n    long_ = max(len(c) for c in cats)\n    tourner = n > 4 and (n > 12 or long_ > 9)\n    spans = \"\".join(f'<span title=\"{escape(c)}\">{escape(c)}<\/span>' for c in cats)\n    cls = \"s360-xl rot\" if tourner else \"s360-xl\"\n    return f'<div class=\"{cls}\" style=\"grid-template-columns:repeat({n},minmax(0,1fr))\">{spans}<\/div>', tourner\n\n\ndef _cote(i, n):\n    \"\"\"Classe d'alignement de l'infobulle : à gauche pour les premières colonnes, à droite pour les dernières.\"\"\"\n    if n >= 3 and i < n * 0.25:\n        return \" tl\"\n    if n >= 3 and i >= n * 0.75:\n        return \" tr\"\n    return \"\"\n\n\n# --------------------------------------------------------------------------\n# Barres verticales (groupées ou empilées) + courbe et repères optionnels\n# --------------------------------------------------------------------------\ndef barres(cats, series: dict, couleurs: dict | None = None, empile=False, ligne: dict | None = None,\n           couleur_ligne=COLORS[\"text\"], fmt=court, fmt_ligne=None, hauteur=250, titre=\"\", survol=None,\n           temporel=False, fenetre=None, repere: dict | None = None, legende_auto=True, etiquettes=True,\n           couleurs_barres=None) -> str:\n    \"\"\"Barres avec valeurs affichées.\n\n    `ligne` = {nom: valeurs} : courbe tracée sur sa propre échelle, dans une bande au-dessus des barres ;\n    `repere` = {nom: valeurs} : losanges sur l'échelle des barres (ex. stock minimum) ;\n    `temporel` : `cats` sont des débuts de mois (étiquettes MM/AA), `fenetre` = (début, fin) limite les mois ;\n    `survol` : texte en plus dans l'infobulle de chaque colonne ; `couleurs_barres` : une couleur par colonne\n    (série unique).\n    \"\"\"\n    cats = list(cats)\n    noms = list(series)\n    vals = {k: [0.0 if _nan(v) else float(v) for v in series[k]] for k in noms}\n    lig = {k: list(v) for k, v in (ligne or {}).items()}\n    rep = {k: list(v) for k, v in (repere or {}).items()}\n    survol = list(survol) if survol is not None else None\n    if temporel and fenetre:\n        a, b = pd.Timestamp(fenetre[0]), pd.Timestamp(fenetre[1])\n        garde = [a <= pd.Timestamp(c) <= b for c in cats]\n        cats = [c for c, g in zip(cats, garde) if g]\n        vals = {k: [x for x, g in zip(v, garde) if g] for k, v in vals.items()}\n        lig = {k: [x for x, g in zip(v, garde) if g] for k, v in lig.items()}\n        rep = {k: [x for x, g in zip(v, garde) if g] for k, v in rep.items()}\n        survol = [x for x, g in zip(survol, garde) if g] if survol else survol\n    n = len(cats)\n    if n == 0 or not noms:\n        return vide()\n    libelles = [_libelle(c, temporel) for c in cats]\n    couleurs = couleurs or {}\n    coul = {k: couleurs.get(k, PALETTE[j % len(PALETTE)]) for j, k in enumerate(noms)}\n    tot = [sum(vals[k][i] for k in noms) for i in range(n)]\n    rep_vals = [float(x) for v in rep.values() for x in v if not _nan(x)]\n    ymax = max([max(tot) if empile else max((max(v) for v in vals.values()), default=0)] + rep_vals) or 1.0\n    fmt_l = fmt_ligne or fmt\n\n    bande = 0.0\n    if lig:  # la courbe occupe une bande au-dessus des barres : les étiquettes ne se chevauchent pas\n        bande = (hauteur - HAUT) * 0.32\n    zone = hauteur - HAUT - bande\n    grp = 62 if n > 3 else 40  # largeur du groupe de barres (% de la colonne)\n    montrer = etiquettes and (n * (1 if empile else len(noms)) <= 36)\n\n    # Position verticale des points de la courbe (px depuis le haut)\n    pts_l = {}\n    for nom, valeurs in lig.items():\n        pts = [None if _nan(v) else float(v) for v in valeurs]\n        ok = [p for p in pts if p is not None]\n        if ok:\n            lo, hi = min(min(ok), 0), max(ok)\n            ech = (hi - lo) or 1\n            pts_l[nom] = (pts, [None if p is None else HAUT - 4 + (1 - (p - lo) / ech) * (bande - 16) for p in pts])\n\n    colonnes = []\n    for i in range(n):\n        infos = [libelles[i], survol[i] if survol else None]\n        infos += [f\"{k} : {fmt(vals[k][i])}\" for k in noms]\n        if empile and len(noms) > 1:\n            infos.append(f\"Total : {fmt(tot[i])}\")\n        infos += [f\"{k} : {fmt(v[i])}\" for k, v in rep.items() if not _nan(v[i])]\n        infos += [f\"{k} : {fmt_l(pts[i])}\" for k, (pts, _) in pts_l.items() if pts[i] is not None]\n        corps = []\n        if empile:\n            segs = []\n            plusieurs = sum(1 for k in noms if vals[k][i] > 0) > 1  # une seule part : le total suffit\n            for k in noms:\n                h = vals[k][i] / ymax * zone\n                if h <= 0:\n                    continue\n                txt = fmt(vals[k][i]) if montrer and plusieurs and h >= 17 else \"\"\n                segs.append(f'<i style=\"height:{h:.1f}px;background:{coul[k]}\">{txt}<\/i>')\n            haut_txt = fmt(tot[i]) if montrer and tot[i] else \"\"\n            corps.append(f'<div class=\"bw\"><b>{haut_txt}<\/b><div class=\"stk\">{\"\".join(segs)}<\/div><\/div>')\n        else:\n            for k in noms:\n                v = vals[k][i]\n                h = v / ymax * zone\n                c = couleurs_barres[i] if couleurs_barres is not None and len(noms) == 1 else coul[k]\n                corps.append(f'<div class=\"bw\"><b>{fmt(v) if montrer and v else \"\"}<\/b>'\n                             f'<i class=\"b\" style=\"height:{max(h, 0):.1f}px;background:{c}\"><\/i><\/div>')\n        extra = []\n        for k, v in rep.items():\n            if not _nan(v[i]):\n                extra.append(f'<i class=\"rp\" style=\"bottom:{float(v[i]) / ymax * zone:.1f}px\"><\/i>')\n        for j, (k, (pts, ys)) in enumerate(pts_l.items()):\n            if ys[i] is None:\n                continue\n            cl = couleur_ligne if j == 0 else PALETTE[(j + 3) % len(PALETTE)]\n            extra.append(f'<i class=\"pt\" style=\"top:{ys[i]:.1f}px;background:{cl}\"><\/i>')\n            if montrer:\n                extra.append(f'<span class=\"pl\" style=\"top:{ys[i] - 19:.1f}px;color:{cl}\">{fmt_l(pts[i])}<\/span>')\n        colonnes.append(f'<div class=\"col{_cote(i, n)}\"{_tip(infos)}>'\n                        f'<div class=\"grp\" style=\"width:{grp}%\">{\"\".join(corps)}<\/div>{\"\".join(extra)}<\/div>')\n\n    traces = []\n    for j, (k, (pts, ys)) in enumerate(pts_l.items()):\n        cl = couleur_ligne if j == 0 else PALETTE[(j + 3) % len(PALETTE)]\n        p = \" \".join(f\"{(i + .5) / n * 100:.3f},{y:.1f}\" for i, y in enumerate(ys) if y is not None)\n        traces.append(f'<polyline points=\"{p}\" fill=\"none\" stroke=\"{cl}\" stroke-width=\"2.5\" stroke-linejoin=\"round\" '\n                      f'vector-effect=\"non-scaling-stroke\"/>')\n    svg = (f'<svg class=\"ov\" viewBox=\"0 0 100 {hauteur}\" preserveAspectRatio=\"none\">{\"\".join(traces)}<\/svg>'\n           if traces else \"\")\n    xl, tourner = _etiquettes_x(libelles, temporel)\n    plot = (f'<div class=\"s360-plot\" style=\"height:{hauteur}px\"><div class=\"cols\" style=\"grid-template-columns:'\n            f'repeat({n},minmax(0,1fr))\">{\"\".join(colonnes)}<\/div>{svg}<\/div>{xl}')\n    if tourner:  # marge à gauche : la première étiquette inclinée n'est pas coupée\n        plot = f'<div class=\"s360-rotpad\">{plot}<\/div>'\n    leg = [(k, coul[k], \"barre\") for k in noms] if couleurs_barres is None else []\n    leg += [(k, COLORS[\"text\"], \"repere\") for k in rep]\n    leg += [(k, couleur_ligne if j == 0 else PALETTE[(j + 3) % len(PALETTE)], \"ligne\") for j, k in enumerate(pts_l)]\n    lg_html = legende(leg) if legende_auto and (len(noms) > 1 or rep or pts_l) else \"\"\n    return f'<div class=\"s360-chart\">{_titre(titre)}{plot}{lg_html}<\/div>'\n\n\ndef ecarts(cats, valeurs, infos=None, seuil=10, titre=\"\", hauteur=250, fmt=jours) -> str:\n    \"\"\"Barres positives / négatives autour de zéro (ex. écart promis − demandé, en jours).\n\n    Couleur : rouge au-delà de `seuil`, orange entre 1 et `seuil`, vert si ≤ 0.\n    `infos` : lignes de détail par barre (infobulle).\n    \"\"\"\n    cats = [str(c) for c in cats]\n    vals = [0.0 if _nan(v) else float(v) for v in valeurs]\n    n = len(cats)\n    if n == 0:\n        return vide()\n    hi, lo = max(max(vals), 0), min(min(vals), 0)\n    ech = (hi - lo) or 1\n    zone = hauteur - HAUT - (HAUT if lo < 0 else 2)  # marge basse seulement s'il y a des valeurs négatives\n    zero = HAUT + hi / ech * zone  # position de l'axe zéro (px depuis le haut)\n    montrer = n <= 40\n    colonnes = []\n    for i, v in enumerate(vals):\n        c = COLORS[\"ko\"] if v > seuil else COLORS[\"warn\"] if v > 0 else COLORS[\"ok\"]\n        h = abs(v) / ech * zone\n        top = zero - h if v > 0 else zero\n        txt = f'<span class=\"pv\" style=\"top:{(top - 18 if v > 0 else zero + h + 2):.1f}px\">{fmt(v)}<\/span>' if montrer else \"\"\n        detail = infos[i] if infos is not None else []\n        colonnes.append(f'<div class=\"col{_cote(i, n)}\"{_tip([cats[i], *detail, f\"Écart : {fmt(v)}\"])}>'\n                        f'<i class=\"bz\" style=\"top:{top:.1f}px;height:{max(h, 1.5):.1f}px;background:{c}\"><\/i>{txt}<\/div>')\n    axe = f'<div class=\"zero\" style=\"top:{zero:.1f}px\"><\/div>'\n    xl = \"\"\n    if n <= 30:\n        xl, tourner = _etiquettes_x(cats)\n    plot = (f'<div class=\"s360-plot nob\" style=\"height:{hauteur}px\">{axe}<div class=\"cols\" style=\"grid-template-columns:'\n            f'repeat({n},minmax(0,1fr))\">{\"\".join(colonnes)}<\/div><\/div>{xl}')\n    if xl and tourner:\n        plot = f'<div class=\"s360-rotpad\">{plot}<\/div>'\n    leg = legende([(f\"Plus de {seuil} j de retard\", COLORS[\"ko\"], \"barre\"), (f\"1 à {seuil} j\", COLORS[\"warn\"], \"barre\"),\n                   (\"À l'heure ou en avance\", COLORS[\"ok\"], \"barre\")])\n    return f'<div class=\"s360-chart\">{_titre(titre)}{plot}{leg}<\/div>'\n\n\ndef multiples(panneaux: dict, couleurs: dict | None = None, hauteur=140, fmt=court, titre=\"\") -> str:\n    \"\"\"Petits multiples : {titre: (catégories, valeurs)}, une mini-série de barres par panneau.\"\"\"\n    if not panneaux:\n        return vide()\n    couleurs = couleurs or {}\n    cartes = []\n    for i, (t, (cats, vals)) in enumerate(panneaux.items()):\n        c = couleurs.get(t, PALETTE[i % len(PALETTE)])\n        cartes.append(f'<div class=\"s360-mini\"><b>{escape(str(t))}<\/b>'\n                      f'{barres(cats, {str(t): vals}, {str(t): c}, hauteur=hauteur, fmt=fmt, legende_auto=False)}<\/div>')\n    return f'<div class=\"s360-chart\">{_titre(titre)}<div class=\"s360-minis\">{\"\".join(cartes)}<\/div><\/div>'\n\n\n# --------------------------------------------------------------------------\n# Barres horizontales simples (classements)\n# --------------------------------------------------------------------------\ndef barres_h(lignes, couleur=COLORS[\"navy_2\"], fmt=court, titre=\"\", max_lignes=12, **_) -> str:\n    \"\"\"lignes : [(libellé, valeur)], [(libellé, valeur, texte affiché)] ou [(libellé, valeur, texte, couleur)].\"\"\"\n    lignes = list(lignes)[:max_lignes]\n    if not lignes:\n        return vide()\n    vmax = max((float(l[1]) for l in lignes if not _nan(l[1])), default=0) or 1\n    rows = []\n    for l in lignes:\n        nom, v = l[0], l[1]\n        txt = l[2] if len(l) > 2 and l[2] is not None else fmt(v)\n        c = l[3] if len(l) > 3 else couleur\n        pct = 0 if _nan(v) or not float(v) else max(float(v) / vmax * 100, 1.5)\n        rows.append(f'<div class=\"rw\"{_tip([nom, txt])}><span class=\"nm\">{escape(str(nom))}<\/span>'\n                    f'<div class=\"bar\"><i style=\"width:{pct:.1f}%;--tone:{c}\"><\/i><\/div><b>{escape(str(txt))}<\/b><\/div>')\n    return f'<div class=\"s360-chart\">{_titre(titre)}<div class=\"s360-rows\">{\"\".join(rows)}<\/div><\/div>'\n\n\n# --------------------------------------------------------------------------\n# Barres 100 % (répartition par ligne)\n# --------------------------------------------------------------------------\ndef parts(tableau, couleurs: dict, titre=\"\", afficher=\"nombre\", **_) -> str:\n    \"\"\"`tableau` : DataFrame (lignes = catégories, colonnes = statuts) de comptages ou de valeurs.\"\"\"\n    if tableau is None or tableau.empty or float(tableau.to_numpy().sum()) == 0:\n        return vide()\n    rows = []\n    for idx, r in tableau.iterrows():\n        total = float(r.sum())\n        segs = []\n        for col, v in r.items():\n            v = float(v)\n            if v <= 0 or total <= 0:\n                continue\n            p = v / total * 100\n            txt = (f\"{p:.0f} %\" if afficher == \"pourcent\" else court(v)) if p >= 7 else \"\"\n            segs.append(f'<span style=\"width:{p:.2f}%;background:{couleurs.get(col, COLORS[\"gris\"])}\"'\n                        f'{_tip([f\"{idx} · {col}\", f\"{court(v)} ({p:.0f} %)\"])}>{txt}<\/span>')\n        rows.append(f'<div class=\"rw\"><span class=\"nm\" title=\"{escape(str(idx))}\">{escape(str(idx))}<\/span>'\n                    f'<div class=\"s360-stack\">{\"\".join(segs)}<\/div><\/div>')\n    leg = legende([(c, couleurs.get(c, COLORS[\"gris\"]), \"barre\") for c in tableau.columns])\n    return f'<div class=\"s360-chart\">{_titre(titre)}<div class=\"s360-share\">{\"\".join(rows)}<\/div>{leg}<\/div>'\n\n\n# --------------------------------------------------------------------------\n# Jauges horizontales : segments empilés + repère (objectif), même échelle pour toutes les lignes\n# --------------------------------------------------------------------------\ndef jauges(lignes, titre=\"\", legende_items=None, repere_nom=\"Objectif\", fmt=court, hauteur_max: str | None = None) -> str:\n    \"\"\"lignes : [(libellé, [(nom, valeur, couleur)], repère ou None, texte à droite[, lignes d'infobulle en plus])].\n\n    Les segments sont empilés de gauche à droite ; le repère est un trait vertical (ex. objectif d'avions).\n    `hauteur_max` : zone défilante (beaucoup de lignes).\n    \"\"\"\n    lignes = list(lignes)\n    if not lignes:\n        return vide()\n    vmax = max(max(sum(max(float(v), 0) for _, v, _ in l[1]), float(l[2]) if not _nan(l[2]) else 0) for l in lignes) or 1\n    rows = []\n    for nom, segs, rep, txt, *plus in lignes:\n        parts_ = []\n        tip = [nom]\n        for n, v, c in segs:\n            v = max(float(v), 0)\n            tip.append(f\"{n} : {fmt(v)}\")\n            if v <= 0:\n                continue\n            w = v / vmax * 100\n            parts_.append(f'<span style=\"width:{w:.2f}%;background:{c}\">{fmt(v) if w >= 6 else \"\"}<\/span>')\n        marque = \"\"\n        if not _nan(rep):\n            tip.append(f\"{repere_nom} : {fmt(rep)}\")\n            marque = f'<i class=\"rp\" style=\"left:{float(rep) / vmax * 100:.2f}%\"><\/i>'\n        tip += list(plus[0]) if plus else []\n        rows.append(f'<div class=\"rw\"{_tip(tip)}><span class=\"nm\" title=\"{escape(str(nom))}\">{escape(str(nom))}<\/span>'\n                    f'<div class=\"trk\">{\"\".join(parts_)}{marque}<\/div><b>{escape(str(txt))}<\/b><\/div>')\n    corps = f'<div class=\"s360-jauge\">{\"\".join(rows)}<\/div>'\n    if hauteur_max and len(rows) > 14:  # zone défilante seulement si nécessaire (elle coupe les infobulles à ses bords)\n        corps = f'<div class=\"s360-jauge-scroll\" style=\"max-height:{hauteur_max}\">{corps}<\/div>'\n    items = list(legende_items or [])\n    return f'<div class=\"s360-chart\">{_titre(titre)}{corps}{legende(items)}<\/div>'\n\n\n# --------------------------------------------------------------------------\n# Carte de chaleur\n# --------------------------------------------------------------------------\ndef chaleur(tableau, titre=\"\", couleur=(31, 78, 156), libelle=\"lignes\", hauteur_max: str | None = None, details=None) -> str:\n    \"\"\"Carte de chaleur HTML : lignes × colonnes, intensité proportionnelle à la valeur.\n\n    `hauteur_max` (ex. \"30rem\") : zone défilante dont la ligne d'en-tête (colonnes) reste figée en haut.\n    `details` : tableau de mêmes lignes / colonnes, texte ajouté à l'infobulle de chaque case (ex. éléments concernés).\n    \"\"\"\n    if tableau is None or tableau.empty:\n        return vide()\n    vmax = float(tableau.to_numpy().max()) or 1\n    r, g, b = couleur\n    tete = \"\".join(f\"<th>{escape(str(c))}<\/th>\" for c in tableau.columns)\n    lignes = []\n    for idx, row in tableau.iterrows():\n        cells = []\n        for col, v in row.items():\n            v = float(v)\n            a = 0 if v <= 0 else .15 + .85 * v / vmax\n            fg = \"#fff\" if a > .55 else COLORS[\"text\"]\n            plus = details.at[idx, col] if details is not None and idx in details.index and col in details.columns else \"\"\n            cells.append(f'<td style=\"background:rgba({r},{g},{b},{a:.2f});color:{fg}\"'\n                         f'{_tip([idx, f\"{col} : {entier(v)} {libelle}\", plus if isinstance(plus, str) else \"\"])}>'\n                         f'{court(v) if v else \"\"}<\/td>')\n        lignes.append(f'<tr><th class=\"f\" title=\"{escape(str(idx))}\">{escape(str(idx))}<\/th>{\"\".join(cells)}<\/tr>')\n    table = f'<table class=\"s360-heat\"><thead><tr><th><\/th>{tete}<\/tr><\/thead><tbody>{\"\".join(lignes)}<\/tbody><\/table>'\n    if hauteur_max:\n        table = f'<div class=\"s360-heat-scroll\" style=\"max-height:{hauteur_max}\">{table}<\/div>'\n    return f'<div class=\"s360-chart\">{_titre(titre)}{table}<\/div>'\n\n", "app/core/components.py": "\"\"\"Composants visuels réutilisables (charte Supply360, prototype v3).\n\nLes fonctions qui renvoient du HTML (`kpi_card`, `badge`…) sont pures ; celles qui\ndessinent (`header`, `section`, `kpi_grid`…) appellent Streamlit.\n\"\"\"\n\nfrom contextlib import contextmanager, nullcontext\nfrom datetime import date\nfrom html import escape\n\nimport streamlit as st\n\nfrom core import dossiers\nfrom core import io as sio\n\nTONES = {\n    \"navy\": \"var(--navy)\", \"info\": \"var(--navy-2)\", \"accent\": \"var(--accent)\", \"ok\": \"var(--ok)\",\n    \"warn\": \"var(--warn)\", \"ko\": \"var(--ko)\", \"muted\": \"var(--muted)\", \"violet\": \"#6D28D9\",\n}\nCHANTIER_STATUTS = {\"Terminé\": \"muted\", \"En cours\": \"info\", \"À venir\": \"ok\"}\nJOURS = [\"lundi\", \"mardi\", \"mercredi\", \"jeudi\", \"vendredi\", \"samedi\", \"dimanche\"]\n\n\ndef _tone(tone: str) -> str:\n    return TONES.get(tone, TONES[\"navy\"])\n\n\n# --------------------------------------------------------------------------\n# Structure de page\n# --------------------------------------------------------------------------\ndef header() -> None:\n    \"\"\"Header fixe : logo AFI (fond clair : le logo est transparent), Supply360, date du jour.\n\n    La navigation entre onglets (main.py) est positionnée dans ce header par le CSS.\n    \"\"\"\n    j = date.today()\n    st.html(\n        '<div class=\"s360-header\"><div class=\"s360-logo\" role=\"img\" '\n        'aria-label=\"Air France Industries KLM Engineering &amp; Maintenance\"><\/div><span class=\"s360-sep\"><\/span>'\n        '<div class=\"s360-brand\">Supply<span>360<\/span><\/div>'\n        f'<div class=\"s360-today\">{JOURS[j.weekday()]} {j:%d/%m/%Y}<\/div><\/div>'\n        '<div class=\"s360-busy\">⏳ Calcul en cours…<\/div>'\n    )\n\n\ndef hero(icone: str, titre: str, sous_titre: str = \"\") -> None:\n    \"\"\"Titre d'onglet : carte translucide posée sur le fond.\"\"\"\n    sub = f\"<p>{escape(sous_titre)}<\/p>\" if sous_titre else \"\"\n    st.html(f'<div class=\"s360-hero\"><div class=\"ico\">{icone}<\/div><div><h1>{escape(titre)}<\/h1>{sub}<\/div><\/div>')\n\n\n@contextmanager\ndef section(key: str, title: str, subtitle: str = \"\", tag: str = \"\"):\n    \"\"\"Bloc carte translucide à en-tête dégradé. `key` doit être unique (préfixé par le TAB_ID).\"\"\"\n    box = st.container(key=f\"s360sec_{key}\")\n    with box:\n        sub = f\"<p>{escape(subtitle)}<\/p>\" if subtitle else \"\"\n        tg = f'<span class=\"tag\">{escape(tag)}<\/span>' if tag else \"\"\n        st.html(f'<div class=\"s360-section-head\"><div><h3>{escape(title)}<\/h3>{sub}<\/div>{tg}<\/div>')\n        yield box\n\n\ndef footer() -> None:\n    st.html('<div class=\"s360-footer\">Supply360 · Air France Industries — fichiers traités localement dans votre navigateur, '\n            \"rien n'est envoyé. Rafraîchir la page réinitialise la session.<\/div>\")\n\n\ndef en_developpement(icone: str, titre: str, points: list[str]) -> None:\n    \"\"\"Page d'un onglet prévu mais pas encore développé.\"\"\"\n    items = \"\".join(f\"<li>{escape(p)}<\/li>\" for p in points)\n    st.html(f'<div class=\"s360-wip\"><div class=\"plane\"><\/div><div class=\"ico\">{icone}<\/div><h2>{escape(titre)}<\/h2>'\n            f'<span class=\"s360-badge\" style=\"--tone:var(--warn)\">En cours de développement<\/span>'\n            f\"<p>Cette fonctionnalité arrive dans une prochaine version de Supply360.<\/p><ul>{items}<\/ul><\/div>\")\n\n\n# --------------------------------------------------------------------------\n# Indicateurs\n# --------------------------------------------------------------------------\ndef kpi_card(label: str, value, sub: str = \"\", tone: str = \"navy\") -> str:\n    \"\"\"HTML d'une tuile KPI (à passer à `kpi_grid`).\"\"\"\n    sub_html = f'<div class=\"sub\">{escape(str(sub))}<\/div>' if sub else \"\"\n    return (f'<div class=\"s360-kpi\" style=\"--tone:{_tone(tone)}\"><div class=\"val\">{escape(str(value))}<\/div>'\n            f'<div class=\"lbl\">{escape(str(label))}<\/div>{sub_html}<\/div>')\n\n\ndef kpi_grid(cards: list[str]) -> None:\n    st.html(f'<div class=\"s360-kpis\">{\"\".join(cards)}<\/div>')\n\n\ndef badge(text: str, tone: str = \"navy\") -> str:\n    return f'<span class=\"s360-badge\" style=\"--tone:{_tone(tone)}\">{escape(text)}<\/span>'\n\n\ndef chantier_badge(statut: str, jours_avant_debut: int | None = None) -> str:\n    \"\"\"Badge de statut chantier : uniquement Terminé / En cours / À venir.\"\"\"\n    if statut not in CHANTIER_STATUTS:\n        raise ValueError(f\"Statut de chantier inconnu : {statut}\")\n    text = statut + (f\" · J-{jours_avant_debut}\" if statut == \"À venir\" and jours_avant_debut is not None else \"\")\n    return badge(text, CHANTIER_STATUTS[statut])\n\n\ndef callout(message_html: str, tone: str = \"navy\", icon: str = \"ℹ️\") -> None:\n    \"\"\"Bandeau court (action à mener, alerte). `message_html` est du HTML de confiance.\"\"\"\n    st.html(f'<div class=\"s360-callout\" style=\"--tone:{_tone(tone)}\"><span>{icon}<\/span><div>{message_html}<\/div><\/div>')\n\n\ndef empty_state(title: str, message: str, etapes: list[tuple[str, bool]] | None = None, icon: str = \"📥\") -> None:\n    \"\"\"État vide : explique quoi faire tant que les fichiers ne sont pas importés.\"\"\"\n    steps = \"\".join(f'<span class=\"s360-step{\" ok\" if ok else \"\"}\">{\"✓\" if ok else \"○\"} {escape(lbl)}<\/span>'\n                    for lbl, ok in etapes or [])\n    st.html(f'<div class=\"s360-empty\"><div class=\"ico\">{icon}<\/div><h4>{escape(title)}<\/h4><p>{escape(message)}<\/p>'\n            f'<div class=\"s360-steps\">{steps}<\/div><\/div>')\n\n\ndef tableau(df, **kwargs) -> None:\n    \"\"\"st.dataframe avec « — » à la place des textes vides (au lieu de « None »).\"\"\"\n    texte = df.select_dtypes(include=[\"object\", \"string\"]).columns\n    if len(texte):\n        df = df.copy()\n        df[texte] = df[texte].astype(object).where(df[texte].notna(), \"—\")\n    st.dataframe(df, hide_index=True, **kwargs)\n\n\ndef graphe(html: str) -> None:\n    \"\"\"Affiche un graphe de core/charts.py. st.markdown (et non st.html, qui supprime le SVG).\"\"\"\n    st.markdown(html, unsafe_allow_html=True)\n\n\n# --------------------------------------------------------------------------\n# Imports et téléchargements\n# --------------------------------------------------------------------------\ndef _fichier_valide(f) -> bool:\n    \"\"\"Vrai pour un fichier réellement importé (Streamlit peut renvoyer un `DeletedFile` après un changement d'onglet).\"\"\"\n    return f is not None and hasattr(f, \"getvalue\") and hasattr(f, \"name\")\n\n\ndef fichier(label: str, cle: str, types: list[str], colonnes: list[tuple[str, str, bool]] | None = None, on_import=None):\n    \"\"\"`file_uploader` dont le contenu survit au changement d'onglet. Renvoie (nom, octets) ou None.\n\n    Streamlit efface un widget qui n'est pas affiché : sans cette mémoire, revenir sur un onglet\n    obligeait à réimporter ses fichiers. La mémoire peut aussi être remplie par `import_groupe`.\n    `on_import(nom)` est appelé (en callback) quand un nouveau fichier est importé ici.\n    \"\"\"\n    # La clé du widget porte un numéro de version : vider_emplacement() l'incrémente pour effacer le fichier affiché.\n    version = st.session_state.get(f\"{cle}__v\", 0)\n    memoire, cle_up, vu = f\"{cle}__data\", f\"{cle}__upload\" + (str(version) if version else \"\"), f\"{cle}__vu\"\n\n    def _maj():\n        f = st.session_state.get(cle_up)\n        if f is None:\n            st.session_state.pop(memoire, None)   # l'utilisateur a retiré le fichier\n        elif _fichier_valide(f):\n            st.session_state[memoire] = (f.name, f.getvalue(), f.file_id)\n            st.session_state[vu] = f.file_id\n            # Zone d'import vidée (nouvelle version du widget) : Streamlit libère sa propre copie du fichier, seule\n            # la mémoire ci-dessus reste (le fichier n'est plus gardé deux fois).\n            vider_emplacement(cle, garder_donnees=True)\n            if on_import:\n                on_import(f.name)\n\n    up = st.file_uploader(label, type=types, key=cle_up, on_change=_maj)\n    garde = st.session_state.get(memoire)\n    if _fichier_valide(up) and st.session_state.get(vu) != up.file_id:\n        garde = st.session_state[memoire] = (up.name, up.getvalue(), up.file_id)\n        st.session_state[vu] = up.file_id\n    if garde and not (_fichier_valide(up) and up.file_id == garde[2]):\n        st.html(f'<div class=\"s360-file\">✓ <span>{escape(garde[0])}<\/span><\/div>')\n    if colonnes:\n        with st.popover(\"Colonnes attendues\", width=\"stretch\"):\n            st.markdown(\"\\n\".join(f\"- `{nom}`{' — **obligatoire**' if obl else ''}\" + (f\" · {aide}\" if aide else \"\")\n                                  for nom, aide, obl in colonnes))\n            st.caption(\"Détection automatique de la feuille et de la ligne d'en-tête, sans tenir compte des accents ni des majuscules.\")\n    return garde[:2] if garde else None\n\n\ndef vider_emplacement(cle: str, garder_donnees: bool = False) -> None:\n    \"\"\"Efface le fichier affiché dans l'import `fichier(cle)` (nouvelle version du widget) et, sauf\n    `garder_donnees`, le fichier gardé en mémoire. À appeler dans un callback.\"\"\"\n    st.session_state[f\"{cle}__v\"] = st.session_state.get(f\"{cle}__v\", 0) + 1\n    if not garder_donnees:\n        st.session_state.pop(f\"{cle}__data\", None)\n\n\nLIBELLES_SOURCES = {\"besoins\": sio.FICHIER_BESOINS, \"asreq\": sio.FICHIER_ASREQ, \"stock\": sio.FICHIER_STOCK,\n                    \"commandes\": sio.FICHIER_COMMANDES, \"references\": sio.FICHIER_REFERENCES, \"pieces\": \"Pièces par avion\",\n                    \"pe\": \"PE mousses\", \"besoin_prod\": \"Besoin Prod mousses\"}\n\n\n@st.cache_resource(show_spinner=False, max_entries=256)\ndef _source_fichier(data: bytes, nom: str):\n    \"\"\"Source d'un fichier (contenu, puis nom), mise en cache : chaque fichier n'est analysé qu'une fois.\"\"\"\n    return sio.identifier_fichier(data, nom)\n\n\ndef _boutons_dossier(dossier: str, cible: str, mode: str) -> str:\n    attrs = f'data-dossier=\"{escape(dossier)}\" data-cible=\"{escape(cible)}\" data-mode=\"{escape(mode)}\"'\n    return (f'<span class=\"s360-dossier-grp\"><button type=\"button\" class=\"s360-dossier-btn\" {attrs}>📂 Ouvrir {escape(dossier)}<\/button>'\n            f'<button type=\"button\" class=\"s360-dossier-btn autre\" {attrs} data-changer=\"1\" '\n            f'title=\"Choisir un autre dossier {escape(dossier)}\">Changer<\/button><\/span>')\n\n\ndef boutons_dossiers(dossier: str, cible: str, mode: str = \"fichiers\", commandes: bool = True) -> None:\n    \"\"\"Barre « 📂 Ouvrir <dossier> » (+ « 📂 Ouvrir COMMANDE ») : dossiers mémorisés, gérés en JavaScript par build.py.\n\n    Le dossier choisi une fois est retenu par le navigateur. Selon `mode`, on dépose dans le `file_uploader` de\n    clé `cible` : tous ses fichiers (« fichiers »), ceux du chantier choisi dans la liste (« chantier ») ou le\n    fichier le plus récemment modifié (« dernier »). « Changer » choisit un autre dossier. Sans effet en local.\n    COMMANDE : fichier Commandes (SAP) le plus récent, rangé dans l'import commun `commun__commandes`.\n    \"\"\"\n    html = _boutons_dossier(dossier, cible, mode)\n    if commandes:\n        html += _boutons_dossier(\"COMMANDE\", \"commun__dossier_commande__upload\", \"dernier\")\n    st.html(f'<div class=\"s360-dossiers\">{html}<\/div>')\n    if commandes:\n        with st.container(key=\"s360cache_commande\"):  # zone de dépôt du bouton COMMANDE, masquée (CSS)\n            import_dossier(\"commun__dossier_commande\", {\"commandes\": \"commun__commandes\"}, resume=False)\n\n\n@contextmanager\ndef zone_repliable(cle: str, libelle: str):\n    \"\"\"Zone repliée derrière un interrupteur. Contrairement à `st.expander` (dont le contenu replié n'est pas\n    dans la page), les widgets restent présents, masqués en CSS : les boutons « 📂 Ouvrir » peuvent y déposer\n    des fichiers même quand la zone est fermée.\"\"\"\n    ouvert = st.toggle(libelle, key=cle, persist_state=\"page\")\n    with st.container(key=f\"s360pli_{'ouvert' if ouvert else 'ferme'}_{cle}\"):\n        yield\n\n\ndef etat_fichiers(fichiers: list[tuple[str, str, bool]]) -> None:\n    \"\"\"Pastilles d'état des imports : (libellé, clé de `fichier`, obligatoire) → ✓ nom du fichier, ou « à importer ».\"\"\"\n    puces = []\n    for libelle, cle, obligatoire in fichiers:\n        garde = st.session_state.get(f\"{cle}__data\")\n        if garde:\n            puces.append(f'<span class=\"s360-puce ok\" title=\"{escape(garde[0])}\">✓ <b>{escape(libelle)}<\/b>'\n                         f'<em>{escape(garde[0])}<\/em><\/span>')\n        else:\n            ton = \"ko\" if obligatoire else \"\"\n            puces.append(f'<span class=\"s360-puce {ton}\">○ <b>{escape(libelle)}<\/b><em>{\"à importer\" if obligatoire else \"facultatif\"}<\/em><\/span>')\n    st.html(f'<div class=\"s360-puces\">{\"\".join(puces)}<\/div>')\n\n\ndef import_commandes(colonnes) -> tuple[str, bytes] | None:\n    \"\"\"Import manuel du fichier Commandes (SAP), commun à tous les onglets. Renvoie (nom, octets) ou None.\"\"\"\n    return fichier(sio.FICHIER_COMMANDES, \"commun__commandes\", [\"xlsx\", \"xlsm\"], colonnes)\n\n\ndef lien_sharepoint(url: str, dossier: str) -> None:\n    \"\"\"Aide « première utilisation » : synchroniser le dossier Teams avec OneDrive pour le voir dans « Parcourir ».\"\"\"\n    with st.popover(f\"🔗 Première utilisation : synchroniser le dossier {dossier}\"):\n        st.markdown(\n            f\"Le bouton **Parcourir** ouvre l'Explorateur Windows : le dossier Teams **{dossier}** doit y apparaître. \"\n            \"À faire **une seule fois par poste** :\\n\\n\"\n            f\"1. [Ouvrir le dossier {dossier} sur SharePoint]({url}) (nouvel onglet).\\n\"\n            \"2. En haut de la page, cliquer sur **« Ajouter un raccourci à Mon OneDrive »** (ou **« Synchroniser »**).\\n\"\n            f\"3. Le dossier apparaît dans l'Explorateur sous **OneDrive – Air France-KLM › {dossier}**, et reste à jour tout seul.\\n\\n\"\n            \"Ensuite, dans Supply360 : **📂 Ouvrir** puis **Autoriser** (le dossier est choisi une seule fois, puis retenu \"\n            \"par le navigateur ; Edge ou Chrome). Rien à télécharger à la main.\\n\\n\"\n            \"Astuce : ajoutez en raccourci la bibliothèque **Documents** entière du canal : R2, Textile et COMMANDE \"\n            \"seront tous disponibles d'un coup.\")\n\n\ndef import_dossier(cle: str, cibles: dict[str, str], dossier: bool = False, on_choix=None, label: str = \"\", aide: str = \"\",\n                   noms: dict[str, str] | None = None, resume: bool = True, zone=None, autres: tuple = ()) -> None:\n    \"\"\"Import de tout un dossier : chaque fichier est reconnu par son contenu (à défaut son nom) et rangé\n    dans l'emplacement `fichier` correspondant (`cibles` = {source: clé du fichier}).\n\n    `dossier=True` : sélection d'un dossier entier (R2 ou un dossier « <IMMAT> - <JJMMAA> ») ; les fichiers\n    sont regroupés par dossier chantier et, s'il y en a plusieurs, on choisit le chantier à analyser.\n    Si une source a plusieurs fichiers, le plus récent (date dans le nom) est retenu et peut être changé.\n    `on_choix(dossier_chantier, {source: [chemins]})` est appelé après chaque répartition.\n    `noms` = {source: motif} : règles de nommage prioritaires (voir dossiers.appliquer_noms).\n    Un fichier Commandes (SAP) trouvé ici est ignoré si `commandes` n'est pas une cible : seul le dossier COMMANDE fait foi.\n    `autres` : sources lues par un autre onglet (même dossier) : ni utilisées ni signalées comme ignorées.\n    `zone` : conteneur où placer la zone d'import (ex. l'expander « Import manuel ») ; le choix du chantier et le\n    bilan restent à l'emplacement courant.\n    \"\"\"\n    version = st.session_state.get(f\"{cle}__v\", 0)\n    cle_up, cle_idx, cle_ch, cle_bilan = f\"{cle}__upload{version}\", f\"{cle}__index\", f\"{cle}__chantier\", f\"{cle}__bilan\"\n\n    def _ranger(source, chemin):\n        nom, data, fid = st.session_state[cle_idx][chemin]\n        vider_emplacement(cibles[source])  # efface un ancien fichier importé à la main dans cet emplacement\n        st.session_state[f\"{cibles[source]}__data\"] = (dossiers.nom_court(nom), data, fid)\n\n    def _appliquer():\n        index = st.session_state.get(cle_idx, {})\n        groupes = dossiers.regrouper(list(index))\n        ch = st.session_state.get(cle_ch, dossiers.HORS_CHANTIER)\n        chemins = groupes.get(ch, []) + (groupes.get(dossiers.HORS_CHANTIER, []) if ch != dossiers.HORS_CHANTIER else [])\n        sources = {c: _source_fichier(index[c][1], c) for c in chemins}\n        par_source, inconnus = dossiers.repartir(dossiers.appliquer_noms(sources, noms) if noms else sources)\n        for source, liste in par_source.items():\n            if source in cibles:\n                _ranger(source, liste[0])\n                st.session_state[f\"{cle}__alt__{source}\"] = liste[0]\n        if dossier:  # nouveau chantier : aucun fichier de l'ancien ne doit rester\n            for source in cibles:\n                if source not in par_source:\n                    vider_emplacement(cibles[source])\n        st.session_state[cle_bilan] = (par_source, inconnus)\n        if on_choix:\n            on_choix(ch, par_source)\n\n    def _charger():\n        # Chaque sélection REMPLACE la précédente (Streamlit, lui, ajouterait les fichiers aux anciens) : on garde\n        # les fichiers en mémoire et on vide la zone d'import (nouvelle version du widget).\n        fs = [f for f in st.session_state.get(cle_up) or [] if _fichier_valide(f)]\n        if not fs:\n            return\n        st.session_state[cle_idx] = {f.name: (f.name, f.getvalue(), f.file_id) for f in fs}\n        st.session_state[f\"{cle}__v\"] = version + 1\n        chantiers = dossiers.chantiers_tries(dossiers.regrouper(list(st.session_state[cle_idx])))\n        if st.session_state.get(cle_ch) not in chantiers:\n            st.session_state[cle_ch] = chantiers[0] if chantiers else dossiers.HORS_CHANTIER\n        _appliquer()\n\n    with zone if zone is not None else nullcontext():\n        st.file_uploader(label or \"📂 Importer les fichiers du dossier (Ctrl+A pour tout sélectionner)\", type=[\"xlsx\", \"xlsm\", \"csv\"],\n                         accept_multiple_files=\"directory\" if dossier else True, key=cle_up, on_change=_charger, help=aide or None)\n    index = st.session_state.get(cle_idx, {})\n    if not index:\n        return\n    taille = sum(len(v[1]) for v in index.values()) / 1e6\n    if taille > 250:\n        callout(f\"{taille:.0f} Mo importés : pour aller plus vite, choisissez directement le dossier du chantier.\", \"warn\", \"🐢\")\n    chantiers = dossiers.chantiers_tries(dossiers.regrouper(list(index)))\n    par_source, inconnus = st.session_state.get(cle_bilan, ({}, []))\n    doubles = {s: l for s, l in par_source.items() if s in cibles and len(l) > 1}\n    choix_chantier = dossier and len(chantiers) > 1\n    if choix_chantier or doubles:\n        cols = iter(st.columns(int(choix_chantier) + len(doubles)))\n        if choix_chantier:\n            def _libelle(g):\n                immat, debut = sio.chantier_depuis_nom(g)\n                return f\"{immat} · début {debut:%d/%m/%Y}\"\n            next(cols).selectbox(f\"Chantier à analyser ({len(chantiers)} dossiers)\", chantiers, key=cle_ch, format_func=_libelle,\n                                 on_change=_appliquer, persist_state=\"page\")\n        for source, liste in doubles.items():\n            next(cols).selectbox(f\"{LIBELLES_SOURCES[source]} : {len(liste)} fichiers, le plus récent est retenu\", liste,\n                                 key=f\"{cle}__alt__{source}\", format_func=dossiers.nom_court, persist_state=\"page\",\n                                 on_change=lambda s=source: _ranger(s, st.session_state[f\"{cle}__alt__{s}\"]))\n    manquants = [LIBELLES_SOURCES[s] for s in cibles if s not in par_source and s not in (\"asreq\", \"commandes\")\n                 and not (s == \"besoins\" and \"asreq\" in par_source)]\n    notes = []\n    ch = st.session_state.get(cle_ch, dossiers.HORS_CHANTIER)\n    nb = sum(len(l) for l in par_source.values()) + len(inconnus)\n    if resume:\n        notes.append(f\"Dossier importé : <b>{escape(ch)}<\/b> ({nb} fichier(s))\" if ch else f\"Dossier importé : {nb} fichier(s)\")\n    if manquants:\n        notes.append(\"absent(s) du dossier : <b>\" + \", \".join(escape(m) for m in manquants) + \"<\/b>\")\n    if \"commandes\" in par_source and \"commandes\" not in cibles:\n        notes.append(f\"Commandes (SAP) du dossier non utilisé ({escape(dossiers.nom_court(par_source['commandes'][0]))}) : \"\n                     \"le fichier du dossier <b>COMMANDE<\/b> fait foi\")\n    hors = [dossiers.nom_court(c) for c in inconnus] + [dossiers.nom_court(c) for s, l in par_source.items()\n                                                       if s not in cibles and s != \"commandes\" and s not in autres for c in l]\n    if hors:\n        notes.append(\"Ignoré(s) : \" + \", \".join(escape(n) for n in hors))\n    if notes:\n        st.html('<div class=\"s360-note\">' + \" · \".join(notes) + \"<\/div>\")\n\n\ndef telecharger(data, nom: str, cle: str, label: str = \"⬇️ Télécharger (Excel)\") -> None:\n    \"\"\"Bouton de téléchargement Excel. `on_click=\"ignore\"` : télécharger ne relance pas les calculs.\n\n    `data` : octets, ou de préférence une FONCTION sans argument qui les produit. Le fichier n'est alors fabriqué\n    qu'au clic, et non à chaque affichage de l'onglet (plusieurs secondes sur de gros fichiers, page figée) :\n    « Exporter » fabrique le fichier, puis le téléchargement part tout seul (JavaScript de build.py, clé « __auto »).\n    \"\"\"\n    mime = \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"\n    if not callable(data):\n        st.download_button(label, data=data, file_name=nom, key=cle, on_click=\"ignore\", mime=mime)\n        return\n    if st.session_state.pop(f\"{cle}__pret\", False):  # fabriqué pour cette exécution seulement\n        with st.spinner(\"Préparation du fichier Excel…\"):\n            octets = data()\n        st.download_button(label, data=octets, file_name=nom, key=f\"{cle}__auto\", on_click=\"ignore\", mime=mime)\n    else:\n        st.button(label, key=f\"{cle}__prep\", on_click=lambda: st.session_state.__setitem__(f\"{cle}__pret\", True))\n\n\ndef sous_onglets(cle: str, options: list[str], icones: dict | None = None) -> str:\n    \"\"\"Barre de sous-onglets (style du prototype : soulignement rouge). Renvoie l'option active.\"\"\"\n    icones = icones or {}\n    with st.container(key=\"s360sub_\" + cle):\n        choix = st.segmented_control(\"Section\", options, default=options[0], key=cle, required=True,\n                                     label_visibility=\"collapsed\", persist_state=\"page\",\n                                     format_func=lambda o: f\"{icones.get(o, '')} {o}\".strip())\n    return choix or options[0]\n", "app/core/dossiers.py": "\"\"\"Dossiers importés d'un coup (dossier SharePoint synchronisé) : regroupement par chantier, choix des fichiers.\n\nFonctions pures, testables sans Streamlit. Les fichiers arrivent avec leur chemin relatif\n(« R2/F-XK
