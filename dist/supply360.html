<style>
/* Écran de chargement (les variables et images viennent du thème, en fin de page) : fond clair, sans photo,
   grande carte, l'avion traverse lentement l'écran. */
#s360-loading {
  position: fixed; inset: 0; z-index: 1000000; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1.2rem; padding: 1rem; text-align: center; font-family: var(--font); overflow: hidden;
  background: radial-gradient(ellipse at 50% 35%, #FFFFFF 0%, #EEF3FA 45%, #DCE6F4 100%);
  transition: opacity .4s ease;
}
#s360-loading::before { content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none;
  background: radial-gradient(circle at 15% 25%, rgba(31, 78, 156, .10), transparent 35%),
              radial-gradient(circle at 85% 75%, rgba(228, 0, 43, .06), transparent 30%); }
#s360-loading.fini { opacity: 0; pointer-events: none; }
#s360-loading .carte {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 1.2rem;
  width: min(44rem, calc(100vw - 2rem)); padding: 3rem 3.4rem 2.4rem; border-radius: 22px;
  background: rgba(255, 255, 255, .92); backdrop-filter: blur(10px); border: 1px solid #E3E8EF;
  box-shadow: 0 30px 80px rgba(0, 33, 87, .14);
}
/* Logo sur fond transparent, texte bleu marine : toujours sur la carte blanche. */
#s360-loading .s360-logo { width: 21rem; max-width: 80%; height: 4.6rem; background-position: center; }
#s360-loading .titre { color: var(--navy); font-size: 3.2rem; line-height: 1; font-weight: 800; letter-spacing: -.03em; }
#s360-loading .titre span { color: var(--accent); }
#s360-loading .texte { color: var(--muted); font-size: 1.05rem; }
#s360-loading .barre { width: 100%; max-width: 26rem; height: 6px; border-radius: 99px; overflow: hidden; background: #E3E9F1; }
#s360-loading .barre::after {
  content: ""; display: block; width: 38%; height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, var(--navy), var(--accent)); animation: s360-glisse 1.6s ease-in-out infinite;
}

  position: absolute; left: -48%; top: 9%; width: min(46rem, 72vw); aspect-ratio: 4 / 1;

@keyframes s360-glisse { 0% { transform: translateX(-100%); } 100% { transform: translateX(270%); } }
@keyframes s360-vol { from { transform: translateX(0); } to { transform: translateX(260vw); } }

  margin: 0 -1.5rem .4rem; padding: .5rem 1rem; background: #fff; border-bottom: 1px solid #E3E9F1; }
#s360-grand .fermer { border: 0; background: none; font-size: 1.2rem; color: var(--muted); cursor: pointer; }

#s360-loading.lent .lent { display: block; }
#s360-loading .avancement { display: none; width: 100%; max-width: 26rem; height: 8px; border-radius: 8px; overflow: hidden; background: #E3E9F1; }
#s360-loading .avancement i { display: block; height: 100%; width: 3%; border-radius: 8px; transition: width .4s ease;

#s360-loading.relance .avancement { display: block; }
#s360-loading.relance .barre, #s360-loading.relance .lent, #s360-loading.relance .erreur { display: none; }
#s360-loading.relance .texte { max-width: 26rem; text-align: center; color: var(--text); }
/* Relance en arrière-plan : application vivante masquée, instantané de la page affiché par-dessus, bandeau en haut */
#root.s360-cache { visibility: hidden !important; }
#s360-ancien { position: fixed; inset: 0; z-index: 999970; overflow: hidden; }
#s360-ancien .s360-busy { display: none !important; }
#s360-relance { position: fixed; z-index: 1000001; left: 50%; top: 4.6rem; transform: translate(-50%, -12px); opacity: 0;
  width: min(40rem, calc(100vw - 2rem)); padding: .75rem 1rem .85rem; border-radius: 12px; background: #fff; color: var(--text);
  font-family: var(--font); box-shadow: 0 12px 32px rgba(0, 33, 87, .18); border: 1px solid #E3E8EF; border-left: 4px solid var(--bleu, #2B6CB0);
  transition: opacity .25s, transform .25s; pointer-events: none; }
#s360-relance.visible { opacity: 1; transform: translate(-50%, 0); }
#s360-relance .l { display: flex; flex-wrap: wrap; gap: .2rem .6rem; align-items: baseline; font-size: .95rem; }
#s360-relance .l b { color: var(--navy); }
#s360-relance .l span { color: var(--muted); font-size: .88rem; }
#s360-relance .piste { margin-top: .55rem; height: 5px; border-radius: 99px; background: #E3E9F1; overflow: hidden; }

    <div class="lent"><span id="s360-lent">Le chargement est plus long que prévu : le navigateur doit pouvoir accéder à

<div id="root"></div>
<script>
// Surveillance du moteur Python (Pyodide, dans un « worker » du navigateur). On note l'heure des messages envoyés à
// l'application qui attendent une réponse (clics) et celle des réponses, les erreurs, et on peut diagnostiquer le
// moteur (`diagnostic`, réponse de Python hors session) : la page ne relance le moteur que sur une panne constatée.
window.s360Version = "06/11/2026 22:17 UTC";  // date de génération du fichier : vérifier qu'on a bien la dernière version
window.s360Moteur = (function () {
  const journal = ["Supply360, version du " + window.s360Version];
  // Journal PERSISTANT (localStorage du navigateur, rien n'est envoyé) : relances, diagnostics et erreurs restent
  // consultables après une relance ou un rechargement de la page (clic sur « Prêt » dans le header).
  const CLE = "s360-journal";
  const lirePersistant = () => { try { return JSON.parse(localStorage.getItem(CLE) || "[]"); } catch (_) { return []; } };
  const persister = (texte) => {
    try {
      const l = lirePersistant();
      l.push(new Date().toLocaleString("fr-FR") + "  " + texte);
      localStorage.setItem(CLE, JSON.stringify(l.slice(-150)));
    } catch (_) { /* stockage indisponible : journal en mémoire seulement */ }
  };
  const noter = (m, important = false) => {
    const texte = String(m).replace(/\s+/g, " ").slice(0, 600);
    journal.push(new Date().toLocaleTimeString("fr-FR") + "  " + texte);
    if (journal.length > 30) journal.shift();
    if (important) persister(texte);
  };
  // Page (re)chargée : un onglet « déchargé » par le navigateur (mise en veille d'Edge / Chrome) repart de zéro
  persister("Page chargée (version du " + window.s360Version + ")" + (document.wasDiscarded
    ? " — l'onglet avait été déchargé par le navigateur (mise en veille des onglets) : tout est rechargé" : ""));
  // Cause probable des rechargements complets : la mise en veille des onglets (Edge « onglets en veille » / mode efficacité, Chrome
  // « économiseur de mémoire »). Un onglet inactif est gelé puis DÉCHARGÉ : au retour, la page repart de zéro
  // (écran de chargement, fichiers perdus). Pyodide pèse plusieurs centaines de Mo : c'est l'onglet choisi en premier.
  // Un onglet qui détient un « Web Lock » n'est jamais mis en veille (règle documentée par Microsoft pour Edge, même
  // règle de gel dans Chromium) : on en garde un en permanence, propre à cet onglet (nom unique : un autre onglet
  // Supply360 ouvert n'attend pas sa libération). Rien n'est envoyé ; le verrou disparaît avec l'onglet.
  const veille = { protegee: false };
  try {
    if (navigator.locks && navigator.locks.request) {
      navigator.locks.request("supply360-eveil-" + Date.now() + "-" + Math.random().toString(36).slice(2),
        () => { veille.protegee = true; return new Promise(() => {}); }).catch((e) => persister("Protection contre la mise en veille impossible : " + e));
    } else persister("Protection contre la mise en veille indisponible dans ce navigateur (Web Locks)");
  } catch (e) { persister("Protection contre la mise en veille impossible : " + e); }
  // Gel / reprise de l'onglet par le navigateur (API Page Lifecycle) : noté dans le journal pour le diagnostic
  let gel = 0;
  document.addEventListener("freeze", () => { gel = Date.now(); persister("Onglet gelé par le navigateur (mise en veille)"); });
  document.addEventListener("resume", () => persister("Onglet réveillé" + (gel ? " après " + Math.round((Date.now() - gel) / 60000) + " min" : "")));
  window.addEventListener("error", (e) => noter("Erreur : " + (e.message || e.error)));
  window.addEventListener("unhandledrejection", (e) => noter("Erreur : " + ((e.reason && e.reason.message) || e.reason)));
  const consoleErreur = console.error;
  console.error = function (...a) { try { noter(a.map((x) => (x && x.message) || x).join(" ")); } catch (_) {} return consoleErreur.apply(this, a); };
  // alerte : un diagnostic est demandé au plus vite ; mort : panne constatée par le diagnostic (relance)
  const etat = { worker: null, envoi: 0, recu: Date.now(), mort: "", alerte: 0, brut: null };
  // Messages de la page (BackMsg, protobuf) qui attendent une réponse : relance du script (champ 11), arrêt (7),
  // adresses de fichiers (16). Les autres (sonde 17, infos git 12, cache 5…) peuvent rester sans réponse : ils ne
  // doivent pas faire croire que la page attend le moteur.
  const AVEC_REPONSE = new Set([7, 11, 16]);
  const champs = (p) => {
    const b = p instanceof Uint8Array ? p : p instanceof ArrayBuffer ? new Uint8Array(p) : null;
    const vus = [];
    if (!b) return vus;
    let i = 0;
    const varint = () => { let v = 0, f = 1, c; do { c = b[i++]; v += (c & 127) * f; f *= 128; } while (c & 128 && i < b.length); return v; };
    while (i < b.length && vus.length < 8) {
      const tag = varint(), type = tag % 8;
      vus.push(Math.floor(tag / 8));
      if (type === 0) varint(); else if (type === 2) i += varint(); else if (type === 1) i += 8; else if (type === 5) i += 4; else break;
    }
    return vus;
  };
  const W = window.Worker;
  // Moteur SANS « JSPI » (bascule de pile WebAssembly, activée par défaut depuis Chrome / Edge 137) : après un gel de
  // l'onglet par le navigateur (mise en veille) puis son réveil, Pyodide finit en « fatal error : memory access out
  // of bounds » quelques minutes plus tard (reproduit 2 fois sur 2 ; jamais sans gel). Sans JSPI, Pyodide fonctionne
  // comme sous Firefox / Safari, le mode historique dont stlite n'a pas besoin. Le worker de stlite (blob classique)
  // est relu et précédé d'une ligne qui retire JSPI.
  const SANS_JSPI = "try { delete WebAssembly.Suspending; delete WebAssembly.promising; } catch (_) {}\n";
  window.Worker = function (...args) {
    if (typeof args[0] === "string" && args[0].startsWith("blob:") && !(args[1] && args[1].type === "module")) {
      try {  // contenu lu tout de suite : stlite révoque son adresse blob juste après la création du worker
        const x = new XMLHttpRequest();
        x.open("GET", args[0], false);
        x.send();
        if (x.status === 200 || x.status === 0) args[0] = URL.createObjectURL(new Blob([SANS_JSPI + x.responseText], { type: "text/javascript" }));
      } catch (_) { /* moteur d'origine */ }
    }
    const w = new W(...args);
    etat.worker = w;
    w.addEventListener("message", (e) => {
      if (w !== etat.worker) return;  // ancien moteur (relance) : ignoré
      const d = e.data;
      if (d && d.type === "websocket:message") etat.recu = Date.now();
      if (d && d.type === "s360:journal") {  // erreur Python transmise par core/journal.py
        noter("Python " + d.texte, /Error|Exception|Traceback|fermée|bug/.test(d.texte));
        if (d.evenement === "session_fermee" || /report this bug|RuntimeStoppedError/.test(d.texte)) etat.alerte = Date.now();
      }
    });
    w.addEventListener("error", (e) => { if (w === etat.worker) { noter("Erreur du moteur : " + (e.message || "?"), true); etat.alerte = Date.now(); } });
    const envoyer = w.postMessage.bind(w);
    w.postMessage = function (m, t) {
      if (m && m.type === "websocket:send") {
        const f = champs(m.data && m.data.payload);
        if (!f.length || f.some((n) => AVEC_REPONSE.has(n))) etat.envoi = Date.now();
      }
      if (m && m.type === "http:request") window.s360Moteur.ecouteurs.forEach((f) => f(m));  // suivi des imports
      return envoyer(m, t);
    };
    etat.brut = envoyer;
    return w;
  };
  window.Worker.prototype = W.prototype;
  // BackMsg { appHeartbeat: true } (champ 17, booléen ; étiquette varint 0x88 0x01, valeur 1) : Streamlit répond par un
  // « heartbeat_ack ». Sans effet sur l'app : sert à vérifier que la session lit encore les messages de la page.
  const sonder = () => {
    if (!etat.worker || !etat.brut) return;
    const canal = new MessageChannel();
    canal.port1.onmessage = () => canal.port1.close();
    etat.brut({ type: "websocket:send", data: { payload: new Uint8Array([136, 1, 1]) } }, [canal.port2]);
  };
  // Diagnostic : commande interne de stlite (`run_python`, hors session Streamlit) qui renvoie l'état de la session
  // (core/journal.py, sante). Pas de réponse = Python calcule (ou est figé) ; réponse en erreur = Python cassé.
  const diagnostic = (delai = 4000) => new Promise((ok) => {
    const w = etat.worker;
    if (!w || !etat.brut) return ok({ etat: "absent" });
    const canal = new MessageChannel();
    const t = setTimeout(() => { canal.port1.close(); ok({ etat: "occupé" }); }, delai);
    canal.port1.onmessage = (e) => {
      clearTimeout(t);
      canal.port1.close();
      const d = e.data || {};
      if (d.error) return ok({ etat: "erreur", erreur: String(d.error.message || d.error).slice(0, 200) });
      let r = {};
      try { r = JSON.parse((d.data && d.data.result) || "{}"); } catch (_) { /* réponse inattendue : rien à conclure */ }
      ok(Object.assign({ etat: "répond", recus: -1 }, r));
    };
    etat.brut({ type: "run_python", data: { code: 'import sys; getattr(sys, "_s360_sante", lambda: "{}")()' } }, [canal.port2]);
  });
  return { etat, journal, noter, lirePersistant, veille, effacer: () => { try { localStorage.removeItem(CLE); } catch (_) {} },
           sonder, diagnostic, ecouteurs: new Set() };
})();
</script>
<script>
// Le bouton de téléchargement de Streamlit « vérifie » son adresse interne (https://stlite.invalid/…) par une vraie
// requête réseau, qui part vers le proxy et échoue. On y répond localement : aucune requête inutile.
const fetchOrigine = window.fetch;
window.fetch = function (ressource, options) {
  const url = typeof ressource === "string" ? ressource : ressource && ressource.url;
  if (url && url.startsWith("https://stlite.invalid/")) return Promise.resolve(new Response(null, { status: 204 }));
  return fetchOrigine.apply(this, arguments);
};
</script>
<script>
// Surveillance du chargement (script classique : elle fonctionne même si stlite ne se télécharge pas).
(function () {
  const ecran = document.getElementById("s360-loading");
  const etape = document.getElementById("s360-etape");
  const erreur = document.getElementById("s360-erreur");
  const lent = document.getElementById("s360-lent");
  const debut = Date.now();
  const ETAPES = [
    [/Loading Pyodide/i, "Téléchargement du moteur Python (cdn.jsdelivr.net)…", "cdn.jsdelivr.net"],
    [/Mounting files|Unpacking archives/i, "Préparation des fichiers de l'application…", ""],
    [/Installing packages/i, "Installation de pandas, numpy… (cdn.jsdelivr.net, pypi.org)", "cdn.jsdelivr.net et pypi.org"],
    [/Loading streamlit/i, "Chargement de Streamlit…", "cdn.jsdelivr.net"],
    [/loggers|Mocking|Booting/i, "Démarrage de l'application…", ""],
  ];
  let libelle = etape.textContent, hote = "cdn.jsdelivr.net";
  const pret = () => document.querySelector(".s360-header, .stException, [data-testid='stException']");
  // Après le démarrage : surveillance du moteur. Il n'est relancé que sur une panne CONSTATÉE, jamais pendant un calcul.
  const surveiller = () => {

        h = await window.showDirectoryPicker({ id: `s360-${dossier}`, mode: "read" });
        await ecrire(dossier, h);
      }
      if (mode === "chantier") await listeChantiers(h, cible);
      else if (mode === "dernier") {  // dossier COMMANDE : le fichier le plus récemment modifié
        const liste = await fichiers(h, h.name, 0);
        if (!liste.length) { progres.cacher(); message(`Aucun fichier Excel dans « ${h.name} ».`); return; }
        deposer(cible, [liste.reduce((a, b) => (b.lastModified > a.lastModified ? b : a))]);
      } else {
        const liste = await fichiers(h, h.name, 0);
        if (!liste.length) { progres.cacher(); message(`Aucun fichier Excel ou CSV dans « ${h.name} ».`); return; }
        deposer(cible, liste);
      }
    } catch (err) {
      progres.cacher();
      if (err.name !== "AbortError") message("Accès au dossier impossible : " + err.message);
    }
  });
})();
</script>
<script>
// Relance du moteur sans perdre les fichiers. Chaque import (📂 Ouvrir ou Parcourir) est retenu EN MÉMOIRE de la
// page (rien n'est écrit sur le disque) : clé de la zone d'import + fichiers. Si le moteur Python s'arrête ou ne
// répond plus, « Relancer » redémarre stlite (sans recharger la page) puis redépose chaque import dans sa zone,
// onglet par onglet, dans l'ordre d'origine.
(function () {
  const ONGLETS = {"alertes": "Alertes", "fournisseurs": "Fournisseurs", "pe_mousses": "PE mousses", "stock_chantier": "Stock par chantier", "textiles": "Textile cabine"};  // TAB_ID → libellé de l'onglet
  const imports = [];
  window.s360Imports = imports;  // (lecture seule : diagnostic)
  let rejeu = false;
  const cleDe = (el) => {
    const c = el.closest('[class*="st-key-"]');
    const m = c && [...c.classList].map((x) => x.match(/^st-key-(.+)$/)).find(Boolean);
    return m ? m[1].replace(/(__upload)\d*$/, "$1") : null;
  };
  const ongletActif = () => {
    const b = document.querySelector('.st-key-s360_nav button[aria-checked="true"], .st-key-s360_nav button[data-selected="true"]');
    const lib = b ? b.textContent : "";
    return Object.keys(ONGLETS).find((id) => lib.includes(ONGLETS[id])) || Object.keys(ONGLETS)[0];
  };
  document.addEventListener("change", (e) => {
    const inp = e.target;
    if (rejeu || !(inp instanceof HTMLInputElement) || inp.type !== "file" || !inp.files || !inp.files.length) return;
    const cle = cleDe(inp);
    if (!cle) return;
    const onglet = cle.startsWith("commun__") ? ongletActif() : cle.split("__")[0];
    for (let i = imports.length - 1; i >= 0; i--) if (imports[i].cle === cle) imports.splice(i, 1);  // une sélection remplace l'autre
    imports.push({ cle, onglet, fichiers: [...inp.files] });
  }, true);
  const pause = (ms) => new Promise((ok) => setTimeout(ok, ms));
  const M = () => window.s360Moteur;
  const R = () => document.getElementById("root");  // application vivante (l'instantané affiché est à part)
  const occupe = () => !R().querySelector(".s360-header") || !!R().querySelector(".stApp[data-test-script-state='running']")
    || M().etat.envoi > M().etat.recu;
  const libre = async (max = 180000) => {  // attend la fin du calcul Streamlit (et des réponses du moteur)
    const debut = Date.now();
    await pause(400);
    let calme = 0;
    while (Date.now() - debut < max) {
      calme = occupe() ? 0 : calme + 1;
      if (calme >= 6) return;
      await pause(250);
    }
  };
  // Dépôt de fichiers dans une zone d'import, puis attente : envoi de TOUS les fichiers au moteur, puis fin du calcul.
  const deposerEtAttendre = (input, fichiers) => new Promise((ok) => {
    let envoyes = 0, dernier = Date.now(), vu = false;
    const debut = Date.now();
    const ecoute = (m) => {
      const r = (m.data && m.data.request) || {};
      if (/upload_file/.test(String(r.path || ""))) { envoyes++; dernier = Date.now(); }
    };
    M().ecouteurs.add(ecoute);
    const dt = new DataTransfer();
    fichiers.forEach((f) => dt.items.add(f));
    input.files = dt.files;
    input.dispatchEvent(new Event("change", { bubbles: true }));
    const tic = setInterval(() => {
      const o = occupe();
      if (envoyes >= fichiers.length && o) vu = true;
      const fini = envoyes >= fichiers.length && !o && Date.now() - dernier > 1200 && (vu || Date.now() - dernier > 6000);
      if (fini || Date.now() - debut > 240000) { clearInterval(tic); M().ecouteurs.delete(ecoute); ok(fini); }
    }, 150);
  });
  const ouvrirOnglet = async (id) => {
    const b = [...R().querySelectorAll(".st-key-s360_nav button")].find((x) => x.textContent.includes(ONGLETS[id]));
    if (b && !b.matches('[aria-checked="true"], [data-selected="true"]')) { b.click(); await libre(); }
  };
  const ouvrirSous = async (libelle) => {  // sous-onglet d'origine (Stock, Prévision…)
    const b = [...R().querySelectorAll('[class*="st-key-s360sub_"] button')].find((x) => x.textContent.trim() === libelle);
    if (b && b.getAttribute("aria-checked") !== "true") { b.click(); await libre(); }
  };
  // Instantané : copie figée de la page, affichée pendant que le moteur redémarre EN ARRIÈRE-PLAN (application
  // vivante masquée). On peut faire défiler et lire ; les clics sont ignorés. Tableaux (canvas) recopiés.
  const instantane = () => {
    const racine = R();
    if (!racine || !racine.querySelector(".s360-header")) return null;
    const copie = racine.cloneNode(true);
    copie.id = "s360-ancien";
    copie.querySelectorAll("[id]").forEach((e) => e.removeAttribute("id"));
    const src = racine.querySelectorAll("canvas"), dst = copie.querySelectorAll("canvas");
    src.forEach((c, i) => { try { dst[i].getContext("2d").drawImage(c, 0, 0); } catch (_) { /* canvas vide */ } });
    racine.after(copie);
    const tous = racine.querySelectorAll("*"), copies = copie.querySelectorAll("*");
    tous.forEach((e, i) => { if (e.scrollTop && copies[i]) copies[i].scrollTop = e.scrollTop; });
    ["click", "mousedown", "pointerdown", "keydown", "input", "change", "submit"].forEach((t) =>
      copie.addEventListener(t, (e) => { e.preventDefault(); e.stopPropagation(); }, true));
    return copie;
  };
  // Bandeau de relance (en haut de la page, au-dessus de l'instantané) ; à défaut d'instantané, l'écran de chargement.
  const bandeau = (() => {
    let el = null;
    return {
      montrer(titre, etape, pct) {
        if (!el) {
          el = document.createElement("div");
          el.id = "s360-relance";
          el.innerHTML = "<div class='l'><b></b><span></span></div><div class='piste'><i></i></div>";
          document.body.append(el);
        }
        el.classList.add("visible");
        el.querySelector("b").textContent = titre;
        el.querySelector("span").textContent = etape;
        el.querySelector("i").style.width = Math.max(3, Math.min(100, pct)) + "%";
      },
      cacher(delai = 0) { setTimeout(() => el && el.classList.remove("visible"), delai); },
    };
  })();
  const ecran = (() => {
    const el = document.getElementById("s360-loading");
    let barre = el.querySelector(".avancement");
    if (!barre) {
      barre = document.createElement("div");
      barre.className = "avancement";
      barre.innerHTML = "<i></i>";
      el.querySelector(".barre").after(barre);
    }
    return {
      montrer(texte, etape, pct) {
        el.classList.remove("fini", "lent", "echec");
        el.classList.add("relance");
        el.querySelector(".texte").textContent = texte;
        el.querySelector(".etape").textContent = etape;
        barre.querySelector("i").style.width = Math.max(3, Math.min(100, pct)) + "%";
      },
      cacher() { el.classList.add("fini"); setTimeout(() => el.classList.remove("relance"), 600); },
    };
  })();
  window.s360Relancer = async (raison) => {
    const Mo = M(), retour = ongletActif();
    if (window.s360EnRelance) return;
    window.s360EnRelance = true;
    const sous = [...R().querySelectorAll('[class*="st-key-s360sub_"] button[aria-checked="true"]')].map((b) => b.textContent.trim());
    const copie = instantane();
    const vue = copie ? bandeau : ecran;  // arrière-plan si la page peut être figée, sinon écran de chargement
    const titre = copie ? "Remise en route du moteur en arrière-plan" + (raison ? " (" + raison + ")" : "") + " · la page reste consultable"
      : (raison ? "Le moteur de calcul ne répondait plus : relance automatique, vos fichiers sont conservés."
        : "Relance du moteur de calcul, vos fichiers sont conservés.");
    Mo.noter((raison ? "Relance automatique" : "Relance manuelle") + (copie ? " en arrière-plan" : "") + (raison ? " : " + raison : ""), true);
    let pct = 2;
    const montee = setInterval(() => { pct += (55 - pct) * 0.06; vue.montrer(titre, "Redémarrage du moteur Python…", pct); }, 400);
    const echecs = [];
    const debut = Date.now();
    try {
      vue.montrer(titre, "Redémarrage du moteur Python…", pct);
      if (copie) R().classList.add("s360-cache");
      try { window.s360App && window.s360App.unmount(); } catch (_) { /* moteur déjà arrêté */ }
      Mo.etat.mort = ""; Mo.etat.envoi = 0; Mo.etat.recu = Date.now();
      await window.s360Monter();
      await libre(300000);
      clearInterval(montee);
      rejeu = true;
      const ordre = [...new Set(imports.map((x) => x.onglet))];
      let n = 0;
      for (const id of ordre) {
        await ouvrirOnglet(id);
        for (const imp of imports.filter((x) => x.onglet === id)) {
          n++;
          vue.montrer(titre, `Réimport de vos fichiers (${n} / ${imports.length}) : ${ONGLETS[id] || ""}…`, 55 + 45 * (n - 1) / imports.length);
          // fichiers relus sur le disque quand ils viennent d'un dossier mémorisé (version à jour, lisible)
          const fichiers = [];
          for (const f of imp.fichiers) {
            const h = window.s360Poignees.get(f);
            try { fichiers.push(h ? await h.getFile() : f); } catch (_) { fichiers.push(f); }
          }
          // zone d'origine ; à défaut (zone absente, ex. type d'étude différent) l'import du dossier de l'onglet,
          // qui reconnaît chaque fichier par son contenu
          const input = R().querySelector(`[class*="st-key-${imp.cle}"] input[type=file]`)
            || R().querySelector(`[class*="st-key-${id}__dossier__upload"] input[type=file]`);
          if (!input || !(await deposerEtAttendre(input, fichiers))) echecs.push(imp.fichiers.map((f) => f.name).join(", "));
        }
      }
      await ouvrirOnglet(retour);
      for (const libelle of sous) await ouvrirSous(libelle);
      vue.montrer(echecs.length ? "Moteur relancé" : "✓ Moteur relancé, vos fichiers sont réimportés",
        echecs.length ? "sauf : " + echecs.join(" ; ") : `en ${Math.round((Date.now() - debut) / 1000)} s`, 100);
      Mo.noter(`Relance terminée en ${Math.round((Date.now() - debut) / 1000)} s` + (echecs.length ? ", réimport incomplet : " + echecs.join(" ; ") : ""), true);
      if (copie) { copie.remove(); R().classList.remove("s360-cache"); bandeau.cacher(echecs.length ? 6000 : 2500); }
      else { await pause(echecs.length ? 4000 : 900); ecran.cacher(); }
    } catch (err) {
      Mo.noter("Relance impossible : " + err, true);
      location.reload();
    } finally {
      clearInterval(montee);
      rejeu = false;
      window.s360EnRelance = false;
      if (copie && copie.isConnected) { copie.remove(); R().classList.remove("s360-cache"); }
    }
  };
})();
</script>
<script>
// Journal du moteur : clic sur « Prêt » (header) → relances (avec leur cause), diagnostics et erreurs, conservés dans
// le navigateur même après un rechargement. « Copier » pour le transmettre ; rien n'est envoyé automatiquement.
document.addEventListener("click", (e) => {
  if (!e.target.closest(".s360-moteur") || e.target.closest("#s360-ancien")) return;
  const M = window.s360Moteur;
  const lignes = M.lirePersistant().slice().reverse();
  const relances = lignes.filter((l) => /Relance (automatique|manuelle)/.test(l)).length;
  document.getElementById("s360-fenetre")?.remove();
  const f = document.createElement("div");
  f.id = "s360-fenetre";
  f.innerHTML = `<div class="boite journal" role="dialog" aria-modal="true"><button type="button" class="fermer" aria-label="Fermer">✕</button>
    <h3>Journal du moteur</h3><p class="sous">${relances} relance(s) enregistrée(s) · mise en veille de l'onglet :
    ${M.veille.protegee ? "bloquée" : "NON bloquée"} · les plus récents en haut · conservé dans ce navigateur</p>
    <pre></pre><div class="actions"><button type="button" class="copier">Copier le journal</button>
    <button type="button" class="effacer">Effacer</button></div></div>`;
  f.querySelector("pre").textContent = lignes.join("\n") || "Aucun événement enregistré.";
  f.addEventListener("click", (ev) => {
    if (ev.target === f || ev.target.closest(".fermer")) f.remove();
    else if (ev.target.closest(".copier")) navigator.clipboard && navigator.clipboard.writeText(
      "Supply360 " + window.s360Version + "\n" + navigator.userAgent + "\n\n" + lignes.join("\n") + "\n\nDernières minutes :\n" + M.journal.join("\n"));
    else if (ev.target.closest(".effacer")) { M.effacer(); f.remove(); }
  });
  document.body.append(f);
});

<script>
// Tableaux (components.tableau_html, utilisé par TOUS les tableaux de l'app) : tri et filtres dans la page, sans
// recalcul Python. Clic sur un en-tête : trier, filtrer par valeurs (texte) ou par bornes (nombres, dates).
// Recherche dans tout le tableau, pastilles par statut, compteur « x lignes sur y » et « Effacer les filtres ».
// Un nouvel affichage du tableau par Streamlit repart sans filtre.
(function () {
  const etats = new WeakMap();
  const etat = (t) => { let e = etats.get(t); if (!e) { e = { f: {}, tri: null, q: "", statut: "" }; etats.set(t, e); } return e; };
  const entetes = (t) => [...t.tHead.rows[t.tHead.rows.length - 1].cells];
  const typeDe = (t, i) => entetes(t)[i].dataset.type || "txt";
  const texte = (td) => { const s = td.textContent.replace(/\s+/g, " ").trim(); return s === "—" ? "" : s; };
  const valeur = (td, type) => {
    if (type === "txt") return texte(td);
    const v = td.dataset.v;
    if (v === undefined || v === "") return null;
    return type === "date" || type === "mois" ? v : +v;
  };
  const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const passe = (v, f) => {
    if (f.type === "txt") {
      if (f.valeurs && !f.valeurs.has(v)) return false;
      if (f.contient && !norm(v).includes(norm(f.contient))) return false;
      return true;
    }
    if (f.vides === false && v === null) return false;
    if (v === null) return !(f.min !== "" || f.max !== "" || f.nonZero);
    if (f.nonZero && v === 0) return false;
    if (f.min !== "" && f.min !== undefined && v < (f.type === "num" || f.type === "euros" || f.type === "progres" ? +f.min : f.min)) return false;
    if (f.max !== "" && f.max !== undefined && v > (f.type === "num" || f.type === "euros" || f.type === "progres" ? +f.max : f.max)) return false;
    return true;
  };
  const outils = (t) => document.querySelector(`.s360-outils[data-table="${t.id}"]`);
  const actif = (f) => f && (f.type === "txt" ? (f.valeurs || f.contient) : (f.min !== "" || f.max !== "" || f.nonZero || f.vides === false));
  const PAGE = 200;
  // Toutes les lignes du tableau (affichées ou non) : les premières sont dans le tableau, les autres dans data-reste
  // (JSON, components.tableau_html), transformées en lignes au premier besoin (filtre, tri, « Afficher plus »).
  const toutes = (t) => {
    const e = etat(t);
    if (!e.toutes) {
      const lignes = [...t.tBodies[0].rows];
      if (t.dataset.reste) {
        const corps = document.createElement("tbody");
        try { corps.innerHTML = JSON.parse(t.dataset.reste).join(""); } catch (_) { /* reste illisible : lignes affichées seulement */ }
        lignes.push(...corps.rows);
        t.removeAttribute("data-reste");
      }
      e.toutes = lignes; e.ordre = lignes.slice(); e.vues = lignes; e.limite = PAGE;
    }
    return e.toutes;
  };
  const afficher = (t) => {
    const e = etat(t), total = e.toutes.length, n = e.vues.length;
    t.tBodies[0].replaceChildren(...e.vues.slice(0, e.limite));
    const o = outils(t);
    if (o) {
      o.querySelector(".s360-nb-lignes").textContent = (n === total ? `${total} ligne${total > 1 ? "s" : ""}` : `${n} ligne${n > 1 ? "s" : ""} sur ${total}`)
        + (n > e.limite ? ` · ${e.limite} affichées` : "");
      o.querySelector(".s360-raz").hidden = !(n !== total || e.tri);
    }
    const plus = document.querySelector(`.s360-plus[data-table="${t.id}"]`);
    if (plus) {
      plus.hidden = n <= e.limite;
      plus.querySelector("button").textContent = `Afficher ${Math.min(PAGE, n - e.limite)} lignes de plus`;
      plus.querySelector("span").textContent = `${Math.max(0, n - e.limite)} lignes non affichées`;
    }
  };
  const appliquer = (t) => {
    const e = etat(t), q = norm(e.q.trim());
    const filtres = Object.entries(e.f).filter(([, f]) => actif(f));
    e.vues = toutes(t).filter((r) => {
      if (e.statut && r.dataset.statut !== e.statut) return false;
      if (q && !(r._q || (r._q = norm(r.textContent))).includes(q)) return false;  // texte de la ligne, calculé une fois
      for (const [i, f] of filtres) if (!passe(valeur(r.cells[i], f.type), f)) return false;
      return true;
    });
    e.limite = PAGE;
    entetes(t).forEach((th, i) => {
      th.classList.toggle("filtre", !!actif(e.f[i]));
      th.classList.toggle("tri-asc", !!(e.tri && e.tri.i === i && e.tri.sens > 0));
      th.classList.toggle("tri-desc", !!(e.tri && e.tri.i === i && e.tri.sens < 0));
    });
    afficher(t);
  };
  const trier = (t, i, sens) => {
    const e = etat(t), type = typeDe(t, i);
    toutes(t);
    e.tri = sens ? { i, sens } : null;
    e.toutes = sens ? [...e.ordre].sort((a, b) => {
      const x = valeur(a.cells[i], type), y = valeur(b.cells[i], type);
      const vx = x === null || x === "", vy = y === null || y === "";
      if (vx || vy) return vx === vy ? 0 : vx ? 1 : -1;  // vides toujours en bas
      return (type === "txt" ? String(x).localeCompare(String(y), "fr", { numeric: true }) : x < y ? -1 : x > y ? 1 : 0) * sens;
    }) : e.ordre.slice();
    appliquer(t);
  };
  // « Afficher plus » : page suivante des lignes retenues
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest(".s360-plus button");
    if (!b) return;
    const t = document.getElementById(b.closest(".s360-plus").dataset.table);
    if (!t) return;
    toutes(t);
    etat(t).limite += PAGE;
    afficher(t);
  });
  // Barre d'outils : recherche et « Effacer les filtres » ajoutés ici (le HTML de Streamlit ne garde pas les champs)
  const preparer = (o) => {
    if (o.dataset.pret) return;
    o.dataset.pret = "1";
    const q = document.createElement("input");
    q.type = "search"; q.className = "s360-recherche"; q.placeholder = "Rechercher dans le tableau…";
    q.addEventListener("input", () => { const t = document.getElementById(o.dataset.table); if (t) { etat(t).q = q.value; appliquer(t); } });
    o.prepend(q);
    const raz = document.createElement("button");
    raz.type = "button"; raz.className = "s360-raz"; raz.hidden = true; raz.textContent = "Effacer les filtres";
    raz.addEventListener("click", () => {
      const t = document.getElementById(o.dataset.table);
      if (!t) return;
      const e = etat(t);
      e.f = {}; e.q = ""; e.statut = ""; q.value = "";
      o.querySelectorAll(".s360-filtres button").forEach((b) => b.classList.toggle("actif", !b.dataset.f));
      trier(t, 0, 0);
    });
    o.append(raz);
    const t = document.getElementById(o.dataset.table);
    if (t) entetes(t).forEach((th) => { th.tabIndex = 0; if (!th.title) th.title = "Cliquer pour trier ou filtrer"; });
  };
  const veilleur = new MutationObserver(() => document.querySelectorAll(".s360-outils:not([data-pret])").forEach(preparer));
  veilleur.observe(document.documentElement, { childList: true, subtree: true });
  // Pastilles de statut
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest(".s360-filtres button");
    if (!b) return;
    const o = b.closest(".s360-outils"), t = o && document.getElementById(o.dataset.table);
    if (!t) return;
    o.querySelectorAll(".s360-filtres button").forEach((x) => x.classList.toggle("actif", x === b));
    etat(t).statut = b.dataset.f || "";
    appliquer(t);
  });
  // Menu d'une colonne
  const fermer = () => document.getElementById("s360-menu-col")?.remove();
  const ouvrir = (th) => {
    const t = th.closest("table"), i = entetes(t).indexOf(th), type = th.dataset.type || "txt", e = etat(t);
    fermer();
    const f = e.f[i] || (e.f[i] = type === "txt" ? { type, valeurs: null, contient: "" } : { type, min: "", max: "", nonZero: false, vides: true });
    const m = document.createElement("div");
    m.id = "s360-menu-col";
    const nom = th.textContent.trim();
    const champ = type === "date" || type === "mois" ? "date" : "number";
    m.innerHTML = `<div class="titre"></div>
      <div class="tri"><button type="button" data-tri="1">${type === "txt" ? "Trier de A à Z" : type === "date" || type === "mois" ? "Plus ancien d'abord" : "Du plus petit au plus grand"}</button>
      <button type="button" data-tri="-1">${type === "txt" ? "Trier de Z à A" : type === "date" || type === "mois" ? "Plus récent d'abord" : "Du plus grand au plus petit"}</button></div>` +
      (type === "txt"
        ? `<input type="search" class="contient" placeholder="Contient…"><div class="liste"></div>`
        : `<div class="bornes"><label>${champ === "date" ? "Du" : "Au moins"} <input type="${champ}" class="min" step="any"></label>
           <label>${champ === "date" ? "Au" : "Au plus"} <input type="${champ}" class="max" step="any"></label></div>` +
          (champ === "number" ? `<label class="case"><input type="checkbox" class="nonzero"> Masquer les zéros</label>` : "") +
          `<label class="case"><input type="checkbox" class="sansvide"> Masquer les cases vides</label>`) +
      `<div class="actions"><button type="button" class="effacer">Effacer ce filtre</button><button type="button" class="ok">Fermer</button></div>`;
    m.querySelector(".titre").textContent = nom;
    document.body.append(m);
    const maj = () => appliquer(t);
    if (type === "txt") {
      const comptes = new Map();
      toutes(t).forEach((r) => { const v = valeur(r.cells[i], "txt"); comptes.set(v, (comptes.get(v) || 0) + 1); });
      const valeurs = [...comptes.keys()].sort((a, b) => a.localeCompare(b, "fr", { numeric: true }));
      const liste = m.querySelector(".liste");
      const dessiner = () => {
        const filtre = norm(m.querySelector(".contient").value);
        const vues = valeurs.filter((v) => !filtre || norm(v).includes(filtre)).slice(0, 300);
        liste.innerHTML = `<label class="case tout"><input type="checkbox"> <b>Tout</b></label>` + vues.map((v, k) =>
          `<label class="case"><input type="checkbox" data-k="${k}"> <span></span> <em>${comptes.get(v)}</em></label>`).join("") +
          (valeurs.length > 300 && vues.length === 300 ? `<p class="plus">Tapez pour affiner (${valeurs.length} valeurs)</p>` : "");
        liste.querySelectorAll("label.case:not(.tout)").forEach((l, k) => {
          l.querySelector("span").textContent = vues[k] || "(vide)";
          l.querySelector("input").checked = !f.valeurs || f.valeurs.has(vues[k]);
        });
        const tout = liste.querySelector(".tout input");
        tout.checked = !f.valeurs;
        tout.addEventListener("change", () => { f.valeurs = tout.checked ? null : new Set(); dessiner(); maj(); });
        liste.querySelectorAll("input[data-k]").forEach((c) => c.addEventListener("change", () => {
          if (!f.valeurs) f.valeurs = new Set(valeurs);
          const v = vues[+c.dataset.k];
          c.checked ? f.valeurs.add(v) : f.valeurs.delete(v);
          if (f.valeurs.size === valeurs.length) f.valeurs = null;
          tout.checked = !f.valeurs;
          maj();
        }));
      };
      const c = m.querySelector(".contient");
      c.value = f.contient || "";
      c.addEventListener("input", () => { f.contient = c.value; dessiner(); maj(); });
      dessiner();
      setTimeout(() => c.focus(), 0);
    } else {
      const lire = () => {
        f.min = m.querySelector(".min").value; f.max = m.querySelector(".max").value;
        const nz = m.querySelector(".nonzero"); f.nonZero = !!(nz && nz.checked);
        f.vides = !m.querySelector(".sansvide").checked;
        maj();
      };
      m.querySelector(".min").value = f.min || ""; m.querySelector(".max").value = f.max || "";
      if (m.querySelector(".nonzero")) m.querySelector(".nonzero").checked = !!f.nonZero;
      m.querySelector(".sansvide").checked = f.vides === false;
      m.querySelectorAll("input").forEach((x) => x.addEventListener("input", lire));
      m.querySelectorAll("input[type=checkbox]").forEach((x) => x.addEventListener("change", lire));
    }
    m.querySelectorAll("[data-tri]").forEach((b) => b.addEventListener("click", () => { trier(t, i, +b.dataset.tri); fermer(); }));
    m.querySelector(".effacer").addEventListener("click", () => { delete e.f[i]; if (e.tri && e.tri.i === i) trier(t, i, 0); else maj(); fermer(); });
    m.querySelector(".ok").addEventListener("click", fermer);
    m._th = th;
    placer(m);
  };
  // position : sous l'en-tête, dans l'écran (recalculée au défilement ; fermé si l'en-tête sort de l'écran)
  const placer = (m) => {
    const r = m._th.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
    if (!m._th.isConnected || r.bottom < 0 || r.top > window.innerHeight) return fermer();
    m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + "px";
    m.style.top = (r.bottom + h + 8 < window.innerHeight ? r.bottom + 4 : Math.max(8, r.top - h - 4)) + "px";
  };
  document.addEventListener("click", (ev) => {
    const th = ev.target.closest("table.s360-filtrable thead tr:last-child th");
    if (th && !ev.target.closest("#s360-ancien")) { ev.preventDefault(); ouvrir(th); return; }
    // clic dans le menu (y compris sur une case que le menu vient de redessiner) : il reste ouvert
    if (!ev.composedPath().some((n) => n.id === "s360-menu-col")) fermer();
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") fermer();
    const th = ev.target.closest && ev.target.closest("table.s360-filtrable thead tr:last-child th");
    if (th && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); ouvrir(th); }
  });
  document.addEventListener("scroll", (ev) => {
    const m = document.getElementById("s360-menu-col");
    if (m && !(ev.target.closest && ev.target.closest("#s360-menu-col"))) placer(m);
  }, true);
  window.addEventListener("resize", () => { const m = document.getElementById("s360-menu-col"); if (m) placer(m); });
})();
</script>
<script>
// Agrandir un graphe : bouton « ⛶ » sur chaque graphe (core/charts.py). Le graphe est recopié dans une fenêtre plein
// écran, sans ses zones défilantes, et mis à l'échelle (zoom) pour tenir en entier dans l'écran : pas de barre de
// défilement, textes et barres agrandis. Infobulles au survol conservées. Échap ou clic hors du graphe pour fermer.
(function () {
  const fermer = () => document.getElementById("s360-grand")?.remove();
  // Enregistrer en PNG : copie du graphe en entier (sans zone défilante), styles calculés recopiés sur chaque élément,
  // police Manrope intégrée, puis dessin dans une image (SVG foreignObject → canvas) au double de la résolution.
  // Feuille de style des graphes : règles « s360 » du thème, variables de couleur (sans les images), police Manrope.
  const styleGraphes = () => {
    const regles = [], vars = [];
    for (const f of document.styleSheets) {
      let r; try { r = f.cssRules; } catch (_) { continue; }
      for (const x of r) {
        if (x instanceof CSSFontFaceRule && /manrope/i.test(x.cssText)) regles.push(x.cssText);
        else if (x instanceof CSSStyleRule && /s360/.test(x.selectorText) && !/s360-(header|hero|loading|grand|bloque|progres)/.test(x.selectorText))
          regles.push(x.cssText);
        else if (x instanceof CSSStyleRule && x.selectorText === ":root")
          for (let i = 0; i < x.style.length; i++) {
            const n = x.style[i], v = x.style.getPropertyValue(n);
            if (n.startsWith("--") && !/url\(/.test(v)) vars.push(`${n}:${v}`);
          }
      }
    }
    return `:root{${vars.join(";")}} ${regles.join("\n")}`;
  };
  const enPng = async (graphe) => {
    const largeur = Math.ceil(graphe.getBoundingClientRect().width);
    const racine = parseFloat(getComputedStyle(document.documentElement).fontSize) || 13;
    const hote = document.createElement("div");
    hote.style.cssText = `position:fixed;left:-20000px;top:0;width:${largeur}px;background:#fff;padding:16px;box-sizing:content-box`;
    const copie = graphe.cloneNode(true);
    copie.querySelectorAll(".s360-agrandir, .s360-png").forEach((b) => b.remove());
    copie.querySelectorAll("[data-tip]").forEach((x) => x.removeAttribute("data-tip"));
    copie.querySelectorAll("h1 a, h2 a, h3 a, h4 a, h5 a, h6 a, [data-testid='stHeaderActionElements']").forEach((x) => x.remove());  // icône de lien des titres
    copie.querySelectorAll(".s360-jauge-scroll, .s360-heat-scroll").forEach((z) => { z.style.maxHeight = "none"; z.style.overflow = "visible"; });
    hote.append(copie);
    // Mesure dans l'app (mêmes règles, police comprise) ; contenu plus large que le cadre : l'image prend toute sa largeur.
    (document.querySelector(".stApp") || document.body).append(hote);
    const large = Math.max(...[copie, ...copie.querySelectorAll("table, .s360-plot, .s360-jauge")].map((x) => x.scrollWidth));
    if (large > largeur) hote.style.width = large + "px";
    const l = Math.ceil(hote.getBoundingClientRect().width), h = Math.ceil(hote.getBoundingClientRect().height);
    const police = getComputedStyle(copie).fontFamily;
    hote.remove();
    hote.style.cssText = `width:${l - 32}px;padding:16px;background:#fff;font-family:${police.replace(/"/g, "'")};color:#1A1F36`;
    const html = new XMLSerializer().serializeToString(hote);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${l}" height="${h}" style="font-size:${racine}px">` +
      `<foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" class="stApp">` +
      `<style>${styleGraphes()}</style>${html}</div></foreignObject></svg>`;
    const img = new Image();
    await new Promise((ok, ko) => { img.onload = ok; img.onerror = ko; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); });
    // Résolution double, réduite pour les très grands graphes (limite de taille d'image des navigateurs).
    const echelle = Math.max(0.5, Math.min(2, 15000 / h, 15000 / l, Math.sqrt(120e6 / (l * h))));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(l * echelle); canvas.height = Math.round(h * echelle);
    const ctx = canvas.getContext("2d");
    ctx.scale(echelle, echelle); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, l, h); ctx.drawImage(img, 0, 0);
    const titre = (graphe.querySelector("h5")?.textContent || "graphe").normalize("NFD").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 60);
    const lien = document.createElement("a");
    lien.download = `Supply360_${titre}.png`;
    lien.href = canvas.toDataURL("image/png");
    lien.click();
  };
  const ouvrir = (graphe) => {
    fermer();
    const largeur = graphe.getBoundingClientRect().width;
    const fond = document.createElement("div");
    fond.id = "s360-grand";
    fond.innerHTML = "<div class='cadre'><div class='outils'><button type='button' class='png'>⬇️ Enregistrer en PNG</button>" +
      "<button type='button' class='fermer' aria-label='Fermer'>✕</button></div><div class='contenu'></div></div>";
    const contenu = fond.querySelector(".contenu");
    const copie = graphe.cloneNode(true);
    copie.querySelectorAll(".s360-agrandir, .s360-png").forEach((b) => b.remove());
    copie.querySelectorAll(".s360-jauge-scroll, .s360-heat-scroll").forEach((z) => { z.style.maxHeight = "none"; z.style.overflow = "visible"; });
    contenu.style.width = largeur + "px";
    fond.querySelector(".png").onclick = () => enPng(graphe).catch((err) => window.s360Moteur.noter("PNG impossible : " + err));
    contenu.append(copie);
    fond.addEventListener("click", (e) => { if (e.target === fond || e.target.closest(".fermer")) fermer(); });
    document.body.append(fond);
    // Échelle : le graphe entier dans la fenêtre (marges comprises), agrandi jusqu'à 2,4 fois.
    const cadre = fond.querySelector(".cadre"), r = contenu.getBoundingClientRect();
    const dispoL = window.innerWidth * 0.94 - 48, dispoH = window.innerHeight * 0.92 - 90;
    // Grand graphe (beaucoup de lignes) : s'il faudrait le réduire sous 70 % pour qu'il tienne en hauteur, on le garde
    // lisible à la largeur de l'écran et la fenêtre défile verticalement.
    const tout = Math.min(2.4, dispoL / r.width, dispoH / r.height);
    const zoom = tout >= 0.7 ? tout : Math.min(1.6, dispoL / r.width);
    contenu.style.zoom = zoom;
    cadre.focus();
  };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") fermer(); });
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".s360-agrandir");
    if (b) { e.preventDefault(); ouvrir(b.closest(".s360-chart")); }
    const p = e.target.closest(".s360-png");
    if (p) { e.preventDefault(); enPng(p.closest(".s360-chart")).catch((err) => window.s360Moteur.noter("PNG impossible : " + err)); }
  });
  setInterval(() => {
    document.querySelectorAll(".stApp .s360-chart:not([data-s360-grand])").forEach((g) => {
      g.setAttribute("data-s360-grand", "1");
      if (g.querySelector(".s360-vide")) return;
      const b = document.createElement("button");
      b.type = "button"; b.className = "s360-agrandir"; b.title = "Agrandir le graphe"; b.textContent = "⛶";
      const p = document.createElement("button");
      p.type = "button"; p.className = "s360-png"; p.title = "Enregistrer le graphe en image PNG"; p.textContent = "⤓";
      g.append(p, b);
    });
  }, 700);
})();
</script>
<script type="module">
// Import d'un dossier : stlite n'envoie que le nom du fichier. On transmet son chemin relatif
// (« R2/F-XKAA - 151126/extraction.xlsx ») pour que l'app regroupe les fichiers par dossier chantier.
const ajouterFormData = FormData.prototype.append;
// La date de modification du fichier est ajoutée devant (« @1730650000000@/… », core/dossiers.py) : quand un dossier
// contient plusieurs fichiers du même type, l'app retient le plus récent même sans date dans le nom.
FormData.prototype.append = function (nom, valeur, fichier) {
  if (valeur instanceof File && fichier === undefined) {
    const chemin = window.s360Chemins.get(`${valeur.name}|${valeur.size}|${valeur.lastModified}`) || valeur.webkitRelativePath || valeur.name;
    return ajouterFormData.call(this, nom, valeur, (valeur.lastModified ? `@${valeur.lastModified}@/` : "") + chemin);
  }
  return ajouterFormData.apply(this, arguments);
};

// Import dynamique : un échec de téléchargement de stlite est affiché au lieu de bloquer l'écran de chargement.
// s360Monter est réutilisé par la relance du moteur (bandeau « L'application ne répond plus »).
const OPTIONS = {
  entrypoint: "app/main.py",
  requirements: ["pandas", "numpy", "python-calamine"],
  files: {"app/core/__init__.py": "", "app/core/avions.py": "\"\"\"Type d'avion d'après l'immatriculation, et image associée (en-tête de Stock par chantier).\n\nCorrespondance par série d'immatriculation (3 lettres après « F- ») : un nouvel avion d'une série connue est\nreconnu sans rien changer. Une image par famille : fichier `assets/avions/<famille>.webp` ; build.py et\nstyle.css_complet en tirent une classe CSS `s360-avion t-<famille>` (aucune image : rien n'est affiché).\n\"\"\"\n\nimport re\n\nSERIES = {\n    \"HZU\": \"A220\", \"HPN\": \"A220\", \"HOZ\": \"A220\",\n    \"GUG\": \"A318\", \"GRH\": \"A319\", \"GRX\": \"A319\",\n    \"GKX\": \"A320\", \"HEP\": \"A320\", \"HBN\": \"A320\", \"HZF\": \"A320\",\n    \"GTA\": \"A321\", \"GMZ\": \"A321\",\n    \"GZC\": \"A330\",\n    \"HTY\": \"A350\", \"HUV\": \"A350\",\n    \"GSP\": \"B777-200\", \"GUO\": \"B777-200\",\n    \"GSQ\": \"B777-300\", \"GZN\": \"B777-300\",\n    \"HRB\": \"B787\",\n}\n\n# Famille d'image de chaque type (même silhouette pour la famille A320)\nFAMILLES = {\"A220\": \"a220\", \"A318\": \"a320\", \"A319\": \"a320\", \"A320\": \"a320\", \"A321\": \"a320\", \"A330\": \"a330\",\n            \"A350\": \"a350\", \"B777-200\": \"b777-200\", \"B777-300\": \"b777-300\", \"B787\": \"b787\"}\n\n\ndef serie(immat) -> str:\n    \"\"\"« F-HTYA », « fhtya », « HTYA » → « HTY » (vide si illisible).\"\"\"\n    s = re.sub(r\"[^A-Z]\", \"\", str(immat or \"\").upper())\n    if len(s) == 5 and s[0] == \"F\":\n        s = s[1:]\n    return s[:3] if len(s) >= 4 else \"\"\n\n\ndef type_avion(immat) -> str | None:\n    \"\"\"Type d'avion (« A350 », « B777-300 »…) ou None si la série est inconnue.\"\"\"\n    return SERIES.get(serie(immat))\n\n\ndef famille(immat) -> str | None:\n    \"\"\"Famille d'image (« a350 », « a320 »…) ou None.\"\"\"\n    t = type_avion(immat)\n    return FAMILLES.get(t) if t else None\n", "app/core/cache.py": "\"\"\"Lectures des sources communes, mises en cache et partagées entre onglets.\n\nUn même fichier « État du stock » ou « Commandes (SAP) » importé dans un onglet est lu une seule\nfois : l'autre onglet réutilise le résultat. La clé de cache est le contenu du fichier (octets).\n\n`st.cache_resource` plutôt que `st.cache_data` : le résultat est gardé tel quel en mémoire, sans\ncopie par pickle. Sous Pyodide, relire par pickle un DataFrame contenant des dates échoue\n(NotImplementedError) et coûte du temps à chaque interaction. Les fonctions appelantes ne\nmodifient jamais les tables reçues (elles travaillent sur des copies).\n\"\"\"\n\nimport streamlit as st\n\nfrom core import io as sio\n\n\n@st.cache_resource(show_spinner=\"Lecture de l'État du stock…\", max_entries=2)\ndef etat_stock(data: bytes):\n    return sio.lire_etat_stock(data)\n\n\n@st.cache_resource(show_spinner=\"Lecture des commandes…\", max_entries=2)\ndef commandes(data: bytes):\n    return sio.lire_commandes_sap(data)\n\n\n@st.cache_resource(show_spinner=\"Lecture des références textile…\", max_entries=2)\ndef references_textile(data: bytes):\n    return sio.lire_references_textile(data)\n", "app/core/charts.py": "\"\"\"Graphes HTML / SVG légers, dans le style du prototype Supply360.\n\nFonctions pures : elles renvoient du HTML affiché par `components.graphe` (st.markdown). Aucune\ndépendance et aucun JavaScript : rendu instantané, rien à charger. Les positions horizontales sont\nen %, les hauteurs en px : les textes gardent leur taille quelle que soit la largeur.\n\nSurvol : chaque colonne (ou ligne, ou case) porte une infobulle `data-tip` affichée en CSS\n(core/theme.css) avec toutes ses valeurs.\n\"\"\"\n\nimport math\nfrom html import escape\n\nimport pandas as pd\n\nfrom core.style import COLORS\n\nPALETTE = [COLORS[\"navy_2\"], \"#2A9D8F\", \"#F4A259\", \"#BC4B51\", COLORS[\"violet\"], \"#8AB17D\", COLORS[\"gris\"]]\nHAUT = 20  # marge au-dessus des barres (étiquettes de valeur)\n\n\n# --------------------------------------------------------------------------\n# Formats\n# --------------------------------------------------------------------------\ndef _nan(v) -> bool:\n    try:\n        return v is None or math.isnan(float(v))\n    except (TypeError, ValueError):\n        return True\n\n\ndef court(v) -> str:\n    \"\"\"1 234 → « 1,2k », 3 400 000 → « 3,4 M » (format français).\"\"\"\n    if _nan(v):\n        return \"\"\n    v = float(v)\n    a = abs(v)\n    if a >= 1e6:\n        s = f\"{v / 1e6:.1f} M\"\n    elif a >= 1e4:\n        s = f\"{v / 1e3:.0f}k\"\n    elif a >= 1e3:\n        s = f\"{v / 1e3:.1f}k\"\n    else:\n        s = f\"{v:.0f}\" if v.is_integer() else f\"{v:.1f}\"\n    return s.replace(\".\", \",\")\n\n\ndef euros(v) -> str:\n    if _nan(v):\n        return \"0 €\"\n    v = float(v)\n    a = abs(v)\n    if a >= 1e6:\n        return f\"{v / 1e6:.1f} M€\".replace(\".\", \",\")\n    if a >= 1e3:\n        return f\"{v / 1e3:.0f} k€\"\n    return f\"{v:.0f} €\"\n\n\ndef entier(v) -> str:\n    return \"\" if _nan(v) else f\"{float(v):,.0f}\".replace(\",\", \" \")\n\n\ndef pourcent(v) -> str:\n    return \"\" if _nan(v) else f\"{float(v):.0f} %\"\n\n\ndef jours(v) -> str:\n    return \"\" if _nan(v) else f\"{float(v):+.0f} j\".replace(\"+0 j\", \"0 j\")\n\n\n# --------------------------------------------------------------------------\n# Briques communes\n# --------------------------------------------------------------------------\ndef _tip(lignes) -> str:\n    \"\"\"Attribut data-tip (une ligne par élément, vides ignorés).\"\"\"\n    texte = \"\\n\".join(str(l) for l in lignes if l not in (None, \"\"))\n    return f' data-tip=\"{escape(texte, quote=True)}\"'.replace(\"\\n\", \"&#10;\")\n\n\nMOTS_CAPITALES = {\"CEINTURE\", \"HOUSSE\", \"MOUSSE\", \"RIDEAUX\", \"ENSEMBLE\", \"TEXTILE\", \"TOUTES\", \"AUTRES\"}\n\n\ndef aff(x) -> str:\n    \"\"\"Libellé affiché : équipements écrits en capitales dans les fichiers (« HOUSSE ») → « Housse », partout pareil.\"\"\"\n    s = str(x)\n    return s.capitalize() if s in MOTS_CAPITALES else s\n\n\ndef _titre(t):\n    return f\"<h5>{escape(t)}<\/h5>\" if t else \"\"\n\n\ndef legende(items) -> str:\n    \"\"\"items : [(libellé, couleur, 'barre' | 'ligne' | 'repere' | 'trait')].\"\"\"\n    if not items:\n        return \"\"\n    cls = {\"ligne\": \"ln\", \"repere\": \"rp\", \"trait\": \"tr\"}\n    spans = \"\".join(f'<span><i class=\"{cls.get(k, \"\")}\" style=\"background:{c}\"><\/i>{escape(aff(n))}<\/span>' for n, c, k in items)\n    return f'<div class=\"s360-legend\">{spans}<\/div>'\n\n\ndef vide(message=\"Aucune donnée à afficher\") -> str:\n    return f'<div class=\"s360-chart\"><p class=\"s360-vide\">{escape(message)}<\/p><\/div>'\n\n\ndef _libelle(c, temporel):\n    if temporel:\n        return pd.Timestamp(c).strftime(\"%m/%y\")\n    return aff(c)\n\n\ndef _etiquettes_x(cats, temporel=False):\n    \"\"\"Étiquettes sous les colonnes : inclinées si longues ; mois : une sur k si nombreux.\"\"\"\n    n = len(cats)\n    if temporel:\n        pas = max(1, math.ceil(n / 14))\n        spans = \"\".join(f\"<span>{escape(c) if i % pas == 0 else ''}<\/span>\" for i, c in enumerate(cats))\n        # « mois » : une étiquette sur `pas` ; elle peut déborder sur les colonnes voisines (vides) au lieu d'être tronquée\n        return f'<div class=\"s360-xl mois\" style=\"grid-template-columns:repeat({n},minmax(0,1fr))\">{spans}<\/div>', False\n    long_ = max(len(c) for c in cats)\n    tourner = n > 4 and (n > 12 or long_ > 9)\n    if all(len(c) <= 5 for c in cats) and n <= 40 and not any(\" \" in c for c in cats):\n        tourner = n > 24  # étiquettes courtes (« 11/26 », « 2027 ») : droites tant qu'il y a la place\n    spans = \"\".join(f'<span title=\"{escape(c)}\">{escape(c)}<\/span>' for c in cats)\n    cls = \"s360-xl rot\" if tourner else \"s360-xl\"\n    return f'<div class=\"{cls}\" style=\"grid-template-columns:repeat({n},minmax(0,1fr))\">{spans}<\/div>', tourner\n\n\ndef _cote(i, n):\n    \"\"\"Classe d'alignement de l'infobulle : à gauche pour les premières colonnes, à droite pour les dernières.\"\"\"\n    if n >= 3 and i < n * 0.25:\n        return \" tl\"\n    if n >= 3 and i >= n * 0.75:\n        return \" tr\"\n    return \"\"\n\n\n# --------------------------------------------------------------------------\n# Barres verticales (groupées ou empilées) + courbe et repères optionnels\n# --------------------------------------------------------------------------\ndef barres(cats, series: dict, couleurs: dict | None = None, empile=False, ligne: dict | None = None,\n           couleur_ligne=COLORS[\"text\"], fmt=court, fmt_ligne=None, hauteur=250, titre=\"\", survol=None,\n           temporel=False, fenetre=None, repere: dict | None = None, legende_auto=True, etiquettes=True,\n           couleurs_barres=None) -> str:\n    \"\"\"Barres avec valeurs affichées.\n\n    `ligne` = {nom: valeurs} : courbe tracée sur sa propre échelle, dans une bande au-dessus des barres ;\n    `repere` = {nom: valeurs} : losanges sur l'échelle des barres (ex. stock minimum) ;\n    `temporel` : `cats` sont des débuts de mois (étiquettes MM/AA), `fenetre` = (début, fin) limite les mois ;\n    `survol` : texte en plus dans l'infobulle de chaque colonne ; `couleurs_barres` : une couleur par colonne\n    (série unique).\n    \"\"\"\n    cats = list(cats)\n    noms = list(series)\n    vals = {k: [0.0 if _nan(v) else float(v) for v in series[k]] for k in noms}\n    lig = {k: list(v) for k, v in (ligne or {}).items()}\n    rep = {k: list(v) for k, v in (repere or {}).items()}\n    survol = list(survol) if survol is not None else None\n    if temporel and fenetre:\n        a, b = pd.Timestamp(fenetre[0]), pd.Timestamp(fenetre[1])\n        garde = [a <= pd.Timestamp(c) <= b for c in cats]\n        cats = [c for c, g in zip(cats, garde) if g]\n        vals = {k: [x for x, g in zip(v, garde) if g] for k, v in vals.items()}\n        lig = {k: [x for x, g in zip(v, garde) if g] for k, v in lig.items()}\n        rep = {k: [x for x, g in zip(v, garde) if g] for k, v in rep.items()}\n        survol = [x for x, g in zip(survol, garde) if g] if survol else survol\n    n = len(cats)\n    if n == 0 or not noms:\n        return vide()\n    libelles = [_libelle(c, temporel) for c in cats]\n    couleurs = couleurs or {}\n    coul = {k: couleurs.get(k, PALETTE[j % len(PALETTE)]) for j, k in enumerate(noms)}\n    tot = [sum(vals[k][i] for k in noms) for i in range(n)]\n    rep_vals = [float(x) for v in rep.values() for x in v if not _nan(x)]\n    ymax = max([max(tot) if empile else max((max(v) for v in vals.values()), default=0)] + rep_vals) or 1.0\n    fmt_l = fmt_ligne or fmt\n\n    bande = 0.0\n    if lig:  # la courbe occupe une bande au-dessus des barres : les étiquettes ne se chevauchent pas\n        bande = (hauteur - HAUT) * 0.32\n    zone = hauteur - HAUT - bande\n    # Densité : beaucoup de colonnes (ex. 36 mois) → barres plus larges dans leur colonne, étiquettes plus petites,\n    # pas de valeur écrite dans les segments (elles restent dans l'infobulle) : rien n'est coupé.\n    barres_n = n * (1 if empile else len(noms))\n    dense, tres_dense = barres_n > 16, barres_n > 28\n    grp = (84 if dense else 62) if n > 3 else 40  # largeur du groupe de barres (% de la colonne)\n    montrer = etiquettes and barres_n <= 48\n\n    # Position verticale des points de la courbe (px depuis le haut)\n    pts_l = {}\n    for nom, valeurs in lig.items():\n        pts = [None if _nan(v) else float(v) for v in valeurs]\n        ok = [p for p in pts if p is not None]\n        if ok:\n            lo, hi = min(min(ok), 0), max(ok)\n            ech = (hi - lo) or 1\n            pts_l[nom] = (pts, [None if p is None else HAUT - 4 + (1 - (p - lo) / ech) * (bande - 16) for p in pts])\n\n    colonnes = []\n    for i in range(n):\n        infos = [libelles[i], survol[i] if survol else None]\n        infos += [f\"{k} : {fmt(vals[k][i])}\" for k in noms]\n        if empile and len(noms) > 1:\n            infos.append(f\"Total : {fmt(tot[i])}\")\n        infos += [f\"{k} : {fmt(v[i])}\" for k, v in rep.items() if not _nan(v[i])]\n        infos += [f\"{k} : {fmt_l(pts[i])}\" for k, (pts, _) in pts_l.items() if pts[i] is not None]\n        corps = []\n        if empile:\n            segs = []\n            plusieurs = sum(1 for k in noms if vals[k][i] > 0) > 1  # une seule part : le total suffit\n            for k in noms:\n                h = vals[k][i] / ymax * zone\n                if h <= 0:\n                    continue\n                txt = fmt(vals[k][i]) if montrer and plusieurs and h >= 17 and not dense else \"\"\n                segs.append(f'<i style=\"height:{h:.1f}px;background:{coul[k]}\">{txt}<\/i>')\n            haut_txt = fmt(tot[i]) if montrer and tot[i] else \"\"\n            corps.append(f'<div class=\"bw\"><b>{haut_txt}<\/b><div class=\"stk\">{\"\".join(segs)}<\/div><\/div>')\n        else:\n            for k in noms:\n                v = vals[k][i]\n                h = v / ymax * zone\n                c = couleurs_barres[i] if couleurs_barres is not None and len(noms) == 1 else coul[k]\n                corps.append(f'<div class=\"bw\"><b>{fmt(v) if montrer and v else \"\"}<\/b>'\n                             f'<i class=\"b\" style=\"height:{max(h, 0):.1f}px;background:{c}\"><\/i><\/div>')\n        extra = []\n        for k, v in rep.items():\n            if not _nan(v[i]):\n                extra.append(f'<i class=\"rp\" style=\"bottom:{float(v[i]) / ymax * zone:.1f}px\"><\/i>')\n        for j, (k, (pts, ys)) in enumerate(pts_l.items()):\n            if ys[i] is None:\n                continue\n            cl = couleur_ligne if j == 0 else PALETTE[(j + 3) % len(PALETTE)]\n            extra.append(f'<i class=\"pt\" style=\"top:{ys[i]:.1f}px;background:{cl}\"><\/i>')\n            if montrer:\n                extra.append(f'<span class=\"pl\" style=\"top:{ys[i] - 19:.1f}px;color:{cl}\">{fmt_l(pts[i])}<\/span>')\n        colonnes.append(f'<div class=\"col{_cote(i, n)}\"{_tip(infos)}>'\n                        f'<div class=\"grp\" style=\"width:{grp}%\">{\"\".join(corps)}<\/div>{\"\".join(extra)}<\/div>')\n\n    traces = []\n    for j, (k, (pts, ys)) in enumerate(pts_l.items()):\n        cl = couleur_ligne if j == 0 else PALETTE[(j + 3) % len(PALETTE)]\n        p = \" \".join(f\"{(i + .5) / n * 100:.3f},{y:.1f}\" for i, y in enumerate(ys) if y is not None)\n        traces.append(f'<polyline points=\"{p}\" fill=\"none\" stroke=\"{cl}\" stroke-width=\"2.5\" stroke-linejoin=\"round\" '\n                      f'vector-effect=\"non-scaling-stroke\"/>')\n    svg = (f'<svg class=\"ov\" viewBox=\"0 0 100 {hauteur}\" preserveAspectRatio=\"none\">{\"\".join(traces)}<\/svg>'\n           if traces else \"\")\n    xl, tourner = _etiquettes_x(libelles, temporel)\n    densite = \" tres-dense\" if tres_dense else \" dense\" if dense else \"\"\n    plot = (f'<div class=\"s360-plot{densite}\" style=\"height:{hauteur}px\"><div class=\"cols\" style=\"grid-template-columns:'\n            f'repeat({n},minmax(0,1fr))\">{\"\".join(colonnes)}<\/div>{svg}<\/div>{xl}')\n    if tourner:  # marge à gauche : la première étiquette inclinée n'est pas coupée\n        plot = f'<div class=\"s360-rotpad\">{plot}<\/div>'\n    leg = [(k, coul[k], \"barre\") for k in noms] if couleurs_barres is None else []\n    leg += [(k, COLORS[\"text\"], \"repere\") for k in rep]\n    leg += [(k, couleur_ligne if j == 0 else PALETTE[(j + 3) % len(PALETTE)], \"ligne\") for j, k in enumerate(pts_l)]\n    lg_html = legende(leg) if legende_auto and (len(noms) > 1 or rep or pts_l) else \"\"\n    return f'<div class=\"s360-chart\">{_titre(titre)}{plot}{lg_html}<\/div>'\n\n\ndef ecarts(cats, valeurs, infos=None, seuil=10, titre=\"\", hauteur=250, fmt=jours) -> str:\n    \"\"\"Barres positives / négatives autour de zéro (ex. écart promis − demandé, en jours).\n\n    Couleur : rouge au-delà de `seuil`, orange entre 1 et `seuil`, vert si ≤ 0.\n    `infos` : lignes de détail par barre (infobulle).\n    \"\"\"\n    cats = [str(c) for c in cats]\n    vals = [0.0 if _nan(v) else float(v) for v in valeurs]\n    n = len(cats)\n    if n == 0:\n        return vide()\n    hi, lo = max(max(vals), 0), min(min(vals), 0)\n    ech = (hi - lo) or 1\n    zone = hauteur - HAUT - (HAUT if lo < 0 else 2)  # marge basse seulement s'il y a des valeurs négatives\n    zero = HAUT + hi / ech * zone  # position de l'axe zéro (px depuis le haut)\n    montrer = n <= 40\n    colonnes = []\n    for i, v in enumerate(vals):\n        c = COLORS[\"ko\"] if v > seuil else COLORS[\"warn\"] if v > 0 else COLORS[\"ok\"]\n        h = abs(v) / ech * zone\n        top = zero - h if v > 0 else zero\n        txt = f'<span class=\"pv\" style=\"top:{(top - 18 if v > 0 else zero + h + 2):.1f}px\">{fmt(v)}<\/span>' if montrer else \"\"\n        detail = infos[i] if infos is not None else []\n        colonnes.append(f'<div class=\"col{_cote(i, n)}\"{_tip([cats[i], *detail, f\"Écart : {fmt(v)}\"])}>'\n                        f'<i class=\"bz\" style=\"top:{top:.1f}px;height:{max(h, 1.5):.1f}px;background:{c}\"><\/i>{txt}<\/div>')\n    axe = f'<div class=\"zero\" style=\"top:{zero:.1f}px\"><\/div>'\n    xl = \"\"\n    if n <= 30:\n        xl, tourner = _etiquettes_x(cats)\n    plot = (f'<div class=\"s360-plot nob\" style=\"height:{hauteur}px\">{axe}<div class=\"cols\" style=\"grid-template-columns:'\n            f'repeat({n},minmax(0,1fr))\">{\"\".join(colonnes)}<\/div><\/div>{xl}')\n    if xl and tourner:\n        plot = f'<div class=\"s360-rotpad\">{plot}<\/div>'\n    leg = legende([(f\"Plus de {seuil} j de retard\", COLORS[\"ko\"], \"barre\"), (f\"1 à {seuil} j\", COLORS[\"warn\"], \"barre\"),\n                   (\"À l'heure ou en avance\", COLORS[\"ok\"], \"barre\")])\n    return f'<div class=\"s360-chart\">{_titre(titre)}{plot}{leg}<\/div>'\n\n\ndef multiples(panneaux: dict, couleurs: dict | None = None, hauteur=140, fmt=court, titre=\"\") -> str:\n    \"\"\"Petits multiples : {titre: (catégories, valeurs)}, une mini-série de barres par panneau.\"\"\"\n    if not panneaux:\n        return vide()\n    couleurs = couleurs or {}\n    cartes = []\n    for i, (t, (cats, vals)) in enumerate(panneaux.items()):\n        c = couleurs.get(t, PALETTE[i % len(PALETTE)])\n        cartes.append(f'<div class=\"s360-mini\"><b>{escape(aff(t))}<\/b>'\n                      f'{barres(cats, {str(t): vals}, {str(t): c}, hauteur=hauteur, fmt=fmt, legende_auto=False)}<\/div>')\n    return f'<div class=\"s360-chart\">{_titre(titre)}<div class=\"s360-minis\">{\"\".join(cartes)}<\/div><\/div>'\n\n\n# --------------------------------------------------------------------------\n# Barres horizontales simples (classements)\n# --------------------------------------------------------------------------\ndef barres_h(lignes, couleur=COLORS[\"navy_2\"], fmt=court, titre=\"\", max_lignes=12, **_) -> str:\n    \"\"\"lignes : [(libellé, valeur)], [(libellé, valeur, texte affiché)] ou [(libellé, valeur, texte, couleur)].\"\"\"\n    lignes = list(lignes)[:max_lignes]\n    if not lignes:\n        return vide()\n    vmax = max((float(l[1]) for l in lignes if not _nan(l[1])), default=0) or 1\n    rows = []\n    for l in lignes:\n        nom, v = l[0], l[1]\n        txt = l[2] if len(l) > 2 and l[2] is not None else fmt(v)\n        c = l[3] if len(l) > 3 else couleur\n        pct = 0 if _nan(v) or not float(v) else max(float(v) / vmax * 100, 1.5)\n        rows.append(f'<div class=\"rw\"{_tip([nom, txt])}><span class=\"nm\">{escape(aff(nom))}<\/span>'\n                    f'<div class=\"bar\"><i style=\"width:{pct:.1f}%;--tone:{c}\"><\/i><\/div><b>{escape(str(txt))}<\/b><\/div>')\n    return f'<div class=\"s360-chart\">{_titre(titre)}<div class=\"s360-rows\">{\"\".join(rows)}<\/div><\/div>'\n\n\n# --------------------------------------------------------------------------\n# Barres 100 % (répartition par ligne)\n# --------------------------------------------------------------------------\ndef parts(tableau, couleurs: dict, titre=\"\", afficher=\"nombre\", **_) -> str:\n    \"\"\"`tableau` : DataFrame (lignes = catégories, colonnes = statuts) de comptages ou de valeurs.\"\"\"\n    if tableau is None or tableau.empty or float(tableau.to_numpy().sum()) == 0:\n        return vide()\n    rows = []\n    for idx, r in tableau.iterrows():\n        total = float(r.sum())\n        segs = []\n        for col, v in r.items():\n            v = float(v)\n            if v <= 0 or total <= 0:\n                continue\n            p = v / total * 100\n            txt = (f\"{p:.0f} %\" if afficher == \"pourcent\" else court(v)) if p >= 7 else \"\"\n            segs.append(f'<span style=\"width:{p:.2f}%;background:{couleurs.get(col, COLORS[\"gris\"])}\"'\n                        f'{_tip([f\"{idx} · {col}\", f\"{court(v)} ({p:.0f} %)\"])}>{txt}<\/span>')\n        rows.append(f'<div class=\"rw\"><span class=\"nm\" title=\"{escape(aff(idx))}\">{escape(aff(idx))}<\/span>'\n                    f'<div class=\"s360-stack\">{\"\".join(segs)}<\/div><\/div>')\n    leg = legende([(c, couleurs.get(c, COLORS[\"gris\"]), \"barre\") for c in tableau.columns])\n    return f'<div class=\"s360-chart\">{_titre(titre)}<div class=\"s360-share\">{\"\".join(rows)}<\/div>{leg}<\/div>'\n\n\n# --------------------------------------------------------------------------\n# Jauges horizontales : segments empilés + repère (objectif), même échelle pour toutes les lignes\n# --------------------------------------------------------------------------\ndef jauges(lignes, titre=\"\", legende_items=None, repere_nom=\"Objectif\", fmt=court, hauteur_max: str | None = None) -> str:\n    \"\"\"lignes : [(libellé, [(nom, valeur, couleur)], repère ou None, texte à droite[, lignes d'infobulle en plus])].\n\n    Les segments sont empilés de gauche à droite ; le repère est un trait vertical (ex. objectif d'avions).\n    `hauteur_max` : zone défilante (beaucoup de lignes).\n    \"\"\"\n    lignes = list(lignes)\n    if not lignes:\n        return vide()\n    vmax = max(max(sum(max(float(v), 0) for _, v, _ in l[1]), float(l[2]) if not _nan(l[2]) else 0) for l in lignes) or 1\n    rows = []\n    for nom, segs, rep, txt, *plus in lignes:\n        parts_ = []\n        tip = [nom]\n        for n, v, c in segs:\n            v = max(float(v), 0)\n            tip.append(f\"{n} : {fmt(v)}\")\n            if v <= 0:\n                continue\n            w = v / vmax * 100\n            parts_.append(f'<span style=\"width:{w:.2f}%;background:{c}\">{fmt(v) if w >= 6 else \"\"}<\/span>')\n        marque = \"\"\n        if not _nan(rep):\n            tip.append(f\"{repere_nom} : {fmt(rep)}\")\n            marque = f'<i class=\"rp\" style=\"left:{float(rep) / vmax * 100:.2f}%\"><\/i>'\n        tip += list(plus[0]) if plus else []\n        rows.append(f'<div class=\"rw\"{_tip(tip)}><span class=\"nm\" title=\"{escape(str(nom))}\">{escape(str(nom))}<\/span>'\n                    f'<div class=\"trk\">{\"\".join(parts_)}{marque}<\/div><b>{escape(str(txt))}<\/b><\/div>')\n    corps = f'<div class=\"s360-jauge\">{\"\".join(rows)}<\/div>'\n    if hauteur_max and len(rows) > 14:  # zone défilante seulement si nécessaire (elle coupe les infobulles à ses bords)\n        corps = f'<div class=\"s360-jauge-scroll\" style=\"max-height:{hauteur_max}\">{corps}<\/div>'\n    items = list(legende_items or [])\n    return f'<div class=\"s360-chart\">{_titre(titre)}{corps}{legende(items)}<\/div>'\n\n\n# --------------------------------------------------------------------------\n# Carte de chaleur\n# --------------------------------------------------------------------------\ndef chaleur(tableau, titre=\"\", couleur=(31, 78, 156), libelle=\"lignes\", hauteur_max: str | None = None, details=None) -> str:\n    \"\"\"Carte de chaleur HTML : lignes × colonnes, intensité proportionnelle à la valeur.\n\n    `hauteur_max` (ex. \"30rem\") : zone défilante dont la ligne d'en-tête (colonnes) reste figée en haut.\n    `details` : tableau de mêmes lignes / colonnes, texte ajouté à l'infobulle de chaque case (ex. éléments concernés).\n    \"\"\"\n    if tableau is None or tableau.empty:\n        return vide()\n    vmax = float(tableau.to_numpy().max()) or 1\n    r, g, b = couleur\n    tete = \"\".join(f\"<th>{escape(str(c))}<\/th>\" for c in tableau.columns)\n    lignes = []\n    for idx, row in tableau.iterrows():\n        cells = []\n        for col, v in row.items():\n            v = float(v)\n            a = 0 if v <= 0 else .15 + .85 * v / vmax\n            fg = \"#fff\" if a > .55 else COLORS[\"text\"]\n            plus = details.at[idx, col] if details is not None and idx in details.index and col in details.columns else \"\"\n            cells.append(f'<td style=\"background:rgba({r},{g},{b},{a:.2f});color:{fg}\"'\n                         f'{_tip([idx, f\"{col} : {entier(v)} {libelle}\", plus if isinstance(plus, str) else \"\"])}>'\n                         f'{court(v) if v else \"\"}<\/td>')\n        lignes.append(f'<tr><th class=\"f\" title=\"{escape(aff(idx))}\">{escape(aff(idx))}<\/th>{\"\".join(cells)}<\/tr>')\n    table = f'<table class=\"s360-heat\"><thead><tr><th><\/th>{tete}<\/tr><\/thead><tbody>{\"\".join(lignes)}<\/tbody><\/table>'\n    if hauteur_max:\n        table = f'<div class=\"s360-heat-scroll\" style=\"max-height:{hauteur_max}\">{table}<\/div>'\n    return f'<div class=\"s360-chart\">{_titre(titre)}{table}<\/div>'\n\n", "app/core/components.py": "\"\"\"Composants visuels réutilisables (charte Supply360, prototype v3).\n\nLes fonctions qui renvoient du HTML (`kpi_card`, `badge`…) sont pures ; celles qui\ndessinent (`header`, `section`, `kpi_grid`…) appellent Streamlit.\n\"\"\"\n\nfrom contextlib import contextmanager, nullcontext\nfrom datetime import date\nfrom html import escape\nimport json\nimport uuid\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom core import dossiers\nfrom core import io as sio\nfrom core.icones import ICONES, ic\nfrom core.charts import aff as charts_aff\nfrom core.style import ONGLETS, teinte\n\n# Tons : (couleur du trait / de l'icône, couleur du chiffre, fond teinté) — palette de core/style.py\nTONES = {\n    \"navy\": (\"#1F4E9C\", \"#002157\", \"#EAF0FA\"), \"info\": (\"#2B6CB0\", \"#2B6CB0\", \"#E9F1FA\"),\n    \"accent\": (\"#E4002B\", \"#C1002A\", \"#FDE8EC\"), \"ok\": (\"#1E8E5A\", \"#17784B\", \"#E6F4EC\"),\n    \"warn\": (\"#DBA100\", \"#A36F00\", \"#FDF6DD\"), \"orange\": (\"#E8590C\", \"#C2410C\", \"#FDF0E7\"),\n    \"ko\": (\"#A61B1B\", \"#A61B1B\", \"#FBECEC\"), \"muted\": (\"#8A94A6\", \"#5B6478\", \"#EEF1F5\"),\n    \"violet\": (\"#7B61C9\", \"#6247B3\", \"#F1EDFB\"), \"teal\": (\"#2A9D8F\", \"#1F7A6F\", \"#E5F4F2\"),\n}\nICONE_TON = {\"navy\": \"layers\", \"info\": \"info\", \"accent\": \"flag\", \"ok\": \"check-circle\", \"warn\": \"clock\", \"orange\": \"send\",\n             \"ko\": \"alert\", \"muted\": \"help\", \"violet\": \"pause\", \"teal\": \"package\"}\n# Emojis encore passés par les modules → icônes vectorielles\nEMOJIS = {\"📌\": \"flag\", \"🚨\": \"flag\", \"💤\": \"moon\", \"✅\": \"check-circle\", \"⚠️\": \"alert\", \"ℹ️\": \"info\", \"⛔\": \"x\", \"🔴\": \"alert\",\n          \"📦\": \"package\", \"🏭\": \"factory\", \"🐢\": \"clock\", \"🧮\": \"grid\", \"📥\": \"inbox\", \"✈️\": \"plane\", \"📅\": \"calendar\",\n          \"🛠️\": \"wrench\", \"🧵\": \"scissors\", \"🪑\": \"armchair\", \"🔔\": \"bell\", \"📈\": \"trend\", \"📊\": \"grid\"}\nCHANTIER_STATUTS = {\"Terminé\": \"muted\", \"En cours\": \"info\", \"À venir\": \"ok\"}\nJOURS = [\"lundi\", \"mardi\", \"mercredi\", \"jeudi\", \"vendredi\", \"samedi\", \"dimanche\"]\n\n\ndef _tone(tone: str) -> tuple[str, str, str]:\n    return TONES.get(tone, TONES[\"navy\"])\n\n\ndef _vars(tone: str) -> str:\n    c, t, f = _tone(tone)\n    return f\"--c:{c};--t:{t};--f:{f}\"\n\n\ndef _icone(icone: str) -> str:\n    \"\"\"SVG d'une icône (nom du jeu core/icones, ou emoji connu) ; à défaut, le texte tel quel.\"\"\"\n    nom = EMOJIS.get(icone, ic
