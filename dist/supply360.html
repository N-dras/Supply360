r cle, _, _ in blocs}\n    actifs = [(cle, obj, {c: q for c, q in besoins.items() if q > 0}) for cle, obj, besoins in blocs if obj > 0 and besoins]\n    while True:\n        possibles = [(fait[cle] / obj, -obj, i) for i, (cle, obj, besoins) in enumerate(actifs)\n                     if fait[cle] < obj and all(reste.get(c, 0) >= q for c, q in besoins.items())]\n        if not possibles:\n            return fait, reste\n        cle, _, besoins = actifs[min(possibles)[2]]\n        for c, q in besoins.items():\n            reste[c] -= q\n        fait[cle] += 1\n\n\ndef repartir(blocs: list[tuple], dispo: dict) -> dict:\n    \"\"\"Avions complets par bloc, le stock d'un CCN commun étant partagé entre les blocs.\n\n    `blocs` : [(clé, objectif, {CCN: qté par avion})] ; `dispo` : {CCN: quantité}. Un avion n'est équipé que si\n    tous les CCN du bloc sont disponibles. À chaque tour, l'avion suivant va au bloc le moins avancé\n    (avions équipés / objectif) : la répartition reste équilibrée entre types d'avion.\n    \"\"\"\n    return repartir_detail(blocs, dispo)[0]\n\n\ndef _attribuer(d: pd.DataFrame, fait: dict, reste: dict) -> pd.Series:\n    \"\"\"Quantité d'un CCN attribuée à chaque bloc (type × classe) : ce qu'ont consommé ses avions complets, plus une\n    part du reste du CCN au prorata de ce qu'il manque encore à chaque bloc. Un CCN propre à un bloc lui revient en\n    entier. Ainsi le détail par CCN concorde avec les avions complets du bloc.\"\"\"\n    cle = list(zip(d[\"Type avion\"], d[\"Classe\"]))\n    fait_l = np.array([fait.get(k, 0) for k in cle], dtype=float)\n    q = d[\"Qté par avion\"].to_numpy(float)\n    consomme = fait_l * q\n    a_venir = np.maximum(d[\"Objectif\"].to_numpy(float) - fait_l, 0) * q\n    total_a_venir = pd.Series(a_venir, index=d.index).groupby(d[\"CCN\"]).transform(\"sum\").to_numpy()\n    nb = d.groupby(\"CCN\")[\"CCN\"].transform(\"size\").to_numpy()\n    part = np.where(total_a_venir > 0, a_venir / np.where(total_a_venir > 0, total_a_venir, 1), 1 / nb)\n    return pd.Series(consomme + np.array([reste.get(c, 0.0) for c in d[\"CCN\"]]) * part, index=d.index)\n\n\ndef avions_faisables(b: pd.DataFrame, m: pd.DataFrame) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"(blocs, détail) — blocs : une ligne par type d'avion × classe ; détail : une ligne par bloc × CCN.\n\n    Objectif = avions restant à traiter. Complets maintenant = répartition du stock ; complets à réception =\n    répartition du stock + commandes, moins les complets maintenant ; le reste est à coter (seuls des CCN sans prix\n    manquent) ou à approvisionner. Détail : avions couvrables par chaque CCN avec la quantité attribuée au bloc\n    (un CCN commun à plusieurs blocs est partagé selon la répartition des avions complets, voir _attribuer).\n    \"\"\"\n    d = b.groupby([\"Type avion\", \"Classe\", \"CCN\"], sort=False).agg(**{\n        \"Flotte\": (\"Flotte\", \"first\"), \"Qté par avion\": (\"Qté par avion\", \"first\"), \"Objectif\": (\"Avions restants\", \"max\"),\n        \"Besoin\": (\"Besoin\", \"sum\"), \"PN\": (\"PN\", _joindre), \"Désignation\": (\"Désignation\", \"first\")}).reset_index()\n    info = m.set_index(\"CCN\")\n    d[\"Stock CCN\"] = d[\"CCN\"].map(info[\"Stock\"]).fillna(0)\n    d[\"Couverture CCN\"] = d[\"CCN\"].map(info[\"Couverture\"]).fillna(0)\n    d[\"PU (€)\"] = d[\"CCN\"].map(info[\"PU (€)\"]).fillna(0)\n    d[\"À coter\"] = d[\"CCN\"].map(info[\"À coter\"]).fillna(False).astype(bool)\n    d[\"Types partageant le CCN\"] = d[\"CCN\"].map(info[\"Nb types\"]).fillna(1).astype(int)\n    d[\"Besoin total CCN\"] = d[\"CCN\"].map(info[\"Besoin\"]).fillna(d[\"Besoin\"])\n    d[\"Manque (unités)\"] = d[\"CCN\"].map(info[\"À demander (PR)\"]).fillna(0).astype(int)\n    d[\"CCN couvert\"] = d[\"CCN\"].map(info[\"Écart\"]).fillna(1) <= 0  # stock + commandes ≥ besoin du CCN, tous types confondus\n\n    blocs = d.groupby([\"Type avion\", \"Classe\"], sort=False).agg(**{\n        \"Flotte\": (\"Flotte\", \"first\"), \"Objectif\": (\"Objectif\", \"max\"), \"Nb CCN\": (\"CCN\", \"nunique\")}).reset_index()\n    cles = list(zip(blocs[\"Type avion\"], blocs[\"Classe\"]))\n    besoins = {k: dict(zip(g[\"CCN\"], g[\"Qté par avion\"])) for k, g in d.groupby([\"Type avion\", \"Classe\"], sort=False)}\n    entree = [(k, int(o), besoins.get(k, {})) for k, o in zip(cles, blocs[\"Objectif\"])]\n    maintenant, reste_stock = repartir_detail(entree, info[\"Stock\"].to_dict())\n    avec_cde, reste_couv = repartir_detail(entree, info[\"Couverture\"].to_dict())\n\n    # Détail par CCN : quantité attribuée au bloc, avions couverts, et avions de l'objectif par origine.\n    d[\"Stock\"] = _attribuer(d, maintenant, reste_stock).where(d[\"CCN\"].isin(info.index), 0)\n    d[\"Couverture\"] = _attribuer(d, avec_cde, reste_couv).where(d[\"CCN\"].isin(info.index), 0)\n    q = d[\"Qté par avion\"].where(d[\"Qté par avion\"] > 0)\n    d[\"Avions (stock)\"] = np.floor(d[\"Stock\"] / q + 1e-9).fillna(0).astype(int)\n    d[\"Avions (stock + commandes)\"] = np.maximum(np.floor(d[\"Couverture\"] / q + 1e-9).fillna(0).astype(int), d[\"Avions (stock)\"])\n    obj = d[\"Objectif\"]\n    d[SEGMENTS_CCN[0]] = np.minimum(d[\"Avions (stock)\"], obj)\n    d[SEGMENTS_CCN[1]] = np.minimum(d[\"Avions (stock + commandes)\"], obj) - d[SEGMENTS_CCN[0]]\n    d[SEGMENTS_CCN[2]] = obj - d[SEGMENTS_CCN[0]] - d[SEGMENTS_CCN[1]]\n    d[SEGMENTS_CCN[3]] = (d[\"Avions (stock + commandes)\"] - obj).clip(lower=0)\n    d[\"Statut CCN\"] = np.select([d[\"Avions (stock)\"] >= obj, d[\"Avions (stock + commandes)\"] >= obj, d[\"À coter\"]],\n                                STATUTS_CCN[:3], STATUTS_CCN[3])\n\n    blocs[\"Complets maintenant\"] = [maintenant[k] for k in cles]\n    blocs[\"Complets à réception\"] = [max(avec_cde[k] - maintenant[k], 0) for k in cles]\n    manque = blocs[\"Objectif\"] - blocs[\"Complets maintenant\"] - blocs[\"Complets à réception\"]\n    # Manque dû uniquement à des CCN sans prix (à faire coter avant de commander) : orange ; sinon à approvisionner : rouge.\n    limitants = d[d[\"Avions (stock + commandes)\"] < d[\"Objectif\"]].groupby([\"Type avion\", \"Classe\"])[\"À coter\"].all()\n    que_coter = np.array([bool(limitants.get(k, False)) for k in cles])\n    blocs[\"À coter\"] = np.where(que_coter, manque, 0)\n    blocs[\"À approvisionner\"] = np.where(que_coter, 0, manque)\n    blocs[\"Taux (%)\"] = np.where(blocs[\"Objectif\"] > 0, (blocs[\"Complets maintenant\"] / blocs[\"Objectif\"] * 100).round(0), np.nan)\n    pire = d.sort_values([\"Avions (stock + commandes)\", \"Avions (stock)\"]).drop_duplicates([\"Type avion\", \"Classe\"]) \\\n        .set_index([\"Type avion\", \"Classe\"])\n    blocs[\"CCN limitant\"] = [pire[\"CCN\"].get(k) for k in cles]\n    par_bloc = d.assign(commun=d[\"Types partageant le CCN\"] > 1).groupby([\"Type avion\", \"Classe\"], sort=False).agg(\n        couverts=(\"CCN couvert\", \"sum\"), a_coter=(\"À coter\", \"sum\"), communs=(\"commun\", \"sum\"))\n    blocs[\"CCN communs\"] = [int(par_bloc[\"communs\"].get(k, 0)) for k in cles]\n    blocs[\"CCN couverts\"] = [int(par_bloc[\"couverts\"].get(k, 0)) for k in cles]\n    blocs[\"Tout commandé\"] = blocs[\"CCN couverts\"] == blocs[\"Nb CCN\"]\n    blocs[\"PN à coter\"] = [int(par_bloc[\"a_coter\"].get(k, 0)) for k in cles]\n    return blocs, d\n\n\ndef avions_distincts(blocs: pd.DataFrame) -> int:\n    \"\"\"Nombre d'avions de l'objectif (et non de classes) : par type d'avion, la classe qui en compte le plus.\n\n    L'objectif est suivi par classe (un avion à traiter en J, W et Y compte 3 fois) ; ce total donne l'ordre de\n    grandeur en avions. Exemple : 18 AFR01 en J, 18 en W, 17 en Y → 53 classes, 18 avions.\"\"\"\n    return int(blocs.groupby(\"Type avion\")[\"Objectif\"].max().sum()) if len(blocs) else 0\n\n\ndef date_debut_annee(date_ref: date) -> date:\n    return date(date_ref.year, 1, 1)\n\n\ndef nom_bloc(type_avion: str, classe: str) -> str:\n    return f\"{type_avion} · {classe}\"\n", "app/core/prevision.py": "\"\"\"Prévision de commandes textile, pilotée par la politique d'entretien (PE) et les groupes d'avions.\n\nLogique reprise de textile_policy.py (dashboard Textile d'origine), sans la partie graphique :\n  1. chaque groupe d'avions (ex. « A320 Group 1 ») a une quantité de pièces par avion pour chaque PN ;\n  2. on veut toujours avoir en stock de quoi équiper N avions d'avance (buffer = ratio de la taille du groupe) ;\n  3. les PE planifiées (immatriculation + date) consomment du stock ; on commande, en tenant compte du délai\n     fournisseur, pour que le stock reste au-dessus du besoin (buffer + PE à venir).\nAjout : `par_fournisseur` regroupe la prévision par fournisseur (nom, ou à défaut code fournisseur).\n\"\"\"\n\nimport io\nimport re\nfrom dataclasses import dataclass\n\nimport numpy as np\nimport pandas as pd\n\nfrom core import io as sio\nfrom core import textile as tx\n\nMAX_LT = 24\nRAW_COLS = [\"equipment\", \"aircraft_type\", \"group\", \"registration\", \"area\", \"ccn\", \"pn\", \"description\", \"qty_per_ac\"]\nSTATUS_ORDER = [\"A commander\", \"A planifier\", \"OK\", \"Dormant / inactif : pas de commande\", \"Hors groupe avion\"]\nSTATUS_COLORS = {\"A commander\": \"#C62828\", \"A planifier\": \"#E8A317\", \"OK\": \"#1E8E5A\",\n                 \"Dormant / inactif : pas de commande\": \"#6D28D9\", \"Hors groupe avion\": \"#9AA5B1\"}\nGROUP_STATUS_ORDER = [\"Sous l'objectif\", \"Couvert si commandes livrées\", \"Objectif atteint\"]\n# Même code couleur que partout : vert = stock, bleu = à réception des commandes, rouge = à commander.\nGROUP_STATUS_COLORS = {\"Sous l'objectif\": \"#C62828\", \"Couvert si commandes livrées\": \"#1F4E9C\", \"Objectif atteint\": \"#1E8E5A\"}\nCLASS_ORDER = [\"J\", \"W\", \"Y\"]\nDEFAULT_PE = {\n    \"HOUSSE\": {(\"J\", \"Assise\"): 3, (\"J\", \"Dossier\"): 6, (\"W\", \"Assise\"): 3, (\"W\", \"Dossier\"): 0, (\"Y\", \"Assise\"): 3, (\"Y\", \"Dossier\"): 0},\n    \"MOUSSE\": {(c, p): 3 for c in CLASS_ORDER for p in (\"Assise\", \"Dossier\")},\n}\nFICHIER_PIECES = \"Pièces par avion\"\nFICHIER_PLANNING = \"Planning PE\"\n\n\n@dataclass(frozen=True)\nclass Params:\n    buffer_ratio: float = 0.10\n    buffer_min: int = 1\n    buffer_on_never: bool = True\n    horizon_months: int = 36\n    lt_default: int = 60\n    lt_basis: str = \"observe\"\n    bfe_delay_months: int = 6\n    assise_kw: str = \"bott, btm, seat, cushion, ottoman, legrest, calfrest, footrest, base\"\n    dossier_kw: str = \"back, headrest, head, neck\"\n    default_component: str = \"Assise\"\n\n\ndef _norm_str(v):\n    return \"\" if v is None or (not isinstance(v, str) and pd.isna(v)) else str(v).strip()\n\n\ndef _norm_pn(v):\n    return \"\" if v is None or (not isinstance(v, str) and pd.isna(v)) else re.sub(r\"\\s+\", \"\", str(v)).upper()\n\n\n# --------------------------------------------------------------------------\n# Lecture des fichiers « Pièces par avion » et « Planning PE »\n# --------------------------------------------------------------------------\ndef lire_pieces(data: bytes, nom: str) -> pd.DataFrame:\n    \"\"\"CSV ou Excel avec les colonnes equipment, aircraft_type, group, registration, area, ccn, pn, description, qty_per_ac.\"\"\"\n    if nom.lower().endswith(\".csv\"):\n        df = pd.read_csv(io.BytesIO(data), sep=None, engine=\"python\")\n        if set(RAW_COLS) <= set(df.columns):\n            return df\n    else:\n        xl = sio.ouvrir_excel(data, FICHIER_PIECES)\n        for feuille in sorted(xl.sheet_names, key=lambda n: 0 if \"registration\" in n.lower() else 1):\n            df = xl.parse(feuille)\n            if set(RAW_COLS) <= set(df.columns):\n                return df\n    raise sio.FichierIllisible(f\"Fichier {FICHIER_PIECES} : aucune feuille avec les colonnes {', '.join(RAW_COLS)}.\")\n\n\ndef lire_planning(data: bytes, nom: str) -> pd.DataFrame:\n    bio = io.BytesIO(data)\n    df = pd.read_csv(bio, sep=None, engine=\"python\") if nom.lower().endswith(\".csv\") else \\\n        sio.ouvrir_excel(data, FICHIER_PLANNING).parse(0)\n    cols = {sio.normaliser(c).replace(\"_\", \"\"): c for c in df.columns}\n\n    def pick(*alias):\n        for a in alias:\n            k = sio.normaliser(a).replace(\"_\", \"\")\n            if k in cols:\n                return cols[k]\n        return None\n    reg, dte = pick(\"Immatriculation\", \"registration\"), pick(\"Date prochaine PE\", \"date PE\", \"prochaine PE\", \"date\")\n    if not reg or not dte:\n        raise sio.ColonneIntrouvable(\"Immatriculation / Date prochaine PE\", FICHIER_PLANNING)\n    eq, cl, comp, cyc = pick(\"Equipement\", \"equipment\"), pick(\"Classe\", \"area\", \"class\"), pick(\"Composant\", \"component\"), pick(\"Cycle PE (ans)\", \"cycle\")\n    out = pd.DataFrame({\n        \"registration\": df[reg].map(_norm_str).str.upper(),\n        \"date\": pd.to_datetime(df[dte], errors=\"coerce\", dayfirst=True),\n        \"pl_equipment\": df[eq].map(_norm_str).str.upper() if eq else \"\",\n        \"pl_area\": df[cl].map(_norm_str) if cl else \"\",\n        \"pl_comp\": df[comp].map(_norm_str).str.capitalize() if comp else \"\",\n        \"pl_cycle\": pd.to_numeric(df[cyc], errors=\"coerce\").fillna(0) if cyc else 0.0,\n    })\n    return out.dropna(subset=[\"date\"]).query(\"registration != ''\").reset_index(drop=True)\n\n\n# --------------------------------------------------------------------------\n# Pièces par avion / groupe\n# --------------------------------------------------------------------------\ndef _group_num(g):\n    m = re.search(r\"(\\d+)\\s*$\", str(g))\n    return int(m.group(1)) if m else 0\n\n\ndef preparer_pieces(raw: pd.DataFrame, p: Params):\n    \"\"\"Nettoie les lignes (par immatriculation), classe Assise/Dossier. Retourne (pièces, flotte par groupe, lignes sans PN).\"\"\"\n    manquantes = [c for c in RAW_COLS if c not in raw.columns]\n    if manquantes:\n        raise sio.ColonneIntrouvable(\", \".join(manquantes), FICHIER_PIECES)\n    d = raw[RAW_COLS].copy()\n    for c in [\"equipment\", \"aircraft_type\", \"group\", \"registration\", \"area\", \"ccn\", \"description\"]:\n        d[c] = d[c].map(_norm_str)\n    d[\"equipment\"] = d[\"equipment\"].str.upper()\n    d[\"registration\"] = d[\"registration\"].str.upper()\n    d[\"pn\"] = d[\"pn\"].map(_norm_pn)\n    d[\"area\"] = d[\"area\"].replace(\"\", \"NA\")\n    d[\"qty_per_ac\"] = pd.to_numeric(d[\"qty_per_ac\"], errors=\"coerce\").fillna(0)\n    fleet = d.groupby([\"equipment\", \"aircraft_type\", \"group\"])[\"registration\"].nunique().rename(\"Avions du groupe\").reset_index()\n    no_pn = d[d[\"pn\"] == \"\"].reset_index(drop=True)\n    d = d[d[\"pn\"] != \"\"].copy()\n    kw = lambda t: \"|\".join(re.escape(k.strip().lower()) for k in t.split(\",\") if k.strip())  # noqa: E731\n    desc = d[\"description\"].str.lower()\n    k_dos, k_ass = kw(p.dossier_kw), kw(p.assise_kw)\n    is_dos = desc.str.contains(k_dos, regex=True) if k_dos else pd.Series(False, index=d.index)\n    is_ass = desc.str.contains(k_ass, regex=True) if k_ass else pd.Series(False, index=d.index)\n    seat = d[\"equipment\"].isin([\"HOUSSE\", \"MOUSSE\"])\n    d[\"Composant\"] = np.where(~seat, \"Ensemble\", np.where(is_dos, \"Dossier\", np.where(is_ass, \"Assise\", p.default_component)))\n    return d.reset_index(drop=True), fleet, no_pn\n\n\ndef registration_parts(parts):\n    \"\"\"Quantité par immatriculation (un avion présent dans deux groupes n'est compté qu'une fois).\"\"\"\n    base = parts.drop_duplicates([\"equipment\", \"registration\", \"area\", \"ccn\", \"pn\", \"description\", \"qty_per_ac\"])\n    return base.groupby([\"equipment\", \"aircraft_type\", \"registration\", \"area\", \"Composant\", \"pn\"], as_index=False)[\"qty_per_ac\"].sum()\n\n\ndef group_pn_table(parts):\n    \"\"\"1 ligne par groupe x classe x composant x PN : quantité par avion.\"\"\"\n    base = parts.drop_duplicates([\"equipment\", \"group\", \"registration\", \"area\", \"ccn\", \"pn\", \"description\", \"qty_per_ac\"])\n    per_reg = base.groupby([\"equipment\", \"aircraft_type\", \"group\", \"registration\", \"area\", \"Composant\", \"pn\"], as_index=False)[\"qty_per_ac\"].sum()\n    g = per_reg.groupby([\"equipment\", \"aircraft_type\", \"group\", \"area\", \"Composant\", \"pn\"]).agg(\n        qty_per_ac=(\"qty_per_ac\", \"median\"), avions_avec_pn=(\"registration\", \"nunique\")).reset_index()\n    g[\"qty_per_ac\"] = np.ceil(g[\"qty_per_ac\"])\n    return g\n\n\ndef cle_regle(equipement, classe, composant) -> str:\n    \"\"\"Identifiant ASCII d'une règle PE (clé de widget).\"\"\"\n    return re.sub(r\"[^A-Za-z0-9]+\", \"_\", f\"{equipement}_{classe}_{composant}\").strip(\"_\").lower()\n\n\ndef regles_pe_defaut(parts) -> pd.DataFrame:\n    keys = parts[[\"equipment\", \"area\", \"Composant\"]].drop_duplicates()\n    df = pd.DataFrame({\n        \"Equipement\": keys[\"equipment\"].to_numpy(), \"Classe\": keys[\"area\"].to_numpy(), \"Composant\": keys[\"Composant\"].to_numpy(),\n        \"Cycle PE (ans)\": [float(DEFAULT_PE.get(e, {}).get((a, c), 0)) for e, a, c in keys.itertuples(index=False)],\n    })\n    eq_rank = {e: i for i, e in enumerate(tx.CATEGORY_ORDER)}\n    cl_rank = {c: i for i, c in enumerate(CLASS_ORDER)}\n    df[\"_a\"], df[\"_b\"] = df[\"Equipement\"].map(lambda x: eq_rank.get(x, 9)), df[\"Classe\"].map(lambda x: cl_rank.get(x, 9))\n    return df.sort_values([\"_a\", \"_b\", \"Classe\", \"Composant\"]).drop(columns=[\"_a\", \"_b\"]).reset_index(drop=True)\n\n\n# --------------------------------------------------------------------------\n# Délai fournisseur (repris de build_pbi_tables)\n# --------------------------------------------------------------------------\ndef ajouter_delais(pbi: pd.DataFrame, orders: pd.DataFrame, p: Params) -> pd.DataFrame:\n    \"\"\"« Délai fournisseur (j) » par fournisseur principal : délais promis ou LT observé (selon `lt_basis`).\"\"\"\n    pbi = pbi.drop(columns=[c for c in [\"Délai fournisseur (j)\", \"Nb délais fournisseur\"] if c in pbi.columns])\n    sup_lt = tx.delais_fournisseurs(orders).rename(columns={\"Délai moyen promis (j)\": \"Délai fournisseur (j)\",\n                                                             \"Lignes avec délai\": \"Nb délais fournisseur\"})\n    if p.lt_basis == \"observe\" and \"LT observé moyen sur 2 ans\" in pbi.columns:\n        obs = pbi[pbi[\"Fournisseur principal\"].notna() & (pd.to_numeric(pbi[\"LT observé moyen sur 2 ans\"], errors=\"coerce\") > 0)]\n        sup_lt = obs.groupby(\"Fournisseur principal\")[\"LT observé moyen sur 2 ans\"].agg([\"mean\", \"count\"]).reset_index()\n        sup_lt.columns = [\"Fournisseur\", \"Délai fournisseur (j)\", \"Nb délais fournisseur\"]\n        sup_lt = sup_lt[sup_lt[\"Nb délais fournisseur\"] >= 3]\n    return pbi.merge(sup_lt[[\"Fournisseur\", \"Délai fournisseur (j)\", \"Nb délais fournisseur\"]]\n                     .rename(columns={\"Fournisseur\": \"Fournisseur principal\"}), on=\"Fournisseur principal\", how=\"left\")\n\n\n# --------------------------------------------------------------------------\n# Besoin par groupe et PN\n# --------------------------------------------------------------------------\ndef build_requirements(gp, fleet, rules, pbi, p):\n    \"\"\"Besoin minimum (buffer) par groupe x PN et répartition du stock entre les groupes qui utilisent le PN.\"\"\"\n    g = gp.merge(fleet, on=[\"equipment\", \"aircraft_type\", \"group\"], how=\"left\")\n    g = g.merge(rules.rename(columns={\"Equipement\": \"equipment\", \"Classe\": \"area\"}), on=[\"equipment\", \"area\", \"Composant\"], how=\"left\")\n    g[\"Cycle PE (ans)\"] = g[\"Cycle PE (ans)\"].fillna(0)\n    g[\"Objectif avions d'avance\"] = np.minimum(np.maximum(p.buffer_min, np.ceil(p.buffer_ratio * g[\"Avions du groupe\"] - 1e-9)), g[\"Avions du groupe\"])\n    applies = (g[\"Cycle PE (ans)\"] > 0) | p.buffer_on_never\n    g[\"Besoin minimum (qté)\"] = np.where(applies, g[\"qty_per_ac\"] * g[\"Objectif avions d'avance\"], 0.0)\n    g[\"_w\"] = g[\"qty_per_ac\"] * g[\"Objectif avions d'avance\"]\n    st = pbi[[\"PNR\", \"QTE SUR ÉTAGÈRE\", \"QTE EN CDE\"]].rename(columns={\"PNR\": \"pn\"})\n    g = g.merge(st, on=\"pn\", how=\"left\")\n    wsum = g.groupby(\"pn\")[\"_w\"].transform(\"sum\").replace(0, np.nan)\n    share = (g[\"_w\"] / wsum).fillna(0)\n    g[\"Stock alloué\"] = g[\"QTE SUR ÉTAGÈRE\"].fillna(0) * share\n    g[\"Commandes allouées\"] = g[\"QTE EN CDE\"].fillna(0) * share\n    q = g[\"qty_per_ac\"].replace(0, np.nan)\n    g[\"Avions équipables (stock)\"] = (g[\"Stock alloué\"] / q).fillna(0)\n    g[\"Avions équipables (stock + commandes)\"] = ((g[\"Stock alloué\"] + g[\"Commandes allouées\"]) / q).fillna(0)\n    g[\"Manque (stock + commandes)\"] = np.maximum(0, g[\"Besoin minimum (qté)\"] - g[\"Stock alloué\"] - g[\"Commandes allouées\"])\n    return g.drop(columns=[\"_w\", \"QTE SUR ÉTAGÈRE\", \"QTE EN CDE\"])\n\n\ndef group_summary(g):\n    \"\"\"1 ligne par groupe x classe x composant : combien d'avions le stock peut équiper, face à l'objectif.\"\"\"\n    key = [\"equipment\", \"aircraft_type\", \"group\", \"area\", \"Composant\"]\n    g = g[g[\"qty_per_ac\"] > 0].sort_values(\"Avions équipables (stock + commandes)\")\n    if g.empty:\n        return pd.DataFrame(columns=key + [\"Statut groupe\"])\n    first = g.groupby(key).first()\n    agg = g.groupby(key).agg(\n        **{\"Avions du groupe\": (\"Avions du groupe\", \"first\"), \"Objectif avions d'avance\": (\"Objectif avions d'avance\", \"first\"),\n           \"Cycle PE (ans)\": (\"Cycle PE (ans)\", \"first\"), \"Nb PN\": (\"pn\", \"nunique\"),\n           \"Avions équipables (stock)\": (\"Avions équipables (stock)\", \"min\"),\n           \"Avions équipables (stock + commandes)\": (\"Avions équipables (stock + commandes)\", \"min\"),\n           \"Manque (qté)\": (\"Manque (stock + commandes)\", \"sum\")})\n    agg[\"PN goulot\"] = first[\"pn\"]\n    sous = g[g[\"Avions équipables (stock + commandes)\"] < g[\"Objectif avions d'avance\"] - 1e-9]\n    agg[\"PN sous l'objectif\"] = sous.groupby(key).size().reindex(agg.index).fillna(0).astype(int)\n    agg[\"Avions équipables (stock)\"] = np.floor(agg[\"Avions équipables (stock)\"] + 1e-9)\n    agg[\"Avions équipables (stock + commandes)\"] = np.floor(agg[\"Avions équipables (stock + commandes)\"] + 1e-9)\n    obj = agg[\"Objectif avions d'avance\"]\n    agg[\"Ecart vs objectif (avions)\"] = agg[\"Avions équipables (stock + commandes)\"] - obj\n    agg[\"Statut groupe\"] = np.select([agg[\"Avions équipables (stock + commandes)\"] < obj, agg[\"Avions équipables (stock)\"] < obj],\n                                     [\"Sous l'objectif\", \"Couvert si commandes livrées\"], default=\"Objectif atteint\")\n    return agg.reset_index()\n\n\ndef pn_requirement(g):\n    a = g.groupby(\"pn\").agg(**{\"Nb groupes avions\": (\"group\", \"nunique\"), \"Avions concernés\": (\"Avions du groupe\", \"sum\"),\n                               \"Besoin minimum (qté)\": (\"Besoin minimum (qté)\", \"sum\")}).reset_index().rename(columns={\"pn\": \"PNR\"})\n    eq = g.groupby(\"pn\").agg(**{\"Avions équipables (stock)\": (\"Avions équipables (stock)\", \"sum\"),\n                                \"Avions équipables (stock + commandes)\": (\"Avions équipables (stock + commandes)\", \"sum\")}).reset_index().rename(columns={\"pn\": \"PNR\"})\n    eq[\"Avions équipables (stock)\"] = np.floor(eq[\"Avions équipables (stock)\"] + 1e-9)\n    eq[\"Avions équipables (stock + commandes)\"] = np.floor(eq[\"Avions équipables (stock + commandes)\"] + 1e-9)\n    return a.merge(eq, on=\"PNR\", how=\"left\")\n\n\n# --------------------------------------------------------------------------\n# Planning PE\n# --------------------------------------------------------------------------\ndef month_index(dates, today):\n    t = pd.Timestamp(today)\n    return ((dates.dt.year - t.year) * 12 + (dates.dt.month - t.month)).astype(int)\n\n\ndef expand_events(planning, reg_parts, rules, today, horizon):\n    \"\"\"Occurrences de PE (cycle répété) par PN : registration x composant x mois.\"\"\"\n    cols = [\"registration\", \"aircraft_type\", \"equipment\", \"area\", \"Composant\", \"pn\", \"qty\", \"idx\", \"overdue\"]\n    if planning is None or planning.empty:\n        return pd.DataFrame(columns=cols)\n    m = planning.merge(reg_parts.rename(columns={\"qty_per_ac\": \"qty\"}), on=\"registration\", how=\"inner\")\n    for a, b in [(\"pl_equipment\", \"equipment\"), (\"pl_area\", \"area\"), (\"pl_comp\", \"Composant\")]:\n        m = m[(m[a] == \"\") | (m[a] == m[b])]\n    m = m.merge(rules.rename(columns={\"Equipement\": \"equipment\", \"Classe\": \"area\"}), on=[\"equipment\", \"area\", \"Composant\"], how=\"left\")\n    m[\"cycle\"] = np.where(m[\"pl_cycle\"] > 0, m[\"pl_cycle\"], m[\"Cycle PE (ans)\"].fillna(0))\n    m[\"idx0\"] = month_index(m[\"date\"], today)\n    T = horizon + MAX_LT\n    step = np.round(m[\"cycle\"] * 12).astype(int)\n    out = []\n    for k in range(0, 12):\n        idx = m[\"idx0\"] + step * k\n        keep = (idx <= T - 1) & ((k == 0) | (step > 0)) & ((idx >= 0) | (k == 0))\n        if not keep.any():\n            continue\n        e = m[keep].copy()\n        e[\"idx\"] = idx[keep].clip(lower=0)\n        e[\"overdue\"] = (idx[keep] < 0)\n        out.append(e[cols])\n    return pd.concat(out, ignore_index=True) if out else pd.DataFrame(columns=cols)\n\n\n# --------------------------------------------------------------------------\n# Délais et livraisons\n# --------------------------------------------------------------------------\ndef lead_time_months(pbi, p):\n    sup = pd.to_numeric(pbi.get(\"Délai fournisseur (j)\"), errors=\"coerce\")\n    obs = pd.to_numeric(pbi.get(\"LT observé moyen sur 2 ans\"), errors=\"coerce\")\n    days = np.where(sup > 0, sup, np.where(obs > 0, obs, p.lt_default))\n    src = np.where(sup > 0, \"Fournisseur\", np.where(obs > 0, \"PN (observé)\", \"Défaut\"))\n    return np.clip(np.ceil(days / 30), 1, MAX_LT).astype(int), days, src\n\n\ndef deliveries_matrix(orders, pns, today, p, T):\n    mat = np.zeros((len(pns), T))\n    if orders is None or len(orders) == 0:\n        return mat\n    pos = {pn: i for i, pn in enumerate(pns)}\n    o = orders[orders[\"PNR\"].isin(pos)].copy()\n    o = o[o[\"Qte restante\"].fillna(0) > 0]\n    if o.empty:\n        return mat\n    t0 = pd.Timestamp(today)\n    arr = o[\"Date livraison promise\"]\n    arr = arr.mask(o[\"Attente BFE\"].fillna(False).astype(bool), t0 + pd.DateOffset(months=int(p.bfe_delay_months)))\n    arr = arr.fillna(o[\"Date livraison demandee\"]).fillna(t0 + pd.Timedelta(days=int(p.lt_default)))\n    idx = month_index(arr, today).clip(0, T - 1).to_numpy()\n    rows = o[\"PNR\"].map(pos).to_numpy()\n    np.add.at(mat, (rows, idx), o[\"Qte restante\"].to_numpy(float))\n    return mat\n\n\n# --------------------------------------------------------------------------\n# Projection et plan de commande\n# --------------------------------------------------------------------------\ndef project_orders(pbi, orders, events, p, today):\n    \"\"\"Pour chaque PN : stock projeté, PE à venir, commandes à passer (délai fournisseur inclus).\"\"\"\n    H = p.horizon_months\n    T = H + MAX_LT\n    pns = pbi[\"PNR\"].tolist()\n    n = len(pns)\n    pos = {pn: i for i, pn in enumerate(pns)}\n    lt_m, lt_days, lt_src = lead_time_months(pbi, p)\n    deliv = deliveries_matrix(orders, pns, today, p, T)\n    pe = np.zeros((n, T))\n    if events is not None and len(events):\n        ev = events[events[\"pn\"].isin(pos)]\n        np.add.at(pe, (ev[\"pn\"].map(pos).to_numpy(), ev[\"idx\"].to_numpy(int)), ev[\"qty\"].to_numpy(float))\n    req = pbi[\"Besoin minimum (qté)\"].fillna(0).to_numpy(float)\n    stock0 = pbi[\"QTE SUR ÉTAGÈRE\"].fillna(0).to_numpy(float)\n    pu = pd.to_numeric(pbi.get(\"Dernier PU (achat) Euros\", pd.Series(0.0, index=pbi.index)), errors=\"coerce\").fillna(0).to_numpy(float)\n    cum_pe, cum_dl = np.cumsum(pe, axis=1), np.cumsum(deliv, axis=1)\n    supply = stock0[:, None] + cum_dl\n    need = req[:, None] + cum_pe\n    gap = need - supply\n    add_cum = np.zeros((n, T))\n    orders_m = np.zeros((n, H))\n    shortfall = np.zeros(n)\n    first_short = np.full(n, -1)\n    for i in range(n):\n        L = int(lt_m[i])\n        run = np.maximum.accumulate(np.maximum(gap[i, L:], 0))\n        add_cum[i, L:] = np.ceil(run - 1e-9)\n        arr = np.diff(add_cum[i], prepend=0.0)\n        orders_m[i] = arr[L:L + H]\n        if L > 0:\n            shortfall[i] = max(0.0, gap[i, :L].max())\n        below = np.where(gap[i, :H] > 1e-9)[0]\n        first_short[i] = below[0] if len(below) else -1\n    inactive = pbi[\"Statut activité\"].isin([\"Inactif\", \"Dormant\"]).to_numpy() if \"Statut activité\" in pbi.columns else np.zeros(n, dtype=bool)\n    blocked_qty = np.where(inactive, orders_m.sum(axis=1), 0.0)\n    orders_m[inactive] = 0.0\n    in_group = pbi[\"Nb groupes avions\"].fillna(0).to_numpy() > 0\n    ord_now = orders_m[:, 0]\n    ord_total = orders_m.sum(axis=1)\n    first_ord = np.array([int(np.argmax(r > 0)) if r.any() else -1 for r in orders_m])\n    t0 = pd.Period(today, \"M\")\n    to_month = lambda k: pd.NaT if k < 0 else (t0 + int(k)).start_time  # noqa: E731\n    out = pbi.copy()\n    out[\"Délai (mois)\"], out[\"Source délai\"] = lt_m, lt_src\n    out[\"PE planifiée sur l'horizon (qté)\"] = pe[:, :H].sum(axis=1)\n    out[\"Stock minimum respecté\"] = np.where(in_group, stock0 >= req - 1e-9, np.nan)\n    out[\"Qté à commander maintenant\"] = ord_now\n    out[\"Valeur à commander maintenant (€)\"] = (ord_now * pu).round(0)\n    out[\"Date 1ère commande\"] = [to_month(k) for k in first_ord]\n    out[\"Commandes recommandées sur l'horizon (qté)\"] = ord_total\n    out[\"Valeur commandes recommandées (€)\"] = (ord_total * pu).round(0)\n    out[\"Manque avant livraison possible (qté)\"] = shortfall\n    out[\"Premier mois sous le minimum (sans commande)\"] = [to_month(k) for k in first_short]\n    out[\"Valeur stock hors groupe avion (€)\"] = np.where(in_group, 0, out[\"Valeur stock (€)\"].fillna(0))\n    out[\"Statut prévision\"] = np.select(\n        [~in_group, inactive, ord_now > 0, ord_total > 0], [\"Hors groupe avion\", \"Dormant / inactif : pas de commande\", \"A commander\", \"A planifier\"], default=\"OK\")\n    out[\"Commande bloquée PN dormant/inactif (qté)\"] = blocked_qty\n    out[\"Stock / besoin minimum (%)\"] = np.where(req > 0, (stock0 / np.where(req > 0, req, 1) * 100).round(0), np.nan)\n\n    months = [(t0 + k).start_time for k in range(H)]\n    rep = lambda a: a[:, :H].ravel()  # noqa: E731\n    monthly = pd.DataFrame({\n        \"PNR\": np.repeat(pns, H), \"Catégorie\": np.repeat(tx.categorie(pbi).to_numpy(), H), \"Mois\": np.tile(months, n),\n        \"Livraisons attendues\": rep(deliv), \"PE planifiée (pièces)\": rep(pe), \"Commande à passer\": orders_m.ravel(),\n        \"Arrivée des commandes recommandées\": rep(np.diff(add_cum, axis=1, prepend=0.0)),\n        \"Stock sans nouvelle commande\": rep(supply - cum_pe), \"Stock avec commandes recommandées\": rep(supply + add_cum - cum_pe),\n        \"Niveau à tenir (minimum + PE cumulée)\": rep(need), \"Stock minimum\": np.repeat(req, H),\n    })\n    sel = np.argwhere(orders_m > 0)\n    cat = tx.categorie(pbi).to_numpy()\n    plan = pd.DataFrame({\n        \"PNR\": [pns[i] for i, _ in sel], \"Catégorie\": [cat[i] for i, _ in sel],\n        \"Mois de commande\": [(t0 + int(m)).start_time for _, m in sel],\n        \"Mois de livraison souhaité\": [(t0 + int(m) + int(lt_m[i])).start_time for i, m in sel],\n        \"Qté à commander\": [orders_m[i, m] for i, m in sel], \"Délai (mois)\": [int(lt_m[i]) for i, _ in sel],\n        \"Valeur (€)\": [round(orders_m[i, m] * pu[i]) for i, m in sel],\n    })\n    plan[\"Année de commande\"] = pd.to_datetime(plan[\"Mois de commande\"]).dt.year\n    return out, monthly, plan\n\n\ndef run_policy(pbi, orders, parts, fleet, planning, rules, p, today):\n    reg_parts = registration_parts(parts)\n    gp = group_pn_table(parts)\n    pbi = ajouter_delais(pbi, orders, p)\n    g = build_requirements(gp, fleet, rules, pbi, p)\n    req = pn_requirement(g)\n    pbi = pbi.merge(req, on=\"PNR\", how=\"left\")\n    pbi[\"Dans un groupe avion\"] = pbi[\"Nb groupes avions\"].fillna(0) > 0\n    pbi[\"Besoin minimum (qté)\"] = pbi[\"Besoin minimum (qté)\"].fillna(0)\n    events = expand_events(planning, reg_parts, rules, today, p.horizon_months)\n    pbi, monthly, plan = project_orders(pbi, orders, events, p, today)\n    pbi[\"Fournisseur\"] = fournisseur_prevision(pbi)\n    plan = plan.merge(pbi[[\"PNR\", \"Fournisseur\"]].drop_duplicates(\"PNR\"), on=\"PNR\", how=\"left\")\n    gs = group_summary(g)\n    return pbi, {\"gp\": g, \"gs\": gs, \"events\": events, \"monthly\": monthly, \"plan\": plan, \"reg_parts\": reg_parts}\n\n\ndef explain_pn(pn, gp):\n    \"\"\"Calcul détaillé d'un PN : groupes d'avions, objectif, besoin et stock réparti.\"\"\"\n    d = gp[gp[\"pn\"] == pn][[\"group\", \"area\", \"Composant\", \"qty_per_ac\", \"Avions du groupe\", \"Objectif avions d'avance\", \"Cycle PE (ans)\",\n                           \"Besoin minimum (qté)\", \"Stock alloué\", \"Commandes allouées\", \"Avions équipables (stock)\"]].copy()\n    d.columns = [\"Groupe\", \"Classe\", \"Composant\", \"Qté par avion\", \"Avions du groupe\", \"Objectif avions d'avance\", \"Cycle PE (ans)\",\n                 \"Besoin minimum (qté)\", \"Stock alloué\", \"Commandes allouées\", \"Avions équipables (stock)\"]\n    return d.round(1)\n\n\n# --------------------------------------------------------------------------\n# Vue par fournisseur\n# --------------------------------------------------------------------------\nFOURNISSEUR_ABSENT = \"Fournisseur non renseigné\"\n\n\ndef fournisseur_prevision(pbi: pd.DataFrame) -> pd.Series:\n    \"\"\"Fournisseur d'un PN pour la prévision : nom, ou à défaut code fournisseur.\n\n    Ordre : fournisseur habituel des commandes (nom) → dernier fournisseur de l'État du stock →\n    code fournisseur (commandes, puis État du stock) → « Fournisseur non renseigné ».\n    \"\"\"\n    princ = pbi.get(\"Fournisseur principal\", pd.Series(np.nan, index=pbi.index))\n    est_code = princ.astype(str).str.startswith(\"Code \")\n    nom = princ.where(princ.notna() & ~est_code)\n    nom = nom.fillna(pbi.get(\"DERNIER FOURNISSEUR\", pd.Series(np.nan, index=pbi.index)))\n    nom = nom.fillna(princ.where(est_code))\n    code = pbi.get(\"CODE FOURNISSEUR\", pd.Series(np.nan, index=pbi.index))\n    nom = nom.fillna((\"Code \" + code.astype(object)).where(code.notna()))\n    return nom.fillna(FOURNISSEUR_ABSENT)\n\n\ndef par_fournisseur(s: pd.DataFrame, plan: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Une ligne par fournisseur (PN actifs rattachés à un groupe d'avions) : quoi commander, quand, pour combien.\"\"\"\n    cand = s[s[\"Dans un groupe avion\"] & (s[\"Statut activité\"] == \"Actif\")]\n    if cand.empty:\n        return pd.DataFrame(columns=[\"Fournisseur\", \"PN suivis\", \"PN à commander\", \"Qté à commander maintenant\",\n                                     \"Valeur maintenant (€)\", \"Valeur sur l'horizon (€)\", \"Prochaine commande\", \"Délai moyen (mois)\"])\n    g = cand.assign(a_cmd=cand[\"Qté à commander maintenant\"] > 0).groupby(\"Fournisseur\").agg(\n        **{\"PN suivis\": (\"PNR\", \"nunique\"), \"PN à commander\": (\"a_cmd\", \"sum\"),\n           \"Qté à commander maintenant\": (\"Qté à commander maintenant\", \"sum\"),\n           \"Valeur maintenant (€)\": (\"Valeur à commander maintenant (€)\", \"sum\"),\n           \"Valeur sur l'horizon (€)\": (\"Valeur commandes recommandées (€)\", \"sum\"),\n           \"Prochaine commande\": (\"Date 1ère commande\", \"min\"), \"Délai moyen (mois)\": (\"Délai (mois)\", \"mean\")})\n    g[\"Délai moyen (mois)\"] = g[\"Délai moyen (mois)\"].round(1)\n    g[\"PN à commander\"] = g[\"PN à commander\"].astype(int)\n    return g.reset_index().sort_values([\"Valeur maintenant (€)\", \"Valeur sur l'horizon (€)\"], ascending=False, kind=\"stable\") \\\n        .reset_index(drop=True)\n", "app/core/style.py": "\"\"\"Thème Supply360 : couleurs de la charte, CSS global (core/theme.css) et injection.\n\nDans le HTML livré, build.py place le CSS (images comprises) une seule fois dans le <head> :\nrien n'est renvoyé au navigateur à chaque interaction. En développement local\n(`streamlit run`), `inject()` l'ajoute à la page.\n\"\"\"\n\nimport base64\nimport re\nimport sys\nfrom functools import lru_cache\nfrom pathlib import Path\n\n# Couleurs de la charte, réutilisées côté Python (graphes Altair, export Excel).\nCOLORS = {\n    \"navy\": \"#002157\",\n    \"navy_2\": \"#1F4E9C\",\n    \"accent\": \"#E4002B\",\n    \"bg\": \"#F4F6FA\",\n    \"surface\": \"#FFFFFF\",\n    \"tile\": \"#F1F5FA\",\n    \"text\": \"#1A1F36\",\n    \"muted\": \"#5B6478\",\n    \"border\": \"#DDE3EE\",\n    \"grid\": \"#E3E9F1\",\n    \"ok\": \"#1E8E5A\",\n    \"warn\": \"#E8A317\",\n    \"ko\": \"#C62828\",\n    \"violet\": \"#6D28D9\",\n    \"gris\": \"#9AA5B1\",\n}\n\n# Manrope (police du prototype) est embarquée dans le thème : aucun appel à Google Fonts.\nFONT = \"Manrope\"\nFONT_STACK = '\"Manrope\", \"Segoe UI\", system-ui, -apple-system, Roboto, Arial, sans-serif'\n\nTHEME = Path(__file__).with_name(\"theme.css\")\nMIME = {\".png\": \"image/png\", \".webp\": \"image/webp\", \".jpg\": \"image/jpeg\", \".jpeg\": \"image/jpeg\", \".svg\": \"image/svg+xml\",\n        \".woff2\": \"font/woff2\"}\n\n\n@lru_cache(maxsize=2)\ndef css_complet(dossier_assets: Path) -> str:\n    \"\"\"CSS du thème avec les images `asset(nom)` remplacées par des data URI.\"\"\"\n    def data_uri(m):\n        f = Path(dossier_assets) / m.group(1)\n        b64 = base64.b64encode(f.read_bytes()).decode(\"ascii\")\n        return f'url(\"data:{MIME[f.suffix.lower()]};base64,{b64}\")'\n\n    return re.sub(r\"asset\\(([^)]+)\\)\", data_uri, THEME.read_text(encoding=\"utf-8\"))\n\n\ndef dans_le_navigateur() -> bool:\n    \"\"\"True sous stlite / Pyodide (HTML livré), False avec `streamlit run`.\"\"\"\n    return sys.platform == \"emscripten\"\n\n\ndef inject() -> None:\n    \"\"\"Injecte le thème en développement local (dans le HTML, il est déjà dans le <head>).\"\"\"\n    if dans_le_navigateur():\n        return\n    import streamlit as st\n\n    assets = Path(__file__).resolve().parents[2] / \"assets\"\n    st.html(f\"<style>{css_complet(assets)}<\/style>\")\n", "app/core/textile.py": "\"\"\"Calculs de l'onglet Textile cabine : stock, consommation, activité, commandes et retards.\n\nLogique reprise de textile_analytics.py / streamlit_textile_dashboard.py (dashboard Textile\nd'origine), sans la partie graphique. La prévision par politique d'entretien (textile_policy.py)\nn'est pas reprise : elle exige le fichier des pièces par avion, hors des trois imports retenus.\n\"\"\"\n\nimport re\n\nimport numpy as np\nimport pandas as pd\n\nfrom core import transforms as tf\nfrom core.style import COLORS\n\nCATEGORY_ORDER = [\"CEINTURE\", \"HOUSSE\", \"MOUSSE\", \"RIDEAUX\"]\nCATEGORY_COLORS = {\"CEINTURE\": \"#2A9D8F\", \"HOUSSE\": COLORS[\"navy_2\"], \"MOUSSE\": \"#F4A259\", \"RIDEAUX\": \"#BC4B51\",\n                   \"Non classé\": COLORS[\"gris\"]}\nORDER_STATUS_ORDER = [\"En retard\", \"A l'heure\", \"Sans date promise\", \"En attente BFE\"]\nORDER_STATUS_COLORS = {\"En retard\": COLORS[\"ko\"], \"A l'heure\": COLORS[\"ok\"], \"Sans date promise\": COLORS[\"warn\"],\n                       \"En attente BFE\": COLORS[\"violet\"]}\nACTIVITY_ORDER = [\"Actif\", \"Dormant\", \"Inactif\"]\nACTIVITY_COLORS = {\"Actif\": COLORS[\"ok\"], \"Dormant\": \"#E67E22\", \"Inactif\": COLORS[\"gris\"]}\nDELAY_BUCKETS = [(\"1 à 20 j\", 1, 20), (\"21 à 50 j\", 21, 50), (\"51 à 150 j\", 51, 150), (\"151 à 300 j\", 151, 300),\n                 (\"301 j et +\", 301, None)]\nBUCKET_COLORS = [\"#F7DC6F\", \"#F5B041\", \"#EB984E\", \"#CB4335\", \"#7B241C\"]\nWINDOW_COLUMNS = [\"QTE CONSO 12M\", \"QTE CONSO 18M\", \"QTE CONSO 24M\"]\nLATE_BUFFER_DAYS = 10  # tolérance avant de déclarer une ligne en retard\n\n# Noms de colonnes de l'État du stock tels qu'affichés dans l'onglet (et dans l'export).\nSTOCK_RENOMMAGE = {\"PN\": \"PNR\", \"Description_stock\": \"DESCRIPTION\", \"QTY_STOCK\": \"QTE SUR ÉTAGÈRE\", \"QTY_CDE\": \"QTE EN CDE\",\n                   \"CODE_FOURNISSEUR\": \"CODE FOURNISSEUR\", \"DERNIER_FOURNISSEUR\": \"DERNIER FOURNISSEUR\"}\n\n\n# --------------------------------------------------------------------------\n# Outils\n# --------------------------------------------------------------------------\ndef annees_conso(df: pd.DataFrame) -> list[int]:\n    \"\"\"Années présentes dans les colonnes « QTE CONSO <année> » (ex. 2021 … 2025), triées.\"\"\"\n    return sorted(int(m.group(1)) for c in df.columns if (m := re.fullmatch(r\"QTE CONSO (20\\d\\d)\", str(c))))\n\n\ndef categorie(df: pd.DataFrame) -> pd.Series:\n    return df[\"REF_Equipement\"].fillna(\"Non classé\")\n\n\ndef categories(df: pd.DataFrame) -> list[str]:\n    presentes = list(dict.fromkeys(categorie(df)))\n    return [c for c in CATEGORY_ORDER if c in presentes] + sorted(c for c in presentes if c not in CATEGORY_ORDER)\n\n\ndef _num(df, col):\n    return pd.to_numeric(df[col], errors=\"coerce\").fillna(0) if col in df.columns else pd.Series(0.0, index=df.index)\n\n\n# --------------------------------------------------------------------------\n# Commandes\n# --------------------------------------------------------------------------\ndef nettoyer_dates_promises(serie: pd.Series):\n    \"\"\"2001 ou 2030+ : pas de date donnée par le fournisseur. 2049 : en attente de BFE (matière première).\"\"\"\n    d = pd.to_datetime(serie, errors=\"coerce\")\n    fictive = ((d.dt.year <= 2001) | (d.dt.year >= 2030)).fillna(False)\n    bfe = (d.dt.year == 2049).fillna(False)\n    return d.mask(fictive), fictive, bfe\n\n\ndef preparer_commandes(lignes: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Lignes du fichier Commandes (SAP) → colonnes du dashboard textile (une ligne par ligne de commande).\"\"\"\n    o = pd.DataFrame({\n        \"PNR\": lignes[\"PN\"],\n        \"Commande\": lignes[\"Commande\"],\n        \"Code acheteur\": lignes[\"Code_acheteur\"],\n        \"CCN\": lignes[\"CCN_cmd\"],\n        \"Code fournisseur\": lignes[\"Code_fournisseur_cmd\"],\n        \"Fournisseur\": lignes[\"Fournisseur\"],\n        \"Date emission commande\": lignes[\"Date_emission\"],\n        \"Date livraison demandee\": lignes[\"Date_demandee\"],\n        \"Date livraison promise\": lignes[\"PSD\"],\n        \"Qte restante\": pd.to_numeric(lignes[\"Qty_restant\"], errors=\"coerce\"),\n    })\n    for c in [\"Date emission commande\", \"Date livraison demandee\"]:\n        o[c] = pd.to_datetime(o[c], errors=\"coerce\")\n    o[\"Date livraison promise\"], o[\"Promesse fictive supprimée\"], o[\"Attente BFE\"] = nettoyer_dates_promises(o[\"Date livraison promise\"])\n    return o.drop_duplicates().reset_index(drop=True)\n\n\ndef ajouter_metriques_commandes(o: pd.DataFrame, today) -> pd.DataFrame:\n    \"\"\"Retard = date promise - date demandée (au-delà de 10 j de tolérance). Statuts à part : sans date promise, BFE.\"\"\"\n    o = o.copy()\n    today = pd.Timestamp(today).normalize()\n    promise, demandee = o[\"Date livraison promise\"], o[\"Date livraison demandee\"]\n    o[\"Ecart promis vs demandé (j)\"] = (promise - demandee).dt.days\n    o[\"Jours de retard\"] = (o[\"Ecart promis vs demandé (j)\"] - LATE_BUFFER_DAYS).clip(lower=0)\n    bfe = o[\"Attente BFE\"].fillna(False).astype(bool)\n    o[\"Statut commande\"] = np.select([bfe, promise.isna(), o[\"Ecart promis vs demandé (j)\"] > LATE_BUFFER_DAYS],\n                                     [\"En attente BFE\", \"Sans date promise\", \"En retard\"], default=\"A l'heure\")\n    o[\"Age commande (j)\"] = (today - o[\"Date emission commande\"]).dt.days\n    o[\"Demande dépassée (j)\"] = (today - demandee).dt.days.clip(lower=0)\n    classe = pd.Series(np.nan, index=o.index, dtype=object)\n    retard = o[\"Jours de retard\"]\n    for label, lo, hi in DELAY_BUCKETS:\n        m = (retard >= lo) & ((retard <= hi) if hi is not None else True) & (o[\"Statut commande\"] == \"En retard\")\n        classe[m] = label\n    o[\"Classe de retard\"] = classe\n    return o\n\n\ndef fournisseur_principal(o: pd.DataFrame) -> pd.Series:\n    \"\"\"Fournisseur le plus fréquent de chaque PN (index = PNR).\"\"\"\n    d = o.dropna(subset=[\"Fournisseur\"])\n    if d.empty:\n        return pd.Series(dtype=object, name=\"Fournisseur principal\")\n    n = d.groupby([\"PNR\", \"Fournisseur\"]).size().reset_index(name=\"n\")\n    n = n.sort_values([\"PNR\", \"n\"], ascending=[True, False], kind=\"stable\").drop_duplicates(\"PNR\")\n    return n.set_index(\"PNR\")[\"Fournisseur\"].rename(\"Fournisseur principal\")\n\n\ndef delais_fournisseurs(o: pd.DataFrame, min_lignes=3) -> pd.DataFrame:\n    \"\"\"Délai moyen promis (émission → livraison promise) par fournisseur ; dates fictives et BFE exclues.\"\"\"\n    cols = [\"Fournisseur\", \"Délai moyen promis (j)\", \"Délai médian promis (j)\", \"Lignes avec délai\"]\n    d = o.dropna(subset=[\"Fournisseur\"]).copy()\n    d[\"lt\"] = (d[\"Date livraison promise\"] - d[\"Date emission commande\"]).dt.days\n    d = d[(d[\"lt\"] >= 1) & (d[\"lt\"] <= 730)]\n    if d.empty:\n        return pd.DataFrame(columns=cols)\n    g = d.groupby(\"Fournisseur\")[\"lt\"].agg([\"mean\", \"median\", \"count\"]).reset_index()\n    g.columns = cols\n    g = g[g[\"Lignes avec délai\"] >= min_lignes]\n    g[\"Délai moyen promis (j)\"] = g[\"Délai moyen promis (j)\"].round(0)\n    return g.sort_values(\"Lignes avec délai\", ascending=False).reset_index(drop=True)\n\n\n# --------------------------------------------------------------------------\n# Stock et consommation\n# --------------------------------------------------------------------------\ndef ajouter_consommation(pbi: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Évolutions de consommation, valeurs (€) et statut d'activité (Actif / Dormant / Inactif).\"\"\"\n    pbi = pbi.copy()\n    annees = annees_conso(pbi)\n    c12, c24 = _num(pbi, \"QTE CONSO 12M\"), _num(pbi, \"QTE CONSO 24M\")\n    shelf, ordered, pu = _num(pbi, \"QTE SUR ÉTAGÈRE\"), _num(pbi, \"QTE EN CDE\"), _num(pbi, \"Dernier PU (achat) Euros\")\n    c3y = sum((_num(pbi, f\"QTE CONSO {a}\") for a in annees[-3:]), pd.Series(0.0, index=pbi.index))\n    prev12 = (c24 - c12).clip(lower=0)\n    pbi[\"Conso 12 mois précédents\"] = prev12\n    pbi[\"Evolution 12M vs 12M précédents (%)\"] = np.where(prev12 > 0, (c12 / prev12.where(prev12 > 0) - 1) * 100, np.nan).round(0)\n    if len(annees) >= 2:\n        a, b = annees[-1], annees[-2]\n        ya, yb = _num(pbi, f\"QTE CONSO {a}\"), _num(pbi, f\"QTE CONSO {b}\")\n        pbi[f\"Evolution {a} vs {b} (%)\"] = np.where(yb > 0, (ya / yb.where(yb > 0) - 1) * 100, np.nan).round(0)\n    pbi[\"Valeur stock (€)\"] = (shelf * pu).round(0)\n    pbi[\"Valeur en commande (€)\"] = (ordered * pu).round(0)\n    last = pd.to_datetime(pbi[\"DATE DERNIERE CONSO\"], errors=\"coerce\") if \"DATE DERNIERE CONSO\" in pbi.columns \\\n        else pd.Series(pd.NaT, index=pbi.index)\n    jamais = (last.dt.year <= 2001).fillna(False).to_numpy()  # 2001 = jamais consommé (date fictive)\n    consomme = ((c24 > 0) | (c3y > 0)).to_numpy()\n    sh, od = (shelf > 0).to_numpy(), (ordered > 0).to_numpy()\n    pbi[\"Statut activité\"] = np.select([consomme, sh & jamais, od], [\"Actif\"] * 3, default=np.where(sh, \"Dormant\", \"Inactif\"))\n    pbi[\"Motif activité\"] = np.select([consomme, sh & jamais, od & ~sh, od],\n                                      [f\"Consommé sur {len(annees[-3:])} ans\" if annees else \"Consommé sur 24 mois\",\n                                       \"Stock jamais consommé (2001)\", \"Commande en cours sur PN sans stock\", \"Commande en cours\"],\n                                      default=\"\")\n    pbi[\"Valeur stock dormant (€)\"] = pbi[\"Valeur stock (€)\"].where(pbi[\"Statut activité\"] == \"Dormant\", 0)\n    pbi[\"Valeur commande sur PN inactif (€)\"] = pbi[\"Valeur en commande (€)\"].where(pbi[\"Statut activité\"] == \"Inactif\", 0)\n    return pbi\n\n\ndef construire_tables(stock_lignes: pd.DataFrame, cmd_lignes: pd.DataFrame | None, catalogue: pd.DataFrame | None,\n                      today, seulement_textile=True):\n    \"\"\"(pbi, commandes) : 1 ligne par PNR du stock (avec commandes et références), 1 ligne par ligne de commande.\"\"\"\n    if seulement_textile and catalogue is not None and len(catalogue):\n        # Filtre en amont (calculs PN par PN : même résultat, beaucoup plus rapide sur un gros État du stock).\n        pns = set(catalogue[\"PN\"])\n        stock_lignes = stock_lignes[stock_lignes[\"PN\"].isin(pns)]\n        cmd_lignes = cmd_lignes[cmd_lignes[\"PN\"].isin(pns)] if cmd_lignes is not None else None\n    pbi = stock_lignes.rename(columns=STOCK_RENOMMAGE)\n    garder = [\"PNR\", \"CCN\", \"DESCRIPTION\", \"QTE SUR ÉTAGÈRE\", \"QTE EN CDE\", *WINDOW_COLUMNS, \"TDD 6M\", \"TDD 12M\",\n              *[f\"QTE CONSO {a}\" for a in annees_conso(pbi)], \"QTE COUVERTURE\", \"QTE SAR\", \"Stock réservé\", \"B/O\",\n              \"Dernier PU (achat) Euros\", \"RP\", \"EOQ\", \"LT observé moyen sur 2 ans\", \"DATE DERNIERE CONSO\",\n              \"CODE FOURNISSEUR\", \"DERNIER FOURNISSEUR\"]\n    pbi = pbi[[c for c in garder if c in pbi.columns]].copy()\n\n    catalogue = catalogue if catalogue is not None else pd.DataFrame(columns=[\"PN\", \"Equipement\", \"Description\", \"CCN\"])\n    ref = catalogue.rename(columns={\"PN\": \"PNR\", \"Equipement\": \"REF_Equipement\", \"Description\": \"REF_Description\"})\n    pbi = pbi.merge(ref[[\"PNR\", \"REF_Equipement\", \"REF_Description\"]], on=\"PNR\", how=\"left\")\n\n    o = preparer_commandes(cmd_lignes) if cmd_lignes is not None and len(cmd_lignes) else \\\n        preparer_commandes(pd.DataFrame(columns=[\"PN\", \"Commande\", \"Code_acheteur\", \"CCN_cmd\", \"Code_fournisseur_cmd\", \"Fournisseur\",\n                                                 \"Date_emission\", \"Date_demandee\", \"PSD\", \"Qty_restant\"]))\n    if len(o):\n        g = o.groupby(\"PNR\")\n        agg = pd.DataFrame({\n            \"Nb lignes commande\": g.size(),\n            \"Prochaine livraison promise\": g[\"Date livraison promise\"].min(),\n            \"Prochaine livraison demandee\": g[\"Date livraison demandee\"].min(),\n        })\n        for col, nom in [(\"Commande\", \"Commandes (liste)\"), (\"Fournisseur\", \"Fournisseurs (liste)\")]:\n            agg[nom] = tf.joindre_par_groupe(o, \"PNR\", col, \" ; \")\n        pbi = pbi.merge(agg, left_on=\"PNR\", right_index=True, how=\"left\")\n        pbi = pbi.merge(fournisseur_principal(o), left_on=\"PNR\", right_index=True, how=\"left\")\n    else:\n        pbi[\"Fournisseur principal\"] = np.nan\n    pbi[\"Nb lignes commande\"] = pbi.get(\"Nb lignes commande\", pd.Series(0, index=pbi.index)).fillna(0).astype(int)\n    pbi = ajouter_consommation(pbi)\n\n    o = o[o[\"PNR\"].isin(set(pbi[\"PNR\"]))]  # commandes des PN présents au stock (cohérent avec la table stock)\n    stock_pn = pbi.drop_duplicates(\"PNR\").set_index(\"PNR\")[\"QTE SUR ÉTAGÈRE\"]\n    o = o.assign(**{\"QTE SUR ÉTAGÈRE\": o[\"PNR\"].map(stock_pn)})  # stock du PN, à côté de chaque ligne de commande\n    o = o.merge(ref[[\"PNR\", \"REF_Equipement\", \"REF_Description\"]], on=\"PNR\", how=\"left\")\n    o = ajouter_metriques_commandes(o, today)\n    if seulement_textile and len(catalogue):\n        pbi = pbi[pbi[\"REF_Equipement\"].notna()]\n        o = o[o[\"REF_Equipement\"].notna()]\n    return pbi.reset_index(drop=True), o.reset_index(drop=True)\n\n\n# --------------------------------------------------------------------------\n# Synthèses\n# --------------------------------------------------------------------------\ndef synthese(s: pd.DataFrame, o: pd.DataFrame) -> dict:\n    statut = o[\"Statut commande\"] if len(o) else pd.Series(dtype=object)\n    return {\n        \"pn\": int(len(s)),\n        \"valeur_stock\": float(s[\"Valeur stock (€)\"].sum()),\n        \"valeur_commande\": float(s[\"Valeur en commande (€)\"].sum()),\n        \"valeur_dormant\": float(s[\"Valeur stock dormant (€)\"].sum()),\n        \"lignes\": int(len(o)),\n        \"en_retard\": int((statut == \"En retard\").sum()),\n        \"sans_date\": int((statut == \"Sans date promise\").sum()),\n        \"bfe\": int((statut == \"En attente BFE\").sum()),\n        \"fournisseurs\": int(o[\"Fournisseur\"].nunique()) if len(o) else 0,\n        \"dormants\": int((s[\"Statut activité\"] == \"Dormant\").sum()),\n        \"inactifs\": int((s[\"Statut activité\"] == \"Inactif\").sum()),\n    }\n\n\ndef resume_categories(s: pd.DataFrame, o: pd.DataFrame) -> pd.DataFrame:\n    rows = []\n    for c in categories(s):\n        d = s[categorie(s) == c]\n        od = o[categorie(o) == c] if len(o) else o\n        rows.append({\n            \"Catégorie\": c, \"PN\": len(d), \"Stock étagère\": d[\"QTE SUR ÉTAGÈRE\"].sum(), \"Valeur stock (€)\": d[\"Valeur stock (€)\"].sum(),\n            \"En commande\": d[\"QTE EN CDE\"].sum(), \"Valeur en commande (€)\": d[\"Valeur en commande (€)\"].sum(),\n            \"Conso 12M\": _num(d, \"QTE CONSO 12M\").sum(),\n            \"PN actifs\": int((d[\"Statut activité\"] == \"Actif\").sum()), \"PN dormants\": int((d[\"Statut activité\"] == \"Dormant\").sum()),\n            \"PN inactifs\": int((d[\"Statut activité\"] == \"Inactif\").sum()), \"Lignes de commande\": len(od),\n            \"Commandes en retard\": int((od[\"Statut commande\"] == \"En retard\").sum()) if len(od) else 0,\n        })\n    df = pd.DataFrame(rows)\n    if len(df) > 1:\n        df = pd.concat([df, pd.DataFrame([{\"Catégorie\": \"TOTAL\", **df.drop(columns=\"Catégorie\").sum().to_dict()}])], ignore_index=True)\n    return df\n\n\ndef poids_par_categorie(s: pd.DataFrame, o: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Lignes = indicateurs, colonnes = catégories : part de chaque catégorie dans chaque indicateur.\"\"\"\n    cats = categories(s)\n    ind = {\"PN\": lambda d, od: len(d), \"Valeur du stock\": lambda d, od: d[\"Valeur stock (€)\"].sum(),\n           \"Valeur en commande\": lambda d, od: d[\"Valeur en commande (€)\"].sum(),\n           \"Conso 12 mois\": lambda d, od: _num(d, \"QTE CONSO 12M\").sum(), \"Lignes de commande\": lambda d, od: len(od)}\n    t = pd.DataFrame(index=list(ind), columns=cats, dtype=float)\n    for c in cats:\n        d = s[categorie(s) == c]\n        od = o[categorie(o) == c] if len(o) else o\n        for k, f in ind.items():\n            t.loc[k, c] = float(f(d, od))\n    return t\n\n\ndef activite_par_categorie(s: pd.DataFrame) -> pd.DataFrame:\n    ct = s.assign(c=categorie(s)).groupby([\"c\", \"Statut activité\"]).size().unstack(fill_value=0)\n    return ct.reindex(index=categories(s), columns=[a for a in ACTIVITY_ORDER if a in ct.columns], fill_value=0)\n\n\ndef conso_par_categorie(s: pd.DataFrame) -> pd.DataFrame:\n    annees = annees_conso(s)\n    rows = []\n    for c in categories(s):\n        d = s[categorie(s) == c]\n        r = {\"Catégorie\": c}\n        for a in annees:\n            r[str(a)] = _num(d, f\"QTE CONSO {a}\").sum()\n        if len(annees) >= 2:\n            a, b = str(annees[-1]), str(annees[-2])\n            r[f\"Evolution {a} vs {b} (%)\"] = round((r[a] / r[b] - 1) * 100) if r[b] else np.nan\n        r[\"12M\"], r[\"18M\"], r[\"24M\"] = (_num(d, w).sum() for w in WINDOW_COLUMNS)\n        prev = r[\"24M\"] - r[\"12M\"]\n        r[\"Evolution 12M vs 12M précédents (%)\"] = round((r[\"12M\"] / prev - 1) * 100) if prev > 0 else np.nan\n        rows.append(r)\n    return pd.DataFrame(rows)\n\n\ndef statut_commandes_par_categorie(o: pd.DataFrame) -> pd.DataFrame:\n    ct = o.assign(c=categorie(o)).groupby([\"c\", \"Statut commande\"]).size().unstack(fill_value=0)\n    ct = ct.reindex(columns=[c for c in ORDER_STATUS_ORDER if c in ct.columns], fill_value=0)\n    return ct.reindex([c for c in categories(o) if c in ct.index])\n\n\ndef profondeur_retards(o: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Lignes en retard par classe de retard (lignes) et catégorie (colonnes).\"\"\"\n    late = o[o[\"Statut commande\"] == \"En retard\"]\n    labels = [b[0] for b in DELAY_BUCKETS]\n    if late.empty:\n        return pd.DataFrame(index=labels)\n    ct = late.assign(c=categorie(late)).groupby([\"Classe de retard\", \"c\"]).size().unstack(fill_value=0).reindex(labels, fill_value=0)\n    return ct[[c for c in categories(late) if c in ct.columns]]\n\n\ndef tableau_retards(o: pd.DataFrame) -> pd.DataFrame:\n    late = o[o[\"Statut commande\"] == \"En retard\"]\n    labels = [b[0] for b in DELAY_BUCKETS]\n    if late.empty:\n        return pd.DataFrame({\"Classe de retard\": labels, \"Lignes\": 0, \"Part (%)\": 0.0, \"Retard moyen (j)\": np.nan, \"Fournisseurs\": 0})\n    g = late.groupby(\"Classe de retard\").agg(Lignes=(\"PNR\", \"size\"), **{\"Retard moyen (j)\": (\"Jours de retard\", \"mean\")},\n                                              Fournisseurs=(\"Fournisseur\", \"nunique\")).reindex(labels)\n    g[\"Lignes\"] = g[\"Lignes\"].fillna(0).astype(int)\n    g[\"Fournisseurs\"] = g[\"Fournisseurs\"].fillna(0).astype(int)\n    g[\"Part (%)\"] = (g[\"Lignes\"] / g[\"Lignes\"].sum() * 100).round(1)\n    g[\"Retard moyen (j)\"] = g[\"Retard moyen (j)\"].round(0)\n    return g.reset_index().rename(columns={\"index\": \"Classe de retard\"})[[\"Classe de retard\", \"Lignes\", \"Part (%)\", \"Retard moyen (j)\", \"Fournisseurs\"]]\n\n\ndef commandes_emises_par_mois(o: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Lignes émises par mois (index = début de mois) et par catégorie.\"\"\"\n    d = o.dropna(subset=[\"Date emission commande\"])\n    if d.empty:\n        return pd.DataFrame()\n    d = d.assign(m=d[\"Date emission commande\"].dt.to_period(\"M\").dt.start_time, c=categorie(d))\n    mois = pd.date_range(d[\"m\"].min(), d[\"m\"].max(), freq=\"MS\")\n    ct = d.groupby([\"m\", \"c\"]).size().unstack(fill_value=0).reindex(mois, fill_value=0)\n    return ct[[c for c in categories(d) if c in ct.columns]]\n\n\ndef fenetre_emissions(today):\n    \"\"\"Période affichée au départ : depuis janvier de l'année précédente (on peut dézoomer).\"\"\"\n    t = pd.Timestamp(today)\n    return pd.Timestamp(t.year - 1, 1, 1), t + pd.DateOffset(months=1)\n\n\ndef planning_livraisons(o: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Lignes à livrer par mois (index = début de mois) : date promise si connue, sinon date demandée.\"\"\"\n    pro = o[\"Date livraison promise\"].dropna().dt.to_period(\"M\").dt.start_time.value_counts()\n    dem = o.loc[o[\"Date livraison promise\"].isna(), \"Date livraison demandee\"].dropna().dt.to_period(\"M\").dt.start_time.value_counts()\n    if pro.empty and dem.empty:\n        return pd.DataFrame()\n    debut, fin = min(pro.index.min() if len(pro) else dem.index.min(), dem.index.min() if len(dem) else pro.index.min()), \\\n        max(pro.index.max() if len(pro) else dem.index.max(), dem.index.max() if len(dem) else pro.index.max())\n    mois = pd.date_range(debut, fin, freq=\"MS\")\n    return pd.DataFrame({\"Avec date promise\": pro.reindex(mois, fill_value=0),\n                         \"Sans date promise (date demandée)\": dem.reindex(mois, fill_value=0)})\n\n\ndef fenetre_planning(today, passe=3, horizon=9):\n    t = pd.Timestamp(today)\n    return (t - pd.DateOffset(months=passe)).to_period(\"M\").start_time, (t + pd.DateOffset(months=horizon)).to_period(\"M\").start_time\n\n\ndef chaleur_livraisons(o: pd.DataFrame, today, top=12, passe=2, horizon=10) -> pd.DataFrame:\n    d = o.dropna(subset=[\"Date livraison promise\", \"Fournisseur\"])\n    if d.empty:\n        return pd.DataFrame()\n    t = pd.Timestamp(today)\n    debut, fin = (t - pd.DateOffset(months=passe)).to_period(\"M\"), (t + pd.DateOffset(months=horizon)).to_period(\"M\")\n    axe = [m.strftime(\"%m/%y\") for m in pd.period_range(debut, fin, freq=\"M\")]\n    top_f = d[\"Fournisseur\"].value_counts().head(top).index\n    p = d[\"Date livraison promise\"].dt.to_period(\"M\")\n    d = d[d[\"Fournisseur\"].isin(top_f) & (p >= debut) & (p <= fin)]\n    d = d.assign(m=d[\"Date livraison promise\"].dt.strftime(\"%m/%y\"))\n    return d.groupby([\"Fournisseur\", \"m\"]).size().unstack(fill_value=0).reindex(index=top_f, columns=axe, fill_value=0)\n\n\ndef relances(o: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Lignes à relancer, de la pire à la meilleure : retards (plus gros retard d'abord), sans date promise, BFE.\n\n    Seules les lignes avec une quantité restant à livrer (ou non renseignée) sont proposées.\n    \"\"\"\n    reste = o[\"Qte restante\"].isna() | (o[\"Qte restante\"] > 0)\n    d = o[reste & o[\"Statut commande\"].isin([\"En retard\", \"Sans date promise\", \"En attente BFE\"])].copy()\n    rang = {\"En retard\": 0, \"Sans date promise\": 1, \"En attente BFE\": 2}\n    d[\"_r\"] = d[\"Statut commande\"].map(rang)\n    d[\"_k\"] = np.select([d[\"_r\"] == 0, d[\"_r\"] == 1], [d[\"Jours de retard\"], d[\"Demande dépassée (j)\"]], default=d[\"Age commande (j)\"])\n    return d.sort_values([\"_r\", \"_k\"], ascending=[True, False], kind=\"stable\").drop(columns=[\"_r\", \"_k\"])\n", "app/core/transforms.py": "\"\"\"Agrégations et croisements réutilisables : besoins chantier × état du stock × commandes.\n\nFonctions pures (pandas uniquement), testables sans Streamlit. Logique métier reprise\nà l'identique du script d'origine `legacy/streamlit_GEAV.py`, vectorisée pour Pyodide.\n\"\"\"\n\nimport numpy as np\nimport pandas as pd\n\nCLASSES_RISQUE = [8.0, 9.0]\n# Les fournisseurs saisissent une PSD en 2031 quand ils n'ont pas encore donné de date.\nANNEE_PSD_NON_FOURNIE = 2031\nSEP = \" | \"\n# Dernier recours, quand ni les commandes ni l'État du stock ne donnent de nom ou de code.\nFOURNISSEUR_ABSENT = \"fournisseur non renseigné\"\n\n# --------------------------------------------------------------------------\n# Codes action (du pire au meilleur)\n# --------------------------------------------------------------------------\nACTION_ORDRE = [\"commander\", \"relancer_urgent\", \"relancer\", \"inconnu\", \"en_cours\", \"hors_perimetre\", \"ok\"]\nACTIONS_A_LANCER = [\"commander\", \"relancer_urgent\", \"relancer\", \"inconnu\"]\nACTION_LABELS = {\n    \"commander\": \"🔴 À commander\",\n    \"relancer_urgent\": \"🔴 Relance urgente (retard vs chantier)\",\n    \"relancer\": \"🟠 À relancer\",\n    \"inconnu\": \"❓ PN introuvable\",\n    \"en_cours\": \"🔵 En cours de livraison\",\n    \"hors_perimetre\": \"⚠️ Hors périmètre gestion\",\n    \"ok\": \"🟢 Stock suffisant\",\n}\n# Tons de la charte (core/style.py) associés à chaque action.\nACTION_TONES = {\n    \"commander\": \"ko\", \"relancer_urgent\": \"accent\", \"relancer\": \"warn\", \"inconnu\": \"muted\",\n    \"en_cours\": \"navy_2\", \"hors_perimetre\": \"border\", \"ok\": \"ok\",\n}\n# Fonds pastel de l'export Excel (repris du script d'origine).\nACTION_FILL_HEX = {\n    \"commander\": \"F8D7DA\", \"relancer_urgent\": \"F5B7B1\", \"relancer\": \"FCE4D6\",\n    \"en_cours\": \"D6E4F0\", \"ok\": \"D9F2E6\", \"hors_perimetre\": \"FDF0D5\", \"inconnu\": \"E2E3E5\",\n}\n\n\n# --------------------------------------------------------------------------\n# Utilitaires d'agrégation\n# --------------------------------------------------------------------------\ndef joindre_uniques(serie: pd.Series, sep: str = SEP):\n    \"\"\"Valeurs non vides, dédoublonnées dans l'ordre, jointes par `sep` (NaN si aucune).\"\"\"\n    vals = [str(v).strip() for v in serie\n            if pd.notna(v) and str(v).strip() and str(v).strip().lower() != \"nan\"]\n    return sep.join(dict.fromkeys(vals)) if vals else np.nan\n\n\ndef joindre_par_groupe(df: pd.DataFrame, cle: str, col: str, sep: str = SEP) -> pd.Series:\n    \"\"\"Équivalent vectorisé de `groupby(cle)[col].agg(joindre_uniques)` (index = clé).\n\n    Sans `groupby().agg` (une fonction Python par groupe, lent sous Pyodide) : tri stable par clé\n    puis une seule boucle sur des listes.\n    \"\"\"\n    s = df[col].map(str, na_action=\"ignore\").str.strip()\n    garde = s.notna() & (s != \"\") & (s.str.lower() != \"nan\")\n    tmp = pd.DataFrame({cle: df[cle], col: s})[garde].drop_duplicates()\n    if tmp.empty:\n        return pd.Series(dtype=object, name=col)\n    codes, uniques = pd.factorize(tmp[cle], sort=False)\n    ordre = np.argsort(codes, kind=\"stable\")\n    c = codes[ordre]\n    vals = tmp[col].to_numpy()[ordre].tolist()\n    bornes = np.flatnonzero(np.diff(c)) + 1\n    debuts, fins = np.r_[0, bornes], np.r_[bornes, len(c)]\n    index = pd.Index(uniques.take(c[debuts]), name=cle)\n    return pd.Series([sep.join(vals[a:b]) for a, b in zip(debuts, fins)], index=index, name=col)\n\n\ndef _plus_frequent(cles: pd.Series, valeurs: pd.Series) -> pd.Series:\n    \"\"\"Par clé : valeur non vide la plus fréquente (première rencontrée en cas d'égalité).\"\"\"\n    d = pd.DataFrame({\"k\": cles, \"v\": valeurs}).dropna()\n    if d.empty:\n        return pd.Series(dtype=object)\n    n = d.groupby([\"k\", \"v\"], sort=False).size().reset_index(name=\"n\")\n    return n.sort_values(\"n\", ascending=False, kind=\"stable\").drop_duplicates(\"k\").set_index(\"k\")[\"v\"]\n\n\ndef completer_fournisseurs(lignes: pd.DataFrame) -> pd.Series:\n    \"\"\"Fournisseur de chaque ligne de commande, sans jamais laisser « fournisseur inconnu ».\n\n    Règle (demande métier) quand la colonne Fournisseur est vide :\n    1. nom associé au même code fournisseur sur les autres lignes du fichier ;\n    2. sinon, fournisseur le plus fréquent sur les autres lignes du même PN ;\n    3. sinon, le code fournisseur lui-même (« Code F123 ») ;\n    4. sinon, via le code fournisseur le plus fréquent du même PN.\n    Reste vide uniquement si la ligne et son PN n'ont ni nom ni code.\n    \"\"\"\n    nom = lignes[\"Fournisseur\"].where(lignes[\"Fournisseur\"].notna(), np.nan)\n    code = lignes[\"Code_fournisseur_cmd\"]\n    nom_par_code = _plus_frequent(code, nom)\n    nom = nom.fillna(code.map(nom_par_code))\n    nom = nom.fillna(lignes[\"PN\"].map(_plus_frequent(lignes[\"PN\"], nom)))\n    nom = nom.fillna((\"Code \" + code.astype(object)).where(code.notna()))\n    code_pn = lignes[\"PN\"].map(_plus_frequent(lignes[\"PN\"], code))\n    nom = nom.fillna(code_pn.map(nom_par_code)).fillna((\"Code \" + code_pn.astype(object)).where(code_pn.notna()))\n    return nom.astype(object)\n\n\ndef _premier_prioritaire(df: pd.DataFrame, cle: str, col: str, prioritaires) -> pd.Series:\n    \"\"\"Par groupe : première valeur figurant dans `prioritaires`, sinon première non vide.\"\"\"\n    rang = (~df[col].isin(prioritaires)).astype(int)\n    ordonne = df.assign(_rang=rang).sort_values(\"_rang\", kind=\"stable\")\n    return ordonne.groupby(cle)[col].first()\n\n\n# --------------------------------------------------------------------------\n# Agrégation par PN\n# --------------------------------------------------------------------------\ndef agreger_besoins(lignes: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Une ligne par PN : quantités sommées (doublons du fichier besoins additionnés).\"\"\"\n    g = lignes.groupby(\"PN\")\n    out = pd.DataFrame({\"QTY_GEAV\": g[\"Qty\"].sum(), \"Nb_lignes\": g[\"Qty\"].size()})\n    if \"Description\" in lignes.columns:\n        out[\"Description\"] = joindre_par_groupe(lignes, \"PN\", \"Description\").reindex(out.index)\n    out[\"TRFX\"] = g[\"TRFX\"].first()\n    out[\"QTY_GEAV\"] = out[\"QTY_GEAV\"].astype(int)\n    return out.reset_index()\n\n\ndef agreger_stock(lignes: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Une ligne par PN. Un PNR est censé être unique ; en cas de doublon on prend le max\n    du stock / des quantités en commande et la classe 8/9 si elle apparaît.\"\"\"\n    g = lignes.groupby(\"PN\")\n    out = pd.DataFrame({\n        \"QTY_STOCK\": g[\"QTY_STOCK\"].max(),\n        \"QTY_CDE\": g[\"QTY_CDE\"].max(),\n        \"GESTION\": g[\"GESTION\"].first(),\n        \"CODE_AGENT\": g[\"CODE_AGENT\"].first(),\n        \"CODE_FOURNISSEUR\": g[\"CODE_FOURNISSEUR\"].first(),\n        \"DERNIER_FOURNISSEUR\": g[\"DERNIER_FOURNISSEUR\"].first(),\n        \"Description_stock\": g[\"Description_stock\"].first(),\n        \"CCN\": g[\"CCN\"].first(),\n        \"TL\": g[\"TL\"].first() if \"TL\" in lignes else np.nan,\n    })\n    out[\"CLASS_CODE_STOCK\"] = _premier_prioritaire(lignes, \"PN\", \"CLASS_CODE_STOCK\", CLASSES_RISQUE)\n    return out.reset_index()\n\n\ndef agreger_commandes(lignes: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Une ligne par PN, triée par date de livraison : la PSD retenue est la plus proche.\"\"\"\n    d = lignes.sort_values(\"PSD_effective\", kind=\"stable\")\n    g = d.groupby(\"PN\")\n    out = pd.DataFrame({\n        \"Commande\": joindre_par_groupe(d, \"PN\", \"Commande\"),\n        \"Code_acheteur\": joindre_par_groupe(d, \"PN\", \"Code_acheteur\"),\n    }).reindex(g.size().index)\n    out[\"Gestion_cmd\"] = g[\"Gestion_cmd\"].first()\n    out[\"Code_fournisseur_cmd\"] = joindre_par_groupe(d, \"PN\", \"Code_fournisseur_cmd\")\n    out[\"Fournisseur\"] = joindre_par_groupe(d, \"PN\", \"Fournisseur\")\n    out[\"PSD\"] = g[\"PSD_effective\"].min()\n    out[\"PSD_est_estimee\"] = g[\"PSD_est_estimee\"].first()\n    out[\"Statut\"] = joindre_par_groupe(d, \"PN\", \"Statut\")\n    out[\"Qty_restant_cmd\"] = g[\"Qty_restant\"].sum()\n    out[\"Nb_commandes\"] = g[\"Commande\"].nunique()\n    out[\"Class_code\"] = g[\"Class_code\"].first()\n    out[\"Has_risk_class\"] = d[\"Class_code\"].isin(CLASSES_RISQUE).groupby(d[\"PN\"]).any()\n    out[\"CCN_cmd\"] = g[\"CCN_cmd\"].first()\n    return out.reset_index()\n\n\n# --------------------------------------------------------------------------\n# Croisement besoins × stock × commandes et action recommandée\n# --------------------------------------------------------------------------\ndef _non_vide(s: pd.Series) -> pd.Series:\n    return s.notna() & (s.astype(str).str.strip() != \"\")\n\n\ndef croiser_geav(besoin: pd.DataFrame, stock: pd.DataFrame, commandes: pd.DataFrame,\n                 gestion_scope, date_chantier) -> pd.DataFrame:\n    \"\"\"Croise les trois sources (agrégées par PN) et calcule l'action recommandée.\n\n    - Deficit = max(0, QTY_GEAV - QTY_STOCK) : quantité manquante maintenant ;\n    - Qty_a_commander = max(0, Deficit - QTY_CDE) : quantité non couverte par les commandes ;\n    - la PSD est comparée à la date de début du chantier pour savoir si la livraison\n      arrivera à temps.\n    \"\"\"\n    date_chantier = pd.Timestamp(date_chantier)\n    m = besoin.copy()\n    m[\"GEAV_DATE\"] = date_chantier\n    if \"TRFX\" not in m.columns:\n        m[\"TRFX\"] = np.nan\n\n    m = m.merge(stock, on=\"PN\", how=\"left\")\n    # Gestion : celle du fichier Commandes fait foi, repli sur l'État du stock.\n    gest_cmd = commandes[[\"PN\", \"Gestion_cmd\"]].drop_duplicates(\"PN\")\n    m = m.merge(gest_cmd, on=\"PN\", how=\"left\")\n    m[\"GESTION\"] = m[\"Gestion_cmd\"].where(m[\"Gestion_cmd\"].notna(), m[\"GESTION\"])\n    m = m.drop(columns=[\"Gestion_cmd\"])\n    m[\"in_stock_file\"] = m[\"QTY_STOCK\"].notna() | m[\"QTY_CDE\"].notna()\n    m[[\"QTY_STOCK\", \"QTY_CDE\"]] = m[[\"QTY_STOCK\", \"QTY_CDE\"]].fillna(0)\n    m[\"gestion_in_scope\"] = m[\"GESTION\"].isin({float(g) for g in gestion_scope})\n\n    m = m.merge(commandes.drop(columns=[\"Gestion_cmd\"]), on=\"PN\", how=\"left\")\n    m[\"Deficit\"] = (m[\"QTY_GEAV\"] - m[\"QTY_STOCK\"]).clip(lower=0).astype(int)\n    m[\"Qty_a_commander\"] = (m[\"Deficit\"] - m[\"QTY_CDE\"]).clip(lower=0).astype(int)\n\n    m[\"FOURNISSEUR\"] = m[\"Fournisseur\"].where(_non_vide(m[\"Fournisseur\"]), m[\"DERNIER_FOURNISSEUR\"])\n    m[\"CODE_FOURNISSEUR\"] = m[\"CODE_FOURNISSEUR\"].where(m[\"CODE_FOURNISSEUR\"].notna(), m[\"Code_fournisseur_cmd\"])\n    # Le code acheteur du fichier Commandes fait foi ; repli sur CODE AGT APPRO.\n    m[\"CODE_ACHETEUR\"] = m[\"Code_acheteur\"].where(m[\"Code_acheteur\"].notna(), m[\"CODE_AGENT\"])\n    m[\"CCN\"] = m[\"CCN\"].where(m[\"CCN\"].notna(), m[\"CCN_cmd\"])\n    # Classe 8/9 : alerte si présente dans les commandes ou dans l'État du stock.\n    m[\"CLASS_CODE\"] = m[\"Class_code\"].where(m[\"Class_code\"].isin(CLASSES_RISQUE), m[\"CLASS_CODE_STOCK\"])\n    m[\"CLASS_CODE\"] = m[\"CLASS_CODE\"].where(m[\"CLASS_CODE\"].notna(), m[\"Class_code\"])\n    m[\"RISK_CLASS\"] = m[\"CLASS_CODE\"].isin(CLASSES_RISQUE) | m[\"Has_risk_class\"].eq(True)\n\n    code, message = _actions(m)\n    m[\"ACTION\"] = message\n    m[\"ACTION_CODE\"] = code\n    risque = m[\"RISK_CLASS\"] & (m[\"ACTION_CODE\"] != \"inconnu\")\n    m.loc[risque, \"ACTION\"] = \"🚨 CLASSE 8/9 — PRIORITÉ : \" + m.loc[risque, \"ACTION\"]\n    return m\n\n\ndef _actions(m: pd.DataFrame):\n    \"\"\"(codes, messages) de l'action recommandée, ligne à ligne mais vectorisé.\"\"\"\n    agent = m[\"CODE_ACHETEUR\"].where(m[\"CODE_ACHETEUR\"].notna(), \"?\").astype(str)\n    fourn = (m[\"FOURNISSEUR\"].where(_non_vide(m[\"FOURNISSEUR\"]),\n                                    m[\"CODE_FOURNISSEUR\"].where(_non_vide(m[\"CODE_FOURNISSEUR\"]),\n                                                                FOURNISSEUR_ABSENT))\n             .astype(str))\n    psd = pd.to_datetime(m[\"PSD\"])\n    psd_txt = psd.dt.strftime(\"%d/%m/%Y\")\n    psd_manquante = psd.notna() & (psd.dt.year == ANNEE_PSD_NON_FOURNIE)\n    psd_tardive = (m[\"GEAV_DATE\"].notna() & psd.notna()\n                   & (psd.dt.normalize() > m[\"GEAV_DATE\"].dt.normalize()) & ~psd_manquante)\n    gestion = m[\"GESTION\"].map(lambda g: \"?\" if pd.isna(g) else str(int(g)))\n    deficit = m[\"Deficit\"].astype(str)\n    a_cmd = m[\"Qty_a_commander\"].astype(str)\n    contact = \" (contact: \" + agent + \")\"\n\n    regles = [  # (condition, code, message) — la première condition vraie l'emporte\n        (~m[\"in_stock_file\"], \"inconnu\",\n         pd.Series(\"❓ PN introuvable dans le fichier État du stock (à vérifier manuellement)\", index=m.index)),\n        (~m[\"gestion_in_scope\"], \"hors_perimetre\",\n         \"⚠️ Besoin de \" + deficit + \" — Gestion \" + gestion + \" hors périmètre (contacter \" + agent + \")\"),\n        ((m[\"Qty_a_commander\"] > 0) & (m[\"QTY_CDE\"] > 0), \"commander\",\n         \"🔴 Commander le complément (\" + a_cmd + \") + relancer \" + fourn + contact),\n        (m[\"Qty_a_commander\"] > 0, \"commander\",\n         \"🔴 Commander \" + a_cmd + \" — aucune commande en cours\" + contact),\n        (m[\"Deficit\"] <= 0, \"ok\",\n         pd.Series(\"🟢 Stock suffisant — aucune action\", index=m.index)),\n        (psd.isna() | psd_manquante, \"relancer\",\n         \"🟠 Relancer \" + fourn + \" — commande en cours, PSD manquante ou à confirmer\" + contact),\n        (psd_tardive, \"relancer_urgent\",\n         \"🔴 Relancer \" + fourn + \" — PSD \" + psd_txt.fillna(\"\") + \" après la date limite GEAV\" + contact),\n        (pd.Series(True, index=m.index), \"en_cours\",\n         \"🔵 Livraison en cours — PSD \" + psd_txt.fillna(\"\") + \" (\" + fourn + \")\"),\n    ]\n    code = pd.Series(None, index=m.index, dtype=object)\n    message = pd.Series(None, index=m.index, dtype=object)\n    for cond, c, msg in regles:\n        libre = code.isna() & cond.fillna(False).astype(bool)\n        code[libre] = c\n        message[libre] = msg[libre]\n    return code, message\n\n\n# --------------------------------------------------------------------------\n# Synthèse et priorisation\n# --------------------------------------------------------------------------\ndef synthese_geav(m_scope: pd.DataFrame) -> dict:\n    codes = m_scope[\"ACTION_CODE\"]\n    return {\n        \"n_total\": int(len(m_scope)),\n        \"n_commander\": int((codes == \"commander\").sum()),\n        \"qty_a_commander\": int(m_scope.loc[codes == \"commander\", \"Qty_a_commander\"].sum()),\n        \"n_relance\": int(codes.isin([\"relancer\", \"relancer_urgent\"]).sum()),\n        \"n_relance_urgente\": int((codes == \"relancer_urgent\").sum()),\n        \"n_en_cours\": int((codes == \"en_cours\").sum()),\n        \"n_ok\": int((codes == \"ok\").sum()),\n        \"n_inconnu\": int((codes == \"inconnu\").sum()),\n        \"n_risque\": int(m_scope[\"RISK_CLASS\"].sum()),\n    }\n\n\ndef actions_a_lancer(m_scope: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Lignes qui demandent une action, du pire au meilleur : classe 8/9 d'abord,\n    puis commander > relance urgente > relancer > PN introuvable, puis quantité.\"\"\"\n    a = m_scope[m_scope[\"ACTION_CODE\"].isin(ACTIONS_A_LANCER)].copy()\n    a[\"_ordre\"] = a[\"ACTION_CODE\"].map({c: i for i, c in enumerate(ACTION_ORDRE)})\n    a = a.sort_values([\"RISK_CLASS\", \"_ordre\", \"Qty_a_commander\", \"PSD\"],\n                      ascending=[False, True, False, True], kind=\"stable\")\n    return a.drop(columns=\"_ordre\")\n\n\ndef jours_avant(date_debut, aujourd_hui) -> int:\n    return int((pd.Timestamp(date_debut).normalize() - pd.Timestamp(aujourd_hui).normalize()).days)\n", "app/core/xlsx.py": "\"\"\"Écriture de classeurs Excel (.xlsx) mis en forme, avec la seule bibliothèque standard.\n\nRemplace openpyxl / xlsxwriter, absents de Pyodide : l'app n'a plus rien à télécharger\ndepuis PyPI. Gère : plusieurs feuilles, en-têtes en gras blanc sur bleu marine, volets\nfigés, filtres automatiques, largeurs ajustées, dates JJ/MM/AAAA, surlignage de lignes.\n\"\"\"\n\nimport io\nimport math\nimport zipfile\nfrom datetime import date, datetime\nfrom xml.sax.saxutils import escape\n\nimport numpy as np\nimport pandas as pd\n\nNAVY = \"002157\"\nEPOCH = datetime(1899, 12, 30)\n\n\ndef _col(n: int) -> str:\n    \"\"\"1 → A, 27 → AA.\"\"\"\n    s = \"\"\n    while n:\n        n, r = divmod(n - 1, 26)\n        s = chr(65 + r) + s\n    return s\n\n\ndef _xml_text(v) -> str:\n    # Caractères de contrôle interdits en XML.\n    return escape(\"\".join(ch for ch in str(v) if ch in \"\\t\\n\\r\" or ord(ch) >= 32))\n\n\nclass _Styles:\n    \"\"\"Index de styles (cellXfs) : (format, couleur de fond) → numéro.\"\"\"\n\n    FMT_DATE = 164\n\n    def __init__(self):\n        self.fills = [\"none\", \"gray125\", NAVY]\n        self.xfs = [(0, 0, 0)]          # (numFmtId, fillId, fontId) ; 0 = défaut\n        self.cache = {}\n        self.header = self._xf(0, self._fill(NAVY), 1)\n\n    def _fill(self, hexa):\n        if hexa not in self.fills:\n            self.fills.append(hexa)\n        return self.fills.index(hexa)\n\n    def _xf(self, fmt, fill, font=0):\n        key = (fmt, fill, font)\n        if key not in self.xfs:\n            self.xfs.append(key)\n        return self.xfs.index(key)\n\n    def cellule(self, est_date: bool, fond: str | None):\n        key = (est_date, fond)\n        if key not in self.cache:\n            self.cache[key] = self._xf(self.FMT_DATE if est_date else 0, self._fill(fond) if fond else 0)\n        return self.cache[key]\n\n    def xml(self) -> str:\n        fills = []\n        for f in self.fills:\n            if f in (\"none\", \"gray125\"):\n                fills.append(f'<fill><patternFill patternType=\"{f}\"/><\/fill>')\n            else:\n                fills.append(f'<fill><patternFill patternType=\"solid\"><fgColor rgb=\"FF{f}\"/><bgColor indexed=\"64\"/><\/patternFill><\/fill>')\n        xfs = \"\".join(\n            f'<xf numFmtId=\"{n}\" fontId=\"{fo}\" fillId=\"{fi}\" borderId=\"0\" xfId=\"0\"'\n            + (' applyNumberFormat=\"1\"' if n else \"\") + (' applyFill=\"1\"' if fi else \"\") + (' applyFont=\"1\"' if fo else \"\")\n            + (' applyAlignment=\"1\"><alignment vertical=\"center\" wrapText=\"1\"/><\/xf>' if fo else \
